<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tonight on the Titanic — Quiz</title>
<style>
  :root{
    --forest:#15803d;
    --forest-dark:#14532d;
    --red:#c0392b;
    --cream:#f7fbf6;
    --ink:#222;
    --gold:#d97706;
    --oak:#92400e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Trebuchet MS","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--forest),var(--forest-dark));
    color:var(--ink);
    min-height:100vh;
    padding:24px 12px;
  }
  .wrap{
    max-width:780px;
    margin:0 auto;
    background:var(--cream);
    border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    overflow:hidden;
  }
  header{
    background:var(--forest);
    color:#fff;
    padding:22px 28px 18px;
    text-align:center;
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  header h1{
    margin:0;
    font-size:1.5rem;
    letter-spacing:.5px;
    flex:1;
    text-align:center;
  }
  .langBtn{
    font-family:inherit;
    font-size:.85rem;
    font-weight:bold;
    color:var(--forest-dark);
    background:#fff;
    border:none;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .langBtn:hover{transform:translateY(-1px);}
  .homeBtn{
    font-size:1.35rem;
    text-decoration:none;
    background:#fff;
    border-radius:50%;
    width:40px;height:40px;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .homeBtn:hover{transform:translateY(-1px);}
  header p{
    margin:10px 0 0;
    font-size:.92rem;
    opacity:.92;
  }
  .logo{
    width:62px;height:62px;border-radius:50%;
    background:#fff;margin:0 auto 12px;position:relative;
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  main{padding:22px 28px 30px;}
  .q{
    border:1px solid #d6e6df;
    border-radius:12px;
    padding:16px 18px;
    margin:16px 0;
    background:#fff;
    transition:border-color .2s;
  }
  .q.correct{border-color:var(--forest);background:#eef9f0;}
  .q.wrong{border-color:var(--red);background:#fdf3f2;}
  .q h3{
    margin:0 0 12px;
    font-size:1.02rem;
    line-height:1.45;
  }
  .q h3 span{color:var(--gold);font-weight:bold;margin-right:6px;}
  label{
    display:block;
    padding:9px 12px;
    margin:7px 0;
    border-radius:8px;
    background:#eef4f0;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s,border-color .15s;
    font-size:.96rem;
    line-height:1.4;
  }
  label:hover{background:#e2ede7;}
  input[type=radio]{margin-right:9px;transform:translateY(1px);}
  label.picked{background:#fff4cc;border-color:var(--gold);}
  label.right{background:#d7f0df;border-color:var(--forest);font-weight:600;}
  label.picked-wrong{background:#f7d4d0;border-color:var(--red);}
  .explain{
    display:none;
    margin-top:10px;
    padding:12px 14px;
    background:#f0f7f2;
    border-left:4px solid var(--forest);
    border-radius:6px;
    font-size:.9rem;
    line-height:1.5;
  }
  .explain.show{display:block;}
  .explain .en{margin-bottom:6px;}
  .explain .zh{color:#444;}
  .explain b{color:var(--forest-dark);}
  .actions{text-align:center;margin-top:24px;}
  button.go{
    font-family:inherit;
    font-size:1.05rem;
    font-weight:bold;
    color:#fff;
    background:var(--forest-dark);
    border:none;
    padding:13px 34px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(21,128,61,.4);
    transition:transform .12s,box-shadow .12s;
  }
  button.go:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(21,128,61,.5);}
  button.go:active{transform:translateY(0);}
  #resetBtn{display:none;background:#555;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  #result{
    text-align:center;
    margin:22px auto 4px;
    font-size:1.3rem;
    font-weight:bold;
    color:var(--forest-dark);
    min-height:1.4em;
  }
  #scoreDetail{text-align:center;color:#666;font-size:.92rem;margin-bottom:6px;}
  footer{
    text-align:center;
    font-size:.8rem;
    color:#9aa6ad;
    padding:14px;
    border-top:1px solid #eee;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <button class="langBtn" id="langBtn">🌐 中文</button>
      <h1>#17 · Tonight on the Titanic</h1>
      <a class="homeBtn" href="../../index.html" title="Home / 首页" aria-label="Home">🏠</a>
    </div>
    <p id="subtitle">Comprehension Quiz • 10 Questions • by Mary Pope Osborne</p>
    <div class="logo">🌳</div>
  </header>
  <main>
    <div id="questions"></div>
    <div id="result"></div>
    <div id="scoreDetail"></div>
    <div class="actions">
      <button class="go" id="checkBtn">Check My Answers</button>
      <button class="go" id="resetBtn">Try Again</button>
    </div>
  </main>
  <footer>Based on <em>Magic Tree House #17: Tonight on the Titanic</em> (Random House, 1999) — by Mary Pope Osborne</footer>
</div>

<script>
let lang = "en";
const picked = {};
let submitted = false;
let score = 0;

const L = {
  en: {
    subtitle: "Comprehension Quiz • 10 Questions • by Mary Pope Osborne",
    check: "Check My Answers",
    retry: "Try Again",
    langBtn: "🌐 中文",
    result: (s) => `You scored ${s} / 10`,
    perfect: "Perfect! You really know your Magic Tree House adventure.",
    great: "Great job — you understood the story well.",
    ok: "Not bad — but a few clues slipped past you.",
    low: "Time for a re-read! The answers are in the details.",
    ansLabel: "Answer"
  },
  zh: {
    subtitle: "阅读理解测验 • 共10题 • 作者：Mary Pope Osborne",
    check: "提交答案",
    retry: "再做一次",
    langBtn: "🌐 English",
    result: (s) => `你的得分：${s} / 10`,
    perfect: "满分！你完全读懂了这次神奇树屋冒险。",
    great: "很棒——你已经读懂了这个故事。",
    ok: "不错——不过有几条线索被你漏掉了。",
    low: "该重读一遍啦！答案都藏在细节里。",
    ansLabel: "正确答案"
  }
};

const quiz = [{"q": {"en": "What time did the great ship hit the iceberg?", "zh": "这艘巨轮是在几点撞上冰山的？"}, "options": [{"en": "At 8:00 in the morning", "zh": "早上8点整"}, {"en": "At 3:15 in the afternoon", "zh": "下午3点15分，发生在很久很久以前"}, {"en": "At 6:30 in the evening", "zh": "傍晚6点30分"}, {"en": "At 11:40 in the evening", "zh": "晚上11点40分"}], "answer": 3, "explain": {"en": "The ship struck the iceberg at 11:40 in the evening, just before midnight.", "zh": "巨轮在晚上11点40分、临近午夜时撞上了冰山。"}}, {"q": {"en": "How many lifeboats were on the ship?", "zh": "这艘船上一共有多少艘救生艇？"}, "options": [{"en": "Only twenty", "zh": "只有二十艘"}, {"en": "None at all", "zh": "一艘也没有"}, {"en": "About forty", "zh": "大约四十艘"}, {"en": "More than one hundred", "zh": "一百多艘"}], "answer": 0, "explain": {"en": "The great ship carried only twenty lifeboats, though it needed twice as many.", "zh": "这艘大船只有二十艘救生艇，其实需要两倍之多。"}}, {"q": {"en": "Why did the closest ship not come to help after the SOS call?", "zh": "发出求救信号后，为什么最近的船没有赶来救援？"}, "options": [{"en": "It was too far away to hear", "zh": "它离得太远，听不到信号"}, {"en": "Its radio had been turned off", "zh": "它的无线电被关掉了"}, {"en": "It sailed the other way on purpose", "zh": "它故意朝反方向开了"}, {"en": "It was already full of people", "zh": "它已经载满了人"}], "answer": 1, "explain": {"en": "The nearby ship's wireless had been switched off, so it never heard the call for help.", "zh": "附近那艘船的无线电被关掉了，所以没有收到求救信号。"}}, {"q": {"en": "Who were William and Lucy on the ship?", "zh": "船上的威廉和露西是什么人？"}, "options": [{"en": "Jack and Annie's cousins", "zh": "杰克和安妮的表兄妹"}, {"en": "A brother and sister", "zh": "一对兄妹"}, {"en": "The ship's captain and his wife", "zh": "船长和他的妻子"}, {"en": "Two friendly dogs", "zh": "两只友善的狗"}], "answer": 1, "explain": {"en": "William and Lucy were young brother and sister traveling on the ship.", "zh": "威廉和露西是船上的一对年幼兄妹。"}}, {"q": {"en": "What did Lucy give Jack and Annie as the special gift?", "zh": "露西把什么作为特别的礼物送给了杰克和安妮？"}, "options": [{"en": "A small toy boat", "zh": "一只小玩具船"}, {"en": "A silver pocket watch", "zh": "一块银怀表"}, {"en": "A golden necklace", "zh": "一条金项链"}, {"en": "A letter from her mother", "zh": "她妈妈的一封信"}], "answer": 1, "explain": {"en": "Lucy gave Jack and Annie her father's silver pocket watch as the gift from the lost ship.", "zh": "露西把父亲的那块银怀表送给了杰克和安妮，作为来自沉船的礼物。"}}, {"q": {"en": "What time had Lucy's pocket watch stopped?", "zh": "露西的怀表停在了几点？"}, "options": [{"en": "12:20", "zh": "12点20分"}, {"en": "11:40", "zh": "11点40分"}, {"en": "1:50", "zh": "1点50分"}, {"en": "2:20", "zh": "2点20分"}], "answer": 3, "explain": {"en": "Lucy's watch had stopped at 2:20, the time the ship went down.", "zh": "露西的怀表停在了2点20分，正是大船沉没的时刻。"}}, {"q": {"en": "What kind of animal was Teddy?", "zh": "泰迪是一只什么动物？"}, "options": [{"en": "A tiny mouse", "zh": "一只小老鼠"}, {"en": "A baby bird", "zh": "一只小鸟"}, {"en": "A white cat", "zh": "一只白猫"}, {"en": "A little dog", "zh": "一只小狗"}], "answer": 3, "explain": {"en": "Teddy was a small terrier puppy who was under a magic spell.", "zh": "泰迪是一只中了魔法的小猎犬。"}}, {"q": {"en": "Who were allowed into the lifeboats first?", "zh": "谁被允许最先登上救生艇？"}, "options": [{"en": "Women and children", "zh": "妇女和儿童"}, {"en": "The strongest sailors", "zh": "最强壮的水手"}, {"en": "The ship's musicians", "zh": "船上的乐手"}, {"en": "The richest passengers", "zh": "最富有的乘客"}], "answer": 0, "explain": {"en": "On the sinking ship, women and children were allowed into the lifeboats first.", "zh": "在正在下沉的船上，妇女和儿童被允许最先登上救生艇。"}}, {"q": {"en": "Which gift did Morgan ask for that matched the Titanic?", "zh": "摩根要的四个礼物中，哪一个对应的是泰坦尼克号？"}, "options": [{"en": "The forest far away", "zh": "遥远的森林，发生在很久很久以前"}, {"en": "A ship lost at sea", "zh": "一艘沉入大海的船"}, {"en": "The prairie blue", "zh": "蓝色的草原"}, {"en": "A kangaroo", "zh": "一只袋鼠"}], "answer": 1, "explain": {"en": "Morgan's note asked for a gift from 'a ship lost at sea,' which matched the Titanic.", "zh": "摩根的字条上要的是‘一艘沉入大海的船’的礼物，正好对应泰坦尼克号。"}}, {"q": {"en": "What did the ship's musicians keep doing as it sank?", "zh": "船下沉时，船上的乐手们一直在做什么？"}, "options": [{"en": "They rowed a small boat", "zh": "他们划着一只小船"}, {"en": "They kept playing music", "zh": "他们一直演奏音乐"}, {"en": "They rang a big bell", "zh": "他们敲响了一口大钟"}, {"en": "They hid in a lifeboat", "zh": "他们躲进了一艘救生艇"}], "answer": 1, "explain": {"en": "The ship's musicians kept playing as the great ship sank.", "zh": "船上的乐手们一直演奏音乐，直到大船沉没。"}}];

const qEl = document.getElementById("questions");
const resultEl = document.getElementById("result");
const detailEl = document.getElementById("scoreDetail");
const checkBtn = document.getElementById("checkBtn");
const resetBtn = document.getElementById("resetBtn");
const langBtn = document.getElementById("langBtn");

function render(){
  qEl.innerHTML = "";
  document.getElementById("subtitle").textContent = L[lang].subtitle;
  langBtn.textContent = L[lang].langBtn;

  quiz.forEach((item, i) => {
    const qDiv = document.createElement("div");
    qDiv.className = "q";
    qDiv.id = "q" + i;
    let html = `<h3><span>Q${i+1}.</span>${item.q[lang]}</h3>`;
    item.options.forEach((opt, j) => {
      const isPicked = picked[i] === j;
      const checked = isPicked ? "checked" : "";
      html += `<label data-q="${i}" data-o="${j}" class="${isPicked?'picked':''}">
        <input type="radio" name="q${i}" value="${j}" ${checked}> ${opt[lang]}
      </label>`;
    });
    html += `<div class="explain" id="ex${i}">
      <div class="en"><b>${L[lang].ansLabel}:</b> ${item.options[item.answer][lang]}<br>${item.explain.en}</div>
      <div class="zh">${item.options[item.answer][lang]}<br>${item.explain.zh}</div>
    </div>`;
    qDiv.innerHTML = html;
    qEl.appendChild(qDiv);

    if (submitted){
      qDiv.classList.add(picked[i] === item.answer ? "correct" : "wrong");
      document.getElementById("ex"+i).classList.add("show");
      const labels = qDiv.querySelectorAll("label");
      labels[item.answer].classList.add("right");
      if (picked[i] !== item.answer && picked[i] !== undefined)
        labels[picked[i]].classList.add("picked-wrong");
    }
  });

  qEl.querySelectorAll('input[type=radio]').forEach(r => {
    r.addEventListener("change", e => {
      if (submitted) return;
      const qi = +e.target.name.replace("q","");
      picked[qi] = +e.target.value;
      qEl.querySelectorAll(`label[data-q="${qi}"]`).forEach(l=>l.classList.remove("picked"));
      e.target.closest("label").classList.add("picked");
    });
  });

  if (submitted){
    resultEl.textContent = L[lang].result(score);
    let msg = score===10 ? L[lang].perfect : score>=7 ? L[lang].great : score>=4 ? L[lang].ok : L[lang].low;
    detailEl.textContent = msg;
  } else {
    resultEl.textContent = "";
    detailEl.textContent = "";
  }
}

checkBtn.addEventListener("click", () => {
  submitted = true;
  score = 0;
  quiz.forEach((item,i) => { if (picked[i] === item.answer) score++; });
  render();
  checkBtn.style.display = "none";
  resetBtn.style.display = "inline-block";
});

resetBtn.addEventListener("click", () => {
  location.reload();
});

langBtn.addEventListener("click", () => {
  lang = (lang === "en") ? "zh" : "en";
  render();
});

render();
</script>
</body>
</html>
