<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hour of the Olympics — Quiz</title>
<style>
  :root{
    --forest:#15803d;
    --forest-dark:#14532d;
    --red:#c0392b;
    --cream:#f7fbf6;
    --ink:#222;
    --gold:#d97706;
    --oak:#92400e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Trebuchet MS","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--forest),var(--forest-dark));
    color:var(--ink);
    min-height:100vh;
    padding:24px 12px;
  }
  .wrap{
    max-width:780px;
    margin:0 auto;
    background:var(--cream);
    border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    overflow:hidden;
  }
  header{
    background:var(--forest);
    color:#fff;
    padding:22px 28px 18px;
    text-align:center;
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  header h1{
    margin:0;
    font-size:1.5rem;
    letter-spacing:.5px;
    flex:1;
    text-align:center;
  }
  .langBtn{
    font-family:inherit;
    font-size:.85rem;
    font-weight:bold;
    color:var(--forest-dark);
    background:#fff;
    border:none;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .langBtn:hover{transform:translateY(-1px);}
  .homeBtn{
    font-size:1.35rem;
    text-decoration:none;
    background:#fff;
    border-radius:50%;
    width:40px;height:40px;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .homeBtn:hover{transform:translateY(-1px);}
  header p{
    margin:10px 0 0;
    font-size:.92rem;
    opacity:.92;
  }
  .logo{
    width:62px;height:62px;border-radius:50%;
    background:#fff;margin:0 auto 12px;position:relative;
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  main{padding:22px 28px 30px;}
  .q{
    border:1px solid #d6e6df;
    border-radius:12px;
    padding:16px 18px;
    margin:16px 0;
    background:#fff;
    transition:border-color .2s;
  }
  .q.correct{border-color:var(--forest);background:#eef9f0;}
  .q.wrong{border-color:var(--red);background:#fdf3f2;}
  .q h3{
    margin:0 0 12px;
    font-size:1.02rem;
    line-height:1.45;
  }
  .q h3 span{color:var(--gold);font-weight:bold;margin-right:6px;}
  label{
    display:block;
    padding:9px 12px;
    margin:7px 0;
    border-radius:8px;
    background:#eef4f0;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s,border-color .15s;
    font-size:.96rem;
    line-height:1.4;
  }
  label:hover{background:#e2ede7;}
  input[type=radio]{margin-right:9px;transform:translateY(1px);}
  label.picked{background:#fff4cc;border-color:var(--gold);}
  label.right{background:#d7f0df;border-color:var(--forest);font-weight:600;}
  label.picked-wrong{background:#f7d4d0;border-color:var(--red);}
  .explain{
    display:none;
    margin-top:10px;
    padding:12px 14px;
    background:#f0f7f2;
    border-left:4px solid var(--forest);
    border-radius:6px;
    font-size:.9rem;
    line-height:1.5;
  }
  .explain.show{display:block;}
  .explain .en{margin-bottom:6px;}
  .explain .zh{color:#444;}
  .explain b{color:var(--forest-dark);}
  .actions{text-align:center;margin-top:24px;}
  button.go{
    font-family:inherit;
    font-size:1.05rem;
    font-weight:bold;
    color:#fff;
    background:var(--forest-dark);
    border:none;
    padding:13px 34px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(21,128,61,.4);
    transition:transform .12s,box-shadow .12s;
  }
  button.go:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(21,128,61,.5);}
  button.go:active{transform:translateY(0);}
  #resetBtn{display:none;background:#555;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  #result{
    text-align:center;
    margin:22px auto 4px;
    font-size:1.3rem;
    font-weight:bold;
    color:var(--forest-dark);
    min-height:1.4em;
  }
  #scoreDetail{text-align:center;color:#666;font-size:.92rem;margin-bottom:6px;}
  footer{
    text-align:center;
    font-size:.8rem;
    color:#9aa6ad;
    padding:14px;
    border-top:1px solid #eee;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <button class="langBtn" id="langBtn">🌐 中文</button>
      <h1>#16 · Hour of the Olympics</h1>
      <a class="homeBtn" href="../../index.html" title="Home / 首页" aria-label="Home">🏠</a>
    </div>
    <p id="subtitle">Comprehension Quiz • 10 Questions • by Mary Pope Osborne</p>
    <div class="logo">🌳</div>
  </header>
  <main>
    <div id="questions"></div>
    <div id="result"></div>
    <div id="scoreDetail"></div>
    <div class="actions">
      <button class="go" id="checkBtn">Check My Answers</button>
      <button class="go" id="resetBtn">Try Again</button>
    </div>
  </main>
  <footer>Based on <em>Magic Tree House #16: Hour of the Olympics</em> (Random House, 1998) — by Mary Pope Osborne</footer>
</div>

<script>
let lang = "en";
const picked = {};
let submitted = false;
let score = 0;

const L = {
  en: {
    subtitle: "Comprehension Quiz • 10 Questions • by Mary Pope Osborne",
    check: "Check My Answers",
    retry: "Try Again",
    langBtn: "🌐 中文",
    result: (s) => `You scored ${s} / 10`,
    perfect: "Perfect! You really know your Magic Tree House adventure.",
    great: "Great job — you understood the story well.",
    ok: "Not bad — but a few clues slipped past you.",
    low: "Time for a re-read! The answers are in the details.",
    ansLabel: "Answer"
  },
  zh: {
    subtitle: "阅读理解测验 • 共10题 • 作者：Mary Pope Osborne",
    check: "提交答案",
    retry: "再做一次",
    langBtn: "🌐 English",
    result: (s) => `你的得分：${s} / 10`,
    perfect: "满分！你完全读懂了这次神奇树屋冒险。",
    great: "很棒——你已经读懂了这个故事。",
    ok: "不错——不过有几条线索被你漏掉了。",
    low: "该重读一遍啦！答案都藏在细节里。",
    ansLabel: "正确答案"
  }
};

const quiz = [{"q": {"en": "Which research book does Morgan give Jack and Annie for their trip to ancient Greece?", "zh": "摩根为这次古希腊之旅，给了杰克和安妮哪一本参考书？"}, "options": [{"en": "Life in Athens", "zh": "《雅典的生活》"}, {"en": "Greek Myths and Heroes", "zh": "《希腊神话与英雄》"}, {"en": "The Story of the Olympic Games", "zh": "《奥林匹克运动会的故事》"}, {"en": "A Day in Ancient Greece", "zh": "《古希腊的一天》"}], "answer": 3, "explain": {"en": "Morgan hands them a book titled A Day in Ancient Greece, which shows the Olympic festival at Olympia and the red-brick buildings with columns.", "zh": "摩根交给他们一本《古希腊的一天》，书里展现了奥林匹亚的奥运盛会和有柱子的红砖建筑。"}}, {"q": {"en": "Who is the bearded philosopher that helps Jack and Annie find the secret poet?", "zh": "那位留着白胡须、帮助他们找到神秘女诗人的哲学家是谁？"}, "options": [{"en": "Plato", "zh": "柏拉图"}, {"en": "Aristotle", "zh": "亚里士多德"}, {"en": "Homer", "zh": "荷马"}, {"en": "Socrates", "zh": "苏格拉底"}], "answer": 0, "explain": {"en": "A man with a short white beard introduces himself as Plato, a philosopher who is a \"lover of wisdom\" and a friend of the secret poet.", "zh": "一位留着白短须的男子自我介绍叫柏拉图，是一位“爱好智慧”的哲学家，也是那位神秘女诗人的朋友。"}}, {"q": {"en": "In ancient Greece, which of these things was a girl NOT allowed to do?", "zh": "在古希腊，下面哪一件事是女孩子不被允许做的？"}, "options": [{"en": "go to school or attend the Olympics", "zh": "上学或观看奥运会"}, {"en": "weave cloth at home", "zh": "在家织布"}, {"en": "wear a tunic", "zh": "穿长袍"}, {"en": "walk freely in the crowded marketplace", "zh": "在拥挤的集市上随意走动"}], "answer": 0, "explain": {"en": "Jack reads that girls were not allowed to go to school, women could not act in plays, and a girl would get in terrible trouble if she attended the Olympics.", "zh": "杰克读到，女孩子不能上学，妇女不能登台演戏，女孩子如果去看奥运会会惹上大麻烦。"}}, {"q": {"en": "The young woman who wrote the poem does not give her real name. How does she sign it?", "zh": "写这首诗的年轻女子没有说出真名。她是怎么署名的？"}, "options": [{"en": "with the name \"Athena\"", "zh": "署名“雅典娜”"}, {"en": "with the name of her older brother", "zh": "用她哥哥的名字"}, {"en": "with the name \"Anonymous\"", "zh": "署名“匿名”"}, {"en": "with the name \"Morgan\"", "zh": "署名“摩根”"}], "answer": 2, "explain": {"en": "The poet says she cannot give her name and tells Annie she can say it was written by Anonymous, because the risk of being found out is too great.", "zh": "女诗人说不能透露名字，并告诉安妮可以说这是“Anonymous（匿名）”写的，因为被发现的代价太大了。"}}, {"q": {"en": "What is the sacred tree of the Greeks, whose branches are made into the winners' crowns?", "zh": "希腊人的圣树是什么？获胜者头上的花冠就是用它的树枝编成的。"}, "options": [{"en": "the olive tree", "zh": "橄榄树"}, {"en": "the palm tree", "zh": "棕榈树"}, {"en": "the apple tree", "zh": "苹果树"}, {"en": "the oak tree", "zh": "橡树"}], "answer": 0, "explain": {"en": "Plato says the olive tree is the sacred tree of the Greeks, and the winners of the games wear crowns made from its branches.", "zh": "柏拉图说橄榄树是希腊人的圣树，运动会的获胜者头戴用橄榄枝编成的花冠。"}}, {"q": {"en": "The Olympic Games are played in honor of which chief Greek god?", "zh": "奥林匹克运动会是为了敬奉哪位希腊主神而举办的？"}, "options": [{"en": "Apollo", "zh": "阿波罗"}, {"en": "Zeus", "zh": "宙斯"}, {"en": "Poseidon", "zh": "波塞冬"}, {"en": "Hermes", "zh": "赫尔墨斯"}], "answer": 1, "explain": {"en": "Inside the Temple of Zeus stands a huge statue of Zeus, the chief god. The Olympic Games are played in his honor and athletes swore to him.", "zh": "宙斯神庙里立着宙斯的巨型雕像，他是众神之主。奥运会正是为他而办，运动员还向他发誓。"}}, {"q": {"en": "On the very first day of the games, what event is held — the greatest honor to win?", "zh": "在运动会的第一天举行的是什么项目——也是最高荣誉的赛事？"}, "options": [{"en": "the wrestling match", "zh": "摔跤赛"}, {"en": "the chariot race", "zh": "战车赛"}, {"en": "the boxing match", "zh": "拳击赛"}, {"en": "the foot race", "zh": "赛跑"}], "answer": 1, "explain": {"en": "Plato tells Jack the first day is the day of the chariot races, and winning a chariot race is the greatest honor of the games.", "zh": "柏拉图告诉杰克，第一天是战车赛的日子，而赢得战车赛是运动会最高的荣誉。"}}, {"q": {"en": "In the Olympic chariot race, how many horses pull each chariot?", "zh": "在奥林匹克战车比赛中，每辆战车由几匹马牵引？"}, "options": [{"en": "three", "zh": "三匹"}, {"en": "four", "zh": "四匹"}, {"en": "six", "zh": "六匹"}, {"en": "two", "zh": "两匹"}], "answer": 1, "explain": {"en": "Jack sees dozens of chariots lined up on the track, and each chariot is pulled by four horses as the race begins.", "zh": "杰克看到赛道上排着几十辆战车，每辆战车都由四匹马牵引，比赛随即开始。"}}, {"q": {"en": "What great winged horse appears and carries Jack and Annie to safety in his chariot?", "zh": "是哪匹长着翅膀的巨马出现，用战车把杰克和安妮带到了安全的地方？"}, "options": [{"en": "Shadowfax", "zh": "影疾"}, {"en": "Arion", "zh": "会说话的神驹阿里翁"}, {"en": "Bucephalus", "zh": "布西发拉"}, {"en": "Pegasus", "zh": "珀伽索斯（飞马）"}], "answer": 3, "explain": {"en": "A huge white horse pulls an empty chariot to them, then grows giant feathery wings and flies them to the olive grove. Morgan names him Pegasus.", "zh": "一匹白色巨马拉着空战车来到他们面前，随后长出巨大羽翼，载他们飞到橄榄树林。摩根号称他为珀伽索斯。"}}, {"q": {"en": "Morgan says the poet signed her story \"Anonymous.\" What does that word mean?", "zh": "摩根说女诗人署名“Anonymous”。这个词是什么意思？"}, "options": [{"en": "the wise queen of all Greece", "zh": "全希腊智慧的王后"}, {"en": "a friend of Plato", "zh": "柏拉图的一位朋友"}, {"en": "a famous writer", "zh": "一位著名作家"}, {"en": "no one knows who wrote it", "zh": "没人知道是谁写的"}], "answer": 3, "explain": {"en": "Plato explains that \"anonymous\" means that no one knows who wrote it. Morgan adds that many talented women used that name in the past.", "zh": "柏拉图解释，“anonymous”意思就是没人知道是谁写的。摩根补充说，过去许多有才华的女性都用了这个名字。"}}];

const qEl = document.getElementById("questions");
const resultEl = document.getElementById("result");
const detailEl = document.getElementById("scoreDetail");
const checkBtn = document.getElementById("checkBtn");
const resetBtn = document.getElementById("resetBtn");
const langBtn = document.getElementById("langBtn");

function render(){
  qEl.innerHTML = "";
  document.getElementById("subtitle").textContent = L[lang].subtitle;
  langBtn.textContent = L[lang].langBtn;

  quiz.forEach((item, i) => {
    const qDiv = document.createElement("div");
    qDiv.className = "q";
    qDiv.id = "q" + i;
    let html = `<h3><span>Q${i+1}.</span>${item.q[lang]}</h3>`;
    item.options.forEach((opt, j) => {
      const isPicked = picked[i] === j;
      const checked = isPicked ? "checked" : "";
      html += `<label data-q="${i}" data-o="${j}" class="${isPicked?'picked':''}">
        <input type="radio" name="q${i}" value="${j}" ${checked}> ${opt[lang]}
      </label>`;
    });
    html += `<div class="explain" id="ex${i}">
      <div class="en"><b>${L[lang].ansLabel}:</b> ${item.options[item.answer][lang]}<br>${item.explain.en}</div>
      <div class="zh">${item.options[item.answer][lang]}<br>${item.explain.zh}</div>
    </div>`;
    qDiv.innerHTML = html;
    qEl.appendChild(qDiv);

    if (submitted){
      qDiv.classList.add(picked[i] === item.answer ? "correct" : "wrong");
      document.getElementById("ex"+i).classList.add("show");
      const labels = qDiv.querySelectorAll("label");
      labels[item.answer].classList.add("right");
      if (picked[i] !== item.answer && picked[i] !== undefined)
        labels[picked[i]].classList.add("picked-wrong");
    }
  });

  qEl.querySelectorAll('input[type=radio]').forEach(r => {
    r.addEventListener("change", e => {
      if (submitted) return;
      const qi = +e.target.name.replace("q","");
      picked[qi] = +e.target.value;
      qEl.querySelectorAll(`label[data-q="${qi}"]`).forEach(l=>l.classList.remove("picked"));
      e.target.closest("label").classList.add("picked");
    });
  });

  if (submitted){
    resultEl.textContent = L[lang].result(score);
    let msg = score===10 ? L[lang].perfect : score>=7 ? L[lang].great : score>=4 ? L[lang].ok : L[lang].low;
    detailEl.textContent = msg;
  } else {
    resultEl.textContent = "";
    detailEl.textContent = "";
  }
}

checkBtn.addEventListener("click", () => {
  submitted = true;
  score = 0;
  quiz.forEach((item,i) => { if (picked[i] === item.answer) score++; });
  render();
  checkBtn.style.display = "none";
  resetBtn.style.display = "inline-block";
});

resetBtn.addEventListener("click", () => {
  location.reload();
});

langBtn.addEventListener("click", () => {
  lang = (lang === "en") ? "zh" : "en";
  render();
});

render();
</script>
</body>
</html>
