<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>High Time for Heroes — Quiz</title>
<style>
  :root{
    --forest:#15803d;
    --forest-dark:#14532d;
    --red:#c0392b;
    --cream:#f7fbf6;
    --ink:#222;
    --gold:#d97706;
    --oak:#92400e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Trebuchet MS","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--forest),var(--forest-dark));
    color:var(--ink);
    min-height:100vh;
    padding:24px 12px;
  }
  .wrap{
    max-width:780px;
    margin:0 auto;
    background:var(--cream);
    border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    overflow:hidden;
  }
  header{
    background:var(--forest);
    color:#fff;
    padding:22px 28px 18px;
    text-align:center;
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  header h1{
    margin:0;
    font-size:1.5rem;
    letter-spacing:.5px;
    flex:1;
    text-align:center;
  }
  .langBtn{
    font-family:inherit;
    font-size:.85rem;
    font-weight:bold;
    color:var(--forest-dark);
    background:#fff;
    border:none;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .langBtn:hover{transform:translateY(-1px);}
  .homeBtn{
    font-size:1.35rem;
    text-decoration:none;
    background:#fff;
    border-radius:50%;
    width:40px;height:40px;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .homeBtn:hover{transform:translateY(-1px);}
  header p{
    margin:10px 0 0;
    font-size:.92rem;
    opacity:.92;
  }
  .logo{
    width:62px;height:62px;border-radius:50%;
    background:#fff;margin:0 auto 12px;position:relative;
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  main{padding:22px 28px 30px;}
  .q{
    border:1px solid #d6e6df;
    border-radius:12px;
    padding:16px 18px;
    margin:16px 0;
    background:#fff;
    transition:border-color .2s;
  }
  .q.correct{border-color:var(--forest);background:#eef9f0;}
  .q.wrong{border-color:var(--red);background:#fdf3f2;}
  .q h3{
    margin:0 0 12px;
    font-size:1.02rem;
    line-height:1.45;
  }
  .q h3 span{color:var(--gold);font-weight:bold;margin-right:6px;}
  label{
    display:block;
    padding:9px 12px;
    margin:7px 0;
    border-radius:8px;
    background:#eef4f0;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s,border-color .15s;
    font-size:.96rem;
    line-height:1.4;
  }
  label:hover{background:#e2ede7;}
  input[type=radio]{margin-right:9px;transform:translateY(1px);}
  label.picked{background:#fff4cc;border-color:var(--gold);}
  label.right{background:#d7f0df;border-color:var(--forest);font-weight:600;}
  label.picked-wrong{background:#f7d4d0;border-color:var(--red);}
  .explain{
    display:none;
    margin-top:10px;
    padding:12px 14px;
    background:#f0f7f2;
    border-left:4px solid var(--forest);
    border-radius:6px;
    font-size:.9rem;
    line-height:1.5;
  }
  .explain.show{display:block;}
  .explain .en{margin-bottom:6px;}
  .explain .zh{color:#444;}
  .explain b{color:var(--forest-dark);}
  .actions{text-align:center;margin-top:24px;}
  button.go{
    font-family:inherit;
    font-size:1.05rem;
    font-weight:bold;
    color:#fff;
    background:var(--forest-dark);
    border:none;
    padding:13px 34px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(21,128,61,.4);
    transition:transform .12s,box-shadow .12s;
  }
  button.go:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(21,128,61,.5);}
  button.go:active{transform:translateY(0);}
  #resetBtn{display:none;background:#555;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  #result{
    text-align:center;
    margin:22px auto 4px;
    font-size:1.3rem;
    font-weight:bold;
    color:var(--forest-dark);
    min-height:1.4em;
  }
  #scoreDetail{text-align:center;color:#666;font-size:.92rem;margin-bottom:6px;}
  footer{
    text-align:center;
    font-size:.8rem;
    color:#9aa6ad;
    padding:14px;
    border-top:1px solid #eee;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <button class="langBtn" id="langBtn">🌐 中文</button>
      <h1>#51 · High Time for Heroes</h1>
      <a class="homeBtn" href="../../index.html" title="Home / 首页" aria-label="Home">🏠</a>
    </div>
    <p id="subtitle">Comprehension Quiz • 10 Questions • by Mary Pope Osborne</p>
    <div class="logo">🌳</div>
  </header>
  <main>
    <div id="questions"></div>
    <div id="result"></div>
    <div id="scoreDetail"></div>
    <div class="actions">
      <button class="go" id="checkBtn">Check My Answers</button>
      <button class="go" id="resetBtn">Try Again</button>
    </div>
  </main>
  <footer>Based on <em>Magic Tree House #51: High Time for Heroes</em> (Random House, 2014) — by Mary Pope Osborne</footer>
</div>

<script>
let lang = "en";
const picked = {};
let submitted = false;
let score = 0;

const L = {
  en: {
    subtitle: "Comprehension Quiz • 10 Questions • by Mary Pope Osborne",
    check: "Check My Answers",
    retry: "Try Again",
    langBtn: "🌐 中文",
    result: (s) => `You scored ${s} / 10`,
    perfect: "Perfect! You really know your Magic Tree House adventure.",
    great: "Great job — you understood the story well.",
    ok: "Not bad — but a few clues slipped past you.",
    low: "Time for a re-read! The answers are in the details.",
    ansLabel: "Answer"
  },
  zh: {
    subtitle: "阅读理解测验 • 共10题 • 作者：Mary Pope Osborne",
    check: "提交答案",
    retry: "再做一次",
    langBtn: "🌐 English",
    result: (s) => `你的得分：${s} / 10`,
    perfect: "满分！你完全读懂了这次神奇树屋冒险。",
    great: "很棒——你已经读懂了这个故事。",
    ok: "不错——不过有几条线索被你漏掉了。",
    low: "该重读一遍啦！答案都藏在细节里。",
    ansLabel: "正确答案"
  }
};

const quiz = [{"q": {"en": "Where do Jack and Annie travel in this story?", "zh": "在这个故事里，杰克和安妮穿越到了哪里？"}, "options": [{"en": "Thebes, Egypt", "zh": "埃及的底比斯"}, {"en": "the Crimea by the Black Sea", "zh": "黑海边的克里米亚"}, {"en": "a hospital in Germany", "zh": "德国的一家医院"}, {"en": "London, England", "zh": "英格兰的伦敦"}], "answer": 0, "explain": {"en": "Jack and Annie land in a sycamore tree on the River Nile in Thebes, Egypt, in the year 1850, across from the Temple of Luxor.", "zh": "杰克和安妮降落在 1850 年埃及底比斯尼罗河畔的一棵悬铃木上，正对着卢克索神庙。"}}, {"q": {"en": "Which famous person do Jack and Annie hope to meet on this mission?", "zh": "杰克和安妮希望在这次任务中见到哪位名人？"}, "options": [{"en": "Florence Nightingale", "zh": "弗洛伦斯·南丁格尔"}, {"en": "Selina Bracebridge", "zh": "塞琳娜·布雷斯布里奇"}, {"en": "Lady Bickerson", "zh": "比克森夫人"}, {"en": "Countess von Kensky, in a place far away", "zh": "冯·肯斯基伯爵夫人"}], "answer": 0, "explain": {"en": "Merlin's scroll sends them to find Florence Nightingale, the woman soldiers will later call the Lady with the Lamp and who becomes the founder of modern nursing.", "zh": "梅林的卷轴让他们去寻找弗洛伦斯·南丁格尔——后来士兵们称她为“提灯女神”，她也成为现代护理事业的奠基人。"}}, {"q": {"en": "What animal does the Countess von Kensky carry with her?", "zh": "冯·肯斯基伯爵夫人随身带着什么动物？"}, "options": [{"en": "a striped pet cat", "zh": "一只有条纹的宠物猫"}, {"en": "a baby baboon named Koku", "zh": "一只叫科库的幼狒狒"}, {"en": "a small gray donkey", "zh": "一头灰色的小驴"}, {"en": "a white dove from the park", "zh": "一只从乐园来的白鸽"}], "answer": 1, "explain": {"en": "The Countess, who is from Budapest, travels with Koku, a baby baboon from the Sudan in Africa. She later asks Jack and Annie to babysit Koku for the afternoon.", "zh": "伯爵夫人来自布达佩斯，她带着科库——一只来自非洲苏丹的幼狒狒。后来她请杰克和安妮下午帮忙照看科库。"}}, {"q": {"en": "To rescue Koku from the top of a cliff, what do Jack and Annie use the magic mist to become?", "zh": "为了把科库从悬崖顶上救下来，杰克和安妮用魔法雾把自己变成了什么？"}, "options": [{"en": "great horse trainers", "zh": "了不起的驯马师"}, {"en": "great nurses", "zh": "了不起的护士"}, {"en": "great rock climbers", "zh": "了不起的攀岩高手"}, {"en": "great stage magicians", "zh": "了不起的舞台魔术师"}], "answer": 2, "explain": {"en": "When Koku is trapped on the cliff, Jack uncorks Merlin's magic mist and they wish to be great rock climbers for one hour so they can climb up and bring her down.", "zh": "科库被困在悬崖上时，杰克打开梅林的魔法雾，他们许愿要当一小时的攀岩高手，好爬上去把它救下来。"}}, {"q": {"en": "What is the third secret of greatness they learn from Florence?", "zh": "他们从弗洛伦斯那里学到的第三个“伟大的秘密”是什么？"}, "options": [{"en": "being very famous", "zh": "变得非常出名"}, {"en": "meaning and purpose", "zh": "意义与目标"}, {"en": "collecting rare coins", "zh": "收集稀有硬币"}, {"en": "owning many tall hats", "zh": "拥有很多高帽子"}], "answer": 1, "explain": {"en": "Florence says she believes deep in her heart that one's life must have meaning and purpose. The Ring of Truth glows, and Jack writes 'meaning and purpose' as the third secret under humility and hard work.", "zh": "弗洛伦斯说，她从心底相信，一个人的生命必须有意义和目标。真理之戒亮了起来，杰克便把“意义与目标”写在“谦逊”和“刻苦努力”下面，作为第三个秘密。"}}, {"q": {"en": "What happens to Jack and Annie as they climb back down the cliff?", "zh": "杰克和安妮在从悬崖往下爬的时候，发生了什么？"}, "options": [{"en": "they lose their two donkeys in the dark, in a place far away", "zh": "他们在黑暗中弄丢了两头驴，在很远很远的地方"}, {"en": "Jack hurts his shoulder, Annie her ankle", "zh": "杰克伤了肩膀，安妮扭了脚踝"}, {"en": "they both come down with a bad fever", "zh": "两个人都发起了高烧"}, {"en": "they each break a leg in the fall", "zh": "两人摔下来都摔断了腿"}], "answer": 1, "explain": {"en": "Halfway down, Jack's grip slips and he falls, dislocating his shoulder; Annie also falls and sprains her ankle. Florence later finds them and cares for their injuries.", "zh": "爬到半途，杰克手一滑摔了下去，肩膀脱臼；安妮也摔下来，扭了脚踝。后来弗洛伦斯找到他们，并照料了他们的伤。"}}, {"q": {"en": "When Florence cares for Jack, what does she make for his hurt arm?", "zh": "弗洛伦斯照料杰克时，为他的伤臂做了什么？"}, "options": [{"en": "a gold ring", "zh": "一枚金戒指"}, {"en": "a cotton sling", "zh": "一个棉布吊带"}, {"en": "a wooden crutch", "zh": "一根木制拐杖"}, {"en": "a warm pair of boots", "zh": "一双暖和的靴子"}], "answer": 1, "explain": {"en": "Florence wraps a long piece of cloth around Jack's dislocated shoulder to make a cotton sling while he sleeps, and she bandages Annie's sprained ankle. (The wooden crutch was for Annie's ankle.)", "zh": "弗洛伦斯用一长条布把杰克脱臼的肩膀包成棉布吊带——那是趁他熟睡时弄的；她也包扎了安妮扭伤的脚踝。（木制拐杖是给安妮的脚踝用的。）"}}, {"q": {"en": "What are the Colossi of Memnon that Jack and Annie see on the plain?", "zh": "杰克和安妮在平原上看到的“门农巨像”是什么？"}, "options": [{"en": "two old lighthouses", "zh": "两座古老的灯塔"}, {"en": "a pair of giant camels, as someone else had told it", "zh": "一对巨大的骆驼，那是别人讲的版本"}, {"en": "twin tall pyramids", "zh": "两座高高的金字塔"}, {"en": "two giant pharaoh statues", "zh": "两尊巨大的法老雕像"}], "answer": 3, "explain": {"en": "The Colossi of Memnon are two gigantic statues of pharaohs on thrones, over 3,000 years old, that once guarded a temple; 'Memnon' means Ruler of the Dawn.", "zh": "“门农巨像”是两座巨大的法老坐像，已有三千多年历史，曾经守卫着一座神庙；“门农”的意思是“黎明之主”。"}}, {"q": {"en": "According to the Bickersons, whose single bite holds enough poison to kill twenty people?", "zh": "据比克森夫妇说，哪一种动物咬一口所含的毒就足以毒死二十个人？"}, "options": [{"en": "the Egyptian jackal", "zh": "埃及胡狼"}, {"en": "the mosquito", "zh": "蚊子"}, {"en": "the black mamba", "zh": "黑曼巴蛇"}, {"en": "the Nile crocodile", "zh": "尼罗河鳄鱼"}], "answer": 2, "explain": {"en": "Lady Bickerson warns that the black mamba's single bite contains enough poison to kill twenty people — one of the many 'dangers' she claims fill Egypt.", "zh": "比克森夫人警告说，黑曼巴蛇咬一口所含的毒就足以毒死二十个人——这是她口中“到处都是危险”的埃及里的其中一种。"}}, {"q": {"en": "At the end, what does the guide Mustafa refuse to take from Jack?", "zh": "最后，向导穆斯塔法拒绝从杰克那里收下什么？"}, "options": [{"en": "money for helping them", "zh": "帮忙后应得的钱"}, {"en": "a cup of tea", "zh": "一杯茶"}, {"en": "the magic mist", "zh": "魔法雾"}, {"en": "their two donkeys, in a place far away", "zh": "他们的两头驴，在很远很远的地方"}], "answer": 0, "explain": {"en": "When Jack offers his Egyptian coins, Mustafa says no — it is the first word Jack hears him speak: he helped them not for money, but because they needed help.", "zh": "当杰克拿出埃及硬币时，穆斯塔法摇头拒绝了——这是杰克听他说的第一句话：他帮忙不是为了钱，而是因为他们需要帮助。"}}];

const qEl = document.getElementById("questions");
const resultEl = document.getElementById("result");
const detailEl = document.getElementById("scoreDetail");
const checkBtn = document.getElementById("checkBtn");
const resetBtn = document.getElementById("resetBtn");
const langBtn = document.getElementById("langBtn");

function render(){
  qEl.innerHTML = "";
  document.getElementById("subtitle").textContent = L[lang].subtitle;
  langBtn.textContent = L[lang].langBtn;

  quiz.forEach((item, i) => {
    const qDiv = document.createElement("div");
    qDiv.className = "q";
    qDiv.id = "q" + i;
    let html = `<h3><span>Q${i+1}.</span>${item.q[lang]}</h3>`;
    item.options.forEach((opt, j) => {
      const isPicked = picked[i] === j;
      const checked = isPicked ? "checked" : "";
      html += `<label data-q="${i}" data-o="${j}" class="${isPicked?'picked':''}">
        <input type="radio" name="q${i}" value="${j}" ${checked}> ${opt[lang]}
      </label>`;
    });
    html += `<div class="explain" id="ex${i}">
      <div class="en"><b>${L[lang].ansLabel}:</b> ${item.options[item.answer][lang]}<br>${item.explain.en}</div>
      <div class="zh">${item.options[item.answer][lang]}<br>${item.explain.zh}</div>
    </div>`;
    qDiv.innerHTML = html;
    qEl.appendChild(qDiv);

    if (submitted){
      qDiv.classList.add(picked[i] === item.answer ? "correct" : "wrong");
      document.getElementById("ex"+i).classList.add("show");
      const labels = qDiv.querySelectorAll("label");
      labels[item.answer].classList.add("right");
      if (picked[i] !== item.answer && picked[i] !== undefined)
        labels[picked[i]].classList.add("picked-wrong");
    }
  });

  qEl.querySelectorAll('input[type=radio]').forEach(r => {
    r.addEventListener("change", e => {
      if (submitted) return;
      const qi = +e.target.name.replace("q","");
      picked[qi] = +e.target.value;
      qEl.querySelectorAll(`label[data-q="${qi}"]`).forEach(l=>l.classList.remove("picked"));
      e.target.closest("label").classList.add("picked");
    });
  });

  if (submitted){
    resultEl.textContent = L[lang].result(score);
    let msg = score===10 ? L[lang].perfect : score>=7 ? L[lang].great : score>=4 ? L[lang].ok : L[lang].low;
    detailEl.textContent = msg;
  } else {
    resultEl.textContent = "";
    detailEl.textContent = "";
  }
}

checkBtn.addEventListener("click", () => {
  submitted = true;
  score = 0;
  quiz.forEach((item,i) => { if (picked[i] === item.answer) score++; });
  render();
  checkBtn.style.display = "none";
  resetBtn.style.display = "inline-block";
});

resetBtn.addEventListener("click", () => {
  location.reload();
});

langBtn.addEventListener("click", () => {
  lang = (lang === "en") ? "zh" : "en";
  render();
});

render();
</script>
</body>
</html>
