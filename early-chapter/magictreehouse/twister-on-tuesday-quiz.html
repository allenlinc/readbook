<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Twister on Tuesday — Quiz</title>
<style>
  :root{
    --forest:#15803d;
    --forest-dark:#14532d;
    --red:#c0392b;
    --cream:#f7fbf6;
    --ink:#222;
    --gold:#d97706;
    --oak:#92400e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Trebuchet MS","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--forest),var(--forest-dark));
    color:var(--ink);
    min-height:100vh;
    padding:24px 12px;
  }
  .wrap{
    max-width:780px;
    margin:0 auto;
    background:var(--cream);
    border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    overflow:hidden;
  }
  header{
    background:var(--forest);
    color:#fff;
    padding:22px 28px 18px;
    text-align:center;
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  header h1{
    margin:0;
    font-size:1.5rem;
    letter-spacing:.5px;
    flex:1;
    text-align:center;
  }
  .langBtn{
    font-family:inherit;
    font-size:.85rem;
    font-weight:bold;
    color:var(--forest-dark);
    background:#fff;
    border:none;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .langBtn:hover{transform:translateY(-1px);}
  .homeBtn{
    font-size:1.35rem;
    text-decoration:none;
    background:#fff;
    border-radius:50%;
    width:40px;height:40px;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .homeBtn:hover{transform:translateY(-1px);}
  header p{
    margin:10px 0 0;
    font-size:.92rem;
    opacity:.92;
  }
  .logo{
    width:62px;height:62px;border-radius:50%;
    background:#fff;margin:0 auto 12px;position:relative;
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  main{padding:22px 28px 30px;}
  .q{
    border:1px solid #d6e6df;
    border-radius:12px;
    padding:16px 18px;
    margin:16px 0;
    background:#fff;
    transition:border-color .2s;
  }
  .q.correct{border-color:var(--forest);background:#eef9f0;}
  .q.wrong{border-color:var(--red);background:#fdf3f2;}
  .q h3{
    margin:0 0 12px;
    font-size:1.02rem;
    line-height:1.45;
  }
  .q h3 span{color:var(--gold);font-weight:bold;margin-right:6px;}
  label{
    display:block;
    padding:9px 12px;
    margin:7px 0;
    border-radius:8px;
    background:#eef4f0;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s,border-color .15s;
    font-size:.96rem;
    line-height:1.4;
  }
  label:hover{background:#e2ede7;}
  input[type=radio]{margin-right:9px;transform:translateY(1px);}
  label.picked{background:#fff4cc;border-color:var(--gold);}
  label.right{background:#d7f0df;border-color:var(--forest);font-weight:600;}
  label.picked-wrong{background:#f7d4d0;border-color:var(--red);}
  .explain{
    display:none;
    margin-top:10px;
    padding:12px 14px;
    background:#f0f7f2;
    border-left:4px solid var(--forest);
    border-radius:6px;
    font-size:.9rem;
    line-height:1.5;
  }
  .explain.show{display:block;}
  .explain .en{margin-bottom:6px;}
  .explain .zh{color:#444;}
  .explain b{color:var(--forest-dark);}
  .actions{text-align:center;margin-top:24px;}
  button.go{
    font-family:inherit;
    font-size:1.05rem;
    font-weight:bold;
    color:#fff;
    background:var(--forest-dark);
    border:none;
    padding:13px 34px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(21,128,61,.4);
    transition:transform .12s,box-shadow .12s;
  }
  button.go:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(21,128,61,.5);}
  button.go:active{transform:translateY(0);}
  #resetBtn{display:none;background:#555;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  #result{
    text-align:center;
    margin:22px auto 4px;
    font-size:1.3rem;
    font-weight:bold;
    color:var(--forest-dark);
    min-height:1.4em;
  }
  #scoreDetail{text-align:center;color:#666;font-size:.92rem;margin-bottom:6px;}
  footer{
    text-align:center;
    font-size:.8rem;
    color:#9aa6ad;
    padding:14px;
    border-top:1px solid #eee;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <button class="langBtn" id="langBtn">🌐 中文</button>
      <h1>#23 · Twister on Tuesday</h1>
      <a class="homeBtn" href="../../index.html" title="Home / 首页" aria-label="Home">🏠</a>
    </div>
    <p id="subtitle">Comprehension Quiz • 10 Questions • by Mary Pope Osborne</p>
    <div class="logo">🌳</div>
  </header>
  <main>
    <div id="questions"></div>
    <div id="result"></div>
    <div id="scoreDetail"></div>
    <div class="actions">
      <button class="go" id="checkBtn">Check My Answers</button>
      <button class="go" id="resetBtn">Try Again</button>
    </div>
  </main>
  <footer>Based on <em>Magic Tree House #23: Twister on Tuesday</em> (Random House, 2001) — by Mary Pope Osborne</footer>
</div>

<script>
let lang = "en";
const picked = {};
let submitted = false;
let score = 0;

const L = {
  en: {
    subtitle: "Comprehension Quiz • 10 Questions • by Mary Pope Osborne",
    check: "Check My Answers",
    retry: "Try Again",
    langBtn: "🌐 中文",
    result: (s) => `You scored ${s} / 10`,
    perfect: "Perfect! You really know your Magic Tree House adventure.",
    great: "Great job — you understood the story well.",
    ok: "Not bad — but a few clues slipped past you.",
    low: "Time for a re-read! The answers are in the details.",
    ansLabel: "Answer"
  },
  zh: {
    subtitle: "阅读理解测验 • 共10题 • 作者：Mary Pope Osborne",
    check: "提交答案",
    retry: "再做一次",
    langBtn: "🌐 English",
    result: (s) => `你的得分：${s} / 10`,
    perfect: "满分！你完全读懂了这次神奇树屋冒险。",
    great: "很棒——你已经读懂了这个故事。",
    ok: "不错——不过有几条线索被你漏掉了。",
    low: "该重读一遍啦！答案都藏在细节里。",
    ansLabel: "正确答案"
  }
};

const quiz = [{"q": {"en": "Where does the magic tree house take Jack and Annie this time?", "zh": "魔法树屋这次把杰克和安妮带到了哪里？"}, "options": [{"en": "To a snowy battlefield by the Delaware River", "zh": "特拉华河边冰天雪地的战场，发生在很久很久以前"}, {"en": "A rain forest full of gorillas", "zh": "满是猩猩的热带雨林"}, {"en": "A deep forest in Canada", "zh": "加拿大的一片密林"}, {"en": "To a prairie schoolhouse in Kansas", "zh": "堪萨斯州大草原上的一间校舍"}], "answer": 3, "explain": {"en": "The tree house landed near a creek in Kansas, where Jack and Annie found a dugout schoolhouse and met the teacher Miss Neely and her three students.", "zh": "树屋降落在堪萨斯州一条小溪边，杰克和安妮在那里找到了一间土屋校舍，认识了老师尼利小姐和她的三名学生。"}}, {"q": {"en": "Who is the young teacher at the dugout schoolhouse?", "zh": "土屋学校里那位年轻的老师是谁？"}, "options": [{"en": "George Washington's sister", "zh": "乔治·华盛顿的妹妹"}, {"en": "A young woman named Miss Neely", "zh": "一位名叫尼利小姐的年轻女子"}, {"en": "Jack's own school teacher", "zh": "杰克自己学校的老师"}, {"en": "A strict old man named Mr. Brown", "zh": "一位名叫布朗先生的严厉老人"}], "answer": 1, "explain": {"en": "The teacher was Miss Neely, who seemed only sixteen or seventeen years old. She was starting her very first day teaching in the dugout schoolhouse.", "zh": "老师是尼利小姐，她看起来只有十六七岁。那是她在土屋校舍教书的第一天。"}}, {"q": {"en": "What book does Jack read from during the first reading lesson?", "zh": "在第一堂阅读课上，杰克读的是哪本书？"}, "options": [{"en": "A dictionary of hard words", "zh": "一本难词词典"}, {"en": "The Pennsylvania book", "zh": "那本关于宾夕法尼亚州的书"}, {"en": "The McGuffey Reader", "zh": "《麦古菲读本》"}, {"en": "A book of fairy tales", "zh": "一本童话书"}], "answer": 2, "explain": {"en": "Miss Neely handed Jack the school's only reader, the McGuffey Reader, and asked him to read the first two lines of a poem: 'Twinkle, twinkle, little star.'", "zh": "尼利小姐把学校唯一的一本读物《麦古菲读本》交给杰克，让他朗读一首诗的前两行：「一闪一闪小星星」。"}}, {"q": {"en": "What food do Will and Kate share with Jack and Annie at lunch?", "zh": "午饭时，威尔和凯特和杰克、安妮分享的食物是什么？"}, "options": [{"en": "Sweet potatoes", "zh": "红薯"}, {"en": "Hard yellow cheese", "zh": "硬邦邦的黄色奶酪"}, {"en": "Fresh red apples", "zh": "新鲜的红苹果"}, {"en": "Warm corn bread", "zh": "温热的玉米面包"}], "answer": 0, "explain": {"en": "Will opened a burlap sack and gave everyone a lumpy sweet potato. Kate and Will bit into theirs like apples, and Annie did too.", "zh": "威尔打开一个粗麻袋，给每人一个坑坑洼洼的红薯。凯特和威尔像啃苹果一样咬起来，安妮也照做了。"}}, {"q": {"en": "When loud thumping sounds hit the roof, what do Kate and Will think is happening?", "zh": "当屋顶传来砰砰的撞击声时，凯特和威尔以为发生了什么？"}, "options": [{"en": "A grasshopper attack", "zh": "蝗虫来袭"}, {"en": "A rain of small frogs", "zh": "下了一场小青蛙雨"}, {"en": "A shower of falling stars", "zh": "下了一场流星"}, {"en": "A herd of wild horses", "zh": "一群野马"}], "answer": 0, "explain": {"en": "Kate and Will screamed 'Grasshopper attack!' because millions of grasshoppers had eaten their crops the spring before. But Miss Neely opened the door and said it was only hailstones.", "zh": "凯特和威尔尖叫「蝗虫来袭！」，因为去年春天曾有数百万只蝗虫吃光了他们的庄稼。但尼利小姐打开门说那只是冰雹。"}}, {"q": {"en": "How far did Will and Kate walk to get to the schoolhouse?", "zh": "威尔和凯特走到学校要走多远？"}, "options": [{"en": "Two miles", "zh": "两英里"}, {"en": "Ten miles", "zh": "十英里"}, {"en": "Five long miles", "zh": "漫长的五英里"}, {"en": "Half a mile", "zh": "半英里"}], "answer": 0, "explain": {"en": "Will and Kate said they walked two miles to school. Jeb, the older boy, had walked five miles and had never been to school before.", "zh": "威尔和凯特说他们走两英里上学。而那个大男孩杰布走了五英里，并且之前从未上过学。"}}, {"q": {"en": "What terrible storm twists across the prairie while Jack and Annie are there?", "zh": "杰克和安妮在那儿时，席卷大草原的恐怖风暴是什么？"}, "options": [{"en": "A blizzard with thunder and lightning", "zh": "夹杂雷暴的暴风雪"}, {"en": "A cloud of blowing dust", "zh": "一阵飞扬的尘土"}, {"en": "A flood of pouring rain", "zh": "一场倾盆大雨的洪水"}, {"en": "A tornado, also called a twister", "zh": "龙卷风，也叫旋风"}], "answer": 3, "explain": {"en": "The greenish clouds dipped low and twisted into a funnel that tore across the prairie. Jack cried, 'It's a twister!' and they raced to save the schoolchildren.", "zh": "发绿的云层压低，拧成一个漏斗状的风柱横扫大草原。杰克喊道：「是龙卷风！」然后他们飞奔去救校舍里的孩子们。"}}, {"q": {"en": "Where do Jack and Annie hide the schoolchildren to escape the twister?", "zh": "为了躲避龙卷风，杰克和安妮把学生们藏在了哪里？"}, "options": [{"en": "In the storm cellar under the floor", "zh": "地板下面的风暴地窖里"}, {"en": "Inside a buried wooden wagon near the creek", "zh": "小溪边一辆埋在地里的木制马车里"}, {"en": "Behind a tall wooden fence", "zh": "在一道高高的木栅栏后面"}, {"en": "Up in the magic tree house", "zh": "在魔法树屋里"}], "answer": 0, "explain": {"en": "Jack and Annie pulled up the rug, found the cellar door, and Jeb helped pull it open. Everyone climbed down the ladder into the storm cellar to stay safe.", "zh": "杰克和安妮掀开地毯，找到地窖门，杰布帮忙拉开它。大家顺着梯子爬进风暴地窖里躲避。"}}, {"q": {"en": "Who pulls open the storm-cellar door so everyone can get inside?", "zh": "是谁拉开了地窖的门，让大家得以躲进去？"}, "options": [{"en": "The captain from Frog Creek", "zh": "来自青蛙溪的队长"}, {"en": "Jeb, the older boy", "zh": "大男孩杰布"}, {"en": "Miss Neely the teacher", "zh": "老师尼利小姐"}, {"en": "Annie", "zh": "安妮"}], "answer": 1, "explain": {"en": "When the wind was too strong for Jack and Annie to open the door, Jeb came over and pulled it open so they could all climb down into the cellar.", "zh": "当风太大、杰克和安妮拉不开门时，杰布过来帮忙把门拉开，大家才得以爬进地窖。"}}, {"q": {"en": "What writing is the 'something to learn' that Jack and Annie bring home?", "zh": "杰克和安妮带回家的「要学习的东西」是哪段文字？"}, "options": [{"en": "A story about last spring's grasshopper attack", "zh": "一个关于去年春天蝗灾的故事"}, {"en": "A list of rules for the one-room schoolhouse", "zh": "一间校舍的守则清单"}, {"en": "A long letter home describing the twister that tore off the roof", "zh": "一封描述掀走屋顶的龙卷风的家信，在很远很远的地方"}, {"en": "The poem 'If at first you don't succeed, try, try again'", "zh": "那首「如果一开始没有成功，就再试一次」的诗"}], "answer": 3, "explain": {"en": "Jack copied a poem from the McGuffey Reader onto his slate. It said 'If at first you don't succeed, try, try again' — and Annie realized this was the 'something to learn.'", "zh": "杰克把《麦古菲读本》里的一首诗抄在石板上，诗里写着「如果一开始没有成功，就再试一次」——安妮意识到这就是「要学习的东西」。"}}];

const qEl = document.getElementById("questions");
const resultEl = document.getElementById("result");
const detailEl = document.getElementById("scoreDetail");
const checkBtn = document.getElementById("checkBtn");
const resetBtn = document.getElementById("resetBtn");
const langBtn = document.getElementById("langBtn");

function render(){
  qEl.innerHTML = "";
  document.getElementById("subtitle").textContent = L[lang].subtitle;
  langBtn.textContent = L[lang].langBtn;

  quiz.forEach((item, i) => {
    const qDiv = document.createElement("div");
    qDiv.className = "q";
    qDiv.id = "q" + i;
    let html = `<h3><span>Q${i+1}.</span>${item.q[lang]}</h3>`;
    item.options.forEach((opt, j) => {
      const isPicked = picked[i] === j;
      const checked = isPicked ? "checked" : "";
      html += `<label data-q="${i}" data-o="${j}" class="${isPicked?'picked':''}">
        <input type="radio" name="q${i}" value="${j}" ${checked}> ${opt[lang]}
      </label>`;
    });
    html += `<div class="explain" id="ex${i}">
      <div class="en"><b>${L[lang].ansLabel}:</b> ${item.options[item.answer][lang]}<br>${item.explain.en}</div>
      <div class="zh">${item.options[item.answer][lang]}<br>${item.explain.zh}</div>
    </div>`;
    qDiv.innerHTML = html;
    qEl.appendChild(qDiv);

    if (submitted){
      qDiv.classList.add(picked[i] === item.answer ? "correct" : "wrong");
      document.getElementById("ex"+i).classList.add("show");
      const labels = qDiv.querySelectorAll("label");
      labels[item.answer].classList.add("right");
      if (picked[i] !== item.answer && picked[i] !== undefined)
        labels[picked[i]].classList.add("picked-wrong");
    }
  });

  qEl.querySelectorAll('input[type=radio]').forEach(r => {
    r.addEventListener("change", e => {
      if (submitted) return;
      const qi = +e.target.name.replace("q","");
      picked[qi] = +e.target.value;
      qEl.querySelectorAll(`label[data-q="${qi}"]`).forEach(l=>l.classList.remove("picked"));
      e.target.closest("label").classList.add("picked");
    });
  });

  if (submitted){
    resultEl.textContent = L[lang].result(score);
    let msg = score===10 ? L[lang].perfect : score>=7 ? L[lang].great : score>=4 ? L[lang].ok : L[lang].low;
    detailEl.textContent = msg;
  } else {
    resultEl.textContent = "";
    detailEl.textContent = "";
  }
}

checkBtn.addEventListener("click", () => {
  submitted = true;
  score = 0;
  quiz.forEach((item,i) => { if (picked[i] === item.answer) score++; });
  render();
  checkBtn.style.display = "none";
  resetBtn.style.display = "inline-block";
});

resetBtn.addEventListener("click", () => {
  location.reload();
});

langBtn.addEventListener("click", () => {
  lang = (lang === "en") ? "zh" : "en";
  render();
});

render();
</script>
</body>
</html>
