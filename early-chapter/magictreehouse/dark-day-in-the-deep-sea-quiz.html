<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Day in the Deep Sea — Quiz</title>
<style>
  :root{
    --forest:#15803d;
    --forest-dark:#14532d;
    --red:#c0392b;
    --cream:#f7fbf6;
    --ink:#222;
    --gold:#d97706;
    --oak:#92400e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Trebuchet MS","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--forest),var(--forest-dark));
    color:var(--ink);
    min-height:100vh;
    padding:24px 12px;
  }
  .wrap{
    max-width:780px;
    margin:0 auto;
    background:var(--cream);
    border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    overflow:hidden;
  }
  header{
    background:var(--forest);
    color:#fff;
    padding:22px 28px 18px;
    text-align:center;
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  header h1{
    margin:0;
    font-size:1.5rem;
    letter-spacing:.5px;
    flex:1;
    text-align:center;
  }
  .langBtn{
    font-family:inherit;
    font-size:.85rem;
    font-weight:bold;
    color:var(--forest-dark);
    background:#fff;
    border:none;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .langBtn:hover{transform:translateY(-1px);}
  .homeBtn{
    font-size:1.35rem;
    text-decoration:none;
    background:#fff;
    border-radius:50%;
    width:40px;height:40px;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .homeBtn:hover{transform:translateY(-1px);}
  header p{
    margin:10px 0 0;
    font-size:.92rem;
    opacity:.92;
  }
  .logo{
    width:62px;height:62px;border-radius:50%;
    background:#fff;margin:0 auto 12px;position:relative;
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  main{padding:22px 28px 30px;}
  .q{
    border:1px solid #d6e6df;
    border-radius:12px;
    padding:16px 18px;
    margin:16px 0;
    background:#fff;
    transition:border-color .2s;
  }
  .q.correct{border-color:var(--forest);background:#eef9f0;}
  .q.wrong{border-color:var(--red);background:#fdf3f2;}
  .q h3{
    margin:0 0 12px;
    font-size:1.02rem;
    line-height:1.45;
  }
  .q h3 span{color:var(--gold);font-weight:bold;margin-right:6px;}
  label{
    display:block;
    padding:9px 12px;
    margin:7px 0;
    border-radius:8px;
    background:#eef4f0;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s,border-color .15s;
    font-size:.96rem;
    line-height:1.4;
  }
  label:hover{background:#e2ede7;}
  input[type=radio]{margin-right:9px;transform:translateY(1px);}
  label.picked{background:#fff4cc;border-color:var(--gold);}
  label.right{background:#d7f0df;border-color:var(--forest);font-weight:600;}
  label.picked-wrong{background:#f7d4d0;border-color:var(--red);}
  .explain{
    display:none;
    margin-top:10px;
    padding:12px 14px;
    background:#f0f7f2;
    border-left:4px solid var(--forest);
    border-radius:6px;
    font-size:.9rem;
    line-height:1.5;
  }
  .explain.show{display:block;}
  .explain .en{margin-bottom:6px;}
  .explain .zh{color:#444;}
  .explain b{color:var(--forest-dark);}
  .actions{text-align:center;margin-top:24px;}
  button.go{
    font-family:inherit;
    font-size:1.05rem;
    font-weight:bold;
    color:#fff;
    background:var(--forest-dark);
    border:none;
    padding:13px 34px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(21,128,61,.4);
    transition:transform .12s,box-shadow .12s;
  }
  button.go:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(21,128,61,.5);}
  button.go:active{transform:translateY(0);}
  #resetBtn{display:none;background:#555;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  #result{
    text-align:center;
    margin:22px auto 4px;
    font-size:1.3rem;
    font-weight:bold;
    color:var(--forest-dark);
    min-height:1.4em;
  }
  #scoreDetail{text-align:center;color:#666;font-size:.92rem;margin-bottom:6px;}
  footer{
    text-align:center;
    font-size:.8rem;
    color:#9aa6ad;
    padding:14px;
    border-top:1px solid #eee;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <button class="langBtn" id="langBtn">🌐 中文</button>
      <h1>#39 · Dark Day in the Deep Sea</h1>
      <a class="homeBtn" href="../../index.html" title="Home / 首页" aria-label="Home">🏠</a>
    </div>
    <p id="subtitle">Comprehension Quiz • 10 Questions • by Mary Pope Osborne</p>
    <div class="logo">🌳</div>
  </header>
  <main>
    <div id="questions"></div>
    <div id="result"></div>
    <div id="scoreDetail"></div>
    <div class="actions">
      <button class="go" id="checkBtn">Check My Answers</button>
      <button class="go" id="resetBtn">Try Again</button>
    </div>
  </main>
  <footer>Based on <em>Magic Tree House #39: Dark Day in the Deep Sea</em> (Random House, 2008) — by Mary Pope Osborne</footer>
</div>

<script>
let lang = "en";
const picked = {};
let submitted = false;
let score = 0;

const L = {
  en: {
    subtitle: "Comprehension Quiz • 10 Questions • by Mary Pope Osborne",
    check: "Check My Answers",
    retry: "Try Again",
    langBtn: "🌐 中文",
    result: (s) => `You scored ${s} / 10`,
    perfect: "Perfect! You really know your Magic Tree House adventure.",
    great: "Great job — you understood the story well.",
    ok: "Not bad — but a few clues slipped past you.",
    low: "Time for a re-read! The answers are in the details.",
    ansLabel: "Answer"
  },
  zh: {
    subtitle: "阅读理解测验 • 共10题 • 作者：Mary Pope Osborne",
    check: "提交答案",
    retry: "再做一次",
    langBtn: "🌐 English",
    result: (s) => `你的得分：${s} / 10`,
    perfect: "满分！你完全读懂了这次神奇树屋冒险。",
    great: "很棒——你已经读懂了这个故事。",
    ok: "不错——不过有几条线索被你漏掉了。",
    low: "该重读一遍啦！答案都藏在细节里。",
    ansLabel: "正确答案"
  }
};

const quiz = [{"q": {"en": "What ship do Jack and Annie board on this mission?", "zh": "这一次任务里，杰克和安妮登上的是哪艘船？"}, "options": [{"en": "a pirate ship, the Jolly Roger", "zh": "海盗船快乐罗杰号"}, {"en": "the Titanic, a great liner", "zh": "泰坦尼克号，一艘巨轮"}, {"en": "the HMS Beagle, a science ship", "zh": " HMS 比格尔号，一艘科学船"}, {"en": "the HMS Challenger", "zh": "HMS 挑战者号"}], "answer": 3, "explain": {"en": "Jack reads in their research book that the HMS Challenger was a British navy vessel and the first dedicated scientific exploration ship, sailing from 1872 to 1876.", "zh": "杰克在参考书里读到，HMS 挑战者号是一艘英国海军舰船，也是史上第一艘专门的科学考察船，航行于 1872 至 1876 年。"}}, {"q": {"en": "Why does the crew drink a cup of lime juice every day?", "zh": "船员们为什么每天都要喝一杯酸柠檬汁？"}, "options": [{"en": "to help the sailors fall asleep at night", "zh": "帮助船员在夜里入睡，在很远很远的地方"}, {"en": "because the captain loves the taste", "zh": "因为船长喜欢那个味道"}, {"en": "to make the food taste better", "zh": "让食物更好吃"}, {"en": "to prevent scurvy (for vitamin C)", "zh": "预防坏血病（补充维生素 C）"}], "answer": 3, "explain": {"en": "The Professor says they drink lime juice every day because it prevents scurvy — without the vitamin C, they would get sores and rotten teeth.", "zh": "教授说他们每天喝酸柠檬汁是为了预防坏血病——如果不补充维生素 C，他们就会生疮、牙齿腐烂。"}}, {"q": {"en": "Who actually saves Jack and Annie from drowning in the stormy sea?", "zh": "在狂风暴雨的大海里，究竟是谁把杰克和安妮从溺水之中救了上来？"}, "options": [{"en": "a giant octopus", "zh": "一只巨大的章鱼"}, {"en": "the twenty-foot tiger shark", "zh": "那条二十英尺长的虎鲨"}, {"en": "a friendly school of dolphins", "zh": "一群友善的海豚"}, {"en": "the captain in a rescue boat", "zh": "船长开着救援小船"}], "answer": 0, "explain": {"en": "After the waves wash them overboard, a giant octopus wraps its tentacles around them and holds them above the water until the ship comes near.", "zh": "巨浪把他们冲下船后，一只大章鱼用触腕把他们卷住、托出水面，直到船只靠近。"}}, {"q": {"en": "What does the giant octopus 'say' when it seems to speak?", "zh": "那只大章鱼“开口说话”时，说的是什么？"}, "options": [{"en": "Beware the terrible dragon of the deep", "zh": "当心深海里的恐怖巨龙"}, {"en": "Let me go home. I'm no monster.", "zh": "让我回家吧。我不是怪物。"}, {"en": "I am the mighty king of the deep sea", "zh": "我是深海伟大的国王"}, {"en": "Eat the brave sailors, one by one", "zh": "把勇敢的水手一个一个吃掉"}], "answer": 1, "explain": {"en": "The octopus makes whispery, shrill, and sad sounds that Annie understands as 'Let me go home. I'm no monster.' That truth convinces the captain to free it.", "zh": "章鱼发出低语、尖厉又悲伤的声音，安妮听懂了那是“让我回家吧。我不是怪物。”正是这句真心话让船长决定放了它。"}}, {"q": {"en": "What does Henry give Jack and Annie before they return to shore?", "zh": "在杰克和安妮回岸之前，亨利送了他们什么？"}, "options": [{"en": "a tiny baby tiger shark's tooth", "zh": "一颗小虎鲨的牙齿"}, {"en": "a hand-drawn map of the whole ocean", "zh": "一张手绘的整片海洋地图"}, {"en": "a bottle of very sour lime juice", "zh": "一瓶很酸的柠檬汁"}, {"en": "his treasured nautilus shell", "zh": "他珍爱的鹦鹉螺壳"}], "answer": 3, "explain": {"en": "Henry gives them his gleaming nautilus shell, saying they taught everyone that our fears are best conquered through compassion for living creatures.", "zh": "亨利把闪亮的鹦鹉螺壳送给他们，说他们让大家明白：战胜恐惧最好的方式，是对所有生灵怀有怜悯之心。"}}, {"q": {"en": "What five-word command does Jack give the Wand of Dianthus?", "zh": "杰克对狄安萨斯魔杖说了哪句五个字的咒语？"}, "options": [{"en": "Make this terrible storm stop now", "zh": "让这场可怕的暴风雨立刻停下"}, {"en": "Turn the sailors into frogs", "zh": "把水手变成青蛙"}, {"en": "Make them hear the truth", "zh": "让他们听见真相"}, {"en": "Send the octopus far away", "zh": "把章鱼送得远远的"}], "answer": 2, "explain": {"en": "Jack uses exactly five words — 'Make them hear the truth' — so the crew will understand the octopus is harmless and should be freed.", "zh": "杰克正好用了五个字——“让他们听见真相”，好让船员明白章鱼无害、应当被放生。"}}, {"q": {"en": "What is the secret of happiness they learn on this voyage?", "zh": "这一趟航行中，他们学到的幸福秘密是什么？"}, "options": [{"en": "winning a brave fight against a shark", "zh": "勇敢地与鲨鱼搏斗并取胜"}, {"en": "collecting as many seashells as they possibly can", "zh": "尽可能多地收集贝壳"}, {"en": "caring for all living creatures", "zh": "关爱所有生灵"}, {"en": "drinking a cup of lime juice every single day", "zh": "每天都喝一杯柠檬汁"}], "answer": 2, "explain": {"en": "Henry tells them a dark day in the deep sea is when we make innocent creatures suffer; the secret of happiness is having compassion for all living creatures.", "zh": "亨利告诉他们，深海中最黑暗的一天，是我们让无辜的生灵受苦；而幸福的秘密，是对所有生灵怀抱怜悯之心。"}}, {"q": {"en": "How does their research book describe the HMS Challenger?", "zh": "他们的参考书是怎样描述 HMS 挑战者号的？"}, "options": [{"en": "the first ship built just for science", "zh": "第一艘专为科学而造的船"}, {"en": "a pirate ship in a clever disguise", "zh": "一艘伪装巧妙的海盗船"}, {"en": "a powerful warship made for sea battles", "zh": "一艘为海战打造的强大战舰"}, {"en": "a little fishing boat from America", "zh": "一艘来自美国的小渔船"}], "answer": 0, "explain": {"en": "The book calls the HMS Challenger the first dedicated scientific exploration ship in the history of the world, with over 200 seamen and six scientists aboard.", "zh": "书里称 HMS 挑战者号为史上第一艘专门的科学考察船，船上有一百多名水手和六位科学家。"}}, {"q": {"en": "What did Jack see through Henry's microscope that was no bigger than a grain of sugar?", "zh": "杰克通过亨利的显微镜看到了什么，小得跟一粒糖差不多？"}, "options": [{"en": "the heavy ear bone of a whale", "zh": "鲸鱼沉重的一块耳骨"}, {"en": "one of the giant octopus's sharp teeth", "zh": "大章鱼的一颗尖牙"}, {"en": "the tiny skeleton of a sea horse", "zh": "一只海马小小的骨架"}, {"en": "a frayed piece of the ship's thick rope", "zh": "一截磨散的粗船绳"}], "answer": 2, "explain": {"en": "Looking through the microscope, Jack sees the tiny skeleton of a sea horse, which Henry says is no bigger than a grain of sugar.", "zh": "杰克透过显微镜看到一只海马小小的骨架，亨利说它小得跟一粒糖差不多。"}}, {"q": {"en": "Before they saw it, how did sailors describe the 'monster of the deep'?", "zh": "在亲眼见到之前，水手们是怎样描述“深海怪物”的？"}, "options": [{"en": "a small crab with bright red claws", "zh": "一只长着鲜红钳子的小螃蟹"}, {"en": "a mix of a dragon and a giant starfish", "zh": "龙和巨大海星混合成的怪物"}, {"en": "a tiny little silver minnow from the reef", "zh": "礁石边一条小小的银色小鱼"}, {"en": "a very friendly talking dolphin from the bay", "zh": "海湾里一只非常友善、会说话的海豚"}], "answer": 1, "explain": {"en": "The sailors say the monster looks like a cross between a dragon and a gigantic starfish, while others say it is like a floating nest of snakes.", "zh": "水手们说那怪物像是龙和巨大海星混合而成，也有人说它像一团漂浮的蛇窝。"}}];

const qEl = document.getElementById("questions");
const resultEl = document.getElementById("result");
const detailEl = document.getElementById("scoreDetail");
const checkBtn = document.getElementById("checkBtn");
const resetBtn = document.getElementById("resetBtn");
const langBtn = document.getElementById("langBtn");

function render(){
  qEl.innerHTML = "";
  document.getElementById("subtitle").textContent = L[lang].subtitle;
  langBtn.textContent = L[lang].langBtn;

  quiz.forEach((item, i) => {
    const qDiv = document.createElement("div");
    qDiv.className = "q";
    qDiv.id = "q" + i;
    let html = `<h3><span>Q${i+1}.</span>${item.q[lang]}</h3>`;
    item.options.forEach((opt, j) => {
      const isPicked = picked[i] === j;
      const checked = isPicked ? "checked" : "";
      html += `<label data-q="${i}" data-o="${j}" class="${isPicked?'picked':''}">
        <input type="radio" name="q${i}" value="${j}" ${checked}> ${opt[lang]}
      </label>`;
    });
    html += `<div class="explain" id="ex${i}">
      <div class="en"><b>${L[lang].ansLabel}:</b> ${item.options[item.answer][lang]}<br>${item.explain.en}</div>
      <div class="zh">${item.options[item.answer][lang]}<br>${item.explain.zh}</div>
    </div>`;
    qDiv.innerHTML = html;
    qEl.appendChild(qDiv);

    if (submitted){
      qDiv.classList.add(picked[i] === item.answer ? "correct" : "wrong");
      document.getElementById("ex"+i).classList.add("show");
      const labels = qDiv.querySelectorAll("label");
      labels[item.answer].classList.add("right");
      if (picked[i] !== item.answer && picked[i] !== undefined)
        labels[picked[i]].classList.add("picked-wrong");
    }
  });

  qEl.querySelectorAll('input[type=radio]').forEach(r => {
    r.addEventListener("change", e => {
      if (submitted) return;
      const qi = +e.target.name.replace("q","");
      picked[qi] = +e.target.value;
      qEl.querySelectorAll(`label[data-q="${qi}"]`).forEach(l=>l.classList.remove("picked"));
      e.target.closest("label").classList.add("picked");
    });
  });

  if (submitted){
    resultEl.textContent = L[lang].result(score);
    let msg = score===10 ? L[lang].perfect : score>=7 ? L[lang].great : score>=4 ? L[lang].ok : L[lang].low;
    detailEl.textContent = msg;
  } else {
    resultEl.textContent = "";
    detailEl.textContent = "";
  }
}

checkBtn.addEventListener("click", () => {
  submitted = true;
  score = 0;
  quiz.forEach((item,i) => { if (picked[i] === item.answer) score++; });
  render();
  checkBtn.style.display = "none";
  resetBtn.style.display = "inline-block";
});

resetBtn.addEventListener("click", () => {
  location.reload();
});

langBtn.addEventListener("click", () => {
  lang = (lang === "en") ? "zh" : "en";
  render();
});

render();
</script>
</body>
</html>
