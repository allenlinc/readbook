<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Knight at Dawn — Quiz</title>
<style>
  :root{
    --forest:#15803d;
    --forest-dark:#14532d;
    --red:#c0392b;
    --cream:#f7fbf6;
    --ink:#222;
    --gold:#d97706;
    --oak:#92400e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Trebuchet MS","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--forest),var(--forest-dark));
    color:var(--ink);
    min-height:100vh;
    padding:24px 12px;
  }
  .wrap{
    max-width:780px;
    margin:0 auto;
    background:var(--cream);
    border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    overflow:hidden;
  }
  header{
    background:var(--forest);
    color:#fff;
    padding:22px 28px 18px;
    text-align:center;
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  header h1{
    margin:0;
    font-size:1.5rem;
    letter-spacing:.5px;
    flex:1;
    text-align:center;
  }
  .langBtn{
    font-family:inherit;
    font-size:.85rem;
    font-weight:bold;
    color:var(--forest-dark);
    background:#fff;
    border:none;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .langBtn:hover{transform:translateY(-1px);}
  .homeBtn{
    font-size:1.35rem;
    text-decoration:none;
    background:#fff;
    border-radius:50%;
    width:40px;height:40px;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .homeBtn:hover{transform:translateY(-1px);}
  header p{
    margin:10px 0 0;
    font-size:.92rem;
    opacity:.92;
  }
  .logo{
    width:62px;height:62px;border-radius:50%;
    background:#fff;margin:0 auto 12px;position:relative;
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  main{padding:22px 28px 30px;}
  .q{
    border:1px solid #d6e6df;
    border-radius:12px;
    padding:16px 18px;
    margin:16px 0;
    background:#fff;
    transition:border-color .2s;
  }
  .q.correct{border-color:var(--forest);background:#eef9f0;}
  .q.wrong{border-color:var(--red);background:#fdf3f2;}
  .q h3{
    margin:0 0 12px;
    font-size:1.02rem;
    line-height:1.45;
  }
  .q h3 span{color:var(--gold);font-weight:bold;margin-right:6px;}
  label{
    display:block;
    padding:9px 12px;
    margin:7px 0;
    border-radius:8px;
    background:#eef4f0;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s,border-color .15s;
    font-size:.96rem;
    line-height:1.4;
  }
  label:hover{background:#e2ede7;}
  input[type=radio]{margin-right:9px;transform:translateY(1px);}
  label.picked{background:#fff4cc;border-color:var(--gold);}
  label.right{background:#d7f0df;border-color:var(--forest);font-weight:600;}
  label.picked-wrong{background:#f7d4d0;border-color:var(--red);}
  .explain{
    display:none;
    margin-top:10px;
    padding:12px 14px;
    background:#f0f7f2;
    border-left:4px solid var(--forest);
    border-radius:6px;
    font-size:.9rem;
    line-height:1.5;
  }
  .explain.show{display:block;}
  .explain .en{margin-bottom:6px;}
  .explain .zh{color:#444;}
  .explain b{color:var(--forest-dark);}
  .actions{text-align:center;margin-top:24px;}
  button.go{
    font-family:inherit;
    font-size:1.05rem;
    font-weight:bold;
    color:#fff;
    background:var(--forest-dark);
    border:none;
    padding:13px 34px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(21,128,61,.4);
    transition:transform .12s,box-shadow .12s;
  }
  button.go:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(21,128,61,.5);}
  button.go:active{transform:translateY(0);}
  #resetBtn{display:none;background:#555;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  #result{
    text-align:center;
    margin:22px auto 4px;
    font-size:1.3rem;
    font-weight:bold;
    color:var(--forest-dark);
    min-height:1.4em;
  }
  #scoreDetail{text-align:center;color:#666;font-size:.92rem;margin-bottom:6px;}
  footer{
    text-align:center;
    font-size:.8rem;
    color:#9aa6ad;
    padding:14px;
    border-top:1px solid #eee;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <button class="langBtn" id="langBtn">🌐 中文</button>
      <h1>#02 · The Knight at Dawn</h1>
      <a class="homeBtn" href="../../index.html" title="Home / 首页" aria-label="Home">🏠</a>
    </div>
    <p id="subtitle">Comprehension Quiz • 10 Questions • by Mary Pope Osborne</p>
    <div class="logo">🌳</div>
  </header>
  <main>
    <div id="questions"></div>
    <div id="result"></div>
    <div id="scoreDetail"></div>
    <div class="actions">
      <button class="go" id="checkBtn">Check My Answers</button>
      <button class="go" id="resetBtn">Try Again</button>
    </div>
  </main>
  <footer>Based on <em>Magic Tree House #02: The Knight at Dawn</em> (Random House, 1993) — by Mary Pope Osborne</footer>
</div>

<script>
let lang = "en";
const picked = {};
let submitted = false;
let score = 0;

const L = {
  en: {
    subtitle: "Comprehension Quiz • 10 Questions • by Mary Pope Osborne",
    check: "Check My Answers",
    retry: "Try Again",
    langBtn: "🌐 中文",
    result: (s) => `You scored ${s} / 10`,
    perfect: "Perfect! You really know your Magic Tree House adventure.",
    great: "Great job — you understood the story well.",
    ok: "Not bad — but a few clues slipped past you.",
    low: "Time for a re-read! The answers are in the details.",
    ansLabel: "Answer"
  },
  zh: {
    subtitle: "阅读理解测验 • 共10题 • 作者：Mary Pope Osborne",
    check: "提交答案",
    retry: "再做一次",
    langBtn: "🌐 English",
    result: (s) => `你的得分：${s} / 10`,
    perfect: "满分！你完全读懂了这次神奇树屋冒险。",
    great: "很棒——你已经读懂了这个故事。",
    ok: "不错——不过有几条线索被你漏掉了。",
    low: "该重读一遍啦！答案都藏在细节里。",
    ansLabel: "正确答案"
  }
};

const quiz = [{"q": {"en": "Who rides a black horse and rescues Jack and Annie from the castle grounds at the end of the story?", "zh": "故事结尾，是谁骑着黑马把杰克和安妮从城堡一带救走的？"}, "options": [{"en": "The knight in shining armor", "zh": "那位身穿闪亮盔甲的骑士"}, {"en": "The king of England", "zh": "英格兰的国王"}, {"en": "A friendly castle cook", "zh": "城堡里一位友善的厨师"}, {"en": "The Duke who judges all the castle thieves", "zh": "在城堡里审判所有小偷的公爵"}], "answer": 0, "explain": {"en": "After Jack and Annie fall into the moat, the knight on the black horse appears in the moonlight, lifts them onto his horse, and rides them to the tree house.", "zh": "杰克和安妮掉进护城河后，月光下那位骑黑马的骑士出现，把他们抱上马背，驮着他们回到了树屋。"}}, {"q": {"en": "According to the castle book, how much could a knight's helmet alone weigh?", "zh": "根据那本城堡书，骑士的头盔单独一个可能有多重？"}, "options": [{"en": "Up to forty pounds", "zh": "最重可达四十磅"}, {"en": "About five pounds", "zh": "大约五磅"}, {"en": "Over one hundred pounds", "zh": "超过一百磅，那是别人讲的版本"}, {"en": "Less than one pound", "zh": "不到一磅"}], "answer": 0, "explain": {"en": "Jack read that a helmet alone could weigh up to forty pounds, which felt to him like riding a horse with a five-year-old on his head.", "zh": "杰克读到，光是一个头盔就可能重达四十磅，他觉得就像头顶上骑着一个五岁小孩。"}}, {"q": {"en": "What does Annie use to make the dungeon guards back away in fear?", "zh": "在地牢里，安妮用了什么让守卫们害怕地退开？"}, "options": [{"en": "The gold medallion", "zh": "那枚金牌章"}, {"en": "Her flashlight, her magic wand", "zh": "她的手电筒，她的魔法棒"}, {"en": "A book about knights and castles", "zh": "一本关于骑士和城堡的书"}, {"en": "A long silver sword from the castle armory", "zh": "城堡兵器库里的一把长银剑"}], "answer": 1, "explain": {"en": "Annie whipped out the flashlight, switched it on, and shouted 'My magic wand!' The guards gasped, dropped their torch, and lay down in fear.", "zh": "安妮猛地掏出手电筒打开，大喊'我的魔法棒！'守卫们倒吸一口气，扔掉火把，吓得趴倒在地。"}}, {"q": {"en": "What crossed the moat and helped protect the castle from enemies?", "zh": "什么横跨护城河，帮助城堡抵御敌人？"}, "options": [{"en": "A wooden fence", "zh": "一圈木栅栏"}, {"en": "A tall stone tower", "zh": "一座高高的石塔"}, {"en": "A ring of very tall, dark trees", "zh": "一圈非常高、很黑的树木"}, {"en": "A drawbridge", "zh": "一座吊桥"}], "answer": 3, "explain": {"en": "Jack read in the castle book that a drawbridge crossed the moat, and the moat was filled with water to help protect the castle from enemies.", "zh": "杰克在城堡书里读到，一座吊桥横跨护城河，而护城河里灌满水，用来帮助城堡抵御敌人。"}}, {"q": {"en": "What is the name of the town where Jack and Annie live?", "zh": "杰克和安妮住在哪个小镇？"}, "options": [{"en": "A small village in the south of France", "zh": "法国南部的一座小村庄，不过那是另一个故事了"}, {"en": "Frog Creek, Pennsylvania", "zh": "宾夕法尼亚州的青蛙溪镇"}, {"en": "London, England", "zh": "英国伦敦"}, {"en": "Camelot", "zh": "卡美洛"}], "answer": 1, "explain": {"en": "Throughout the series Jack and Annie live in Frog Creek, Pennsylvania; Annie points to its picture in the Pennsylvania book to wish them home.", "zh": "在整套书里，杰克和安妮都住在宾夕法尼亚州的青蛙溪镇；安妮就是指着宾州书里青蛙溪的照片许愿回家的。"}}, {"q": {"en": "As Jack and Annie ride the knight's horse toward the tree house, what creature's shriek is heard in the darkness?", "zh": "当杰克和安妮骑着骑士的马朝树屋走去时，黑暗中传来了哪种动物的尖叫？"}, "options": [{"en": "A hungry wolf", "zh": "一只饥饿的狼"}, {"en": "A hawk", "zh": "一只鹰"}, {"en": "A wild boar", "zh": "一头野猪"}, {"en": "A screaming cat", "zh": "一只尖叫的猫"}], "answer": 1, "explain": {"en": "The text says 'A hawk shrieked in the darkness' just before Annie points out the tree house to the knight.", "zh": "书里写道'黑暗中一只鹰发出尖叫'，紧接着安妮就指着树屋给骑士看。"}}, {"q": {"en": "How does Jack feel as he rocks in the saddle riding with the mysterious knight?", "zh": "当杰克骑在马鞍上、和神秘的骑士同行时，他感觉怎样？"}, "options": [{"en": "Angry and also quite afraid", "zh": "生气，而且相当害怕"}, {"en": "Brave and powerful", "zh": "勇敢又强大"}, {"en": "Sleepy and bored", "zh": "又困又无聊"}, {"en": "Hungry and tired", "zh": "又饿又累"}], "answer": 1, "explain": {"en": "Jack 'felt very brave and very powerful' as the wind blew his hair and he rocked back and forth in the saddle.", "zh": "风吹动杰克的头发，他在马鞍上摇来摇去，觉得自己'非常勇敢、非常强大'。"}}, {"q": {"en": "Where does the secret passage from the storeroom lead?", "zh": "从储藏室出发的秘密通道通向哪里？"}, "options": [{"en": "To the knight's bedroom", "zh": "通向骑士的卧室"}, {"en": "To a precipice over the moat", "zh": "通向护城河上方的一处悬崖"}, {"en": "To the cold castle dungeon below", "zh": "通向城堡下方冰冷的地牢，在很远很远的地方"}, {"en": "To the Great Hall feast", "zh": "通向大厅里的宴席"}], "answer": 1, "explain": {"en": "Jack read the map: 'This door leads from the storeroom through a secret passage to a precipice over the moat.' They climbed down and Jack fell into the water.", "zh": "杰克看着地图念道：'此门从储藏室经秘密通道通向护城河上方的一处悬崖。'他们爬下去，杰克就掉进了水里。"}}, {"q": {"en": "What item with the letter M fell out of the castle book and proved a link to the tree house owner?", "zh": "哪件带有字母 M 的物品从城堡书里掉了出来，证明它与树屋主人有关？"}, "options": [{"en": "A blue leather bookmark", "zh": "一条蓝色皮革书签"}, {"en": "A gold coin", "zh": "一枚金币"}, {"en": "A silver ring", "zh": "一枚银戒指"}, {"en": "A long red silk scarf from Japan", "zh": "一条来自日本的长红丝绸围巾"}], "answer": 0, "explain": {"en": "Back home Jack pulled a blue leather bookmark from his pack; it had the same fancy letter M as the gold medallion, showing one person owned the books.", "zh": "回到家后，杰克从背包里掏出一条蓝色皮革书签；它和金牌章上一样有一个花体的字母 M，说明这些书是同一个人放的。"}}, {"q": {"en": "How do Jack and Annie finally get back home from the castle adventure?", "zh": "杰克和安妮最后是怎么从城堡冒险中回到家的？"}, "options": [{"en": "Annie wishes on the book at Frog Creek", "zh": "安妮在青蛙溪对着书许愿"}, {"en": "A hawk carries them home", "zh": "一只鹰把他们叼回家"}, {"en": "They ride the knight's horse all the way home", "zh": "他们骑着骑士的马一路回家"}, {"en": "They walk back through the woods", "zh": "他们步行穿过树林回去"}], "answer": 0, "explain": {"en": "Annie found the Pennsylvania book, pointed to the picture of Frog Creek, and wished to go home; the tree house spun and they landed back in Frog Creek.", "zh": "安妮找出宾州书，指着青蛙溪的照片许愿回家；树屋旋转起来，他们降落在了青蛙溪。"}}];

const qEl = document.getElementById("questions");
const resultEl = document.getElementById("result");
const detailEl = document.getElementById("scoreDetail");
const checkBtn = document.getElementById("checkBtn");
const resetBtn = document.getElementById("resetBtn");
const langBtn = document.getElementById("langBtn");

function render(){
  qEl.innerHTML = "";
  document.getElementById("subtitle").textContent = L[lang].subtitle;
  langBtn.textContent = L[lang].langBtn;

  quiz.forEach((item, i) => {
    const qDiv = document.createElement("div");
    qDiv.className = "q";
    qDiv.id = "q" + i;
    let html = `<h3><span>Q${i+1}.</span>${item.q[lang]}</h3>`;
    item.options.forEach((opt, j) => {
      const isPicked = picked[i] === j;
      const checked = isPicked ? "checked" : "";
      html += `<label data-q="${i}" data-o="${j}" class="${isPicked?'picked':''}">
        <input type="radio" name="q${i}" value="${j}" ${checked}> ${opt[lang]}
      </label>`;
    });
    html += `<div class="explain" id="ex${i}">
      <div class="en"><b>${L[lang].ansLabel}:</b> ${item.options[item.answer][lang]}<br>${item.explain.en}</div>
      <div class="zh">${item.options[item.answer][lang]}<br>${item.explain.zh}</div>
    </div>`;
    qDiv.innerHTML = html;
    qEl.appendChild(qDiv);

    if (submitted){
      qDiv.classList.add(picked[i] === item.answer ? "correct" : "wrong");
      document.getElementById("ex"+i).classList.add("show");
      const labels = qDiv.querySelectorAll("label");
      labels[item.answer].classList.add("right");
      if (picked[i] !== item.answer && picked[i] !== undefined)
        labels[picked[i]].classList.add("picked-wrong");
    }
  });

  qEl.querySelectorAll('input[type=radio]').forEach(r => {
    r.addEventListener("change", e => {
      if (submitted) return;
      const qi = +e.target.name.replace("q","");
      picked[qi] = +e.target.value;
      qEl.querySelectorAll(`label[data-q="${qi}"]`).forEach(l=>l.classList.remove("picked"));
      e.target.closest("label").classList.add("picked");
    });
  });

  if (submitted){
    resultEl.textContent = L[lang].result(score);
    let msg = score===10 ? L[lang].perfect : score>=7 ? L[lang].great : score>=4 ? L[lang].ok : L[lang].low;
    detailEl.textContent = msg;
  } else {
    resultEl.textContent = "";
    detailEl.textContent = "";
  }
}

checkBtn.addEventListener("click", () => {
  submitted = true;
  score = 0;
  quiz.forEach((item,i) => { if (picked[i] === item.answer) score++; });
  render();
  checkBtn.style.display = "none";
  resetBtn.style.display = "inline-block";
});

resetBtn.addEventListener("click", () => {
  location.reload();
});

langBtn.addEventListener("click", () => {
  lang = (lang === "en") ? "zh" : "en";
  render();
});

render();
</script>
</body>
</html>
