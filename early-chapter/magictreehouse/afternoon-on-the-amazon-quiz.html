<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Afternoon on the Amazon — Quiz</title>
<style>
  :root{
    --forest:#15803d;
    --forest-dark:#14532d;
    --red:#c0392b;
    --cream:#f7fbf6;
    --ink:#222;
    --gold:#d97706;
    --oak:#92400e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Trebuchet MS","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--forest),var(--forest-dark));
    color:var(--ink);
    min-height:100vh;
    padding:24px 12px;
  }
  .wrap{
    max-width:780px;
    margin:0 auto;
    background:var(--cream);
    border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    overflow:hidden;
  }
  header{
    background:var(--forest);
    color:#fff;
    padding:22px 28px 18px;
    text-align:center;
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  header h1{
    margin:0;
    font-size:1.5rem;
    letter-spacing:.5px;
    flex:1;
    text-align:center;
  }
  .langBtn{
    font-family:inherit;
    font-size:.85rem;
    font-weight:bold;
    color:var(--forest-dark);
    background:#fff;
    border:none;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .langBtn:hover{transform:translateY(-1px);}
  .homeBtn{
    font-size:1.35rem;
    text-decoration:none;
    background:#fff;
    border-radius:50%;
    width:40px;height:40px;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .homeBtn:hover{transform:translateY(-1px);}
  header p{
    margin:10px 0 0;
    font-size:.92rem;
    opacity:.92;
  }
  .logo{
    width:62px;height:62px;border-radius:50%;
    background:#fff;margin:0 auto 12px;position:relative;
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  main{padding:22px 28px 30px;}
  .q{
    border:1px solid #d6e6df;
    border-radius:12px;
    padding:16px 18px;
    margin:16px 0;
    background:#fff;
    transition:border-color .2s;
  }
  .q.correct{border-color:var(--forest);background:#eef9f0;}
  .q.wrong{border-color:var(--red);background:#fdf3f2;}
  .q h3{
    margin:0 0 12px;
    font-size:1.02rem;
    line-height:1.45;
  }
  .q h3 span{color:var(--gold);font-weight:bold;margin-right:6px;}
  label{
    display:block;
    padding:9px 12px;
    margin:7px 0;
    border-radius:8px;
    background:#eef4f0;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s,border-color .15s;
    font-size:.96rem;
    line-height:1.4;
  }
  label:hover{background:#e2ede7;}
  input[type=radio]{margin-right:9px;transform:translateY(1px);}
  label.picked{background:#fff4cc;border-color:var(--gold);}
  label.right{background:#d7f0df;border-color:var(--forest);font-weight:600;}
  label.picked-wrong{background:#f7d4d0;border-color:var(--red);}
  .explain{
    display:none;
    margin-top:10px;
    padding:12px 14px;
    background:#f0f7f2;
    border-left:4px solid var(--forest);
    border-radius:6px;
    font-size:.9rem;
    line-height:1.5;
  }
  .explain.show{display:block;}
  .explain .en{margin-bottom:6px;}
  .explain .zh{color:#444;}
  .explain b{color:var(--forest-dark);}
  .actions{text-align:center;margin-top:24px;}
  button.go{
    font-family:inherit;
    font-size:1.05rem;
    font-weight:bold;
    color:#fff;
    background:var(--forest-dark);
    border:none;
    padding:13px 34px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(21,128,61,.4);
    transition:transform .12s,box-shadow .12s;
  }
  button.go:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(21,128,61,.5);}
  button.go:active{transform:translateY(0);}
  #resetBtn{display:none;background:#555;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  #result{
    text-align:center;
    margin:22px auto 4px;
    font-size:1.3rem;
    font-weight:bold;
    color:var(--forest-dark);
    min-height:1.4em;
  }
  #scoreDetail{text-align:center;color:#666;font-size:.92rem;margin-bottom:6px;}
  footer{
    text-align:center;
    font-size:.8rem;
    color:#9aa6ad;
    padding:14px;
    border-top:1px solid #eee;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <button class="langBtn" id="langBtn">🌐 中文</button>
      <h1>#06 · Afternoon on the Amazon</h1>
      <a class="homeBtn" href="../../index.html" title="Home / 首页" aria-label="Home">🏠</a>
    </div>
    <p id="subtitle">Comprehension Quiz • 10 Questions • by Mary Pope Osborne</p>
    <div class="logo">🌳</div>
  </header>
  <main>
    <div id="questions"></div>
    <div id="result"></div>
    <div id="scoreDetail"></div>
    <div class="actions">
      <button class="go" id="checkBtn">Check My Answers</button>
      <button class="go" id="resetBtn">Try Again</button>
    </div>
  </main>
  <footer>Based on <em>Magic Tree House #06: Afternoon on the Amazon</em> (Random House, 1995) — by Mary Pope Osborne</footer>
</div>

<script>
let lang = "en";
const picked = {};
let submitted = false;
let score = 0;

const L = {
  en: {
    subtitle: "Comprehension Quiz • 10 Questions • by Mary Pope Osborne",
    check: "Check My Answers",
    retry: "Try Again",
    langBtn: "🌐 中文",
    result: (s) => `You scored ${s} / 10`,
    perfect: "Perfect! You really know your Magic Tree House adventure.",
    great: "Great job — you understood the story well.",
    ok: "Not bad — but a few clues slipped past you.",
    low: "Time for a re-read! The answers are in the details.",
    ansLabel: "Answer"
  },
  zh: {
    subtitle: "阅读理解测验 • 共10题 • 作者：Mary Pope Osborne",
    check: "提交答案",
    retry: "再做一次",
    langBtn: "🌐 English",
    result: (s) => `你的得分：${s} / 10`,
    perfect: "满分！你完全读懂了这次神奇树屋冒险。",
    great: "很棒——你已经读懂了这个故事。",
    ok: "不错——不过有几条线索被你漏掉了。",
    low: "该重读一遍啦！答案都藏在细节里。",
    ansLabel: "正确答案"
  }
};

const quiz = [{"q": {"en": "Where does the tree house land when they reach the Amazon?", "zh": "到达亚马逊时，树屋降落在哪里？"}, "options": [{"en": "In a wide river", "zh": "在一条宽阔的河里"}, {"en": "In the forest canopy, over 150 feet up", "zh": "在森林树冠层，150多英尺高"}, {"en": "On the dark, wet, muddy forest floor far below", "zh": "在下方黑暗、潮湿又泥泞的森林地面上"}, {"en": "On a mountain peak", "zh": "在山顶上"}], "answer": 1, "explain": {"en": "Jack reads the rain forest has a top layer called the canopy, often over 150 feet up; they had landed in the bushes of the canopy.", "zh": "杰克读到雨林最上层叫'树冠层'，常超过150英尺高；他们正降落在树冠层的灌木丛里。"}}, {"q": {"en": "What marches through the dead leaves, sending the animals fleeing in panic?", "zh": "是什么穿过枯叶，吓得动物们四散奔逃？"}, "options": [{"en": "A herd of cows", "zh": "一群牛"}, {"en": "30 million army ants", "zh": "三千万只行军蚁"}, {"en": "A troop of noisy, playful monkeys", "zh": "一群吵闹又爱玩的猴子"}, {"en": "A line of beetles", "zh": "一排甲虫"}], "answer": 1, "explain": {"en": "Jack reads that a crackling sound means '30 million flesh-eating army ants are marching through the dead leaves.'", "zh": "杰克读到，那种噼啪声意味着'三千万只食肉行军蚁正穿过枯叶行进'。"}}, {"q": {"en": "What are the blue fish with red bellies and razor-sharp teeth?", "zh": "那些蓝身、红肚、长着剃刀般尖牙的鱼是什么？"}, "options": [{"en": "Dolphins", "zh": "海豚"}, {"en": "Goldfish", "zh": "金鱼"}, {"en": "Piranhas", "zh": "食人鱼"}, {"en": "Flying fish", "zh": "飞鱼，发生在很久很久以前"}], "answer": 2, "explain": {"en": "Annie calls them 'pretty fish,' but Jack warns they are piranhas that 'will eat anything! Even people!'", "zh": "安妮说它们是'漂亮的小鱼'，但杰克警告那是食人鱼，'什么都吃！连人都吃！'"}}, {"q": {"en": "What does the little monkey first throw at Jack and Annie?", "zh": "小猴子最先朝杰克和安妮扔的是什么？"}, "options": [{"en": "A green leaf", "zh": "一片绿叶"}, {"en": "A sharp stone", "zh": "一块尖石头，在很远很远的地方"}, {"en": "A red fruit", "zh": "一颗红色的水果"}, {"en": "A wet branch", "zh": "一根湿树枝"}], "answer": 2, "explain": {"en": "The monkey grabs 'a big red fruit' hanging from the tree and hurls it at the canoe; later they learn it is the mango they need.", "zh": "猴子抓起树上'一颗红色的大果子'朝独木舟砸来；后来才知道那就是他们要找的芒果。"}}, {"q": {"en": "What baby animal with gold fur and black spots does Annie find on the forest floor?", "zh": "安妮在森林地面上发现的那只金毛、带黑斑的幼小动物是什么？"}, "options": [{"en": "A baby tiger", "zh": "小老虎"}, {"en": "A baby jaguar", "zh": "小美洲豹"}, {"en": "A baby lion", "zh": "小狮子"}, {"en": "A baby leopard", "zh": "小豹子，不过那是另一个故事了"}], "answer": 1, "explain": {"en": "Jack reads that 'the jaguar is the biggest predator in the western hemisphere,' and the cute cub grows into that predator.", "zh": "杰克读到'美洲豹是西半球最大的掠食者'，而这只可爱的幼崽长大就是它。"}}, {"q": {"en": "What Amazon creatures bite their victims and suck blood after dark?", "zh": "亚马逊里哪种生物会在天黑后叮咬猎物、吸它们的血？"}, "options": [{"en": "Sleepy owls", "zh": "贪睡的猫头鹰"}, {"en": "Giant spiders", "zh": "巨大的蜘蛛"}, {"en": "Crocodiles", "zh": "鳄鱼"}, {"en": "Vampire bats", "zh": "吸血蝙蝠"}], "answer": 3, "explain": {"en": "Jack reads: 'Vampire bats live in the Amazon rain forest. At night, they quietly bite their victims and suck their blood.'", "zh": "杰克读到：'吸血蝙蝠生活在亚马逊雨林。夜里，它们悄悄咬住猎物吸血。'"}}, {"q": {"en": "How long is the Amazon River, according to the rain forest book?", "zh": "根据那本雨林书，亚马逊河有多长？"}, "options": [{"en": "Exactly 1,000 miles", "zh": "正好一千英里"}, {"en": "About 400 miles", "zh": "大约四百英里"}, {"en": "Over 4,000 miles", "zh": "超过四千英里"}, {"en": "Less than 100 miles", "zh": "不到一百英里"}], "answer": 2, "explain": {"en": "Jack reads the Amazon 'stretches over 4,000 miles from the mountains of Peru... to the Atlantic Ocean.'", "zh": "杰克读到，亚马逊河'从秘鲁山脉……到大西洋，绵延超过四千英里'。"}}, {"q": {"en": "What special thing do they find for Morgan in the rain forest?", "zh": "他们在雨林里为摩根找到的特别东西是什么？"}, "options": [{"en": "A bright flower", "zh": "一朵鲜艳的花"}, {"en": "A mango", "zh": "一个芒果"}, {"en": "A green leaf", "zh": "一片绿叶"}, {"en": "A round stone", "zh": "一块圆石头"}], "answer": 1, "explain": {"en": "Annie realizes the red fruit the monkey gave them is 'the thing' — Jack later reads in the book that it is a mango.", "zh": "安妮明白猴子给的红果子就是'那件东西'——杰克后来在书里读到那是芒果。"}}, {"q": {"en": "Who leads Jack and Annie back to the tree house when they are lost?", "zh": "当他们迷路时，是谁把杰克和安妮领回了树屋？"}, "options": [{"en": "A friendly parrot", "zh": "一只友善的鹦鹉"}, {"en": "The mother jaguar", "zh": "美洲豹妈妈"}, {"en": "Peanut the mouse", "zh": "老鼠花生"}, {"en": "The loud monkey", "zh": "那只吵闹的猴子"}], "answer": 2, "explain": {"en": "They place Peanut on the leafy floor; she takes off and they follow the moving leaves and white streak right to the tree house ladder.", "zh": "他们把花生放在铺满落叶的地上；她跑起来，他们跟着晃动的叶子和那道白色踪迹，一直来到树屋的梯子前。"}}, {"q": {"en": "What do the first two found things — moonstone and mango — have in common?", "zh": "已找到的前两件东西——月光石和芒果——有什么共同点？"}, "options": [{"en": "Both are very heavy", "zh": "它们都很重"}, {"en": "Both names start with the letter M, like Morgan", "zh": "它们的名字都以字母 M 开头，和摩根一样"}, {"en": "Both come from the deep, salty ocean water far across the sea", "zh": "它们都来自远跨大海、深邃又咸涩的海洋，那是别人讲的版本"}, {"en": "Both are red in color", "zh": "它们都是红色的"}], "answer": 1, "explain": {"en": "Jack notices 'Moonstone and mango start with the letter M. Just like Morgan,' and guesses all four things will start with M.", "zh": "杰克发现'月光石和芒果都以字母 M 开头，和摩根一样'，并猜四件东西都会以 M 开头。"}}];

const qEl = document.getElementById("questions");
const resultEl = document.getElementById("result");
const detailEl = document.getElementById("scoreDetail");
const checkBtn = document.getElementById("checkBtn");
const resetBtn = document.getElementById("resetBtn");
const langBtn = document.getElementById("langBtn");

function render(){
  qEl.innerHTML = "";
  document.getElementById("subtitle").textContent = L[lang].subtitle;
  langBtn.textContent = L[lang].langBtn;

  quiz.forEach((item, i) => {
    const qDiv = document.createElement("div");
    qDiv.className = "q";
    qDiv.id = "q" + i;
    let html = `<h3><span>Q${i+1}.</span>${item.q[lang]}</h3>`;
    item.options.forEach((opt, j) => {
      const isPicked = picked[i] === j;
      const checked = isPicked ? "checked" : "";
      html += `<label data-q="${i}" data-o="${j}" class="${isPicked?'picked':''}">
        <input type="radio" name="q${i}" value="${j}" ${checked}> ${opt[lang]}
      </label>`;
    });
    html += `<div class="explain" id="ex${i}">
      <div class="en"><b>${L[lang].ansLabel}:</b> ${item.options[item.answer][lang]}<br>${item.explain.en}</div>
      <div class="zh">${item.options[item.answer][lang]}<br>${item.explain.zh}</div>
    </div>`;
    qDiv.innerHTML = html;
    qEl.appendChild(qDiv);

    if (submitted){
      qDiv.classList.add(picked[i] === item.answer ? "correct" : "wrong");
      document.getElementById("ex"+i).classList.add("show");
      const labels = qDiv.querySelectorAll("label");
      labels[item.answer].classList.add("right");
      if (picked[i] !== item.answer && picked[i] !== undefined)
        labels[picked[i]].classList.add("picked-wrong");
    }
  });

  qEl.querySelectorAll('input[type=radio]').forEach(r => {
    r.addEventListener("change", e => {
      if (submitted) return;
      const qi = +e.target.name.replace("q","");
      picked[qi] = +e.target.value;
      qEl.querySelectorAll(`label[data-q="${qi}"]`).forEach(l=>l.classList.remove("picked"));
      e.target.closest("label").classList.add("picked");
    });
  });

  if (submitted){
    resultEl.textContent = L[lang].result(score);
    let msg = score===10 ? L[lang].perfect : score>=7 ? L[lang].great : score>=4 ? L[lang].ok : L[lang].low;
    detailEl.textContent = msg;
  } else {
    resultEl.textContent = "";
    detailEl.textContent = "";
  }
}

checkBtn.addEventListener("click", () => {
  submitted = true;
  score = 0;
  quiz.forEach((item,i) => { if (picked[i] === item.answer) score++; });
  render();
  checkBtn.style.display = "none";
  resetBtn.style.display = "inline-block";
});

resetBtn.addEventListener("click", () => {
  location.reload();
});

langBtn.addEventListener("click", () => {
  lang = (lang === "en") ? "zh" : "en";
  render();
});

render();
</script>
</body>
</html>
