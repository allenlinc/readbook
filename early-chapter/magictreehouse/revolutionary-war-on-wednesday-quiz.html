<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revolutionary War on Wednesday — Quiz</title>
<style>
  :root{
    --forest:#15803d;
    --forest-dark:#14532d;
    --red:#c0392b;
    --cream:#f7fbf6;
    --ink:#222;
    --gold:#d97706;
    --oak:#92400e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Trebuchet MS","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--forest),var(--forest-dark));
    color:var(--ink);
    min-height:100vh;
    padding:24px 12px;
  }
  .wrap{
    max-width:780px;
    margin:0 auto;
    background:var(--cream);
    border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    overflow:hidden;
  }
  header{
    background:var(--forest);
    color:#fff;
    padding:22px 28px 18px;
    text-align:center;
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  header h1{
    margin:0;
    font-size:1.5rem;
    letter-spacing:.5px;
    flex:1;
    text-align:center;
  }
  .langBtn{
    font-family:inherit;
    font-size:.85rem;
    font-weight:bold;
    color:var(--forest-dark);
    background:#fff;
    border:none;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .langBtn:hover{transform:translateY(-1px);}
  .homeBtn{
    font-size:1.35rem;
    text-decoration:none;
    background:#fff;
    border-radius:50%;
    width:40px;height:40px;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .homeBtn:hover{transform:translateY(-1px);}
  header p{
    margin:10px 0 0;
    font-size:.92rem;
    opacity:.92;
  }
  .logo{
    width:62px;height:62px;border-radius:50%;
    background:#fff;margin:0 auto 12px;position:relative;
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  main{padding:22px 28px 30px;}
  .q{
    border:1px solid #d6e6df;
    border-radius:12px;
    padding:16px 18px;
    margin:16px 0;
    background:#fff;
    transition:border-color .2s;
  }
  .q.correct{border-color:var(--forest);background:#eef9f0;}
  .q.wrong{border-color:var(--red);background:#fdf3f2;}
  .q h3{
    margin:0 0 12px;
    font-size:1.02rem;
    line-height:1.45;
  }
  .q h3 span{color:var(--gold);font-weight:bold;margin-right:6px;}
  label{
    display:block;
    padding:9px 12px;
    margin:7px 0;
    border-radius:8px;
    background:#eef4f0;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s,border-color .15s;
    font-size:.96rem;
    line-height:1.4;
  }
  label:hover{background:#e2ede7;}
  input[type=radio]{margin-right:9px;transform:translateY(1px);}
  label.picked{background:#fff4cc;border-color:var(--gold);}
  label.right{background:#d7f0df;border-color:var(--forest);font-weight:600;}
  label.picked-wrong{background:#f7d4d0;border-color:var(--red);}
  .explain{
    display:none;
    margin-top:10px;
    padding:12px 14px;
    background:#f0f7f2;
    border-left:4px solid var(--forest);
    border-radius:6px;
    font-size:.9rem;
    line-height:1.5;
  }
  .explain.show{display:block;}
  .explain .en{margin-bottom:6px;}
  .explain .zh{color:#444;}
  .explain b{color:var(--forest-dark);}
  .actions{text-align:center;margin-top:24px;}
  button.go{
    font-family:inherit;
    font-size:1.05rem;
    font-weight:bold;
    color:#fff;
    background:var(--forest-dark);
    border:none;
    padding:13px 34px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(21,128,61,.4);
    transition:transform .12s,box-shadow .12s;
  }
  button.go:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(21,128,61,.5);}
  button.go:active{transform:translateY(0);}
  #resetBtn{display:none;background:#555;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  #result{
    text-align:center;
    margin:22px auto 4px;
    font-size:1.3rem;
    font-weight:bold;
    color:var(--forest-dark);
    min-height:1.4em;
  }
  #scoreDetail{text-align:center;color:#666;font-size:.92rem;margin-bottom:6px;}
  footer{
    text-align:center;
    font-size:.8rem;
    color:#9aa6ad;
    padding:14px;
    border-top:1px solid #eee;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <button class="langBtn" id="langBtn">🌐 中文</button>
      <h1>#22 · Revolutionary War on Wednesday</h1>
      <a class="homeBtn" href="../../index.html" title="Home / 首页" aria-label="Home">🏠</a>
    </div>
    <p id="subtitle">Comprehension Quiz • 10 Questions • by Mary Pope Osborne</p>
    <div class="logo">🌳</div>
  </header>
  <main>
    <div id="questions"></div>
    <div id="result"></div>
    <div id="scoreDetail"></div>
    <div class="actions">
      <button class="go" id="checkBtn">Check My Answers</button>
      <button class="go" id="resetBtn">Try Again</button>
    </div>
  </main>
  <footer>Based on <em>Magic Tree House #22: Revolutionary War on Wednesday</em> (Random House, 2000) — by Mary Pope Osborne</footer>
</div>

<script>
let lang = "en";
const picked = {};
let submitted = false;
let score = 0;

const L = {
  en: {
    subtitle: "Comprehension Quiz • 10 Questions • by Mary Pope Osborne",
    check: "Check My Answers",
    retry: "Try Again",
    langBtn: "🌐 中文",
    result: (s) => `You scored ${s} / 10`,
    perfect: "Perfect! You really know your Magic Tree House adventure.",
    great: "Great job — you understood the story well.",
    ok: "Not bad — but a few clues slipped past you.",
    low: "Time for a re-read! The answers are in the details.",
    ansLabel: "Answer"
  },
  zh: {
    subtitle: "阅读理解测验 • 共10题 • 作者：Mary Pope Osborne",
    check: "提交答案",
    retry: "再做一次",
    langBtn: "🌐 English",
    result: (s) => `你的得分：${s} / 10`,
    perfect: "满分！你完全读懂了这次神奇树屋冒险。",
    great: "很棒——你已经读懂了这个故事。",
    ok: "不错——不过有几条线索被你漏掉了。",
    low: "该重读一遍啦！答案都藏在细节里。",
    ansLabel: "正确答案"
  }
};

const quiz = [{"q": {"en": "Who is the commander-in-chief that Jack and Annie meet on the frozen riverbank?", "zh": "杰克和安妮在结冰的河岸边遇到的总司令是谁？"}, "options": [{"en": "A captain who lives in Frog Creek", "zh": "一位住在青蛙溪的队长"}, {"en": "Thomas Paine, the writer of essays", "zh": "托马斯·潘恩，那位写文章的作家"}, {"en": "The King of England", "zh": "英国国王"}, {"en": "George Washington", "zh": "乔治·华盛顿"}], "answer": 3, "explain": {"en": "The man in the dark cape and three-cornered hat who rode up on a white horse was George Washington, commander-in-chief of the American army. Jack recognized his face from pictures on dollar bills.", "zh": "那位披着深色斗篷、头戴三角帽、骑着白马出现的人正是美国军队总司令乔治·华盛顿。杰克从美元钞票上的肖像认出了他。"}}, {"q": {"en": "What writing do Jack and Annie find that is the 'something to send' for Morgan's library?", "zh": "杰克和安妮找到的、可以作为摩根图书馆里「要寄出的东西」的文稿是什么？"}, "options": [{"en": "A poem copied onto a school slate", "zh": "抄在石板上的诗"}, {"en": "A list of rules from the famous nurse Clara Barton", "zh": "著名的护士克拉拉·巴顿写的一张守则清单"}, {"en": "A sign with a poem about hope", "zh": "写满希望诗句的木牌"}, {"en": "A captain's farewell letter to his children", "zh": "一位队长写给孩子们的告别信"}], "answer": 3, "explain": {"en": "The captain gave Jack a farewell letter he had written to his children, Molly and Ben Sanders, saying Jack should only send it if the mission failed. This letter was the 'something to send.'", "zh": "队长交给杰克一封写给孩子们莫莉和本·桑德斯（Molly and Ben Sanders）的告别信，并说只有任务失败时才寄出。这封信就是「要寄出的东西」。"}}, {"q": {"en": "About how many American patriots gathered to cross the Delaware River?", "zh": "大约有多少名美国爱国者聚集起来准备横渡特拉华河？"}, "options": [{"en": "About 2,400", "zh": "大约 2,400 人"}, {"en": "About 240", "zh": "大约 240 人"}, {"en": "About 24,000", "zh": "大约 24,000 人"}, {"en": "About 12,000", "zh": "大约 12,000 人"}], "answer": 0, "explain": {"en": "Their research book said about 2,400 American patriots gathered on the west bank of the Delaware River in Pennsylvania to begin their secret mission.", "zh": "他们的参考书上写道，大约 2,400 名美国爱国者聚集在宾夕法尼亚州特拉华河西岸，准备开始秘密行动。"}}, {"q": {"en": "On which river does Washington's secret Christmas mission take place?", "zh": "华盛顿的圣诞秘密行动发生在哪条河上？"}, "options": [{"en": "The Hudson River", "zh": "哈德逊河"}, {"en": "The Delaware River", "zh": "特拉华河"}, {"en": "The Potomac River", "zh": "波托马克河"}, {"en": "The Mississippi River", "zh": "密西西比河"}], "answer": 1, "explain": {"en": "The patriots gathered by the Delaware River and crossed it on Christmas night to surprise the Hessians. Jack and Annie landed near its icy banks in Pennsylvania.", "zh": "爱国者们在特拉华河边集结，并在圣诞夜渡河奇袭黑森雇佣兵。杰克和安妮降落在宾夕法尼亚州结冰的河岸边。"}}, {"q": {"en": "What famous words does Washington read to his men to give them courage?", "zh": "华盛顿为了让士兵们鼓起勇气，给他们朗读了哪句著名的话？"}, "options": [{"en": "Give me liberty, or give me death", "zh": "不自由，毋宁死"}, {"en": "I have a dream today", "zh": "我有一个梦想"}, {"en": "We hold these truths to be self-evident that all are equal", "zh": "我们认为这些真理是不言而喻的：人人生而平等"}, {"en": "These are the times that try men's souls", "zh": "这是一个考验人们灵魂的时代"}], "answer": 3, "explain": {"en": "Washington read from Thomas Paine's essay The Crisis: 'These are the times that try men's souls.' The captain later copied those very words into his letter to his children.", "zh": "华盛顿朗读了托马斯·潘恩《危机》中的句子：「这是一个考验人们灵魂的时代。」队长后来还把这句话抄进了给孩子们的信里。"}}, {"q": {"en": "How does Jack feel when he learns they are going to another war?", "zh": "当杰克得知他们又要去打仗时，他是什么感受？"}, "options": [{"en": "Bored and sleepy", "zh": "无聊又困倦"}, {"en": "Furious that Morgan sent them", "zh": "对摩根派他们去感到非常生气"}, {"en": "Excited and eager to fight", "zh": "兴奋又渴望参战"}, {"en": "Reluctant and worried", "zh": "不情愿又担心"}], "answer": 3, "explain": {"en": "Jack sighed and said 'Another war,' because he hated the suffering he had seen in the Civil War. He and Annie went only because they had to help Morgan and save Camelot.", "zh": "杰克叹了口气说「又要打仗了」，因为他讨厌在南北战争中看到的那些苦难。他们去只是因为必须帮助摩根、拯救卡米洛特。"}}, {"q": {"en": "What animal does George Washington ride when he first appears?", "zh": "乔治·华盛顿第一次出现时，骑着什么动物？"}, "options": [{"en": "A black donkey", "zh": "一头黑色驴子"}, {"en": "A brown mule", "zh": "一头棕色骡子"}, {"en": "A gray camel", "zh": "一头灰色骆驼"}, {"en": "A white horse", "zh": "一匹白马"}], "answer": 3, "explain": {"en": "Jack and Annie saw a man in a dark cape and three-cornered hat ride up on a white horse — it was George Washington, commander-in-chief.", "zh": "杰克和安妮看到一位披着深色斗篷、头戴三角帽的人骑着一匹白马出现——那就是总司令乔治·华盛顿。"}}, {"q": {"en": "Which book do Jack and Annie use to travel back home to Frog Creek?", "zh": "杰克和安妮用哪本书回到了青蛙溪的家？"}, "options": [{"en": "The Pennsylvania book", "zh": "那本关于宾夕法尼亚州的书"}, {"en": "Morgan's handwritten note", "zh": "摩根手写的便条"}, {"en": "The Revolutionary War book", "zh": "那本关于革命战争的书"}, {"en": "A book all about George Washington", "zh": "一本专门讲乔治·华盛顿的书"}], "answer": 0, "explain": {"en": "Annie grabbed the Pennsylvania book, pointed to the picture of Frog Creek woods, and wished them home — just as they had done on earlier trips.", "zh": "安妮拿起那本关于宾夕法尼亚州的书，指着青蛙溪树林的照片许愿回家——和之前几次旅行一样。"}}, {"q": {"en": "On what date does Washington's secret crossing of the Delaware take place?", "zh": "华盛顿秘密横渡特拉华河发生在哪一天？"}, "options": [{"en": "March 17, 1776", "zh": "1776 年 3 月 17 日"}, {"en": "December 25, 1776", "zh": "1776 年 12 月 25 日"}, {"en": "July 4, 1776", "zh": "1776 年 7 月 4 日"}, {"en": "September 17, 1787", "zh": "1787 年 9 月 17 日，不过那是另一个故事了"}], "answer": 1, "explain": {"en": "The research book said the crossing happened on Wednesday, December 25, 1776 — Christmas night — when Annie realized, 'Today's Christmas!'", "zh": "参考书里说渡河发生在 1776 年 12 月 25 日星期三——圣诞夜。安妮当时惊喜地说：「今天是圣诞节！」"}}, {"q": {"en": "Whose boat do Jack and Annie accidentally ride across the Delaware River?", "zh": "杰克和安妮不小心搭上了谁的船渡过了特拉华河？"}, "options": [{"en": "George Washington and his crew", "zh": "乔治·华盛顿和他的船员"}, {"en": "A group of Hessian soldiers", "zh": "一群黑森雇佣兵"}, {"en": "Clara Barton the nurse", "zh": "护士克拉拉·巴顿"}, {"en": "The captain and his ragged men", "zh": "那位队长和他衣衫褴褛的部下"}], "answer": 0, "explain": {"en": "Annie climbed into the biggest boat, which turned out to be George Washington's. The crew pushed off before Jack could pull her out, so they rode across with the general and his men.", "zh": "安妮爬上了最大的那艘船，结果发现那是乔治·华盛顿的船。船夫在杰克把她拉出来之前就划走了，于是他们和将军及其部下一起渡了河。"}}];

const qEl = document.getElementById("questions");
const resultEl = document.getElementById("result");
const detailEl = document.getElementById("scoreDetail");
const checkBtn = document.getElementById("checkBtn");
const resetBtn = document.getElementById("resetBtn");
const langBtn = document.getElementById("langBtn");

function render(){
  qEl.innerHTML = "";
  document.getElementById("subtitle").textContent = L[lang].subtitle;
  langBtn.textContent = L[lang].langBtn;

  quiz.forEach((item, i) => {
    const qDiv = document.createElement("div");
    qDiv.className = "q";
    qDiv.id = "q" + i;
    let html = `<h3><span>Q${i+1}.</span>${item.q[lang]}</h3>`;
    item.options.forEach((opt, j) => {
      const isPicked = picked[i] === j;
      const checked = isPicked ? "checked" : "";
      html += `<label data-q="${i}" data-o="${j}" class="${isPicked?'picked':''}">
        <input type="radio" name="q${i}" value="${j}" ${checked}> ${opt[lang]}
      </label>`;
    });
    html += `<div class="explain" id="ex${i}">
      <div class="en"><b>${L[lang].ansLabel}:</b> ${item.options[item.answer][lang]}<br>${item.explain.en}</div>
      <div class="zh">${item.options[item.answer][lang]}<br>${item.explain.zh}</div>
    </div>`;
    qDiv.innerHTML = html;
    qEl.appendChild(qDiv);

    if (submitted){
      qDiv.classList.add(picked[i] === item.answer ? "correct" : "wrong");
      document.getElementById("ex"+i).classList.add("show");
      const labels = qDiv.querySelectorAll("label");
      labels[item.answer].classList.add("right");
      if (picked[i] !== item.answer && picked[i] !== undefined)
        labels[picked[i]].classList.add("picked-wrong");
    }
  });

  qEl.querySelectorAll('input[type=radio]').forEach(r => {
    r.addEventListener("change", e => {
      if (submitted) return;
      const qi = +e.target.name.replace("q","");
      picked[qi] = +e.target.value;
      qEl.querySelectorAll(`label[data-q="${qi}"]`).forEach(l=>l.classList.remove("picked"));
      e.target.closest("label").classList.add("picked");
    });
  });

  if (submitted){
    resultEl.textContent = L[lang].result(score);
    let msg = score===10 ? L[lang].perfect : score>=7 ? L[lang].great : score>=4 ? L[lang].ok : L[lang].low;
    detailEl.textContent = msg;
  } else {
    resultEl.textContent = "";
    detailEl.textContent = "";
  }
}

checkBtn.addEventListener("click", () => {
  submitted = true;
  score = 0;
  quiz.forEach((item,i) => { if (picked[i] === item.answer) score++; });
  render();
  checkBtn.style.display = "none";
  resetBtn.style.display = "inline-block";
});

resetBtn.addEventListener("click", () => {
  location.reload();
});

langBtn.addEventListener("click", () => {
  lang = (lang === "en") ? "zh" : "en";
  render();
});

render();
</script>
</body>
</html>
