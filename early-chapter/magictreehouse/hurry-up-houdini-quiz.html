<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hurry Up, Houdini! — Quiz</title>
<style>
  :root{
    --forest:#15803d;
    --forest-dark:#14532d;
    --red:#c0392b;
    --cream:#f7fbf6;
    --ink:#222;
    --gold:#d97706;
    --oak:#92400e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Trebuchet MS","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--forest),var(--forest-dark));
    color:var(--ink);
    min-height:100vh;
    padding:24px 12px;
  }
  .wrap{
    max-width:780px;
    margin:0 auto;
    background:var(--cream);
    border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    overflow:hidden;
  }
  header{
    background:var(--forest);
    color:#fff;
    padding:22px 28px 18px;
    text-align:center;
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  header h1{
    margin:0;
    font-size:1.5rem;
    letter-spacing:.5px;
    flex:1;
    text-align:center;
  }
  .langBtn{
    font-family:inherit;
    font-size:.85rem;
    font-weight:bold;
    color:var(--forest-dark);
    background:#fff;
    border:none;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .langBtn:hover{transform:translateY(-1px);}
  .homeBtn{
    font-size:1.35rem;
    text-decoration:none;
    background:#fff;
    border-radius:50%;
    width:40px;height:40px;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .homeBtn:hover{transform:translateY(-1px);}
  header p{
    margin:10px 0 0;
    font-size:.92rem;
    opacity:.92;
  }
  .logo{
    width:62px;height:62px;border-radius:50%;
    background:#fff;margin:0 auto 12px;position:relative;
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  main{padding:22px 28px 30px;}
  .q{
    border:1px solid #d6e6df;
    border-radius:12px;
    padding:16px 18px;
    margin:16px 0;
    background:#fff;
    transition:border-color .2s;
  }
  .q.correct{border-color:var(--forest);background:#eef9f0;}
  .q.wrong{border-color:var(--red);background:#fdf3f2;}
  .q h3{
    margin:0 0 12px;
    font-size:1.02rem;
    line-height:1.45;
  }
  .q h3 span{color:var(--gold);font-weight:bold;margin-right:6px;}
  label{
    display:block;
    padding:9px 12px;
    margin:7px 0;
    border-radius:8px;
    background:#eef4f0;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s,border-color .15s;
    font-size:.96rem;
    line-height:1.4;
  }
  label:hover{background:#e2ede7;}
  input[type=radio]{margin-right:9px;transform:translateY(1px);}
  label.picked{background:#fff4cc;border-color:var(--gold);}
  label.right{background:#d7f0df;border-color:var(--forest);font-weight:600;}
  label.picked-wrong{background:#f7d4d0;border-color:var(--red);}
  .explain{
    display:none;
    margin-top:10px;
    padding:12px 14px;
    background:#f0f7f2;
    border-left:4px solid var(--forest);
    border-radius:6px;
    font-size:.9rem;
    line-height:1.5;
  }
  .explain.show{display:block;}
  .explain .en{margin-bottom:6px;}
  .explain .zh{color:#444;}
  .explain b{color:var(--forest-dark);}
  .actions{text-align:center;margin-top:24px;}
  button.go{
    font-family:inherit;
    font-size:1.05rem;
    font-weight:bold;
    color:#fff;
    background:var(--forest-dark);
    border:none;
    padding:13px 34px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(21,128,61,.4);
    transition:transform .12s,box-shadow .12s;
  }
  button.go:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(21,128,61,.5);}
  button.go:active{transform:translateY(0);}
  #resetBtn{display:none;background:#555;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  #result{
    text-align:center;
    margin:22px auto 4px;
    font-size:1.3rem;
    font-weight:bold;
    color:var(--forest-dark);
    min-height:1.4em;
  }
  #scoreDetail{text-align:center;color:#666;font-size:.92rem;margin-bottom:6px;}
  footer{
    text-align:center;
    font-size:.8rem;
    color:#9aa6ad;
    padding:14px;
    border-top:1px solid #eee;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <button class="langBtn" id="langBtn">🌐 中文</button>
      <h1>#50 · Hurry Up, Houdini!</h1>
      <a class="homeBtn" href="../../index.html" title="Home / 首页" aria-label="Home">🏠</a>
    </div>
    <p id="subtitle">Comprehension Quiz • 10 Questions • by Mary Pope Osborne</p>
    <div class="logo">🌳</div>
  </header>
  <main>
    <div id="questions"></div>
    <div id="result"></div>
    <div id="scoreDetail"></div>
    <div class="actions">
      <button class="go" id="checkBtn">Check My Answers</button>
      <button class="go" id="resetBtn">Try Again</button>
    </div>
  </main>
  <footer>Based on <em>Magic Tree House #50: Hurry Up, Houdini!</em> (Random House, 2013) — by Mary Pope Osborne</footer>
</div>

<script>
let lang = "en";
const picked = {};
let submitted = false;
let score = 0;

const L = {
  en: {
    subtitle: "Comprehension Quiz • 10 Questions • by Mary Pope Osborne",
    check: "Check My Answers",
    retry: "Try Again",
    langBtn: "🌐 中文",
    result: (s) => `You scored ${s} / 10`,
    perfect: "Perfect! You really know your Magic Tree House adventure.",
    great: "Great job — you understood the story well.",
    ok: "Not bad — but a few clues slipped past you.",
    low: "Time for a re-read! The answers are in the details.",
    ansLabel: "Answer"
  },
  zh: {
    subtitle: "阅读理解测验 • 共10题 • 作者：Mary Pope Osborne",
    check: "提交答案",
    retry: "再做一次",
    langBtn: "🌐 English",
    result: (s) => `你的得分：${s} / 10`,
    perfect: "满分！你完全读懂了这次神奇树屋冒险。",
    great: "很棒——你已经读懂了这个故事。",
    ok: "不错——不过有几条线索被你漏掉了。",
    low: "该重读一遍啦！答案都藏在细节里。",
    ansLabel: "正确答案"
  }
};

const quiz = [{"q": {"en": "Where do Jack and Annie travel in this story?", "zh": "在这个故事里，杰克和安妮穿越到了哪里？"}, "options": [{"en": "the surface of the Moon", "zh": "月球的表面"}, {"en": "a jungle in Brazil", "zh": "巴西的一片丛林"}, {"en": "Coney Island in New York", "zh": "纽约的康尼岛"}, {"en": "a royal castle in London", "zh": "伦敦的一座皇家城堡"}], "answer": 2, "explain": {"en": "Jack and Annie land in the Japanese Tea Garden at Coney Island, a famous amusement park in New York, in the year 1908.", "zh": "杰克和安妮降落在纽约著名游乐园康尼岛的日式茶园里，那是在 1908 年。"}}, {"q": {"en": "Jack and Annie meet a cheerful couple wearing big hats piled with roses and bananas. Who are they really?", "zh": "杰克和安妮遇到一对戴着插满玫瑰和香蕉的大帽子的欢乐夫妇。他们究竟是谁？"}, "options": [{"en": "two cake bakers from the park", "zh": "游乐园里做蛋糕的两位师傅"}, {"en": "a pair of ticket takers", "zh": "两个检票员"}, {"en": "the missing Bambini Brothers", "zh": "失踪的班比尼兄弟"}, {"en": "Harry and Bess Houdini", "zh": "哈里和贝丝·胡迪尼夫妇"}], "answer": 3, "explain": {"en": "The couple is Harry Houdini, the famous escape artist, and his wife Bess. They first met at Coney Island fifteen years earlier.", "zh": "这对夫妇就是著名的逃生魔术大师哈里·胡迪尼和他的妻子贝丝。他们十五年前正是在康尼岛相识的。"}}, {"q": {"en": "Why do Jack and Annie end up performing on stage at Henderson's Music Hall?", "zh": "杰克和安妮为什么最终会在亨德森音乐厅的舞台上表演？"}, "options": [{"en": "they won a talent show at the park", "zh": "他们在游乐园的才艺比赛中赢了"}, {"en": "a sudden storm blew in", "zh": "突然刮来了一场暴风雨"}, {"en": "the theater owner is their uncle", "zh": "戏院老板是他们的叔叔"}, {"en": "the planned opening act ran off", "zh": "原定的开场演员跑掉了"}], "answer": 3, "explain": {"en": "The Bambini Brothers, the opening act for the Great Houdini show, ran off after stealing from the box office, so Jack and Annie filled in as 'Jolly Jack and the Amazing Annie.'", "zh": "胡迪尼演出的开场演员班比尼兄弟偷了售票处的钱后跑掉了，于是杰克和安妮顶替上台，化身为“快乐的杰克和神奇的安妮”。"}}, {"q": {"en": "What helps Jack and Annie become great stage magicians for one full hour?", "zh": "是什么让杰克和安妮在整整一小时里变成了了不起的舞台魔术师？"}, "options": [{"en": "eating the world's best hot dog", "zh": "吃了世界上最好吃的热狗"}, {"en": "a special pair of white gloves", "zh": "一双特别的白手套"}, {"en": "Merlin's magic mist", "zh": "梅林的魔法雾"}, {"en": "a magic wand from a princess", "zh": "一位公主送的魔杖"}], "answer": 2, "explain": {"en": "Annie sniffs Merlin's magic mist, and they become expert magicians for one hour — long enough to perform their act before the mist wears off.", "zh": "安妮吸了梅林的魔法雾，他们就成了一小时的魔术高手——刚好够演完节目，雾气散去前都管用。"}}, {"q": {"en": "What is the secret of greatness that Jack and Annie learn on this mission?", "zh": "在这一次任务里，杰克和安妮学到的“伟大的秘密”是什么？"}, "options": [{"en": "never sharing secrets", "zh": "永远不分享秘密"}, {"en": "hard work", "zh": "刻苦努力"}, {"en": "being very famous", "zh": "变得非常出名"}, {"en": "owning many tall hats", "zh": "拥有很多高帽子"}], "answer": 1, "explain": {"en": "Bess tells them Harry practiced coin and card tricks for hours every day and read every book on magic. The Ring of Truth glows when Annie hears 'hard work' — that is the secret, written under HUMILITY as HARD WORK.", "zh": "贝丝告诉他们，哈里每天练好几个小时的硬币和纸牌魔术，还读遍了所有讲魔术的书。当安妮听到“刻苦努力”时，真理之戒亮了起来——这个秘密被写在“谦逊”下面，正是“刻苦努力”。"}}, {"q": {"en": "What happens during Houdini's famous milk can trick?", "zh": "在胡迪尼著名的牛奶罐魔术中，发生了什么？"}, "options": [{"en": "he hides a rabbit inside the can", "zh": "他把一只兔子藏在罐子里"}, {"en": "he floats the can all the way to the moon", "zh": "他把罐子飘到了月球上，那是别人讲的版本"}, {"en": "he turns the water into soda", "zh": "他把罐里的水变成了汽水"}, {"en": "he escapes while locked inside it", "zh": "他被锁在罐里却成功逃了出来"}], "answer": 3, "explain": {"en": "Houdini climbs into a milk can filled with water, Bess padlocks the lid, and after a tense wait he throws open the curtain — free, with the lid still locked.", "zh": "胡迪尼爬进装满水的牛奶罐，贝丝把盖子用挂锁锁上。紧张地等了一会儿后，他拉开帘子——自由了，而盖子还牢牢锁着。"}}, {"q": {"en": "How long does Houdini's famous Metamorphosis trick take?", "zh": "胡迪尼著名的“变形术”只用了多长时间？"}, "options": [{"en": "the whole night", "zh": "一整晚"}, {"en": "one full hour", "zh": "整整一个小时"}, {"en": "ten long minutes", "zh": "足足十分钟"}, {"en": "three seconds", "zh": "三秒钟"}], "answer": 3, "explain": {"en": "Houdini calls it 'the world-famous original Metamorphosis in three seconds' — he and Bess swap places inside the locked trunk in just three seconds.", "zh": "胡迪尼称它为“举世闻名、仅用三秒的变形术”——他和贝丝在那口上锁的旅行箱里只用三秒就互换了位置。"}}, {"q": {"en": "Where did Harry and Bess Houdini first meet, many years before this story?", "zh": "在这个故事发生的许多年前，哈里和贝丝·胡迪尼是在哪里相识的？"}, "options": [{"en": "at Coney Island", "zh": "在康尼岛"}, {"en": "in a small schoolhouse", "zh": "在一间小小的校舍里"}, {"en": "on a train to Milwaukee", "zh": "在一列开往密尔沃基的火车上"}, {"en": "inside a quiet library", "zh": "在一间安静的图书馆里"}], "answer": 0, "explain": {"en": "As the author's note says, Harry first met Bess at Coney Island in 1893, when he was performing as the Brothers Houdini and she was singing with the Floral Sisters. They married three weeks later.", "zh": "正如作者后记所说，哈里是 1893 年在康尼岛认识贝丝的——那时他和兄弟组“胡迪尼兄弟”演出，而贝丝正和“花之姐妹”一起唱歌。三周后他们就结婚了。"}}, {"q": {"en": "During their magic act, what jumps out of Jack's top hat?", "zh": "在他们的魔术表演中，从杰克的礼帽里跳出来的是什么？"}, "options": [{"en": "a white dove, though that is another story", "zh": "一只白鸽"}, {"en": "a goldfish", "zh": "一条金鱼"}, {"en": "a black cat", "zh": "一只黑猫"}, {"en": "a white rabbit", "zh": "一只白兔"}], "answer": 3, "explain": {"en": "Jack places his hat over a hidden trapdoor in the table and taps it; a white rabbit leaps out, then two more. (Annie's hat produces the doves.)", "zh": "杰克把礼帽扣在桌子暗格的翻门上敲了敲，一只白兔就跳了出来，接着又跳出两只。（鸽子是从安妮的帽子里变出来的。）"}}, {"q": {"en": "After the show, where do Jack and Annie finally find Harry and Bess?", "zh": "演出结束后，杰克和安妮最终是在哪里找到哈里和贝丝的？"}, "options": [{"en": "on the Shoot-the-Chutes water ride", "zh": "在“激流勇进”的水上滑梯上"}, {"en": "back at the magic tree house", "zh": "回到了魔法树屋里"}, {"en": "in the theater box office", "zh": "在戏院的售票处里"}, {"en": "on a bench eating ice cream", "zh": "坐在长椅上吃着冰淇淋"}], "answer": 3, "explain": {"en": "Remembering Bess's words 'ice cream always comes after the show,' Jack and Annie find Harry and Bess on a bench at Luna Park, hiding their faces under their big hats.", "zh": "杰克和安妮想起贝丝说的“冰淇淋总在演出之后才吃”，便在月神乐园的长椅上找到了哈里和贝丝——他们正把脸藏在各自的大帽子下面。"}}];

const qEl = document.getElementById("questions");
const resultEl = document.getElementById("result");
const detailEl = document.getElementById("scoreDetail");
const checkBtn = document.getElementById("checkBtn");
const resetBtn = document.getElementById("resetBtn");
const langBtn = document.getElementById("langBtn");

function render(){
  qEl.innerHTML = "";
  document.getElementById("subtitle").textContent = L[lang].subtitle;
  langBtn.textContent = L[lang].langBtn;

  quiz.forEach((item, i) => {
    const qDiv = document.createElement("div");
    qDiv.className = "q";
    qDiv.id = "q" + i;
    let html = `<h3><span>Q${i+1}.</span>${item.q[lang]}</h3>`;
    item.options.forEach((opt, j) => {
      const isPicked = picked[i] === j;
      const checked = isPicked ? "checked" : "";
      html += `<label data-q="${i}" data-o="${j}" class="${isPicked?'picked':''}">
        <input type="radio" name="q${i}" value="${j}" ${checked}> ${opt[lang]}
      </label>`;
    });
    html += `<div class="explain" id="ex${i}">
      <div class="en"><b>${L[lang].ansLabel}:</b> ${item.options[item.answer][lang]}<br>${item.explain.en}</div>
      <div class="zh">${item.options[item.answer][lang]}<br>${item.explain.zh}</div>
    </div>`;
    qDiv.innerHTML = html;
    qEl.appendChild(qDiv);

    if (submitted){
      qDiv.classList.add(picked[i] === item.answer ? "correct" : "wrong");
      document.getElementById("ex"+i).classList.add("show");
      const labels = qDiv.querySelectorAll("label");
      labels[item.answer].classList.add("right");
      if (picked[i] !== item.answer && picked[i] !== undefined)
        labels[picked[i]].classList.add("picked-wrong");
    }
  });

  qEl.querySelectorAll('input[type=radio]').forEach(r => {
    r.addEventListener("change", e => {
      if (submitted) return;
      const qi = +e.target.name.replace("q","");
      picked[qi] = +e.target.value;
      qEl.querySelectorAll(`label[data-q="${qi}"]`).forEach(l=>l.classList.remove("picked"));
      e.target.closest("label").classList.add("picked");
    });
  });

  if (submitted){
    resultEl.textContent = L[lang].result(score);
    let msg = score===10 ? L[lang].perfect : score>=7 ? L[lang].great : score>=4 ? L[lang].ok : L[lang].low;
    detailEl.textContent = msg;
  } else {
    resultEl.textContent = "";
    detailEl.textContent = "";
  }
}

checkBtn.addEventListener("click", () => {
  submitted = true;
  score = 0;
  quiz.forEach((item,i) => { if (picked[i] === item.answer) score++; });
  render();
  checkBtn.style.display = "none";
  resetBtn.style.display = "inline-block";
});

resetBtn.addEventListener("click", () => {
  location.reload();
});

langBtn.addEventListener("click", () => {
  lang = (lang === "en") ? "zh" : "en";
  render();
});

render();
</script>
</body>
</html>
