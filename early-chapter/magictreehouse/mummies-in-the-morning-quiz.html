<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mummies in the Morning — Quiz</title>
<style>
  :root{
    --forest:#15803d;
    --forest-dark:#14532d;
    --red:#c0392b;
    --cream:#f7fbf6;
    --ink:#222;
    --gold:#d97706;
    --oak:#92400e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Trebuchet MS","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--forest),var(--forest-dark));
    color:var(--ink);
    min-height:100vh;
    padding:24px 12px;
  }
  .wrap{
    max-width:780px;
    margin:0 auto;
    background:var(--cream);
    border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    overflow:hidden;
  }
  header{
    background:var(--forest);
    color:#fff;
    padding:22px 28px 18px;
    text-align:center;
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  header h1{
    margin:0;
    font-size:1.5rem;
    letter-spacing:.5px;
    flex:1;
    text-align:center;
  }
  .langBtn{
    font-family:inherit;
    font-size:.85rem;
    font-weight:bold;
    color:var(--forest-dark);
    background:#fff;
    border:none;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .langBtn:hover{transform:translateY(-1px);}
  .homeBtn{
    font-size:1.35rem;
    text-decoration:none;
    background:#fff;
    border-radius:50%;
    width:40px;height:40px;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .homeBtn:hover{transform:translateY(-1px);}
  header p{
    margin:10px 0 0;
    font-size:.92rem;
    opacity:.92;
  }
  .logo{
    width:62px;height:62px;border-radius:50%;
    background:#fff;margin:0 auto 12px;position:relative;
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  main{padding:22px 28px 30px;}
  .q{
    border:1px solid #d6e6df;
    border-radius:12px;
    padding:16px 18px;
    margin:16px 0;
    background:#fff;
    transition:border-color .2s;
  }
  .q.correct{border-color:var(--forest);background:#eef9f0;}
  .q.wrong{border-color:var(--red);background:#fdf3f2;}
  .q h3{
    margin:0 0 12px;
    font-size:1.02rem;
    line-height:1.45;
  }
  .q h3 span{color:var(--gold);font-weight:bold;margin-right:6px;}
  label{
    display:block;
    padding:9px 12px;
    margin:7px 0;
    border-radius:8px;
    background:#eef4f0;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s,border-color .15s;
    font-size:.96rem;
    line-height:1.4;
  }
  label:hover{background:#e2ede7;}
  input[type=radio]{margin-right:9px;transform:translateY(1px);}
  label.picked{background:#fff4cc;border-color:var(--gold);}
  label.right{background:#d7f0df;border-color:var(--forest);font-weight:600;}
  label.picked-wrong{background:#f7d4d0;border-color:var(--red);}
  .explain{
    display:none;
    margin-top:10px;
    padding:12px 14px;
    background:#f0f7f2;
    border-left:4px solid var(--forest);
    border-radius:6px;
    font-size:.9rem;
    line-height:1.5;
  }
  .explain.show{display:block;}
  .explain .en{margin-bottom:6px;}
  .explain .zh{color:#444;}
  .explain b{color:var(--forest-dark);}
  .actions{text-align:center;margin-top:24px;}
  button.go{
    font-family:inherit;
    font-size:1.05rem;
    font-weight:bold;
    color:#fff;
    background:var(--forest-dark);
    border:none;
    padding:13px 34px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(21,128,61,.4);
    transition:transform .12s,box-shadow .12s;
  }
  button.go:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(21,128,61,.5);}
  button.go:active{transform:translateY(0);}
  #resetBtn{display:none;background:#555;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  #result{
    text-align:center;
    margin:22px auto 4px;
    font-size:1.3rem;
    font-weight:bold;
    color:var(--forest-dark);
    min-height:1.4em;
  }
  #scoreDetail{text-align:center;color:#666;font-size:.92rem;margin-bottom:6px;}
  footer{
    text-align:center;
    font-size:.8rem;
    color:#9aa6ad;
    padding:14px;
    border-top:1px solid #eee;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <button class="langBtn" id="langBtn">🌐 中文</button>
      <h1>#03 · Mummies in the Morning</h1>
      <a class="homeBtn" href="../../index.html" title="Home / 首页" aria-label="Home">🏠</a>
    </div>
    <p id="subtitle">Comprehension Quiz • 10 Questions • by Mary Pope Osborne</p>
    <div class="logo">🌳</div>
  </header>
  <main>
    <div id="questions"></div>
    <div id="result"></div>
    <div id="scoreDetail"></div>
    <div class="actions">
      <button class="go" id="checkBtn">Check My Answers</button>
      <button class="go" id="resetBtn">Try Again</button>
    </div>
  </main>
  <footer>Based on <em>Magic Tree House #03: Mummies in the Morning</em> (Random House, 1993) — by Mary Pope Osborne</footer>
</div>

<script>
let lang = "en";
const picked = {};
let submitted = false;
let score = 0;

const L = {
  en: {
    subtitle: "Comprehension Quiz • 10 Questions • by Mary Pope Osborne",
    check: "Check My Answers",
    retry: "Try Again",
    langBtn: "🌐 中文",
    result: (s) => `You scored ${s} / 10`,
    perfect: "Perfect! You really know your Magic Tree House adventure.",
    great: "Great job — you understood the story well.",
    ok: "Not bad — but a few clues slipped past you.",
    low: "Time for a re-read! The answers are in the details.",
    ansLabel: "Answer"
  },
  zh: {
    subtitle: "阅读理解测验 • 共10题 • 作者：Mary Pope Osborne",
    check: "提交答案",
    retry: "再做一次",
    langBtn: "🌐 English",
    result: (s) => `你的得分：${s} / 10`,
    perfect: "满分！你完全读懂了这次神奇树屋冒险。",
    great: "很棒——你已经读懂了这个故事。",
    ok: "不错——不过有几条线索被你漏掉了。",
    low: "该重读一遍啦！答案都藏在细节里。",
    ansLabel: "正确答案"
  }
};

const quiz = [{"q": {"en": "Who is the ghost-queen that Jack and Annie meet inside the pyramid?", "zh": "杰克和安妮在金字塔里遇到的幽灵女王是谁？"}, "options": [{"en": "The cat's owner", "zh": "那只猫的主人"}, {"en": "A young pharaoh named Tutankhamun", "zh": "一位叫图坦卡蒙的年轻法老"}, {"en": "A tomb robber's wife", "zh": "一个盗墓贼的妻子"}, {"en": "Hutepi, Queen of the Nile", "zh": "尼罗河女王胡特琵"}], "answer": 3, "explain": {"en": "The ghost introduced herself: 'I am Hutepi, Queen of the Nile,' and said she had waited a thousand years for help.", "zh": "幽灵自我介绍道：'我是胡特琵，尼罗河女王'，并说她已经等待帮助一千年了。"}}, {"q": {"en": "What does the running figure drop on the pyramid floor before it disappears?", "zh": "那个奔跑的身影在消失前，在金字塔地板上掉了什么？"}, "options": [{"en": "A silver mirror", "zh": "一面银镜子"}, {"en": "A blue gem", "zh": "一颗蓝色宝石"}, {"en": "A broken stone tablet with writing", "zh": "一块刻着文字的破石板，在很远很远的地方"}, {"en": "A gold scepter with a dog's head", "zh": "一根刻着狗头的金色权杖"}], "answer": 3, "explain": {"en": "A white figure swooshed past and dropped 'a gold stick... A dog's head was carved on one end' — Jack called it a scepter.", "zh": "一个白色身影掠过，掉下'一根金色的棍子……一端刻着狗头'，杰克认出那是权杖。"}}, {"q": {"en": "Where was Queen Hutepi's Book of the Dead hidden?", "zh": "胡特琵女王的《死者之书》藏在哪里？"}, "options": [{"en": "Inside a clay jug in the boat", "zh": "在船里的一个陶罐中"}, {"en": "Hidden inside the ghost's golden crown", "zh": "藏在幽灵的金王冠里"}, {"en": "Under a pile of bones", "zh": "在一堆骨头下面"}, {"en": "Behind a stone door", "zh": "在一扇石门后面"}], "answer": 0, "explain": {"en": "Jack reached into the boat, lifted a clay jug, and pulled out a folded cloth wrapped around an ancient scroll — the Book of the Dead.", "zh": "杰克伸手进船里，拿起一个陶罐，从里面抽出裹着古老卷轴的折叠布——正是《死者之书》。"}}, {"q": {"en": "Which animal leads Jack and Annie out of the dark false passage?", "zh": "是哪只动物把杰克和安妮带出了黑暗的假通道？"}, "options": [{"en": "A white owl", "zh": "一只白色的猫头鹰"}, {"en": "A brown camel", "zh": "一只棕色的骆驼"}, {"en": "A black cat", "zh": "一只黑猫"}, {"en": "A spotted dog", "zh": "一只带斑点的狗"}], "answer": 2, "explain": {"en": "When trapped in the pitch-dark false passage, they heard 'Meow,' followed the cat's sound, and came out into bright sunlight.", "zh": "被困在漆黑的假通道里时，他们听到'喵'，循着猫叫声走，最终来到了明亮的阳光下。"}}, {"q": {"en": "How long had the ghost-queen waited for someone to help her?", "zh": "幽灵女王等了多久才有人来帮她？"}, "options": [{"en": "Ten years", "zh": "十年"}, {"en": "Forever", "zh": "永远"}, {"en": "One hundred years", "zh": "一百年"}, {"en": "A thousand years", "zh": "一千年"}], "answer": 3, "explain": {"en": "Hutepi said, 'For a thousand years I have waited for help' to find her Book of the Dead and pass to the Next Life.", "zh": "胡特琵说：'我等待帮助已经一千年了'，只为找到《死者之书》去往来生。"}}, {"q": {"en": "What were pyramids sometimes called in the Egypt book?", "zh": "在那本埃及书里，金字塔有时被叫作什么？"}, "options": [{"en": "Gates of the Sun", "zh": "太阳之门"}, {"en": "The secret Tombs of the Kings", "zh": "国王们秘密的墓穴"}, {"en": "Towers of Gold", "zh": "黄金之塔"}, {"en": "Houses of the Dead", "zh": "死者的居所"}], "answer": 3, "explain": {"en": "Jack read: 'Pyramids were sometimes called Houses of the Dead. They were nearly all solid stone, except for the burial chambers deep inside.'", "zh": "杰克读到：'金字塔有时被称为死者的居所。它们几乎全是实心石头，只有深处有墓室。'"}}, {"q": {"en": "What four pictures made up the secret message on the pyramid wall?", "zh": "金字塔墙上的秘密信息由哪四幅图组成？"}, "options": [{"en": "Sun, moon, star, cloud", "zh": "太阳、月亮、星星、云"}, {"en": "Tree, river, mountain, and a deep cave", "zh": "树、河、山和一处深洞穴，不过那是另一个故事了"}, {"en": "Cat, dog, bird, fish", "zh": "猫、狗、鸟、鱼"}, {"en": "Stairs, boat, jug, folded cloth", "zh": "楼梯、船、罐子、折叠的布"}], "answer": 3, "explain": {"en": "Jack described the hieroglyphs as stairs, a boat, a jug, and a folded cloth, which led them to the burial chambers and the Book of the Dead.", "zh": "杰克把象形文字描述为楼梯、船、罐子和折叠的布，这些指引他们找到墓室和《死者之书》。"}}, {"q": {"en": "In what ancient land does this adventure take place?", "zh": "这次冒险发生在哪个古老的国度？"}, "options": [{"en": "Ancient Rome", "zh": "古罗马"}, {"en": "Ancient China", "zh": "古代中国"}, {"en": "Ancient Egypt", "zh": "古埃及"}, {"en": "Ancient Greece", "zh": "古希腊"}], "answer": 2, "explain": {"en": "The tree house takes them to a desert with a giant pyramid, a funeral parade, and a black cat — clearly ancient Egypt.", "zh": "树屋把他们带到一个有巨大金字塔、送葬队伍和黑猫的沙漠——分明是古埃及。"}}, {"q": {"en": "How was the queen's coffin carried in the funeral parade?", "zh": "在送葬队伍中，女王的棺木是怎样被运送的？"}, "options": [{"en": "Pulled on a sled by four oxen", "zh": "由四头牛在雪橇上拉着"}, {"en": "Carried by four strong palace servants", "zh": "由四个强壮的宫殿仆人抬着"}, {"en": "Floated down the river", "zh": "顺河漂着"}, {"en": "Pulled by horses", "zh": "由马匹拉着"}], "answer": 0, "explain": {"en": "Jack read that the coffin, called a sarcophagus, 'was pulled on a sled by four oxen' in the royal funeral procession.", "zh": "杰克读到，那口叫石棺的棺木在王室送葬队伍中'由四头牛在雪橇上拉着'。"}}, {"q": {"en": "What glowing letter do Jack and Annie find on the tree house floor at the end?", "zh": "结尾时，杰克和安妮在树屋地板上发现了哪个发光字母？"}, "options": [{"en": "The letter M", "zh": "字母 M"}, {"en": "The letter T", "zh": "字母 T"}, {"en": "The letter P", "zh": "字母 P"}, {"en": "The letter K", "zh": "字母 K"}], "answer": 0, "explain": {"en": "When the light hit the floor just right, the letter M shimmered, proving the tree house belonged to the mysterious M person.", "zh": "当光线角度刚好时，字母 M 闪闪发光，证明树屋属于那位神秘的 M 先生/女士。"}}];

const qEl = document.getElementById("questions");
const resultEl = document.getElementById("result");
const detailEl = document.getElementById("scoreDetail");
const checkBtn = document.getElementById("checkBtn");
const resetBtn = document.getElementById("resetBtn");
const langBtn = document.getElementById("langBtn");

function render(){
  qEl.innerHTML = "";
  document.getElementById("subtitle").textContent = L[lang].subtitle;
  langBtn.textContent = L[lang].langBtn;

  quiz.forEach((item, i) => {
    const qDiv = document.createElement("div");
    qDiv.className = "q";
    qDiv.id = "q" + i;
    let html = `<h3><span>Q${i+1}.</span>${item.q[lang]}</h3>`;
    item.options.forEach((opt, j) => {
      const isPicked = picked[i] === j;
      const checked = isPicked ? "checked" : "";
      html += `<label data-q="${i}" data-o="${j}" class="${isPicked?'picked':''}">
        <input type="radio" name="q${i}" value="${j}" ${checked}> ${opt[lang]}
      </label>`;
    });
    html += `<div class="explain" id="ex${i}">
      <div class="en"><b>${L[lang].ansLabel}:</b> ${item.options[item.answer][lang]}<br>${item.explain.en}</div>
      <div class="zh">${item.options[item.answer][lang]}<br>${item.explain.zh}</div>
    </div>`;
    qDiv.innerHTML = html;
    qEl.appendChild(qDiv);

    if (submitted){
      qDiv.classList.add(picked[i] === item.answer ? "correct" : "wrong");
      document.getElementById("ex"+i).classList.add("show");
      const labels = qDiv.querySelectorAll("label");
      labels[item.answer].classList.add("right");
      if (picked[i] !== item.answer && picked[i] !== undefined)
        labels[picked[i]].classList.add("picked-wrong");
    }
  });

  qEl.querySelectorAll('input[type=radio]').forEach(r => {
    r.addEventListener("change", e => {
      if (submitted) return;
      const qi = +e.target.name.replace("q","");
      picked[qi] = +e.target.value;
      qEl.querySelectorAll(`label[data-q="${qi}"]`).forEach(l=>l.classList.remove("picked"));
      e.target.closest("label").classList.add("picked");
    });
  });

  if (submitted){
    resultEl.textContent = L[lang].result(score);
    let msg = score===10 ? L[lang].perfect : score>=7 ? L[lang].great : score>=4 ? L[lang].ok : L[lang].low;
    detailEl.textContent = msg;
  } else {
    resultEl.textContent = "";
    detailEl.textContent = "";
  }
}

checkBtn.addEventListener("click", () => {
  submitted = true;
  score = 0;
  quiz.forEach((item,i) => { if (picked[i] === item.answer) score++; });
  render();
  checkBtn.style.display = "none";
  resetBtn.style.display = "inline-block";
});

resetBtn.addEventListener("click", () => {
  location.reload();
});

langBtn.addEventListener("click", () => {
  lang = (lang === "en") ? "zh" : "en";
  render();
});

render();
</script>
</body>
</html>
