<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Good Morning, Gorillas — Quiz</title>
<style>
  :root{
    --forest:#15803d;
    --forest-dark:#14532d;
    --red:#c0392b;
    --cream:#f7fbf6;
    --ink:#222;
    --gold:#d97706;
    --oak:#92400e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Trebuchet MS","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--forest),var(--forest-dark));
    color:var(--ink);
    min-height:100vh;
    padding:24px 12px;
  }
  .wrap{
    max-width:780px;
    margin:0 auto;
    background:var(--cream);
    border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    overflow:hidden;
  }
  header{
    background:var(--forest);
    color:#fff;
    padding:22px 28px 18px;
    text-align:center;
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  header h1{
    margin:0;
    font-size:1.5rem;
    letter-spacing:.5px;
    flex:1;
    text-align:center;
  }
  .langBtn{
    font-family:inherit;
    font-size:.85rem;
    font-weight:bold;
    color:var(--forest-dark);
    background:#fff;
    border:none;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .langBtn:hover{transform:translateY(-1px);}
  .homeBtn{
    font-size:1.35rem;
    text-decoration:none;
    background:#fff;
    border-radius:50%;
    width:40px;height:40px;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .homeBtn:hover{transform:translateY(-1px);}
  header p{
    margin:10px 0 0;
    font-size:.92rem;
    opacity:.92;
  }
  .logo{
    width:62px;height:62px;border-radius:50%;
    background:#fff;margin:0 auto 12px;position:relative;
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  main{padding:22px 28px 30px;}
  .q{
    border:1px solid #d6e6df;
    border-radius:12px;
    padding:16px 18px;
    margin:16px 0;
    background:#fff;
    transition:border-color .2s;
  }
  .q.correct{border-color:var(--forest);background:#eef9f0;}
  .q.wrong{border-color:var(--red);background:#fdf3f2;}
  .q h3{
    margin:0 0 12px;
    font-size:1.02rem;
    line-height:1.45;
  }
  .q h3 span{color:var(--gold);font-weight:bold;margin-right:6px;}
  label{
    display:block;
    padding:9px 12px;
    margin:7px 0;
    border-radius:8px;
    background:#eef4f0;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s,border-color .15s;
    font-size:.96rem;
    line-height:1.4;
  }
  label:hover{background:#e2ede7;}
  input[type=radio]{margin-right:9px;transform:translateY(1px);}
  label.picked{background:#fff4cc;border-color:var(--gold);}
  label.right{background:#d7f0df;border-color:var(--forest);font-weight:600;}
  label.picked-wrong{background:#f7d4d0;border-color:var(--red);}
  .explain{
    display:none;
    margin-top:10px;
    padding:12px 14px;
    background:#f0f7f2;
    border-left:4px solid var(--forest);
    border-radius:6px;
    font-size:.9rem;
    line-height:1.5;
  }
  .explain.show{display:block;}
  .explain .en{margin-bottom:6px;}
  .explain .zh{color:#444;}
  .explain b{color:var(--forest-dark);}
  .actions{text-align:center;margin-top:24px;}
  button.go{
    font-family:inherit;
    font-size:1.05rem;
    font-weight:bold;
    color:#fff;
    background:var(--forest-dark);
    border:none;
    padding:13px 34px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(21,128,61,.4);
    transition:transform .12s,box-shadow .12s;
  }
  button.go:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(21,128,61,.5);}
  button.go:active{transform:translateY(0);}
  #resetBtn{display:none;background:#555;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  #result{
    text-align:center;
    margin:22px auto 4px;
    font-size:1.3rem;
    font-weight:bold;
    color:var(--forest-dark);
    min-height:1.4em;
  }
  #scoreDetail{text-align:center;color:#666;font-size:.92rem;margin-bottom:6px;}
  footer{
    text-align:center;
    font-size:.8rem;
    color:#9aa6ad;
    padding:14px;
    border-top:1px solid #eee;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <button class="langBtn" id="langBtn">🌐 中文</button>
      <h1>#26 · Good Morning, Gorillas</h1>
      <a class="homeBtn" href="../../index.html" title="Home / 首页" aria-label="Home">🏠</a>
    </div>
    <p id="subtitle">Comprehension Quiz • 10 Questions • by Mary Pope Osborne</p>
    <div class="logo">🌳</div>
  </header>
  <main>
    <div id="questions"></div>
    <div id="result"></div>
    <div id="scoreDetail"></div>
    <div class="actions">
      <button class="go" id="checkBtn">Check My Answers</button>
      <button class="go" id="resetBtn">Try Again</button>
    </div>
  </main>
  <footer>Based on <em>Magic Tree House #26: Good Morning, Gorillas</em> (Random House, 2002) — by Mary Pope Osborne</footer>
</div>

<script>
let lang = "en";
const picked = {};
let submitted = false;
let score = 0;

const L = {
  en: {
    subtitle: "Comprehension Quiz • 10 Questions • by Mary Pope Osborne",
    check: "Check My Answers",
    retry: "Try Again",
    langBtn: "🌐 中文",
    result: (s) => `You scored ${s} / 10`,
    perfect: "Perfect! You really know your Magic Tree House adventure.",
    great: "Great job — you understood the story well.",
    ok: "Not bad — but a few clues slipped past you.",
    low: "Time for a re-read! The answers are in the details.",
    ansLabel: "Answer"
  },
  zh: {
    subtitle: "阅读理解测验 • 共10题 • 作者：Mary Pope Osborne",
    check: "提交答案",
    retry: "再做一次",
    langBtn: "🌐 English",
    result: (s) => `你的得分：${s} / 10`,
    perfect: "满分！你完全读懂了这次神奇树屋冒险。",
    great: "很棒——你已经读懂了这个故事。",
    ok: "不错——不过有几条线索被你漏掉了。",
    low: "该重读一遍啦！答案都藏在细节里。",
    ansLabel: "正确答案"
  }
};

const quiz = [{"q": {"en": "Where does the magic tree house take Jack and Annie this time?", "zh": "这一次，魔法树屋把杰克和安妮带到了哪里？"}, "options": [{"en": "Elizabethan London", "zh": "伊丽莎白时代的伦敦"}, {"en": "San Francisco in 1906, though that is another story", "zh": "1906年的旧金山"}, {"en": "An African cloud forest", "zh": "非洲的云雾林"}, {"en": "A Kansas prairie", "zh": "堪萨斯州的大草原"}], "answer": 2, "explain": {"en": "Their book is titled An African Rain Forest, and Jack reads that the misty mountain forest is called a 'cloud forest.'", "zh": "他们的书名叫《非洲雨林》，杰克读到，山上那片雾蒙蒙的雨林被称为「云雾林」。"}}, {"q": {"en": "What 'special language' do Jack and Annie use with the gorillas?", "zh": "杰克和安妮用哪种「特别的语言」和大猩猩交流？"}, "options": [{"en": "Sign language with their hands", "zh": "用手比划的手语"}, {"en": "Speaking French", "zh": "说法语"}, {"en": "Using a secret code of clicks and hums", "zh": "用咔哒声和低吟组成的秘密暗号"}, {"en": "Whistling like birds", "zh": "像鸟一样吹口哨"}], "answer": 0, "explain": {"en": "Morgan's rhyme says 'talk with your hands and heart'; Annie signs 'I love you' and the little gorillas try to copy it — a special language.", "zh": "摩根的谜语说「用你的手和心说话」；安妮比出「我爱你」的手语，小猩猩也学着做——这就是一种特别的语言。"}}, {"q": {"en": "What does Annie name the small gorilla who says 'Bu, bu'?", "zh": "安妮给那只会说「布，布」的小猩猩起了什么名字？"}, "options": [{"en": "Bu-bu", "zh": "布布"}, {"en": "Little Guy", "zh": "小家伙"}, {"en": "Big Guy", "zh": "大块头"}, {"en": "Ho-ho", "zh": "霍霍"}], "answer": 3, "explain": {"en": "The small gorilla peeks out saying 'Bu, bu?' and Annie happily names her Bu-bu.", "zh": "小猩猩探出头来说「布，布？」，安妮开心地给她起名叫布布。"}}, {"q": {"en": "Who is the leader of the gorilla family?", "zh": "大猩猩一家是谁在领头？"}, "options": [{"en": "The mother gorilla who cares for the baby", "zh": "照顾猩猩宝宝的猩猩妈妈"}, {"en": "A black leopard", "zh": "一只黑豹"}, {"en": "The baby gorilla", "zh": "猩猩宝宝"}, {"en": "The silverback, a giant male", "zh": "银背，一只巨大的雄猩猩"}], "answer": 3, "explain": {"en": "The biggest gorilla has black and silver fur and is the family's leader, a 'silverback'; Annie calls him Big Guy.", "zh": "最大那只猩猩长着黑中带银的毛，是一家之主，也就是「银背」；安妮叫他大块头。"}}, {"q": {"en": "When Jack got lost in the dark rainy forest, who led him to Annie?", "zh": "杰克在漆黑下雨的森林里迷路时，是谁把他带到了安妮身边？"}, "options": [{"en": "The black leopard", "zh": "那只黑豹"}, {"en": "A friendly little bird in the trees", "zh": "树林里一只友善的小鸟"}, {"en": "Bu-bu the small gorilla", "zh": "小猩猩布布"}, {"en": "The silverback", "zh": "银背大猩猩"}], "answer": 2, "explain": {"en": "In the dawn light, Bu-bu finds Jack, waves her arms, and leads him to where Annie is asleep among the sleeping gorillas.", "zh": "在黎明的微光里，布布找到了杰克，挥着胳膊把他领到安妮身旁——安妮正和睡着的大猩猩们躺在一起。"}}, {"q": {"en": "How did Jack scare away the hungry black leopard?", "zh": "杰克是怎样把那只饥饿的黑豹吓跑的？"}, "options": [{"en": "He swung from branch to branch like a monkey", "zh": "他像猴子一样在树枝间荡来荡去"}, {"en": "He climbed a tall tree to hide", "zh": "他爬到一棵大树上躲起来"}, {"en": "He called for Annie to help", "zh": "他喊安妮来帮忙"}, {"en": "He acted like a silverback gorilla", "zh": "他学银背大猩猩的样子"}], "answer": 3, "explain": {"en": "Jack copies the silverback's display — hooting, shaking a limb, beating his chest, and roaring 'WRAAGH!' — and the leopard leaves.", "zh": "杰克学银背的样子——呼啸、摇晃树枝、捶打胸口，还大吼「哇啊！」——黑豹就走掉了。"}}, {"q": {"en": "What sign did Annie teach the little gorillas?", "zh": "安妮教小猩猩们比的是什么手语？"}, "options": [{"en": "The 'goodbye' wave", "zh": "「再见」的挥手"}, {"en": "The 'sleep' sign", "zh": "「睡觉」的手势"}, {"en": "The 'eat' sign", "zh": "「吃」的手势"}, {"en": "The 'I love you' sign", "zh": "「我爱你」的手势"}], "answer": 1, "explain": {"en": "Annie lifts her thumb, index finger, and little finger to sign 'I love you,' and Bu-bu and Ho-ho try to make the same sign.", "zh": "安妮竖起大拇指、食指和小指，比出「我爱你」；布布和霍霍也试着做出同样的样子。"}}, {"q": {"en": "What do mountain gorillas mostly eat?", "zh": "山地大猩猩主要吃什么？"}, "options": [{"en": "Other animals", "zh": "其他动物"}, {"en": "Fresh fish from the cold river", "zh": "冰冷河里的新鲜鱼"}, {"en": "Insects only", "zh": "只吃昆虫"}, {"en": "Plants and leaves", "zh": "植物和树叶"}], "answer": 3, "explain": {"en": "Jack reads that gorillas are shy, gentle giants who do not hunt; they mainly eat the plant growth of the forest.", "zh": "杰克读到，大猩猩是害羞温和的巨兽，不会捕猎，主要以森林里的植物为食。"}}, {"q": {"en": "What do Jack and Annie bring home as proof of 'gorilla magic'?", "zh": "杰克和安妮带回什么，作为「大猩猩魔法」的证明？"}, "options": [{"en": "A silverback's tooth", "zh": "银背大猩猩的一颗牙"}, {"en": "A twig that little Ho-ho gave Jack", "zh": "小霍霍送给杰克的树枝"}, {"en": "A handwritten note from Morgan le Fay", "zh": "摩根·勒·菲写的一张字条"}, {"en": "Annie's red umbrella", "zh": "安妮的红色雨伞"}], "answer": 1, "explain": {"en": "Little Ho-ho offers Jack a twig to eat; Jack saves it and places it by the scrolls from England as proof of the magic of animals.", "zh": "小霍霍递给杰克一根树枝让他吃；杰克把它留下来，和从英格兰带回的卷轴放在一起，作为动物魔法的证明。"}}, {"q": {"en": "As they say good-bye, what does the silverback sign to Jack and Annie?", "zh": "道别时，银背大猩猩向杰克和安妮比出了什么手势？"}, "options": [{"en": "Thank you", "zh": "谢谢你"}, {"en": "Come back soon", "zh": "快点回来"}, {"en": "Be careful", "zh": "小心点"}, {"en": "I love you", "zh": "我爱你"}], "answer": 3, "explain": {"en": "The silverback raises his thumb, index finger, and little finger and signs 'I love you' before turning away with his family.", "zh": "银背竖起大拇指、食指和小指，比出「我爱你」，然后带着家群转身离去。"}}];

const qEl = document.getElementById("questions");
const resultEl = document.getElementById("result");
const detailEl = document.getElementById("scoreDetail");
const checkBtn = document.getElementById("checkBtn");
const resetBtn = document.getElementById("resetBtn");
const langBtn = document.getElementById("langBtn");

function render(){
  qEl.innerHTML = "";
  document.getElementById("subtitle").textContent = L[lang].subtitle;
  langBtn.textContent = L[lang].langBtn;

  quiz.forEach((item, i) => {
    const qDiv = document.createElement("div");
    qDiv.className = "q";
    qDiv.id = "q" + i;
    let html = `<h3><span>Q${i+1}.</span>${item.q[lang]}</h3>`;
    item.options.forEach((opt, j) => {
      const isPicked = picked[i] === j;
      const checked = isPicked ? "checked" : "";
      html += `<label data-q="${i}" data-o="${j}" class="${isPicked?'picked':''}">
        <input type="radio" name="q${i}" value="${j}" ${checked}> ${opt[lang]}
      </label>`;
    });
    html += `<div class="explain" id="ex${i}">
      <div class="en"><b>${L[lang].ansLabel}:</b> ${item.options[item.answer][lang]}<br>${item.explain.en}</div>
      <div class="zh">${item.options[item.answer][lang]}<br>${item.explain.zh}</div>
    </div>`;
    qDiv.innerHTML = html;
    qEl.appendChild(qDiv);

    if (submitted){
      qDiv.classList.add(picked[i] === item.answer ? "correct" : "wrong");
      document.getElementById("ex"+i).classList.add("show");
      const labels = qDiv.querySelectorAll("label");
      labels[item.answer].classList.add("right");
      if (picked[i] !== item.answer && picked[i] !== undefined)
        labels[picked[i]].classList.add("picked-wrong");
    }
  });

  qEl.querySelectorAll('input[type=radio]').forEach(r => {
    r.addEventListener("change", e => {
      if (submitted) return;
      const qi = +e.target.name.replace("q","");
      picked[qi] = +e.target.value;
      qEl.querySelectorAll(`label[data-q="${qi}"]`).forEach(l=>l.classList.remove("picked"));
      e.target.closest("label").classList.add("picked");
    });
  });

  if (submitted){
    resultEl.textContent = L[lang].result(score);
    let msg = score===10 ? L[lang].perfect : score>=7 ? L[lang].great : score>=4 ? L[lang].ok : L[lang].low;
    detailEl.textContent = msg;
  } else {
    resultEl.textContent = "";
    detailEl.textContent = "";
  }
}

checkBtn.addEventListener("click", () => {
  submitted = true;
  score = 0;
  quiz.forEach((item,i) => { if (picked[i] === item.answer) score++; });
  render();
  checkBtn.style.display = "none";
  resetBtn.style.display = "inline-block";
});

resetBtn.addEventListener("click", () => {
  location.reload();
});

langBtn.addEventListener("click", () => {
  lang = (lang === "en") ? "zh" : "en";
  render();
});

render();
</script>
</body>
</html>
