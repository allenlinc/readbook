<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day of the Dragon King — Quiz</title>
<style>
  :root{
    --forest:#15803d;
    --forest-dark:#14532d;
    --red:#c0392b;
    --cream:#f7fbf6;
    --ink:#222;
    --gold:#d97706;
    --oak:#92400e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Trebuchet MS","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--forest),var(--forest-dark));
    color:var(--ink);
    min-height:100vh;
    padding:24px 12px;
  }
  .wrap{
    max-width:780px;
    margin:0 auto;
    background:var(--cream);
    border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    overflow:hidden;
  }
  header{
    background:var(--forest);
    color:#fff;
    padding:22px 28px 18px;
    text-align:center;
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  header h1{
    margin:0;
    font-size:1.5rem;
    letter-spacing:.5px;
    flex:1;
    text-align:center;
  }
  .langBtn{
    font-family:inherit;
    font-size:.85rem;
    font-weight:bold;
    color:var(--forest-dark);
    background:#fff;
    border:none;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .langBtn:hover{transform:translateY(-1px);}
  .homeBtn{
    font-size:1.35rem;
    text-decoration:none;
    background:#fff;
    border-radius:50%;
    width:40px;height:40px;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .homeBtn:hover{transform:translateY(-1px);}
  header p{
    margin:10px 0 0;
    font-size:.92rem;
    opacity:.92;
  }
  .logo{
    width:62px;height:62px;border-radius:50%;
    background:#fff;margin:0 auto 12px;position:relative;
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  main{padding:22px 28px 30px;}
  .q{
    border:1px solid #d6e6df;
    border-radius:12px;
    padding:16px 18px;
    margin:16px 0;
    background:#fff;
    transition:border-color .2s;
  }
  .q.correct{border-color:var(--forest);background:#eef9f0;}
  .q.wrong{border-color:var(--red);background:#fdf3f2;}
  .q h3{
    margin:0 0 12px;
    font-size:1.02rem;
    line-height:1.45;
  }
  .q h3 span{color:var(--gold);font-weight:bold;margin-right:6px;}
  label{
    display:block;
    padding:9px 12px;
    margin:7px 0;
    border-radius:8px;
    background:#eef4f0;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s,border-color .15s;
    font-size:.96rem;
    line-height:1.4;
  }
  label:hover{background:#e2ede7;}
  input[type=radio]{margin-right:9px;transform:translateY(1px);}
  label.picked{background:#fff4cc;border-color:var(--gold);}
  label.right{background:#d7f0df;border-color:var(--forest);font-weight:600;}
  label.picked-wrong{background:#f7d4d0;border-color:var(--red);}
  .explain{
    display:none;
    margin-top:10px;
    padding:12px 14px;
    background:#f0f7f2;
    border-left:4px solid var(--forest);
    border-radius:6px;
    font-size:.9rem;
    line-height:1.5;
  }
  .explain.show{display:block;}
  .explain .en{margin-bottom:6px;}
  .explain .zh{color:#444;}
  .explain b{color:var(--forest-dark);}
  .actions{text-align:center;margin-top:24px;}
  button.go{
    font-family:inherit;
    font-size:1.05rem;
    font-weight:bold;
    color:#fff;
    background:var(--forest-dark);
    border:none;
    padding:13px 34px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(21,128,61,.4);
    transition:transform .12s,box-shadow .12s;
  }
  button.go:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(21,128,61,.5);}
  button.go:active{transform:translateY(0);}
  #resetBtn{display:none;background:#555;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  #result{
    text-align:center;
    margin:22px auto 4px;
    font-size:1.3rem;
    font-weight:bold;
    color:var(--forest-dark);
    min-height:1.4em;
  }
  #scoreDetail{text-align:center;color:#666;font-size:.92rem;margin-bottom:6px;}
  footer{
    text-align:center;
    font-size:.8rem;
    color:#9aa6ad;
    padding:14px;
    border-top:1px solid #eee;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <button class="langBtn" id="langBtn">🌐 中文</button>
      <h1>#14 · Day of the Dragon King</h1>
      <a class="homeBtn" href="../../index.html" title="Home / 首页" aria-label="Home">🏠</a>
    </div>
    <p id="subtitle">Comprehension Quiz • 10 Questions • by Mary Pope Osborne</p>
    <div class="logo">🌳</div>
  </header>
  <main>
    <div id="questions"></div>
    <div id="result"></div>
    <div id="scoreDetail"></div>
    <div class="actions">
      <button class="go" id="checkBtn">Check My Answers</button>
      <button class="go" id="resetBtn">Try Again</button>
    </div>
  </main>
  <footer>Based on <em>Magic Tree House #14: Day of the Dragon King</em> (Random House, 1998) — by Mary Pope Osborne</footer>
</div>

<script>
let lang = "en";
const picked = {};
let submitted = false;
let score = 0;

const L = {
  en: {
    subtitle: "Comprehension Quiz • 10 Questions • by Mary Pope Osborne",
    check: "Check My Answers",
    retry: "Try Again",
    langBtn: "🌐 中文",
    result: (s) => `You scored ${s} / 10`,
    perfect: "Perfect! You really know your Magic Tree House adventure.",
    great: "Great job — you understood the story well.",
    ok: "Not bad — but a few clues slipped past you.",
    low: "Time for a re-read! The answers are in the details.",
    ansLabel: "Answer"
  },
  zh: {
    subtitle: "阅读理解测验 • 共10题 • 作者：Mary Pope Osborne",
    check: "提交答案",
    retry: "再做一次",
    langBtn: "🌐 English",
    result: (s) => `你的得分：${s} / 10`,
    perfect: "满分！你完全读懂了这次神奇树屋冒险。",
    great: "很棒——你已经读懂了这个故事。",
    ok: "不错——不过有几条线索被你漏掉了。",
    low: "该重读一遍啦！答案都藏在细节里。",
    ansLabel: "正确答案"
  }
};

const quiz = [{"q": {"en": "Over 2,000 years ago, what creature did the first emperor choose as his symbol, earning him the name \"Dragon King\"?", "zh": "两千多年前，第一位皇帝选择了哪种动物作为自己的象征，因而被称为“龙王”？"}, "options": [{"en": "the tiger", "zh": "老虎"}, {"en": "the dragon", "zh": "龙"}, {"en": "the elephant", "zh": "大象"}, {"en": "the phoenix", "zh": "凤凰"}], "answer": 1, "explain": {"en": "Jack reads that the first emperor chose the dragon as his symbol, so he was called the \"Dragon King.\" In China dragons are seen as brave and powerful.", "zh": "杰克读到，第一位皇帝选择了龙作为象征，因此被称为“龙王”。在中国，龙被视为勇敢而强大的生物。"}}, {"q": {"en": "The young cowherd asks Jack and Annie to give a message to the silk weaver. What is it?", "zh": "放牛的年轻人让杰克和安妮给织绸女带一句话。是什么话？"}, "options": [{"en": "The Dragon King is coming!", "zh": "龙王来了！"}, {"en": "Meet me in the field at twilight.", "zh": "黄昏时到田里见我。"}, {"en": "Hide the silk thread!", "zh": "把丝线藏起来！"}, {"en": "Please meet me at the busy market at noon.", "zh": "请中午在热闹的集市见我。"}], "answer": 1, "explain": {"en": "The young man tending the cows asks them to tell the silk weaver to meet him in the field at twilight — and the two are later reunited there.", "zh": "放牛的年轻人请他们转告织绸女，黄昏时到田里见他——后来两人果然在那里重逢。"}}, {"q": {"en": "According to the silk weaver, what is silk thread made from?", "zh": "根据织绸女所说，丝线是用什么做成的？"}, "options": [{"en": "the cocoons of silkworms", "zh": "蚕茧"}, {"en": "the leaves of the mulberry tree", "zh": "桑树的叶子"}, {"en": "the wool of sheep", "zh": "羊毛"}, {"en": "the fibers of bamboo", "zh": "竹子的纤维"}], "answer": 0, "explain": {"en": "The silk weaver tells Jack that silk is made from the cocoons of silkworms, and warns that stealing the secret is punished by death.", "zh": "织绸女告诉杰克，丝是用蚕茧做成的，并警告说偷走这个秘密会被处死。"}}, {"q": {"en": "Why did the Dragon King order the burning of all the books in the Imperial Library?", "zh": "龙王为什么要下令烧掉皇家图书馆里所有的书？"}, "options": [{"en": "he feared the power of books and learning", "zh": "他害怕书籍和知识的力量"}, {"en": "he simply wanted to keep his palace warm in winter", "zh": "他只是想让宫殿冬天暖和一些"}, {"en": "the books were old and torn", "zh": "那些书又旧又破"}, {"en": "he disliked the color of the bamboo", "zh": "他讨厌竹子的颜色"}], "answer": 0, "explain": {"en": "The scholar explains that the Dragon King is afraid of the power of books and learning, so he orders all the books in the Imperial Library to be burned.", "zh": "学者解释说，龙王害怕书籍和知识的力量，所以下令烧掉皇家图书馆里所有的书。"}}, {"q": {"en": "After later emperors made it even longer, how long did the Great Wall stretch?", "zh": "后来的皇帝把它修得更长之后，万里长城总长达到了多少？"}, "options": [{"en": "37 miles", "zh": "37 英里"}, {"en": "3,700 miles", "zh": "3,700 英里"}, {"en": "3,700 feet around the city", "zh": "环绕城市 3,700 英尺"}, {"en": "700 miles", "zh": "700 英里"}], "answer": 1, "explain": {"en": "Jack reads that the Dragon King forced subjects to build a wall, and later emperors extended it until it stretched 3,700 miles — the longest structure ever built.", "zh": "杰克读到，龙王强迫百姓修墙，后来的皇帝不断加长，最终达到 3,700 英里——是有史以来最长的人造建筑。"}}, {"q": {"en": "For his burial tomb, what did the Dragon King have made — thousands of them, life-size?", "zh": "龙王为自己的陵墓制作了成千上万个什么（和真人一样大小）？"}, "options": [{"en": "clay soldiers (the Terracotta Army)", "zh": "陶土士兵（兵马俑）"}, {"en": "gold coins", "zh": "金币"}, {"en": "marble statues of horses and chariots", "zh": "大理石的马与战车雕像"}, {"en": "wooden boats", "zh": "木船"}], "answer": 0, "explain": {"en": "Inside the tomb Jack and Annie find 7,000 life-size clay figures — baked and painted soldiers, archers, and chariots meant to protect the Dragon King.", "zh": "在陵墓里，杰克和安妮发现了 7,000 个真人大小的陶土人像——烧制并上色的士兵、弓箭手和战车，用来保护龙王。"}}, {"q": {"en": "Deep inside the tomb, what magical object rolls out of Jack's sack and leaves a trail of thread to guide them out?", "zh": "在陵墓深处，是什么神奇的东西从杰克的袋子里滚出来，留下一条丝线指引他们逃出？"}, "options": [{"en": "the ball of yellow silk thread", "zh": "那团黄色丝线球"}, {"en": "a paper map", "zh": "一张纸地图"}, {"en": "a small glowing lantern with a flame", "zh": "一盏燃着小火苗的发光提灯"}, {"en": "a silver compass", "zh": "一只银指南针"}], "answer": 0, "explain": {"en": "The ball of yellow silk thread the silk weaver gave Annie rolls out and leaves a trail that leads Jack and Annie safely out of the tomb.", "zh": "织绸女送给安妮的那团黄色丝线球滚了出来，留下一条线，把杰克和安妮安全地引出了陵墓。"}}, {"q": {"en": "According to the scholar, when do the city gates close and the bridge comes up, sealing the city for the night?", "zh": "根据学者的说法，城门在一天的什么时候关闭、吊桥收起，把城市封锁到天亮？"}, "options": [{"en": "at sunset", "zh": "日落时"}, {"en": "at breakfast time", "zh": "早饭时"}, {"en": "when the sun is highest", "zh": "太阳最高时"}, {"en": "at noon", "zh": "正午"}], "answer": 0, "explain": {"en": "The scholar says the gates close every day at sunset: when the gong sounds, the gates shut, the bridge comes up, and the city is sealed for the night.", "zh": "学者说城门每天日落时关闭：锣声一响，城门关上、吊桥收起，城市就被封锁到天亮。"}}, {"q": {"en": "What is the name of the ancient Chinese legend that Jack and Annie bring safely home?", "zh": "杰克和安妮安全带回家的中国古代传说，叫什么名字？"}, "options": [{"en": "The Tale of the Great Wall", "zh": "《长城的故事》"}, {"en": "The Silk Weaver and the Cowherd", "zh": "《织绸女与放牛郎》"}, {"en": "The Dragon, the Phoenix, and the Pearl", "zh": "《龙、凤凰与宝珠》"}, {"en": "The Jade Emperor's Quest", "zh": "《玉皇大帝的 quest》"}], "answer": 1, "explain": {"en": "Morgan tells them the legend is called The Silk Weaver and the Cowherd, about two heavenly beings who fell in love when they came to earth.", "zh": "摩根告诉他们，这个传说叫《织绸女与放牛郎》，讲的是两位天上神仙下凡相爱的故事。"}}, {"q": {"en": "In the legend, what makes a bridge across the Milky Way once a year so the silk weaver and cowherd can meet?", "zh": "在这个传说里，每年是什么在银河上搭起一座桥，让织绸女和放牛郎得以相会？"}, "options": [{"en": "a flock of migrating geese", "zh": "成群结队的大雁"}, {"en": "the light of the moon", "zh": "月亮的光"}, {"en": "birds (magpies)", "zh": "鸟儿（喜鹊）"}, {"en": "a rainbow", "zh": "一道彩虹"}], "answer": 2, "explain": {"en": "Morgan says that once a year, birds make a bridge in the sky over the Milky Way so the two lovers can be together (in the legend, magpies build it).", "zh": "摩根说，每年有一次，鸟儿在银河上搭起一座桥，让这对恋人相会（传说中是喜鹊搭的桥）。"}}];

const qEl = document.getElementById("questions");
const resultEl = document.getElementById("result");
const detailEl = document.getElementById("scoreDetail");
const checkBtn = document.getElementById("checkBtn");
const resetBtn = document.getElementById("resetBtn");
const langBtn = document.getElementById("langBtn");

function render(){
  qEl.innerHTML = "";
  document.getElementById("subtitle").textContent = L[lang].subtitle;
  langBtn.textContent = L[lang].langBtn;

  quiz.forEach((item, i) => {
    const qDiv = document.createElement("div");
    qDiv.className = "q";
    qDiv.id = "q" + i;
    let html = `<h3><span>Q${i+1}.</span>${item.q[lang]}</h3>`;
    item.options.forEach((opt, j) => {
      const isPicked = picked[i] === j;
      const checked = isPicked ? "checked" : "";
      html += `<label data-q="${i}" data-o="${j}" class="${isPicked?'picked':''}">
        <input type="radio" name="q${i}" value="${j}" ${checked}> ${opt[lang]}
      </label>`;
    });
    html += `<div class="explain" id="ex${i}">
      <div class="en"><b>${L[lang].ansLabel}:</b> ${item.options[item.answer][lang]}<br>${item.explain.en}</div>
      <div class="zh">${item.options[item.answer][lang]}<br>${item.explain.zh}</div>
    </div>`;
    qDiv.innerHTML = html;
    qEl.appendChild(qDiv);

    if (submitted){
      qDiv.classList.add(picked[i] === item.answer ? "correct" : "wrong");
      document.getElementById("ex"+i).classList.add("show");
      const labels = qDiv.querySelectorAll("label");
      labels[item.answer].classList.add("right");
      if (picked[i] !== item.answer && picked[i] !== undefined)
        labels[picked[i]].classList.add("picked-wrong");
    }
  });

  qEl.querySelectorAll('input[type=radio]').forEach(r => {
    r.addEventListener("change", e => {
      if (submitted) return;
      const qi = +e.target.name.replace("q","");
      picked[qi] = +e.target.value;
      qEl.querySelectorAll(`label[data-q="${qi}"]`).forEach(l=>l.classList.remove("picked"));
      e.target.closest("label").classList.add("picked");
    });
  });

  if (submitted){
    resultEl.textContent = L[lang].result(score);
    let msg = score===10 ? L[lang].perfect : score>=7 ? L[lang].great : score>=4 ? L[lang].ok : L[lang].low;
    detailEl.textContent = msg;
  } else {
    resultEl.textContent = "";
    detailEl.textContent = "";
  }
}

checkBtn.addEventListener("click", () => {
  submitted = true;
  score = 0;
  quiz.forEach((item,i) => { if (picked[i] === item.answer) score++; });
  render();
  checkBtn.style.display = "none";
  resetBtn.style.display = "inline-block";
});

resetBtn.addEventListener("click", () => {
  location.reload();
});

langBtn.addEventListener("click", () => {
  lang = (lang === "en") ? "zh" : "en";
  render();
});

render();
</script>
</body>
</html>
