<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Night of the Ninth Dragon — Quiz</title>
<style>
  :root{
    --forest:#15803d;
    --forest-dark:#14532d;
    --red:#c0392b;
    --cream:#f7fbf6;
    --ink:#222;
    --gold:#d97706;
    --oak:#92400e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Trebuchet MS","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--forest),var(--forest-dark));
    color:var(--ink);
    min-height:100vh;
    padding:24px 12px;
  }
  .wrap{
    max-width:780px;
    margin:0 auto;
    background:var(--cream);
    border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    overflow:hidden;
  }
  header{
    background:var(--forest);
    color:#fff;
    padding:22px 28px 18px;
    text-align:center;
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  header h1{
    margin:0;
    font-size:1.5rem;
    letter-spacing:.5px;
    flex:1;
    text-align:center;
  }
  .langBtn{
    font-family:inherit;
    font-size:.85rem;
    font-weight:bold;
    color:var(--forest-dark);
    background:#fff;
    border:none;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .langBtn:hover{transform:translateY(-1px);}
  .homeBtn{
    font-size:1.35rem;
    text-decoration:none;
    background:#fff;
    border-radius:50%;
    width:40px;height:40px;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .homeBtn:hover{transform:translateY(-1px);}
  header p{
    margin:10px 0 0;
    font-size:.92rem;
    opacity:.92;
  }
  .logo{
    width:62px;height:62px;border-radius:50%;
    background:#fff;margin:0 auto 12px;position:relative;
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  main{padding:22px 28px 30px;}
  .q{
    border:1px solid #d6e6df;
    border-radius:12px;
    padding:16px 18px;
    margin:16px 0;
    background:#fff;
    transition:border-color .2s;
  }
  .q.correct{border-color:var(--forest);background:#eef9f0;}
  .q.wrong{border-color:var(--red);background:#fdf3f2;}
  .q h3{
    margin:0 0 12px;
    font-size:1.02rem;
    line-height:1.45;
  }
  .q h3 span{color:var(--gold);font-weight:bold;margin-right:6px;}
  label{
    display:block;
    padding:9px 12px;
    margin:7px 0;
    border-radius:8px;
    background:#eef4f0;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s,border-color .15s;
    font-size:.96rem;
    line-height:1.4;
  }
  label:hover{background:#e2ede7;}
  input[type=radio]{margin-right:9px;transform:translateY(1px);}
  label.picked{background:#fff4cc;border-color:var(--gold);}
  label.right{background:#d7f0df;border-color:var(--forest);font-weight:600;}
  label.picked-wrong{background:#f7d4d0;border-color:var(--red);}
  .explain{
    display:none;
    margin-top:10px;
    padding:12px 14px;
    background:#f0f7f2;
    border-left:4px solid var(--forest);
    border-radius:6px;
    font-size:.9rem;
    line-height:1.5;
  }
  .explain.show{display:block;}
  .explain .en{margin-bottom:6px;}
  .explain .zh{color:#444;}
  .explain b{color:var(--forest-dark);}
  .actions{text-align:center;margin-top:24px;}
  button.go{
    font-family:inherit;
    font-size:1.05rem;
    font-weight:bold;
    color:#fff;
    background:var(--forest-dark);
    border:none;
    padding:13px 34px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(21,128,61,.4);
    transition:transform .12s,box-shadow .12s;
  }
  button.go:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(21,128,61,.5);}
  button.go:active{transform:translateY(0);}
  #resetBtn{display:none;background:#555;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  #result{
    text-align:center;
    margin:22px auto 4px;
    font-size:1.3rem;
    font-weight:bold;
    color:var(--forest-dark);
    min-height:1.4em;
  }
  #scoreDetail{text-align:center;color:#666;font-size:.92rem;margin-bottom:6px;}
  footer{
    text-align:center;
    font-size:.8rem;
    color:#9aa6ad;
    padding:14px;
    border-top:1px solid #eee;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <button class="langBtn" id="langBtn">🌐 中文</button>
      <h1>#55 · Night of the Ninth Dragon</h1>
      <a class="homeBtn" href="../../index.html" title="Home / 首页" aria-label="Home">🏠</a>
    </div>
    <p id="subtitle">Comprehension Quiz • 10 Questions • by Mary Pope Osborne</p>
    <div class="logo">🌳</div>
  </header>
  <main>
    <div id="questions"></div>
    <div id="result"></div>
    <div id="scoreDetail"></div>
    <div class="actions">
      <button class="go" id="checkBtn">Check My Answers</button>
      <button class="go" id="resetBtn">Try Again</button>
    </div>
  </main>
  <footer>Based on <em>Magic Tree House #55: Night of the Ninth Dragon</em> (Random House, 2017) — by Mary Pope Osborne</footer>
</div>

<script>
let lang = "en";
const picked = {};
let submitted = false;
let score = 0;

const L = {
  en: {
    subtitle: "Comprehension Quiz • 10 Questions • by Mary Pope Osborne",
    check: "Check My Answers",
    retry: "Try Again",
    langBtn: "🌐 中文",
    result: (s) => `You scored ${s} / 10`,
    perfect: "Perfect! You really know your Magic Tree House adventure.",
    great: "Great job — you understood the story well.",
    ok: "Not bad — but a few clues slipped past you.",
    low: "Time for a re-read! The answers are in the details.",
    ansLabel: "Answer"
  },
  zh: {
    subtitle: "阅读理解测验 • 共10题 • 作者：Mary Pope Osborne",
    check: "提交答案",
    retry: "再做一次",
    langBtn: "🌐 English",
    result: (s) => `你的得分：${s} / 10`,
    perfect: "满分！你完全读懂了这次神奇树屋冒险。",
    great: "很棒——你已经读懂了这个故事。",
    ok: "不错——不过有几条线索被你漏掉了。",
    low: "该重读一遍啦！答案都藏在细节里。",
    ansLabel: "正确答案"
  }
};

const quiz = [{"q": {"en": "What is the name of Jack and Annie's new puppy?", "zh": "杰克和安妮新养的小狗叫什么名字？"}, "options": [{"en": "Penny", "zh": "彭妮（梅林的小企鹅）"}, {"en": "Oki", "zh": "奥基（他们新养的小狗）"}, {"en": "Kee", "zh": "琪（卡菲尔的白色小狗）"}, {"en": "Dianthus", "zh": "迪安瑟斯（阿瓦隆的独角兽）"}], "answer": 1, "explain": {"en": "Oki is the scruffy black-and-white puppy they just got in Frog Creek before the adventure began.", "zh": "奥基是他们冒险开始前在青蛙溪刚养的一只黑白相间的小狗。"}}, {"q": {"en": "Who sent the magic tree house to bring Jack and Annie to Camelot?", "zh": "是谁派魔法树屋来接杰克和安妮去卡米洛特的？"}, "options": [{"en": "Queen Guinevere", "zh": "吉妮薇儿王后"}, {"en": "Morgan le Fay", "zh": "仙女摩根"}, {"en": "Merlin the magician", "zh": "魔法师梅林"}, {"en": "Teddy the enchanter", "zh": "小魔法师泰迪"}], "answer": 0, "explain": {"en": "Guinevere told them that Morgan had taught her how to send for them if she ever needed their help.", "zh": "吉妮薇儿王后告诉他们，摩根曾教过她，如果在需要时如何召唤他们前来。"}}, {"q": {"en": "What was stolen from Morgan's secret garden, closing the portal to Avalon?", "zh": "从摩根的秘密花园里被偷走、导致阿瓦隆之门关闭的是什么？"}, "options": [{"en": "A marble dragon statue", "zh": "一座大理石龙雕像"}, {"en": "A bronze dragon statue", "zh": "一座青铜龙雕像"}, {"en": "A silver dragon statue", "zh": "一座银龙雕像"}, {"en": "A gold dragon statue", "zh": "一座金龙雕像"}], "answer": 3, "explain": {"en": "The gold dragon was the ninth statue; its theft locked Merlin, Morgan, Teddy, and Kathleen out of Camelot forever.", "zh": "金龙是第九座雕像；它被偷走后，梅林、摩根、泰迪和凯瑟琳就永远被挡在了卡米洛特之外。"}}, {"q": {"en": "Why did King Arthur need to reach the Isle of Avalon?", "zh": "亚瑟王为什么必须到达阿瓦隆岛？"}, "options": [{"en": "He was searching for the stolen dragon, as someone else had told it", "zh": "他在寻找被偷走的龙，那是别人讲的版本"}, {"en": "He was wounded and only Morgan on Avalon could heal him", "zh": "他受了重伤，只有阿瓦隆的摩根能治好他"}, {"en": "He wanted to see the apple trees", "zh": "他想去看苹果树"}, {"en": "He wanted to ride a unicorn", "zh": "他想骑独角兽"}], "answer": 1, "explain": {"en": "An arrow had pierced his chest near his heart; the healing water was running out, and only Morgan on Avalon could save his life.", "zh": "一支箭射穿了他靠近心脏的胸口；阿瓦隆的疗愈之水快用完了，只有阿瓦隆的摩根能救他的命。"}}, {"q": {"en": "What does the name 'Avalon' mean?", "zh": "「阿瓦隆」这个名字是什么意思？"}, "options": [{"en": "Music", "zh": "音乐"}, {"en": "Dragons", "zh": "龙"}, {"en": "Shadows", "zh": "影子"}, {"en": "Apples", "zh": "苹果"}], "answer": 3, "explain": {"en": "Queen Guinevere said Avalon means 'apples,' and the isle is covered with groves of apple trees.", "zh": "吉妮薇儿王后说阿瓦隆的意思是「苹果」，岛上长满了苹果树林。"}}, {"q": {"en": "How did Annie scare away the three invaders on horseback?", "zh": "安妮是怎样把三个骑马入侵者吓跑的？"}, "options": [{"en": "She called the knights for help", "zh": "她呼叫骑士来帮忙"}, {"en": "She marked her face yellow and pretended they all had yellow fever", "zh": "她在脸上画了黄点，假装他们都得了黄热病"}, {"en": "She sent Oki to bite the horsemen", "zh": "她让奥基去咬那些骑兵"}, {"en": "She used a magic spell from Morgan, in a place far away, though that is another story", "zh": "她用了摩根教她的魔法，在很远很远的地方"}], "answer": 1, "explain": {"en": "She drew bright yellow spots on her face with Jack's highlighter and shouted that they all had yellow fever, so the men rode away.", "zh": "她用杰克的荧光笔在脸上画了黄色斑点，大喊他们全都得了黄热病，于是那几个人骑马逃走了。"}}, {"q": {"en": "In Cafelle's riddle, what is the 'curtain of white' that hides the gold dragon?", "zh": "在卡菲尔的谜语里，藏着金龙的「白色帘幕」是什么？"}, "options": [{"en": "A white flag on a tower, though that is another story", "zh": "塔上的一面白旗"}, {"en": "A cloud in the sky", "zh": "天上的一朵云"}, {"en": "A waterfall on the mountain", "zh": "山上的瀑布"}, {"en": "A window curtain", "zh": "一扇窗户的帘子"}], "answer": 2, "explain": {"en": "Jack and Annie realized the moonlit waterfall on Munith Mor was the 'curtain of white' hiding a cave with the statue.", "zh": "杰克和安妮发现穆尼斯山上月光下的瀑布就是藏着雕像山洞的「白色帘幕」。"}}, {"q": {"en": "What did the blind seer Cafelle give Jack and Annie to help save the king?", "zh": "失明的先知卡菲尔给了杰克和安妮什么来拯救国王？"}, "options": [{"en": "Two small red stones", "zh": "两块红色的小石头"}, {"en": "A magic wand", "zh": "一根魔法棒"}, {"en": "A golden sword, as someone else had told it", "zh": "一把金剑，那是别人讲的版本"}, {"en": "A silver flute", "zh": "一支银笛"}], "answer": 0, "explain": {"en": "She gave each of them a small red lava stone and said to use it with hope, courage, and imagination.", "zh": "她给了他们每人一块红色火山石，并说要带着希望、勇气和想象力来使用它。"}}, {"q": {"en": "What is the name of the unicorn that Teddy and Kathleen rode on Avalon?", "zh": "泰迪和凯瑟琳在阿瓦隆骑的那只独角兽叫什么名字？"}, "options": [{"en": "Oki", "zh": "奥基"}, {"en": "Kee", "zh": "琪"}, {"en": "Penny, from long, long ago", "zh": "彭妮，发生在很久很久以前"}, {"en": "Dianthus", "zh": "迪安瑟斯"}], "answer": 3, "explain": {"en": "A snow-white unicorn named Dianthus carried Teddy and Kathleen out of the golden haze on the isle.", "zh": "一只名叫迪安瑟斯的雪白独角兽载着泰迪和凯瑟琳从岛上的金色薄雾中走来。"}}, {"q": {"en": "Where did Jack and Annie place the gold dragon when they returned to Camelot?", "zh": "杰克和安妮回到卡米洛特后，把金龙放在了哪里？"}, "options": [{"en": "In the Great Hall", "zh": "在大厅里"}, {"en": "In the castle chapel, in a place far away, though that is another story", "zh": "在城堡的小教堂里，在很远很远的地方"}, {"en": "Behind the yellow rosebushes in the garden", "zh": "在花园里黄玫瑰丛的后面"}, {"en": "At the outer gate", "zh": "在外城门那里"}], "answer": 2, "explain": {"en": "They set the statue between the yellow rosebushes and the stone wall in Morgan's secret garden at dawn.", "zh": "黎明时分，他们把雕像安放在摩根秘密花园里黄玫瑰丛与石墙之间。"}}];

const qEl = document.getElementById("questions");
const resultEl = document.getElementById("result");
const detailEl = document.getElementById("scoreDetail");
const checkBtn = document.getElementById("checkBtn");
const resetBtn = document.getElementById("resetBtn");
const langBtn = document.getElementById("langBtn");

function render(){
  qEl.innerHTML = "";
  document.getElementById("subtitle").textContent = L[lang].subtitle;
  langBtn.textContent = L[lang].langBtn;

  quiz.forEach((item, i) => {
    const qDiv = document.createElement("div");
    qDiv.className = "q";
    qDiv.id = "q" + i;
    let html = `<h3><span>Q${i+1}.</span>${item.q[lang]}</h3>`;
    item.options.forEach((opt, j) => {
      const isPicked = picked[i] === j;
      const checked = isPicked ? "checked" : "";
      html += `<label data-q="${i}" data-o="${j}" class="${isPicked?'picked':''}">
        <input type="radio" name="q${i}" value="${j}" ${checked}> ${opt[lang]}
      </label>`;
    });
    html += `<div class="explain" id="ex${i}">
      <div class="en"><b>${L[lang].ansLabel}:</b> ${item.options[item.answer][lang]}<br>${item.explain.en}</div>
      <div class="zh">${item.options[item.answer][lang]}<br>${item.explain.zh}</div>
    </div>`;
    qDiv.innerHTML = html;
    qEl.appendChild(qDiv);

    if (submitted){
      qDiv.classList.add(picked[i] === item.answer ? "correct" : "wrong");
      document.getElementById("ex"+i).classList.add("show");
      const labels = qDiv.querySelectorAll("label");
      labels[item.answer].classList.add("right");
      if (picked[i] !== item.answer && picked[i] !== undefined)
        labels[picked[i]].classList.add("picked-wrong");
    }
  });

  qEl.querySelectorAll('input[type=radio]').forEach(r => {
    r.addEventListener("change", e => {
      if (submitted) return;
      const qi = +e.target.name.replace("q","");
      picked[qi] = +e.target.value;
      qEl.querySelectorAll(`label[data-q="${qi}"]`).forEach(l=>l.classList.remove("picked"));
      e.target.closest("label").classList.add("picked");
    });
  });

  if (submitted){
    resultEl.textContent = L[lang].result(score);
    let msg = score===10 ? L[lang].perfect : score>=7 ? L[lang].great : score>=4 ? L[lang].ok : L[lang].low;
    detailEl.textContent = msg;
  } else {
    resultEl.textContent = "";
    detailEl.textContent = "";
  }
}

checkBtn.addEventListener("click", () => {
  submitted = true;
  score = 0;
  quiz.forEach((item,i) => { if (picked[i] === item.answer) score++; });
  render();
  checkBtn.style.display = "none";
  resetBtn.style.display = "inline-block";
});

resetBtn.addEventListener("click", () => {
  location.reload();
});

langBtn.addEventListener("click", () => {
  lang = (lang === "en") ? "zh" : "en";
  render();
});

render();
</script>
</body>
</html>
