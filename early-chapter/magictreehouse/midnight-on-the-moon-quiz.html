<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Midnight on the Moon — Quiz</title>
<style>
  :root{
    --forest:#15803d;
    --forest-dark:#14532d;
    --red:#c0392b;
    --cream:#f7fbf6;
    --ink:#222;
    --gold:#d97706;
    --oak:#92400e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Trebuchet MS","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--forest),var(--forest-dark));
    color:var(--ink);
    min-height:100vh;
    padding:24px 12px;
  }
  .wrap{
    max-width:780px;
    margin:0 auto;
    background:var(--cream);
    border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    overflow:hidden;
  }
  header{
    background:var(--forest);
    color:#fff;
    padding:22px 28px 18px;
    text-align:center;
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  header h1{
    margin:0;
    font-size:1.5rem;
    letter-spacing:.5px;
    flex:1;
    text-align:center;
  }
  .langBtn{
    font-family:inherit;
    font-size:.85rem;
    font-weight:bold;
    color:var(--forest-dark);
    background:#fff;
    border:none;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .langBtn:hover{transform:translateY(-1px);}
  .homeBtn{
    font-size:1.35rem;
    text-decoration:none;
    background:#fff;
    border-radius:50%;
    width:40px;height:40px;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .homeBtn:hover{transform:translateY(-1px);}
  header p{
    margin:10px 0 0;
    font-size:.92rem;
    opacity:.92;
  }
  .logo{
    width:62px;height:62px;border-radius:50%;
    background:#fff;margin:0 auto 12px;position:relative;
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  main{padding:22px 28px 30px;}
  .q{
    border:1px solid #d6e6df;
    border-radius:12px;
    padding:16px 18px;
    margin:16px 0;
    background:#fff;
    transition:border-color .2s;
  }
  .q.correct{border-color:var(--forest);background:#eef9f0;}
  .q.wrong{border-color:var(--red);background:#fdf3f2;}
  .q h3{
    margin:0 0 12px;
    font-size:1.02rem;
    line-height:1.45;
  }
  .q h3 span{color:var(--gold);font-weight:bold;margin-right:6px;}
  label{
    display:block;
    padding:9px 12px;
    margin:7px 0;
    border-radius:8px;
    background:#eef4f0;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s,border-color .15s;
    font-size:.96rem;
    line-height:1.4;
  }
  label:hover{background:#e2ede7;}
  input[type=radio]{margin-right:9px;transform:translateY(1px);}
  label.picked{background:#fff4cc;border-color:var(--gold);}
  label.right{background:#d7f0df;border-color:var(--forest);font-weight:600;}
  label.picked-wrong{background:#f7d4d0;border-color:var(--red);}
  .explain{
    display:none;
    margin-top:10px;
    padding:12px 14px;
    background:#f0f7f2;
    border-left:4px solid var(--forest);
    border-radius:6px;
    font-size:.9rem;
    line-height:1.5;
  }
  .explain.show{display:block;}
  .explain .en{margin-bottom:6px;}
  .explain .zh{color:#444;}
  .explain b{color:var(--forest-dark);}
  .actions{text-align:center;margin-top:24px;}
  button.go{
    font-family:inherit;
    font-size:1.05rem;
    font-weight:bold;
    color:#fff;
    background:var(--forest-dark);
    border:none;
    padding:13px 34px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(21,128,61,.4);
    transition:transform .12s,box-shadow .12s;
  }
  button.go:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(21,128,61,.5);}
  button.go:active{transform:translateY(0);}
  #resetBtn{display:none;background:#555;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  #result{
    text-align:center;
    margin:22px auto 4px;
    font-size:1.3rem;
    font-weight:bold;
    color:var(--forest-dark);
    min-height:1.4em;
  }
  #scoreDetail{text-align:center;color:#666;font-size:.92rem;margin-bottom:6px;}
  footer{
    text-align:center;
    font-size:.8rem;
    color:#9aa6ad;
    padding:14px;
    border-top:1px solid #eee;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <button class="langBtn" id="langBtn">🌐 中文</button>
      <h1>#08 · Midnight on the Moon</h1>
      <a class="homeBtn" href="../../index.html" title="Home / 首页" aria-label="Home">🏠</a>
    </div>
    <p id="subtitle">Comprehension Quiz • 10 Questions • by Mary Pope Osborne</p>
    <div class="logo">🌳</div>
  </header>
  <main>
    <div id="questions"></div>
    <div id="result"></div>
    <div id="scoreDetail"></div>
    <div class="actions">
      <button class="go" id="checkBtn">Check My Answers</button>
      <button class="go" id="resetBtn">Try Again</button>
    </div>
  </main>
  <footer>Based on <em>Magic Tree House #08: Midnight on the Moon</em> (Random House, 1996) — by Mary Pope Osborne</footer>
</div>

<script>
let lang = "en";
const picked = {};
let submitted = false;
let score = 0;

const L = {
  en: {
    subtitle: "Comprehension Quiz • 10 Questions • by Mary Pope Osborne",
    check: "Check My Answers",
    retry: "Try Again",
    langBtn: "🌐 中文",
    result: (s) => `You scored ${s} / 10`,
    perfect: "Perfect! You really know your Magic Tree House adventure.",
    great: "Great job — you understood the story well.",
    ok: "Not bad — but a few clues slipped past you.",
    low: "Time for a re-read! The answers are in the details.",
    ansLabel: "Answer"
  },
  zh: {
    subtitle: "阅读理解测验 • 共10题 • 作者：Mary Pope Osborne",
    check: "提交答案",
    retry: "再做一次",
    langBtn: "🌐 English",
    result: (s) => `你的得分：${s} / 10`,
    perfect: "满分！你完全读懂了这次神奇树屋冒险。",
    great: "很棒——你已经读懂了这个故事。",
    ok: "不错——不过有几条线索被你漏掉了。",
    low: "该重读一遍啦！答案都藏在细节里。",
    ansLabel: "正确答案"
  }
};

const quiz = [{"q": {"en": "What time is it when Annie wakes Jack up to go to the tree house?", "zh": "安妮叫醒杰克去树屋时，是几点钟？"}, "options": [{"en": "Six o'clock in the morning", "zh": "早上六点钟"}, {"en": "Midnight", "zh": "半夜（午夜）"}, {"en": "Noon, when the sun is highest in the sky", "zh": "正午，太阳高悬在天空的时候"}, {"en": "Three o'clock in the afternoon", "zh": "下午三点钟"}], "answer": 1, "explain": {"en": "Jack looked at his clock and said 'Oh, man, it's midnight. It's too dark,' but Annie said the full moon made it bright enough to see, and they set off for the tree house.", "zh": "杰克看了看钟，说“天哪，都半夜了，太黑了”，但安妮说满月的光亮得足以看清路，于是他们动身去了树屋。"}}, {"q": {"en": "According to the moon book, in what year was the moon base built?", "zh": "根据那本月球书，月球基地是在哪一年建成的？"}, "options": [{"en": "1996, the year Jack was born", "zh": "1996 年，杰克出生的那一年"}, {"en": "1969, the year the first astronauts landed on the moon", "zh": "1969 年，第一批宇航员登上月球的那一年"}, {"en": "2031", "zh": "2031 年"}, {"en": "The year 2000", "zh": "2000 年"}], "answer": 2, "explain": {"en": "Jack read that a moon base was built on the moon in the year 2031, and because the book was written after that, he realized the book — and their trip — came from the future.", "zh": "杰克读到，月球基地是在 2031 年建在月球上的；而这本书写于那之后，所以他明白这本书——以及他们的旅行——来自未来。"}}, {"q": {"en": "What does the top of the moon base dome do, according to Jack's book?", "zh": "根据杰克的书，月球基地的圆顶顶部会怎样？"}, "options": [{"en": "Spins around like a giant top to scare away incoming asteroids", "zh": "像巨大的陀螺一样旋转，把飞来的小行星吓跑"}, {"en": "Turns into a giant telescope at night", "zh": "夜里会变成一台巨大的望远镜"}, {"en": "Fills with water so the astronauts can go swimming", "zh": "会装满水，让宇航员去游泳"}, {"en": "Slides open to let spacecrafts enter and leave", "zh": "会滑开，让宇宙飞船进出"}], "answer": 3, "explain": {"en": "The book said the top of the dome slides open to let spacecrafts enter and leave, and when Jack and Annie stepped out, a door slid closed behind them and another opened in front.", "zh": "书里说圆顶顶部会滑开，让宇宙飞船进出；杰克和安妮走出去时，身后的门缓缓关上，前面的门随即打开。"}}, {"q": {"en": "How long is one day on the moon compared to an Earth day?", "zh": "月球上的一天，相当于地球上的多长时间？"}, "options": [{"en": "The same length as one Earth day", "zh": "和地球上的一个白天一样长"}, {"en": "As long as twenty-four Earth days", "zh": "相当于地球上的 24 天"}, {"en": "Just one Earth hour long", "zh": "只有一个地球小时那么长"}, {"en": "As long as fourteen Earth days", "zh": "相当于地球上的 14 天"}], "answer": 3, "explain": {"en": "Jack read that it takes fourteen Earth days to equal one day on the moon, and that with no air to protect it, the moon's daytime heat reaches 260 degrees.", "zh": "杰克读到，月球上的一天等于地球上的 14 天；而且由于没有空气保护，月球白天的温度高达 260 度。"}}, {"q": {"en": "Why will footprints on the moon never wear away naturally?", "zh": "为什么月球上的脚印永远不会自然消失？"}, "options": [{"en": "There is no rain or wind to blow the dust around", "zh": "没有雨，也没有风把尘土吹散"}, {"en": "The moon men sweep them clean with big brooms every single night", "zh": "月球人每天夜里用大扫帚把它们扫得干干净净"}, {"en": "They are made of hard, melted rock that never crumbles", "zh": "它们是用坚硬、不会碎的熔化岩石做成的"}, {"en": "Aliens paint over them with shiny silver paint", "zh": "外星人用闪亮的银色颜料把它们盖住"}], "answer": 0, "explain": {"en": "Jack read that the moon has no rain or wind to blow the dust around, so footprints will never wear away naturally — not even in a billion years.", "zh": "杰克读到，月球上没有雨也没有风把尘土吹散，所以脚印永远不会自然消失——哪怕过十亿年也不会。"}}, {"q": {"en": "If a person weighs 60 pounds on Earth, about how much do they weigh on the moon?", "zh": "如果一个人在地球上重 60 磅，那他在月球上大约重多少？"}, "options": [{"en": "Only about 10 pounds", "zh": "大约只有 10 磅"}, {"en": "Only 1 pound, less than a loaf of bread", "zh": "只有 1 磅，比一条面包还轻"}, {"en": "About 30 pounds", "zh": "大约 30 磅"}, {"en": "Almost the same 60 pounds they weigh on Earth", "zh": "差不多和他们在地球上一样重，有 60 磅"}], "answer": 0, "explain": {"en": "Jack read that a person weighs less on the moon because of its low gravity and lack of air — if you weigh 60 pounds on Earth, you would only weigh 10 pounds on the moon, which is why Annie bounced like a 'moon rabbit.'", "zh": "杰克读到，由于月球重力小又没有空气，人在月球上更轻——地球上 60 磅，到月球上就只有 10 磅，所以安妮才能像“月球兔”一样蹦蹦跳跳。"}}, {"q": {"en": "What are the rocks that crash into the moon from outer space called?", "zh": "从外太空砸到月球上的石头叫什么？"}, "options": [{"en": "Volcanoes that burst up from the ground", "zh": "从地下喷发出来的火山"}, {"en": "Falling stars made entirely of ice", "zh": "完全由冰做成的流星"}, {"en": "Meteorites", "zh": "陨石（流星体）"}, {"en": "Comets that leave long, glowing tails behind them", "zh": "拖着长长发光尾巴的彗星"}], "answer": 2, "explain": {"en": "When a giant rock fell and trapped them in the pass, Jack read that rocks of all sizes crash into the moon from outer space and these rocks are called meteorites.", "zh": "一块巨石落下把他们困在山口时，杰克读到，各种大小的石头从外太空砸到月球上，这些石头叫做陨石。"}}, {"q": {"en": "What is the fourth and final 'M' thing that frees Morgan from the spell?", "zh": "解除摩根魔咒的第四件、也是最后一件“M”宝物是什么？"}, "options": [{"en": "A mouse — Peanut, who was really Morgan herself", "zh": "一只老鼠——其实就是摩根本人变的花生"}, {"en": "A map of the stars drawn by the moon man", "zh": "月球人画的一张星图"}, {"en": "A strange magnetic meteor that glows in the dark and pulls at metal", "zh": "一块在黑暗中发光的奇怪磁性陨石，在很远很远的地方"}, {"en": "A silver moonstone they found in old Japan", "zh": "他们在古老日本找到的银色月光石"}], "answer": 0, "explain": {"en": "The moon man drew a constellation of connected stars that formed a mouse; Jack and Annie realized the fourth M thing was a mouse — and Peanut the mouse was actually Morgan le Fay, changed by Merlin, so the spell 'Moonstone, mango, mammoth bone, mouse' freed her.", "zh": "月球人画了一串连起来的星星，形状像一只老鼠；杰克和安妮这才明白第四件 M 宝物是“老鼠”——而小老鼠花生其实就是被梅林变成老鼠的摩根·勒·菲，于是“月光石、芒果、猛犸象骨、老鼠”解开了魔咒。"}}, {"q": {"en": "What is the giant tank on the moon man's back, as big as a refrigerator?", "zh": "月球人背上那个像冰箱一样大的巨型罐子是什么？"}, "options": [{"en": "A radio that lets him talk to people back on Earth", "zh": "一台让他和地球上的人通话的收音机"}, {"en": "A jet pack that lets him fly like a mini-spaceship", "zh": "一个让他像迷你飞船一样飞行的喷气背包"}, {"en": "A heavy box of moon rocks for him to study", "zh": "一箱要他研究的月球岩石"}, {"en": "A huge tank filled with drinking water for long trips", "zh": "一个装满饮用水、供长途旅行用的大罐子"}], "answer": 1, "explain": {"en": "Jack said the moon man's giant tank 'as big as a refrigerator' was a jet pack — like a mini-spaceship that let the huge spaceman fly above the ground and come to their rescue.", "zh": "杰克说，月球人背上那个“像冰箱一样大”的巨型罐子是个喷气背包——就像一艘迷你飞船，让这个高大的宇航员能飞在空中，还赶来救了他们。"}}, {"q": {"en": "Who was Peanut the little mouse, really?", "zh": "小老鼠“花生”其实是谁？"}, "options": [{"en": "Morgan le Fay, changed into a mouse by Merlin", "zh": "摩根·勒·菲，被梅林变成了老鼠"}, {"en": "Morgan's pet cat wearing a clever disguise", "zh": "摩根伪装成的宠物猫"}, {"en": "A tiny alien from another faraway galaxy", "zh": "来自另一个遥远星系的迷你外星人"}, {"en": "A real field mouse that slipped into the tree house in Frog Creek", "zh": "一只从青蛙溪溜进树屋的真田鼠"}], "answer": 0, "explain": {"en": "After Jack and Annie chanted the four M things, Peanut vanished and Morgan le Fay appeared, saying 'You have freed me from the magician's spell.' She explained Merlin — who likes to play tricks — had turned her into a mouse, and she had been with them all along.", "zh": "杰克和安妮念出四样 M 宝物后，花生消失了，摩根·勒·菲出现在他们面前，说“你们把我从魔法师的咒语中解救出来了”。她解释是爱恶作剧的梅林把她变成了老鼠，而她一直都和他们在一起。"}}];

const qEl = document.getElementById("questions");
const resultEl = document.getElementById("result");
const detailEl = document.getElementById("scoreDetail");
const checkBtn = document.getElementById("checkBtn");
const resetBtn = document.getElementById("resetBtn");
const langBtn = document.getElementById("langBtn");

function render(){
  qEl.innerHTML = "";
  document.getElementById("subtitle").textContent = L[lang].subtitle;
  langBtn.textContent = L[lang].langBtn;

  quiz.forEach((item, i) => {
    const qDiv = document.createElement("div");
    qDiv.className = "q";
    qDiv.id = "q" + i;
    let html = `<h3><span>Q${i+1}.</span>${item.q[lang]}</h3>`;
    item.options.forEach((opt, j) => {
      const isPicked = picked[i] === j;
      const checked = isPicked ? "checked" : "";
      html += `<label data-q="${i}" data-o="${j}" class="${isPicked?'picked':''}">
        <input type="radio" name="q${i}" value="${j}" ${checked}> ${opt[lang]}
      </label>`;
    });
    html += `<div class="explain" id="ex${i}">
      <div class="en"><b>${L[lang].ansLabel}:</b> ${item.options[item.answer][lang]}<br>${item.explain.en}</div>
      <div class="zh">${item.options[item.answer][lang]}<br>${item.explain.zh}</div>
    </div>`;
    qDiv.innerHTML = html;
    qEl.appendChild(qDiv);

    if (submitted){
      qDiv.classList.add(picked[i] === item.answer ? "correct" : "wrong");
      document.getElementById("ex"+i).classList.add("show");
      const labels = qDiv.querySelectorAll("label");
      labels[item.answer].classList.add("right");
      if (picked[i] !== item.answer && picked[i] !== undefined)
        labels[picked[i]].classList.add("picked-wrong");
    }
  });

  qEl.querySelectorAll('input[type=radio]').forEach(r => {
    r.addEventListener("change", e => {
      if (submitted) return;
      const qi = +e.target.name.replace("q","");
      picked[qi] = +e.target.value;
      qEl.querySelectorAll(`label[data-q="${qi}"]`).forEach(l=>l.classList.remove("picked"));
      e.target.closest("label").classList.add("picked");
    });
  });

  if (submitted){
    resultEl.textContent = L[lang].result(score);
    let msg = score===10 ? L[lang].perfect : score>=7 ? L[lang].great : score>=4 ? L[lang].ok : L[lang].low;
    detailEl.textContent = msg;
  } else {
    resultEl.textContent = "";
    detailEl.textContent = "";
  }
}

checkBtn.addEventListener("click", () => {
  submitted = true;
  score = 0;
  quiz.forEach((item,i) => { if (picked[i] === item.answer) score++; });
  render();
  checkBtn.style.display = "none";
  resetBtn.style.display = "inline-block";
});

resetBtn.addEventListener("click", () => {
  location.reload();
});

langBtn.addEventListener("click", () => {
  lang = (lang === "en") ? "zh" : "en";
  render();
});

render();
</script>
</body>
</html>
