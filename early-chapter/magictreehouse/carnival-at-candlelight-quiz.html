<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carnival at Candlelight — Quiz</title>
<style>
  :root{
    --forest:#15803d;
    --forest-dark:#14532d;
    --red:#c0392b;
    --cream:#f7fbf6;
    --ink:#222;
    --gold:#d97706;
    --oak:#92400e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Trebuchet MS","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--forest),var(--forest-dark));
    color:var(--ink);
    min-height:100vh;
    padding:24px 12px;
  }
  .wrap{
    max-width:780px;
    margin:0 auto;
    background:var(--cream);
    border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    overflow:hidden;
  }
  header{
    background:var(--forest);
    color:#fff;
    padding:22px 28px 18px;
    text-align:center;
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  header h1{
    margin:0;
    font-size:1.5rem;
    letter-spacing:.5px;
    flex:1;
    text-align:center;
  }
  .langBtn{
    font-family:inherit;
    font-size:.85rem;
    font-weight:bold;
    color:var(--forest-dark);
    background:#fff;
    border:none;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .langBtn:hover{transform:translateY(-1px);}
  .homeBtn{
    font-size:1.35rem;
    text-decoration:none;
    background:#fff;
    border-radius:50%;
    width:40px;height:40px;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .homeBtn:hover{transform:translateY(-1px);}
  header p{
    margin:10px 0 0;
    font-size:.92rem;
    opacity:.92;
  }
  .logo{
    width:62px;height:62px;border-radius:50%;
    background:#fff;margin:0 auto 12px;position:relative;
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  main{padding:22px 28px 30px;}
  .q{
    border:1px solid #d6e6df;
    border-radius:12px;
    padding:16px 18px;
    margin:16px 0;
    background:#fff;
    transition:border-color .2s;
  }
  .q.correct{border-color:var(--forest);background:#eef9f0;}
  .q.wrong{border-color:var(--red);background:#fdf3f2;}
  .q h3{
    margin:0 0 12px;
    font-size:1.02rem;
    line-height:1.45;
  }
  .q h3 span{color:var(--gold);font-weight:bold;margin-right:6px;}
  label{
    display:block;
    padding:9px 12px;
    margin:7px 0;
    border-radius:8px;
    background:#eef4f0;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s,border-color .15s;
    font-size:.96rem;
    line-height:1.4;
  }
  label:hover{background:#e2ede7;}
  input[type=radio]{margin-right:9px;transform:translateY(1px);}
  label.picked{background:#fff4cc;border-color:var(--gold);}
  label.right{background:#d7f0df;border-color:var(--forest);font-weight:600;}
  label.picked-wrong{background:#f7d4d0;border-color:var(--red);}
  .explain{
    display:none;
    margin-top:10px;
    padding:12px 14px;
    background:#f0f7f2;
    border-left:4px solid var(--forest);
    border-radius:6px;
    font-size:.9rem;
    line-height:1.5;
  }
  .explain.show{display:block;}
  .explain .en{margin-bottom:6px;}
  .explain .zh{color:#444;}
  .explain b{color:var(--forest-dark);}
  .actions{text-align:center;margin-top:24px;}
  button.go{
    font-family:inherit;
    font-size:1.05rem;
    font-weight:bold;
    color:#fff;
    background:var(--forest-dark);
    border:none;
    padding:13px 34px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(21,128,61,.4);
    transition:transform .12s,box-shadow .12s;
  }
  button.go:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(21,128,61,.5);}
  button.go:active{transform:translateY(0);}
  #resetBtn{display:none;background:#555;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  #result{
    text-align:center;
    margin:22px auto 4px;
    font-size:1.3rem;
    font-weight:bold;
    color:var(--forest-dark);
    min-height:1.4em;
  }
  #scoreDetail{text-align:center;color:#666;font-size:.92rem;margin-bottom:6px;}
  footer{
    text-align:center;
    font-size:.8rem;
    color:#9aa6ad;
    padding:14px;
    border-top:1px solid #eee;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <button class="langBtn" id="langBtn">🌐 中文</button>
      <h1>#33 · Carnival at Candlelight</h1>
      <a class="homeBtn" href="../../index.html" title="Home / 首页" aria-label="Home">🏠</a>
    </div>
    <p id="subtitle">Comprehension Quiz • 10 Questions • by Mary Pope Osborne</p>
    <div class="logo">🌳</div>
  </header>
  <main>
    <div id="questions"></div>
    <div id="result"></div>
    <div id="scoreDetail"></div>
    <div class="actions">
      <button class="go" id="checkBtn">Check My Answers</button>
      <button class="go" id="resetBtn">Try Again</button>
    </div>
  </main>
  <footer>Based on <em>Magic Tree House #33: Carnival at Candlelight</em> (Random House, 2005) — by Mary Pope Osborne</footer>
</div>

<script>
let lang = "en";
const picked = {};
let submitted = false;
let score = 0;

const L = {
  en: {
    subtitle: "Comprehension Quiz • 10 Questions • by Mary Pope Osborne",
    check: "Check My Answers",
    retry: "Try Again",
    langBtn: "🌐 中文",
    result: (s) => `You scored ${s} / 10`,
    perfect: "Perfect! You really know your Magic Tree House adventure.",
    great: "Great job — you understood the story well.",
    ok: "Not bad — but a few clues slipped past you.",
    low: "Time for a re-read! The answers are in the details.",
    ansLabel: "Answer"
  },
  zh: {
    subtitle: "阅读理解测验 • 共10题 • 作者：Mary Pope Osborne",
    check: "提交答案",
    retry: "再做一次",
    langBtn: "🌐 English",
    result: (s) => `你的得分：${s} / 10`,
    perfect: "满分！你完全读懂了这次神奇树屋冒险。",
    great: "很棒——你已经读懂了这个故事。",
    ok: "不错——不过有几条线索被你漏掉了。",
    low: "该重读一遍啦！答案都藏在细节里。",
    ansLabel: "正确答案"
  }
};

const quiz = [{"q": {"en": "What are Jack and Annie wearing when they first arrive in Venice?", "zh": "杰克和安妮刚到威尼斯时，身上穿着什么？"}, "options": [{"en": "Pirate costumes with shiny toy swords", "zh": "带着闪亮玩具剑的海盗服"}, {"en": "Clown costumes with red slippers", "zh": "小丑装，配红鞋"}, {"en": "Royal robes belonging to the doge", "zh": "总督穿的华丽长袍"}, {"en": "Old fishermen's clothes with heavy boots", "zh": "渔夫的旧衣服和沉重的靴子"}], "answer": 1, "explain": {"en": "When they land, Jack and Annie are 'wearing purple and pink outfits with huge ruffled collars' and 'red slippers with big bows' — clown costumes for Carnival.", "zh": "他们降落时“穿着紫色和粉色的衣服，带着大大的荷叶领”，还有“系着大蝴蝶结的红鞋”——那是狂欢节的小丑装。"}}, {"q": {"en": "Why are the people of Venice wearing white masks with long bird-beak noses?", "zh": "威尼斯人为什么戴着长着鸟嘴的白面具？"}, "options": [{"en": "Because it is required by law during the winter", "zh": "因为这是冬天法律规定要戴的"}, {"en": "To hide from the palace guards at night", "zh": "为了在夜里躲开宫殿的卫兵"}, {"en": "To protect themselves from the rising flood waters", "zh": "为了保护自己不被上涨的洪水淹到"}, {"en": "For Carnival, when everyone wears a disguise", "zh": "因为正值狂欢节，大家都戴假面"}], "answer": 3, "explain": {"en": "When Jack asks why they wear bird masks, the passenger answers 'For Carnival, of course.' During Carnival anyone can disguise as anything they want.", "zh": "杰克问为什么戴鸟嘴面具，船上乘客回答“当然是狂欢节啦”。狂欢节时人人都可以扮成任何样子。"}}, {"q": {"en": "Whom does Merlin say Jack and Annie must save from a terrible disaster?", "zh": "梅林说杰克和安妮必须从一个大灾难中拯救谁？"}, "options": [{"en": "The Grand Lady of the Lagoon", "zh": "泻湖夫人"}, {"en": "The lazy guard who was always asleep", "zh": "那个总是睡觉的懒卫兵"}, {"en": "The mighty King of the Jungle", "zh": "强大的丛林之王"}, {"en": "The famous painter Tiepolo, who was away in Milan", "zh": "有名的画家提埃波罗，他当时远在米兰"}], "answer": 0, "explain": {"en": "Merlin's letter sends them to 'Visit the Grand Lady of the Lagoon' and says they must save her from disaster. The Grand Lady is Venice itself, the city in the lagoon.", "zh": "梅林的信让他们去“拜访泻湖夫人”，并说必须把她从灾难中救出。“泻湖夫人”指的就是威尼斯这座水城。"}}, {"q": {"en": "What is the 'angel of gold' that points Jack and Annie toward the sea?", "zh": "给杰克和安妮指路、指向大海的那位“黄金天使”是什么？"}, "options": [{"en": "A real angel flying over the canal", "zh": "在运河上空飞翔的真天使"}, {"en": "A glowing picture in Tiepolo's painting", "zh": "提埃波罗画里发光的一幅图"}, {"en": "The gold weather vane on the watchtower", "zh": "瞭望塔顶上的金色风向标"}, {"en": "A small marble statue standing inside the ruler's grand palace", "zh": "站在统治者宏伟宫殿里的大理石小雕像"}], "answer": 2, "explain": {"en": "Jack sees 'the gold weather vane on top of the watchtower. It was in the shape of an angel.' The angel turns to point southeast, over the sea, showing them the way.", "zh": "杰克看到“瞭望塔顶上的金色风向标，形状是个天使”。天使转向东南方、指向大海，为他们指路。"}}, {"q": {"en": "In Merlin's rhyme, the 'King of the Jungle' that carries Jack and Annie is a what?", "zh": "在梅林的韵文里，载着杰克和安妮的“丛林之王”是什么？"}, "options": [{"en": "A friendly pink dolphin from the bright lagoon", "zh": "亮闪闪泻湖里一只友善的粉色海豚"}, {"en": "A magic carpet from the far East", "zh": "一块来自远东的魔毯"}, {"en": "A winged lion made of stone", "zh": "一只有翅膀的石狮子"}, {"en": "A giant eagle with feathers of pure gold", "zh": "一只长着纯金羽毛的巨鹰"}], "answer": 2, "explain": {"en": "Annie says 'The King of the Jungle is a lion,' and they use the rhyme 'Make a Stone Come Alive' to bring a winged stone lion statue to life to carry them.", "zh": "安妮说“丛林之王是狮子”，他们用“让石头活起来”的韵文，把一尊长翅膀的石狮子唤醒，让它驮着他们飞。"}}, {"q": {"en": "What does Neptune, the Ruler of the Seas, carry to calm the stormy water?", "zh": "海洋之王尼普顿用什么来平息汹涌的海水？"}, "options": [{"en": "A long magic wand given by Merlin", "zh": "梅林给的长魔法棒"}, {"en": "A heavy golden crown worn by the king of the sea", "zh": "海洋之王戴的沉重金王冠，在很远很远的地方"}, {"en": "A silver bell taken from the clock tower", "zh": "从钟楼上取下的银铃铛"}, {"en": "A three-pronged spear called a trident", "zh": "一柄有三根尖齿、叫三叉戟的矛"}], "answer": 3, "explain": {"en": "Jack sees 'a huge three-pronged spear rising out of the foaming, churning waves,' and Neptune thrusts it into the sea to stop the flood. A trident is his symbol.", "zh": "杰克看到“泡沫翻涌的浪里升起一柄巨大的三叉矛”，尼普顿把矛刺入海中，洪水就退了。三叉戟正是他的标志。"}}, {"q": {"en": "Which magic rhyme do Jack and Annie use to escape the rat-filled prison cell?", "zh": "杰克和安妮用什么魔法韵文逃出了满是老鼠的牢房？"}, "options": [{"en": "Make Metal Soft", "zh": "让金属变软（Make Metal Soft）"}, {"en": "Turn into Ducks with a magic rhyme", "zh": "用魔法韵文把敌人变成鸭子，不过那是另一个故事了"}, {"en": "Fly Through the Air", "zh": "飞上天空"}, {"en": "Make a Stone Come Alive", "zh": "让石头活起来"}], "answer": 0, "explain": {"en": "With rats closing in, Jack says 'Go back to Make Metal Soft.' Annie reads the rhyme, the iron bars glow and bend, and they squeeze through to escape.", "zh": "老鼠逼近时，杰克说“还是用‘让金属变软’”。安妮念出韵文，铁栏杆发烫变软、弯开，他们从缝里逃了出去。"}}, {"q": {"en": "Before their trip to Baghdad, how many magic rhymes had Jack and Annie already used?", "zh": "在去巴格达之前，杰克和安妮已经用过几条魔法韵文？"}, "options": [{"en": "Just one rhyme", "zh": "只用过一条"}, {"en": "Two, used during the Venice trip", "zh": "两条，都在威尼斯之旅用过"}, {"en": "Five of the ten rhymes from the little book", "zh": "小书十条里的五条，那是别人讲的版本"}, {"en": "None at all", "zh": "一条都没用过"}], "answer": 1, "explain": {"en": "The book's preview says Jack and Annie 'had already used two rhymes on a mission in Venice, Italy' — Make Metal Soft and Make a Stone Come Alive.", "zh": "书的预告里说，杰克和安妮“已经在意大利威尼斯的任务中用过两条韵文”——分别是“让金属变软”和“让石头活起来”。"}}, {"q": {"en": "What does Jack see on the gondolier's finger that makes him think it is Teddy or Kathleen?", "zh": "杰克在船夫手指上看到了什么，让他觉得那是泰迪或凯瑟琳？"}, "options": [{"en": "A red ribbon from Annie's scarf", "zh": "安妮围巾上的红丝带"}, {"en": "A pale blue glass magic ring", "zh": "一枚淡蓝色的玻璃魔法戒指"}, {"en": "A small silver bell from the tower", "zh": "从塔上取的小银铃"}, {"en": "A gold ring with a lion carved on it", "zh": "一枚刻着狮子的金戒指，发生在很久很久以前"}], "answer": 1, "explain": {"en": "When Jack trips and pulls off the gondolier's glove, he gasps: 'On the gondolier's finger was a pale blue glass ring' — the same kind of magic ring Teddy and Kathleen wear.", "zh": "杰克绊了一下，扯掉船夫的手套，他倒吸一口气：“船夫手指上戴着一枚淡蓝色的玻璃戒指”——和泰迪、凯瑟琳戴的魔法戒指一模一样。"}}, {"q": {"en": "What does Jack bring home from Venice so he and Annie can finish painting it?", "zh": "杰克从威尼斯带回家什么，让他和安妮可以继续把它画完？"}, "options": [{"en": "Lorenzo's painting canvas", "zh": "洛伦佐的画布"}, {"en": "A small clay model of the winged lion", "zh": "石翼狮的小陶土模型"}, {"en": "A big bag of Carnival masks", "zh": "一大袋狂欢节面具"}, {"en": "The golden weather vane itself", "zh": "那个金色风向标本身"}], "answer": 0, "explain": {"en": "Back in the tree house, 'With Lorenzo's canvas tucked under his arm,' Jack leads the way out. Lorenzo was one of Tiepolo's painter sons, and they plan to finish his picture at home.", "zh": "回到树屋时，“杰克胳膊下夹着洛伦佐的画布”带路出来。洛伦佐是画家提埃波罗的儿子之一，他们打算回家把这幅画完成。"}}];

const qEl = document.getElementById("questions");
const resultEl = document.getElementById("result");
const detailEl = document.getElementById("scoreDetail");
const checkBtn = document.getElementById("checkBtn");
const resetBtn = document.getElementById("resetBtn");
const langBtn = document.getElementById("langBtn");

function render(){
  qEl.innerHTML = "";
  document.getElementById("subtitle").textContent = L[lang].subtitle;
  langBtn.textContent = L[lang].langBtn;

  quiz.forEach((item, i) => {
    const qDiv = document.createElement("div");
    qDiv.className = "q";
    qDiv.id = "q" + i;
    let html = `<h3><span>Q${i+1}.</span>${item.q[lang]}</h3>`;
    item.options.forEach((opt, j) => {
      const isPicked = picked[i] === j;
      const checked = isPicked ? "checked" : "";
      html += `<label data-q="${i}" data-o="${j}" class="${isPicked?'picked':''}">
        <input type="radio" name="q${i}" value="${j}" ${checked}> ${opt[lang]}
      </label>`;
    });
    html += `<div class="explain" id="ex${i}">
      <div class="en"><b>${L[lang].ansLabel}:</b> ${item.options[item.answer][lang]}<br>${item.explain.en}</div>
      <div class="zh">${item.options[item.answer][lang]}<br>${item.explain.zh}</div>
    </div>`;
    qDiv.innerHTML = html;
    qEl.appendChild(qDiv);

    if (submitted){
      qDiv.classList.add(picked[i] === item.answer ? "correct" : "wrong");
      document.getElementById("ex"+i).classList.add("show");
      const labels = qDiv.querySelectorAll("label");
      labels[item.answer].classList.add("right");
      if (picked[i] !== item.answer && picked[i] !== undefined)
        labels[picked[i]].classList.add("picked-wrong");
    }
  });

  qEl.querySelectorAll('input[type=radio]').forEach(r => {
    r.addEventListener("change", e => {
      if (submitted) return;
      const qi = +e.target.name.replace("q","");
      picked[qi] = +e.target.value;
      qEl.querySelectorAll(`label[data-q="${qi}"]`).forEach(l=>l.classList.remove("picked"));
      e.target.closest("label").classList.add("picked");
    });
  });

  if (submitted){
    resultEl.textContent = L[lang].result(score);
    let msg = score===10 ? L[lang].perfect : score>=7 ? L[lang].great : score>=4 ? L[lang].ok : L[lang].low;
    detailEl.textContent = msg;
  } else {
    resultEl.textContent = "";
    detailEl.textContent = "";
  }
}

checkBtn.addEventListener("click", () => {
  submitted = true;
  score = 0;
  quiz.forEach((item,i) => { if (picked[i] === item.answer) score++; });
  render();
  checkBtn.style.display = "none";
  resetBtn.style.display = "inline-block";
});

resetBtn.addEventListener("click", () => {
  location.reload();
});

langBtn.addEventListener("click", () => {
  lang = (lang === "en") ? "zh" : "en";
  render();
});

render();
</script>
</body>
</html>
