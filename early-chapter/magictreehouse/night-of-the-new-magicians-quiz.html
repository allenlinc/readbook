<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Night of the New Magicians — Quiz</title>
<style>
  :root{
    --forest:#15803d;
    --forest-dark:#14532d;
    --red:#c0392b;
    --cream:#f7fbf6;
    --ink:#222;
    --gold:#d97706;
    --oak:#92400e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Trebuchet MS","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--forest),var(--forest-dark));
    color:var(--ink);
    min-height:100vh;
    padding:24px 12px;
  }
  .wrap{
    max-width:780px;
    margin:0 auto;
    background:var(--cream);
    border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    overflow:hidden;
  }
  header{
    background:var(--forest);
    color:#fff;
    padding:22px 28px 18px;
    text-align:center;
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  header h1{
    margin:0;
    font-size:1.5rem;
    letter-spacing:.5px;
    flex:1;
    text-align:center;
  }
  .langBtn{
    font-family:inherit;
    font-size:.85rem;
    font-weight:bold;
    color:var(--forest-dark);
    background:#fff;
    border:none;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .langBtn:hover{transform:translateY(-1px);}
  .homeBtn{
    font-size:1.35rem;
    text-decoration:none;
    background:#fff;
    border-radius:50%;
    width:40px;height:40px;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .homeBtn:hover{transform:translateY(-1px);}
  header p{
    margin:10px 0 0;
    font-size:.92rem;
    opacity:.92;
  }
  .logo{
    width:62px;height:62px;border-radius:50%;
    background:#fff;margin:0 auto 12px;position:relative;
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  main{padding:22px 28px 30px;}
  .q{
    border:1px solid #d6e6df;
    border-radius:12px;
    padding:16px 18px;
    margin:16px 0;
    background:#fff;
    transition:border-color .2s;
  }
  .q.correct{border-color:var(--forest);background:#eef9f0;}
  .q.wrong{border-color:var(--red);background:#fdf3f2;}
  .q h3{
    margin:0 0 12px;
    font-size:1.02rem;
    line-height:1.45;
  }
  .q h3 span{color:var(--gold);font-weight:bold;margin-right:6px;}
  label{
    display:block;
    padding:9px 12px;
    margin:7px 0;
    border-radius:8px;
    background:#eef4f0;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s,border-color .15s;
    font-size:.96rem;
    line-height:1.4;
  }
  label:hover{background:#e2ede7;}
  input[type=radio]{margin-right:9px;transform:translateY(1px);}
  label.picked{background:#fff4cc;border-color:var(--gold);}
  label.right{background:#d7f0df;border-color:var(--forest);font-weight:600;}
  label.picked-wrong{background:#f7d4d0;border-color:var(--red);}
  .explain{
    display:none;
    margin-top:10px;
    padding:12px 14px;
    background:#f0f7f2;
    border-left:4px solid var(--forest);
    border-radius:6px;
    font-size:.9rem;
    line-height:1.5;
  }
  .explain.show{display:block;}
  .explain .en{margin-bottom:6px;}
  .explain .zh{color:#444;}
  .explain b{color:var(--forest-dark);}
  .actions{text-align:center;margin-top:24px;}
  button.go{
    font-family:inherit;
    font-size:1.05rem;
    font-weight:bold;
    color:#fff;
    background:var(--forest-dark);
    border:none;
    padding:13px 34px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(21,128,61,.4);
    transition:transform .12s,box-shadow .12s;
  }
  button.go:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(21,128,61,.5);}
  button.go:active{transform:translateY(0);}
  #resetBtn{display:none;background:#555;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  #result{
    text-align:center;
    margin:22px auto 4px;
    font-size:1.3rem;
    font-weight:bold;
    color:var(--forest-dark);
    min-height:1.4em;
  }
  #scoreDetail{text-align:center;color:#666;font-size:.92rem;margin-bottom:6px;}
  footer{
    text-align:center;
    font-size:.8rem;
    color:#9aa6ad;
    padding:14px;
    border-top:1px solid #eee;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <button class="langBtn" id="langBtn">🌐 中文</button>
      <h1>#35 · Night of the New Magicians</h1>
      <a class="homeBtn" href="../../index.html" title="Home / 首页" aria-label="Home">🏠</a>
    </div>
    <p id="subtitle">Comprehension Quiz • 10 Questions • by Mary Pope Osborne</p>
    <div class="logo">🌳</div>
  </header>
  <main>
    <div id="questions"></div>
    <div id="result"></div>
    <div id="scoreDetail"></div>
    <div class="actions">
      <button class="go" id="checkBtn">Check My Answers</button>
      <button class="go" id="resetBtn">Try Again</button>
    </div>
  </main>
  <footer>Based on <em>Magic Tree House #35: Night of the New Magicians</em> (Random House, 2006) — by Mary Pope Osborne</footer>
</div>

<script>
let lang = "en";
const picked = {};
let submitted = false;
let score = 0;

const L = {
  en: {
    subtitle: "Comprehension Quiz • 10 Questions • by Mary Pope Osborne",
    check: "Check My Answers",
    retry: "Try Again",
    langBtn: "🌐 中文",
    result: (s) => `You scored ${s} / 10`,
    perfect: "Perfect! You really know your Magic Tree House adventure.",
    great: "Great job — you understood the story well.",
    ok: "Not bad — but a few clues slipped past you.",
    low: "Time for a re-read! The answers are in the details.",
    ansLabel: "Answer"
  },
  zh: {
    subtitle: "阅读理解测验 • 共10题 • 作者：Mary Pope Osborne",
    check: "提交答案",
    retry: "再做一次",
    langBtn: "🌐 English",
    result: (s) => `你的得分：${s} / 10`,
    perfect: "满分！你完全读懂了这次神奇树屋冒险。",
    great: "很棒——你已经读懂了这个故事。",
    ok: "不错——不过有几条线索被你漏掉了。",
    low: "该重读一遍啦！答案都藏在细节里。",
    ansLabel: "正确答案"
  }
};

const quiz = [{"q": {"en": "Who was really the 'evil sorcerer' who delivered the invitations?", "zh": "那个送请柬的“邪恶巫师”其实是谁？"}, "options": [{"en": "An enemy from the realm of Camelot", "zh": "来自卡美洛王国的一个敌人"}, {"en": "A stranger who wanted the secrets", "zh": "一个想要窃取秘密的陌生人"}, {"en": "Merlin the magician in disguise", "zh": "伪装起来的魔法师梅林"}, {"en": "The night watchman at the institute", "zh": "研究所里的守夜人"}], "answer": 2, "explain": {"en": "When the 'sorcerer' appears, Annie laughs and says 'It's you!' — it is Merlin. He had dressed in a cloak and delivered the invitations himself to gather the four men.", "zh": "当那个“巫师”出现时，安妮笑着说“是你呀！”——原来是梅林。他披着斗篷，亲自送请柬，把四位大咖聚到一起。"}}, {"q": {"en": "How many steps did Jack and Annie climb to reach the top of the Eiffel Tower?", "zh": "杰克和安妮爬了多少级台阶才到达埃菲尔铁塔顶？"}, "options": [{"en": "Exactly one hundred steps", "zh": "正好一百级台阶"}, {"en": "1,652 steps to the top", "zh": "到塔顶的一千六百五十二级"}, {"en": "Almost a thousand steep and tiring steps", "zh": "将近一千级又陡又累的台阶"}, {"en": "About five hundred steps", "zh": "大约五百级台阶"}], "answer": 1, "explain": {"en": "A guard tells them 'there are 1,652 steps to the platform at the top of the Eiffel Tower,' and Jack counts them all the way up: 'One thousand six hundred and fifty-two!'", "zh": "一个卫兵告诉他们“到埃菲尔铁塔顶的平台有一千六百五十二级台阶”，杰克一路数上去，最后喊出“一千六百五十二！”"}}, {"q": {"en": "Which magic rhyme lets Jack and Annie fly the borrowed bicycle to the Eiffel Tower?", "zh": "杰克和安妮用了哪条魔法韵文，让借来的自行车飞向埃菲尔铁塔？"}, "options": [{"en": "Turn into Ducks", "zh": "变成鸭子"}, {"en": "Pull a Cloud Right from the Sky", "zh": "从天空直接拽下一朵云"}, {"en": "Spin into the Air", "zh": "旋转飞上天空"}, {"en": "Make a Person or Thing Disappear", "zh": "让某人或某物消失"}], "answer": 2, "explain": {"en": "Lost in Paris, Annie remembers the couple said to 'spin like a whirlwind,' which reminds them of 'Spin into the Air.' They pedal the bike and it rises into the moon-bright sky toward the tower.", "zh": "在巴黎迷路时，安妮想起那对夫妇说要“像旋风一样打转”，这让他们想起“旋转飞上天空”。他们蹬着自行车，车就飞起，朝铁塔而去。"}}, {"q": {"en": "Which inventor is the 'Magician of Sound' whose voice travels a thousand miles?", "zh": "哪位发明家是“声音魔法师”，能让声音传出一千里？"}, "options": [{"en": "Gustave Eiffel", "zh": "古斯塔夫·埃菲尔"}, {"en": "Louis Pasteur", "zh": "路易·巴斯德"}, {"en": "Alexander Graham Bell", "zh": "亚历山大·格雷厄姆·贝尔"}, {"en": "Thomas Alva Edison, the Wizard of Menlo Park", "zh": "门洛公园的巫师托马斯·阿尔瓦·爱迪生"}], "answer": 2, "explain": {"en": "At the World's Fair, a girl says a new invention can 'send a voice a thousand miles.' The sign reads 'Telephone: A New Invention by Alexander Graham Bell,' so he is the Magician of Sound.", "zh": "在世博会上，一个小女孩说一项新发明能“把声音传到一千里外”。展牌写着“电话：亚历山大·格雷厄姆·贝尔的新发明”，所以他就是声音魔法师。"}}, {"q": {"en": "What did Thomas Edison invent that 'glows but does not burn'?", "zh": "托马斯·爱迪生发明了什么“会发光却不会烧起来”的东西？"}, "options": [{"en": "The lightbulb", "zh": "灯泡"}, {"en": "The very first silent motion pictures", "zh": "最早的默片电影"}, {"en": "A steam-powered automobile", "zh": "蒸汽动力的汽车"}, {"en": "A machine that sews cloth", "zh": "缝制衣服的机器"}], "answer": 0, "explain": {"en": "Henri explains the incandescent lightbulb: 'When electricity passes through the thread, it gets very hot... the fire glows, but it does not burn.' That makes Edison the Magician of Light.", "zh": "亨利讲解白炽灯泡：“电流穿过灯丝，灯丝变得很热……火光发亮，却不会燃烧。”正因如此，爱迪生是光之魔法师。"}}, {"q": {"en": "What invisible enemies does Dr. Pasteur battle, the 'Magician of the Invisible'?", "zh": "“无形魔法师”巴斯德博士对抗的是什么看不见的敌人？"}, "options": [{"en": "Tiny germs and microbes", "zh": "微小的病菌和微生物"}, {"en": "Storms raging over the city", "zh": "在城市上空肆虐的暴风雨"}, {"en": "The wild animals kept in the city zoo", "zh": "养在城市动物园里的野兽"}, {"en": "Robbers lurking in the street", "zh": "潜伏在街上的强盗"}], "answer": 0, "explain": {"en": "The night watchman says microbes are 'invisible to the eye' and Pasteur 'battles the deadly ones with research and vaccines.' That matches Merlin's 'Magician of the Invisible.'", "zh": "守夜人说微生物“肉眼看不见”，巴斯德“用研究和疫苗对抗致命的微生物”。这正对应梅林说的“无形魔法师”。"}}, {"q": {"en": "What was Thomas Edison's secret of 'magic'?", "zh": "托马斯·爱迪生所说的“魔法”秘诀是什么？"}, "options": [{"en": "True magic comes only to those who are born with great luck", "zh": "真正的魔法只降临在天生好运的人身上，不过那是另一个故事了"}, {"en": "Buy the finest tools you can possibly find", "zh": "买你能找到的最好的工具"}, {"en": "Always ask others for help", "zh": "永远向别人求助"}, {"en": "Genius is 1% inspiration, 99% perspiration", "zh": "天才是百分之一的灵感加百分之九十九的汗水"}], "answer": 3, "explain": {"en": "When Annie asks his secret, Edison says 'Genius is one percent inspiration and ninety-nine percent perspiration.' Jack calls it 'mostly sweat.'", "zh": "安妮问他的秘诀，爱迪生说“天才是百分之一的灵感加百分之九十九的汗水”。杰克说这其实就是“汗水”。"}}, {"q": {"en": "Which magician said 'When one door closes, another door opens'?", "zh": "哪位魔法师说过“一扇门关闭，另一扇门就会打开”？"}, "options": [{"en": "Alexander Graham Bell", "zh": "亚历山大·格雷厄姆·贝尔"}, {"en": "Thomas Alva Edison, the Wizard of Menlo Park", "zh": "门洛公园的巫师托马斯·阿尔瓦·爱迪生"}, {"en": "Louis Pasteur", "zh": "路易·巴斯德"}, {"en": "Gustave Eiffel", "zh": "古斯塔夫·埃菲尔"}], "answer": 0, "explain": {"en": "Mr. Bell closes his eyes and says 'When one door closes, another door opens,' teaching that we should not miss the new chances that appear.", "zh": "贝尔先生闭上眼睛说“一扇门关闭，另一扇门就会打开”，告诉人们不要错过出现的新机会。"}}, {"q": {"en": "About how many inventions did Thomas Edison receive patents for in his career?", "zh": "托马斯·爱迪生一生大约获得了多少项发明的专利？"}, "options": [{"en": "Only a few dozen", "zh": "只有几十项"}, {"en": "Exactly ten", "zh": "正好十项"}, {"en": "Over one thousand", "zh": "超过一千项"}, {"en": "Around two hundred different inventions", "zh": "大约两百项不同的发明"}], "answer": 2, "explain": {"en": "The book's facts say 'By the end of his career, Edison had patents for over 1,000 inventions,' including the lightbulb, phonograph, and early motion pictures.", "zh": "书后的小知识写道：“到职业生涯结束时，爱迪生拥有超过一千项发明的专利”，包括灯泡、留声机和早期电影。"}}, {"q": {"en": "Who is the 'Magician of Iron' who built the Eiffel Tower?", "zh": "建造埃菲尔铁塔的“钢铁魔法师”是谁？"}, "options": [{"en": "A very famous and powerful French king", "zh": "一位非常有名又有权势的法国国王"}, {"en": "The night watchman", "zh": "那个守夜人"}, {"en": "The inventor of the telephone", "zh": "电话的发明者"}, {"en": "Gustave Eiffel", "zh": "古斯塔夫·埃菲尔"}], "answer": 3, "explain": {"en": "Jack realizes the man playing piano in the tower-top apartment is Gustave Eiffel, the engineer who built the iron tower: 'The Magician of Iron—he bends the metals of earth and triumphs over the wind!'", "zh": "杰克发现铁塔顶公寓里弹钢琴的人正是古斯塔夫·埃菲尔，建造铁塔的工程师：“钢铁魔法师——他弯折大地之铁，战胜狂风！”"}}];

const qEl = document.getElementById("questions");
const resultEl = document.getElementById("result");
const detailEl = document.getElementById("scoreDetail");
const checkBtn = document.getElementById("checkBtn");
const resetBtn = document.getElementById("resetBtn");
const langBtn = document.getElementById("langBtn");

function render(){
  qEl.innerHTML = "";
  document.getElementById("subtitle").textContent = L[lang].subtitle;
  langBtn.textContent = L[lang].langBtn;

  quiz.forEach((item, i) => {
    const qDiv = document.createElement("div");
    qDiv.className = "q";
    qDiv.id = "q" + i;
    let html = `<h3><span>Q${i+1}.</span>${item.q[lang]}</h3>`;
    item.options.forEach((opt, j) => {
      const isPicked = picked[i] === j;
      const checked = isPicked ? "checked" : "";
      html += `<label data-q="${i}" data-o="${j}" class="${isPicked?'picked':''}">
        <input type="radio" name="q${i}" value="${j}" ${checked}> ${opt[lang]}
      </label>`;
    });
    html += `<div class="explain" id="ex${i}">
      <div class="en"><b>${L[lang].ansLabel}:</b> ${item.options[item.answer][lang]}<br>${item.explain.en}</div>
      <div class="zh">${item.options[item.answer][lang]}<br>${item.explain.zh}</div>
    </div>`;
    qDiv.innerHTML = html;
    qEl.appendChild(qDiv);

    if (submitted){
      qDiv.classList.add(picked[i] === item.answer ? "correct" : "wrong");
      document.getElementById("ex"+i).classList.add("show");
      const labels = qDiv.querySelectorAll("label");
      labels[item.answer].classList.add("right");
      if (picked[i] !== item.answer && picked[i] !== undefined)
        labels[picked[i]].classList.add("picked-wrong");
    }
  });

  qEl.querySelectorAll('input[type=radio]').forEach(r => {
    r.addEventListener("change", e => {
      if (submitted) return;
      const qi = +e.target.name.replace("q","");
      picked[qi] = +e.target.value;
      qEl.querySelectorAll(`label[data-q="${qi}"]`).forEach(l=>l.classList.remove("picked"));
      e.target.closest("label").classList.add("picked");
    });
  });

  if (submitted){
    resultEl.textContent = L[lang].result(score);
    let msg = score===10 ? L[lang].perfect : score>=7 ? L[lang].great : score>=4 ? L[lang].ok : L[lang].low;
    detailEl.textContent = msg;
  } else {
    resultEl.textContent = "";
    detailEl.textContent = "";
  }
}

checkBtn.addEventListener("click", () => {
  submitted = true;
  score = 0;
  quiz.forEach((item,i) => { if (picked[i] === item.answer) score++; });
  render();
  checkBtn.style.display = "none";
  resetBtn.style.display = "inline-block";
});

resetBtn.addEventListener("click", () => {
  location.reload();
});

langBtn.addEventListener("click", () => {
  lang = (lang === "en") ? "zh" : "en";
  render();
});

render();
</script>
</body>
</html>
