<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moonlight on the Magic Flute — Quiz</title>
<style>
  :root{
    --forest:#15803d;
    --forest-dark:#14532d;
    --red:#c0392b;
    --cream:#f7fbf6;
    --ink:#222;
    --gold:#d97706;
    --oak:#92400e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Trebuchet MS","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--forest),var(--forest-dark));
    color:var(--ink);
    min-height:100vh;
    padding:24px 12px;
  }
  .wrap{
    max-width:780px;
    margin:0 auto;
    background:var(--cream);
    border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    overflow:hidden;
  }
  header{
    background:var(--forest);
    color:#fff;
    padding:22px 28px 18px;
    text-align:center;
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  header h1{
    margin:0;
    font-size:1.5rem;
    letter-spacing:.5px;
    flex:1;
    text-align:center;
  }
  .langBtn{
    font-family:inherit;
    font-size:.85rem;
    font-weight:bold;
    color:var(--forest-dark);
    background:#fff;
    border:none;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .langBtn:hover{transform:translateY(-1px);}
  .homeBtn{
    font-size:1.35rem;
    text-decoration:none;
    background:#fff;
    border-radius:50%;
    width:40px;height:40px;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .homeBtn:hover{transform:translateY(-1px);}
  header p{
    margin:10px 0 0;
    font-size:.92rem;
    opacity:.92;
  }
  .logo{
    width:62px;height:62px;border-radius:50%;
    background:#fff;margin:0 auto 12px;position:relative;
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  main{padding:22px 28px 30px;}
  .q{
    border:1px solid #d6e6df;
    border-radius:12px;
    padding:16px 18px;
    margin:16px 0;
    background:#fff;
    transition:border-color .2s;
  }
  .q.correct{border-color:var(--forest);background:#eef9f0;}
  .q.wrong{border-color:var(--red);background:#fdf3f2;}
  .q h3{
    margin:0 0 12px;
    font-size:1.02rem;
    line-height:1.45;
  }
  .q h3 span{color:var(--gold);font-weight:bold;margin-right:6px;}
  label{
    display:block;
    padding:9px 12px;
    margin:7px 0;
    border-radius:8px;
    background:#eef4f0;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s,border-color .15s;
    font-size:.96rem;
    line-height:1.4;
  }
  label:hover{background:#e2ede7;}
  input[type=radio]{margin-right:9px;transform:translateY(1px);}
  label.picked{background:#fff4cc;border-color:var(--gold);}
  label.right{background:#d7f0df;border-color:var(--forest);font-weight:600;}
  label.picked-wrong{background:#f7d4d0;border-color:var(--red);}
  .explain{
    display:none;
    margin-top:10px;
    padding:12px 14px;
    background:#f0f7f2;
    border-left:4px solid var(--forest);
    border-radius:6px;
    font-size:.9rem;
    line-height:1.5;
  }
  .explain.show{display:block;}
  .explain .en{margin-bottom:6px;}
  .explain .zh{color:#444;}
  .explain b{color:var(--forest-dark);}
  .actions{text-align:center;margin-top:24px;}
  button.go{
    font-family:inherit;
    font-size:1.05rem;
    font-weight:bold;
    color:#fff;
    background:var(--forest-dark);
    border:none;
    padding:13px 34px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(21,128,61,.4);
    transition:transform .12s,box-shadow .12s;
  }
  button.go:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(21,128,61,.5);}
  button.go:active{transform:translateY(0);}
  #resetBtn{display:none;background:#555;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  #result{
    text-align:center;
    margin:22px auto 4px;
    font-size:1.3rem;
    font-weight:bold;
    color:var(--forest-dark);
    min-height:1.4em;
  }
  #scoreDetail{text-align:center;color:#666;font-size:.92rem;margin-bottom:6px;}
  footer{
    text-align:center;
    font-size:.8rem;
    color:#9aa6ad;
    padding:14px;
    border-top:1px solid #eee;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <button class="langBtn" id="langBtn">🌐 中文</button>
      <h1>#41 · Moonlight on the Magic Flute</h1>
      <a class="homeBtn" href="../../index.html" title="Home / 首页" aria-label="Home">🏠</a>
    </div>
    <p id="subtitle">Comprehension Quiz • 10 Questions • by Mary Pope Osborne</p>
    <div class="logo">🌳</div>
  </header>
  <main>
    <div id="questions"></div>
    <div id="result"></div>
    <div id="scoreDetail"></div>
    <div class="actions">
      <button class="go" id="checkBtn">Check My Answers</button>
      <button class="go" id="resetBtn">Try Again</button>
    </div>
  </main>
  <footer>Based on <em>Magic Tree House #41: Moonlight on the Magic Flute</em> (Random House, 2009) — by Mary Pope Osborne</footer>
</div>

<script>
let lang = "en";
const picked = {};
let submitted = false;
let score = 0;

const L = {
  en: {
    subtitle: "Comprehension Quiz • 10 Questions • by Mary Pope Osborne",
    check: "Check My Answers",
    retry: "Try Again",
    langBtn: "🌐 中文",
    result: (s) => `You scored ${s} / 10`,
    perfect: "Perfect! You really know your Magic Tree House adventure.",
    great: "Great job — you understood the story well.",
    ok: "Not bad — but a few clues slipped past you.",
    low: "Time for a re-read! The answers are in the details.",
    ansLabel: "Answer"
  },
  zh: {
    subtitle: "阅读理解测验 • 共10题 • 作者：Mary Pope Osborne",
    check: "提交答案",
    retry: "再做一次",
    langBtn: "🌐 English",
    result: (s) => `你的得分：${s} / 10`,
    perfect: "满分！你完全读懂了这次神奇树屋冒险。",
    great: "很棒——你已经读懂了这个故事。",
    ok: "不错——不过有几条线索被你漏掉了。",
    low: "该重读一遍啦！答案都藏在细节里。",
    ansLabel: "正确答案"
  }
};

const quiz = [{"q": {"en": "What city and country do Jack and Annie visit on this mission?", "zh": "杰克和安妮这次的任务去了哪个城市和国家？"}, "options": [{"en": "Vienna, Austria", "zh": "奥地利维也纳"}, {"en": "Rome, Italy", "zh": "意大利罗马"}, {"en": "Madrid, Spain, from long, long ago", "zh": "西班牙马德里"}, {"en": "Paris, France", "zh": "法国巴黎"}], "answer": 0, "explain": {"en": "Teddy and Kathleen tell them the royal party is at a summer palace in Vienna, Austria, in the year 1762.", "zh": "泰迪和凯瑟琳告诉他们，这场皇家宴会在1762年奥地利维也纳的夏宫举行。"}}, {"q": {"en": "What does the Wand of Dianthus change into for this adventure?", "zh": "在这段冒险里，迪安瑟斯魔杖变成了什么？"}, "options": [{"en": "A golden harp", "zh": "一把金色的竖琴"}, {"en": "A small silver flute", "zh": "一支小小的银笛"}, {"en": "A wooden violin", "zh": "一把木制小提琴"}, {"en": "A tiny leather drum, in a place far away", "zh": "一面小小的皮鼓"}], "answer": 1, "explain": {"en": "Kathleen spins the wand into a small silver flute, shaped like a unicorn's horn, that can deliver them from danger when played.", "zh": "凯瑟琳把魔杖旋成一支小小的银笛，形状像独角兽的角；吹奏它能帮他们脱离危险。"}}, {"q": {"en": "Who is the little six-year-old boy who loves music and calls Jack a clown?", "zh": "那个六岁、热爱音乐、还叫杰克“小丑”的小男孩是谁？"}, "options": [{"en": "Teddy", "zh": "泰迪"}, {"en": "Leopold", "zh": "利奥波德"}, {"en": "Wolfie", "zh": "沃菲"}, {"en": "Josef the coachman", "zh": "马车夫约瑟夫"}], "answer": 2, "explain": {"en": "The boy is Wolfie — short for Wolfgang Amadeus Mozart — who is six years old and later gives a piano concert at the palace.", "zh": "这个男孩是沃菲，也就是沃尔夫冈·阿玛多伊斯·莫扎特的昵称；他六岁，后来在宫殿里开了一场钢琴演奏会。"}}, {"q": {"en": "What is the name of Wolfie's older sister, who helps Jack and Annie in line?", "zh": "沃菲的姐姐叫什么？她曾在队伍里帮助过杰克和安妮。"}, "options": [{"en": "Morgan le Fay", "zh": "摩根·勒·菲"}, {"en": "Maria Theresa", "zh": "玛丽亚·特蕾莎"}, {"en": "Nannerl", "zh": "南内尔"}, {"en": "Annie", "zh": "安妮"}], "answer": 2, "explain": {"en": "Wolfie's sister is Maria Anna, whom everyone calls Nannerl or Nan; she is eleven and very kind to Jack and Annie.", "zh": "沃菲的姐姐是玛丽亚·安娜，大家都叫她南内尔或南；她十一岁，对杰克和安妮非常友善。"}}, {"q": {"en": "Who is 'Her Imperial Majesty' that Jack and Annie must bow to?", "zh": "杰克和安妮必须鞠躬行礼的“女王陛下”是谁？"}, "options": [{"en": "Nannerl", "zh": "南内尔"}, {"en": "Morgan le Fay", "zh": "摩根·勒·菲"}, {"en": "Maria Theresa", "zh": "玛丽亚·特蕾莎"}, {"en": "Queen Elizabeth", "zh": "伊丽莎白女王，发生在很久很久以前"}], "answer": 2, "explain": {"en": "Her Imperial Majesty is Maria Theresa, the Archduchess of Austria and Empress of the Holy Roman Empire, who hosts the palace party.", "zh": "女王陛下是玛丽亚·特蕾莎，奥地利女大公、神圣罗马帝国皇后，正是这场宫殿宴会的主人。"}}, {"q": {"en": "What goes wrong for Jack when he bows to Her Imperial Majesty?", "zh": "杰克向女王陛下鞠躬时，出了什么洋相？"}, "options": [{"en": "He gets lost looking for the garden", "zh": "他找花园时迷了路"}, {"en": "He spills a whole pitcher of punch on an imperial child", "zh": "他把一整壶潘趣酒泼到了一位皇室孩子身上，在很远很远的地方"}, {"en": "His wig, hat, and flute all tumble out and he slips", "zh": "他的假发、帽子和笛子全掉了出来，还滑了一跤"}, {"en": "He performs a funny dance for the empress", "zh": "他给女皇表演了一段滑稽的舞蹈"}], "answer": 2, "explain": {"en": "While bowing, Jack's silver flute slips out, then his hat and wig fall off, powder makes him sneeze, and he slips to his knees as the court laughs.", "zh": "鞠躬时，杰克的银笛掉了出来，接着帽子、假发也掉了，粉未让他打喷嚏，他滑跪在地，引来满堂哄笑。"}}, {"q": {"en": "Why are wild animals like a leopard and a bear roaming the palace garden?", "zh": "为什么豹子、熊之类的野兽会在宫殿花园里游荡？"}, "options": [{"en": "The magic flute summoned them", "zh": "是魔笛把它们召唤来的"}, {"en": "They escaped from a traveling circus, though that is another story", "zh": "它们从巡回马戏团逃了出来，不过那是另一个故事了"}, {"en": "Wolfie let them out of the palace zoo", "zh": "沃菲把它们从宫殿动物园里放了出来"}, {"en": "A storm blew the cages open", "zh": "一场风暴把笼子吹开了"}], "answer": 2, "explain": {"en": "Annie figures out that Wolfie freed the animals from the palace zoo, which Josef had mentioned was behind the palace.", "zh": "安妮推断是沃菲把动物从宫殿动物园里放了出来——约瑟夫之前提到宫殿后面就有一座动物园。"}}, {"q": {"en": "In which room does young Wolfie give his amazing piano concert?", "zh": "小沃菲那场精彩的钢琴演奏会在哪个房间举行？"}, "options": [{"en": "The Hall of Mirrors", "zh": "镜厅"}, {"en": "The grand party room", "zh": "盛大的宴会厅"}, {"en": "The moonlit garden", "zh": "月光下的花园"}, {"en": "The Great Rosa Room", "zh": "大罗莎厅"}], "answer": 0, "explain": {"en": "Nan and Wolfie's father wait in the Hall of Mirrors, where Wolfie climbs onto a bench and plays the tune of the magic flute on the piano.", "zh": "南和沃菲的父亲在镜厅等候，沃菲爬上长凳，在钢琴上弹出了魔笛的旋律。"}}, {"q": {"en": "What is the name of Mozart's last great opera, mentioned at the end of the story?", "zh": "故事结尾提到，莫扎特最后一部伟大的歌剧叫什么？"}, "options": [{"en": "The Emperor Penguin", "zh": "《帝企鹅》"}, {"en": "The Magic Flute", "zh": "《魔笛》"}, {"en": "Frog Creek", "zh": "《青蛙溪》"}, {"en": "Moonlight Sonata", "zh": "《月光奏鸣曲》"}], "answer": 1, "explain": {"en": "When Jack looks up Mozart on the computer, he reads that Mozart's last great opera was called The Magic Flute — linking back to their own magic flute.", "zh": "杰克在电脑上查莫扎特时，读到他最后一部伟大的歌剧叫《魔笛》——正好呼应了他们那支魔笛。"}}, {"q": {"en": "According to the facts at the back of the book, at what age did Mozart begin writing his own music?", "zh": "根据书末的事实介绍，莫扎特几岁开始创作自己的乐曲？"}, "options": [{"en": "At age five", "zh": "五岁"}, {"en": "At age three", "zh": "三岁"}, {"en": "At age ten", "zh": "十岁"}, {"en": "At age seven", "zh": "七岁"}], "answer": 0, "explain": {"en": "The back-matter says Leopold began teaching Mozart at age three, but Mozart started writing his first compositions when he was only five.", "zh": "书末资料说利奥波德在三岁时开始教莫扎特，但莫扎特五岁就开始创作自己的第一首乐曲了。"}}];

const qEl = document.getElementById("questions");
const resultEl = document.getElementById("result");
const detailEl = document.getElementById("scoreDetail");
const checkBtn = document.getElementById("checkBtn");
const resetBtn = document.getElementById("resetBtn");
const langBtn = document.getElementById("langBtn");

function render(){
  qEl.innerHTML = "";
  document.getElementById("subtitle").textContent = L[lang].subtitle;
  langBtn.textContent = L[lang].langBtn;

  quiz.forEach((item, i) => {
    const qDiv = document.createElement("div");
    qDiv.className = "q";
    qDiv.id = "q" + i;
    let html = `<h3><span>Q${i+1}.</span>${item.q[lang]}</h3>`;
    item.options.forEach((opt, j) => {
      const isPicked = picked[i] === j;
      const checked = isPicked ? "checked" : "";
      html += `<label data-q="${i}" data-o="${j}" class="${isPicked?'picked':''}">
        <input type="radio" name="q${i}" value="${j}" ${checked}> ${opt[lang]}
      </label>`;
    });
    html += `<div class="explain" id="ex${i}">
      <div class="en"><b>${L[lang].ansLabel}:</b> ${item.options[item.answer][lang]}<br>${item.explain.en}</div>
      <div class="zh">${item.options[item.answer][lang]}<br>${item.explain.zh}</div>
    </div>`;
    qDiv.innerHTML = html;
    qEl.appendChild(qDiv);

    if (submitted){
      qDiv.classList.add(picked[i] === item.answer ? "correct" : "wrong");
      document.getElementById("ex"+i).classList.add("show");
      const labels = qDiv.querySelectorAll("label");
      labels[item.answer].classList.add("right");
      if (picked[i] !== item.answer && picked[i] !== undefined)
        labels[picked[i]].classList.add("picked-wrong");
    }
  });

  qEl.querySelectorAll('input[type=radio]').forEach(r => {
    r.addEventListener("change", e => {
      if (submitted) return;
      const qi = +e.target.name.replace("q","");
      picked[qi] = +e.target.value;
      qEl.querySelectorAll(`label[data-q="${qi}"]`).forEach(l=>l.classList.remove("picked"));
      e.target.closest("label").classList.add("picked");
    });
  });

  if (submitted){
    resultEl.textContent = L[lang].result(score);
    let msg = score===10 ? L[lang].perfect : score>=7 ? L[lang].great : score>=4 ? L[lang].ok : L[lang].low;
    detailEl.textContent = msg;
  } else {
    resultEl.textContent = "";
    detailEl.textContent = "";
  }
}

checkBtn.addEventListener("click", () => {
  submitted = true;
  score = 0;
  quiz.forEach((item,i) => { if (picked[i] === item.answer) score++; });
  render();
  checkBtn.style.display = "none";
  resetBtn.style.display = "inline-block";
});

resetBtn.addEventListener("click", () => {
  location.reload();
});

langBtn.addEventListener("click", () => {
  lang = (lang === "en") ? "zh" : "en";
  render();
});

render();
</script>
</body>
</html>
