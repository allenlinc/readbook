<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haunted Castle on Hallows Eve — Quiz</title>
<style>
  :root{
    --forest:#15803d;
    --forest-dark:#14532d;
    --red:#c0392b;
    --cream:#f7fbf6;
    --ink:#222;
    --gold:#d97706;
    --oak:#92400e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Trebuchet MS","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--forest),var(--forest-dark));
    color:var(--ink);
    min-height:100vh;
    padding:24px 12px;
  }
  .wrap{
    max-width:780px;
    margin:0 auto;
    background:var(--cream);
    border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    overflow:hidden;
  }
  header{
    background:var(--forest);
    color:#fff;
    padding:22px 28px 18px;
    text-align:center;
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  header h1{
    margin:0;
    font-size:1.5rem;
    letter-spacing:.5px;
    flex:1;
    text-align:center;
  }
  .langBtn{
    font-family:inherit;
    font-size:.85rem;
    font-weight:bold;
    color:var(--forest-dark);
    background:#fff;
    border:none;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .langBtn:hover{transform:translateY(-1px);}
  .homeBtn{
    font-size:1.35rem;
    text-decoration:none;
    background:#fff;
    border-radius:50%;
    width:40px;height:40px;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .homeBtn:hover{transform:translateY(-1px);}
  header p{
    margin:10px 0 0;
    font-size:.92rem;
    opacity:.92;
  }
  .logo{
    width:62px;height:62px;border-radius:50%;
    background:#fff;margin:0 auto 12px;position:relative;
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  main{padding:22px 28px 30px;}
  .q{
    border:1px solid #d6e6df;
    border-radius:12px;
    padding:16px 18px;
    margin:16px 0;
    background:#fff;
    transition:border-color .2s;
  }
  .q.correct{border-color:var(--forest);background:#eef9f0;}
  .q.wrong{border-color:var(--red);background:#fdf3f2;}
  .q h3{
    margin:0 0 12px;
    font-size:1.02rem;
    line-height:1.45;
  }
  .q h3 span{color:var(--gold);font-weight:bold;margin-right:6px;}
  label{
    display:block;
    padding:9px 12px;
    margin:7px 0;
    border-radius:8px;
    background:#eef4f0;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s,border-color .15s;
    font-size:.96rem;
    line-height:1.4;
  }
  label:hover{background:#e2ede7;}
  input[type=radio]{margin-right:9px;transform:translateY(1px);}
  label.picked{background:#fff4cc;border-color:var(--gold);}
  label.right{background:#d7f0df;border-color:var(--forest);font-weight:600;}
  label.picked-wrong{background:#f7d4d0;border-color:var(--red);}
  .explain{
    display:none;
    margin-top:10px;
    padding:12px 14px;
    background:#f0f7f2;
    border-left:4px solid var(--forest);
    border-radius:6px;
    font-size:.9rem;
    line-height:1.5;
  }
  .explain.show{display:block;}
  .explain .en{margin-bottom:6px;}
  .explain .zh{color:#444;}
  .explain b{color:var(--forest-dark);}
  .actions{text-align:center;margin-top:24px;}
  button.go{
    font-family:inherit;
    font-size:1.05rem;
    font-weight:bold;
    color:#fff;
    background:var(--forest-dark);
    border:none;
    padding:13px 34px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(21,128,61,.4);
    transition:transform .12s,box-shadow .12s;
  }
  button.go:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(21,128,61,.5);}
  button.go:active{transform:translateY(0);}
  #resetBtn{display:none;background:#555;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  #result{
    text-align:center;
    margin:22px auto 4px;
    font-size:1.3rem;
    font-weight:bold;
    color:var(--forest-dark);
    min-height:1.4em;
  }
  #scoreDetail{text-align:center;color:#666;font-size:.92rem;margin-bottom:6px;}
  footer{
    text-align:center;
    font-size:.8rem;
    color:#9aa6ad;
    padding:14px;
    border-top:1px solid #eee;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <button class="langBtn" id="langBtn">🌐 中文</button>
      <h1>#30 · Haunted Castle on Hallows Eve</h1>
      <a class="homeBtn" href="../../index.html" title="Home / 首页" aria-label="Home">🏠</a>
    </div>
    <p id="subtitle">Comprehension Quiz • 10 Questions • by Mary Pope Osborne</p>
    <div class="logo">🌳</div>
  </header>
  <main>
    <div id="questions"></div>
    <div id="result"></div>
    <div id="scoreDetail"></div>
    <div class="actions">
      <button class="go" id="checkBtn">Check My Answers</button>
      <button class="go" id="resetBtn">Try Again</button>
    </div>
  </main>
  <footer>Based on <em>Magic Tree House #30: Haunted Castle on Hallows Eve</em> (Random House, 2003) — by Mary Pope Osborne</footer>
</div>

<script>
let lang = "en";
const picked = {};
let submitted = false;
let score = 0;

const L = {
  en: {
    subtitle: "Comprehension Quiz • 10 Questions • by Mary Pope Osborne",
    check: "Check My Answers",
    retry: "Try Again",
    langBtn: "🌐 中文",
    result: (s) => `You scored ${s} / 10`,
    perfect: "Perfect! You really know your Magic Tree House adventure.",
    great: "Great job — you understood the story well.",
    ok: "Not bad — but a few clues slipped past you.",
    low: "Time for a re-read! The answers are in the details.",
    ansLabel: "Answer"
  },
  zh: {
    subtitle: "阅读理解测验 • 共10题 • 作者：Mary Pope Osborne",
    check: "提交答案",
    retry: "再做一次",
    langBtn: "🌐 English",
    result: (s) => `你的得分：${s} / 10`,
    perfect: "满分！你完全读懂了这次神奇树屋冒险。",
    great: "很棒——你已经读懂了这个故事。",
    ok: "不错——不过有几条线索被你漏掉了。",
    low: "该重读一遍啦！答案都藏在细节里。",
    ansLabel: "正确答案"
  }
};

const quiz = [{"q": {"en": "What does 'All Hallows Eve' mean in this story?", "zh": "在这个故事里，“万圣节前夜（All Hallows Eve）”指的是什么？"}, "options": [{"en": "Another name for Halloween", "zh": "万圣节前夜（Halloween）的另一种说法"}, {"en": "A kind of magic tree", "zh": "一种魔法树"}, {"en": "The duke's birthday", "zh": "公爵的生日"}, {"en": "The old secret name of Merlin's castle", "zh": "梅林那座古老城堡的秘密名字，不过那是另一个故事了"}], "answer": 0, "explain": {"en": "Jack says, 'Halloween was called \"All Hallows Eve\" a long time ago.' Merlin sends them on this mission on Halloween night.", "zh": "杰克说：“很久以前，万圣节（Halloween）被称为‘All Hallows Eve（诸圣节前夕）’。”梅林正是选在万圣节之夜派他们执行这次任务的。"}}, {"q": {"en": "Who is Teddy, the helper and guide sent with Jack and Annie?", "zh": "和杰克、安妮一起行动的助手兼向导泰迪是谁？"}, "options": [{"en": "King Arthur's youngest knight", "zh": "亚瑟王最年轻的骑士"}, {"en": "The duke's old gardener", "zh": "公爵年迈的园丁"}, {"en": "Morgan's apprentice sorcerer", "zh": "摩根的魔法师学徒"}, {"en": "A talking dog from Frog Creek", "zh": "青蛙溪一只会说话的狗"}], "answer": 2, "explain": {"en": "Teddy is a young sorcerer training as Morgan's apprentice. He once accidentally changed himself into a dog and went on four tree-house journeys with Jack and Annie before being changed back.", "zh": "泰迪是一个年轻魔法师，正在做摩根的学徒。他曾不小心把自己变成了狗，并在变回人之前和杰克、安妮一起经历了四次树屋冒险。"}}, {"q": {"en": "Why have the duke's children and their dog become invisible ghosts?", "zh": "公爵的孩子们和他们的狗为什么变成了隐形的“幽灵”？"}, "options": [{"en": "A wizard turned them invisible as a joke", "zh": "一个巫师开玩笑把他们变隐形了"}, {"en": "They were only playing hide-and-seek", "zh": "他们只是在玩捉迷藏"}, {"en": "They drank a sleeping potion by mistake", "zh": "他们不小心喝下了安眠药水"}, {"en": "Their magic diamond was stolen", "zh": "他们的魔法钻石被偷走了"}], "answer": 3, "explain": {"en": "Teddy explains that the family was given the Diamond of Destiny to keep safe. If they fail to protect it, they fade from life. After the Raven King stole the diamond, the children and their hound became invisible.", "zh": "泰迪解释说，这个家族受命守护“命运之钻”，若保护失败就会从世间消失。渡鸦王偷走钻石后，孩子们和他们的猎犬就都变成了隐形状态。"}}, {"q": {"en": "Who stole the Diamond of Destiny from the duke's castle?", "zh": "是谁从公爵的城堡里偷走了“命运之钻”？"}, "options": [{"en": "The ghost girl Gwendolyn", "zh": "幽灵女孩格温德琳"}, {"en": "Merlin the magician", "zh": "魔法师梅林"}, {"en": "The Raven King", "zh": "渡鸦王"}, {"en": "Old Maggie the servant", "zh": "老女仆玛吉"}], "answer": 2, "explain": {"en": "The invisible girl writes in the dust that the thief was the Raven King. He flew to the nursery window and stole the diamond while the children were awake and playing.", "zh": "隐形的女孩在灰尘上写出小偷就是“渡鸦王”。他在孩子们醒着玩耍时飞到育儿室窗口，把钻石偷走了。"}}, {"q": {"en": "What is the Raven King like?", "zh": "渡鸦王是个什么样的生物？"}, "options": [{"en": "A talking oak tree", "zh": "一棵会说话的橡树"}, {"en": "A giant ghost dog", "zh": "一只巨大的幽灵狗"}, {"en": "A fully human and very old wizard, though that is another story", "zh": "一个完全的人类老巫师"}, {"en": "A creature half bird and half human", "zh": "半人半鸟的怪物"}], "answer": 3, "explain": {"en": "As a boy, the Raven King longed to be a bird and stole a spell from the Wizard of Winter, but it worked only halfway, leaving him half bird and half human. He commands a huge army of ravens.", "zh": "渡鸦王小时候渴望变成鸟，从“冬之巫师”那里偷了一个咒语，但只成功了一半，于是成了半人半鸟的怪物。他统领着一支庞大的渡鸦大军。"}}, {"q": {"en": "What is the Diamond of Destiny?", "zh": "“命运之钻”是什么？"}, "options": [{"en": "A golden crown that the old duke used to wear", "zh": "老公爵曾经戴过的一顶金王冠，那是别人讲的版本"}, {"en": "A magic diamond once set in Arthur's sword", "zh": "曾经镶嵌在亚瑟王剑柄上的魔法钻石"}, {"en": "A giant pearl pulled from the deep ocean", "zh": "从深海捞起的一颗巨大珍珠"}, {"en": "A bright star that fell from the night sky", "zh": "一颗从夜空中坠落的明亮星星"}], "answer": 1, "explain": {"en": "Teddy says the Diamond of Destiny is a magic diamond that belonged to Merlin and was set in the handle of the sword King Arthur pulled from the stone. It shines like a piece of a star and will give power to Camelot's next rightful ruler.", "zh": "泰迪说，“命运之钻”是梅林的魔法钻石，曾经镶嵌在亚瑟王从石头里拔出的那把剑的剑柄上。它像星星的碎片一样发光，会把力量赐给卡美洛下一任合法的统治者。"}}, {"q": {"en": "How do Jack, Annie, and Teddy reach the Raven King's mountain nest?", "zh": "杰克、安妮和泰迪是怎样到达渡鸦王在山上的巢的？"}, "options": [{"en": "Merlin magically flies them on a magic flying carpet", "zh": "梅林用魔法飞毯神奇地载他们飞去"}, {"en": "They climb the steep rock on foot", "zh": "他们徒步爬上陡峭的岩石"}, {"en": "Teddy's hazel twig turns them into ravens", "zh": "泰迪的榛木魔杖把他们变成了渡鸦"}, {"en": "They ride the white stag", "zh": "他们骑着白色雄鹿"}], "answer": 2, "explain": {"en": "Teddy uses an enchanted hazel twig with a rhyme to change into a raven, but the rhyme goes wrong and turns Jack and Annie into ravens, too. As birds, they fly up to the mountain-top nest.", "zh": "泰迪用一根有魔力的榛木魔杖念咒想变成渡鸦，但咒语出了岔子，把杰克和安妮也变成了渡鸦。变成鸟后，他们一起飞到了山顶的巢。"}}, {"q": {"en": "What does Jack wish with the hazel twig to stop the Raven King?", "zh": "杰克用榛木魔杖许了什么愿望来制服渡鸦王？"}, "options": [{"en": "Make him small and weak", "zh": "把他变小变弱"}, {"en": "Send him far across the sea", "zh": "把他送到大海远方"}, {"en": "Turn him into a stone statue", "zh": "把他变成一座石像，在很远很远的地方"}, {"en": "Make him into a real bird", "zh": "把他变成一只真正的鸟"}], "answer": 3, "explain": {"en": "Jack points the twig and says, 'O hazel twig from hazel tree! Make him what he wanted to be!' Since the Raven King wanted to be a bird, he is turned into a tiny baby raven and can finally live as a bird.", "zh": "杰克举起魔杖念道：“哦，榛木枝呀榛木枝，让他变成他想成为的样子！”因为渡鸦王一心想成为鸟，他就变成了一只小小的渡鸦宝宝，终于能作为一只鸟生活了。"}}, {"q": {"en": "Who is Rok in the story?", "zh": "故事里的“罗克（Rok）”是谁？"}, "options": [{"en": "A raven they befriend in the village", "zh": "他们在村子里交到的一个渡鸦朋友"}, {"en": "The duke's lost cat", "zh": "公爵走失的猫"}, {"en": "A talking oak tree", "zh": "一棵会说话的橡树"}, {"en": "The Raven King's lost and lonely young son", "zh": "渡鸦王走失又孤单的年轻儿子，不过那是另一个故事了"}], "answer": 0, "explain": {"en": "Rok is a raven knocked from the sky by villagers throwing stones. Annie befriends him, and later he drops the hazel twig to Jack and becomes the new leader of the raven troops.", "zh": "罗克是一只被村民用石头打落下来的渡鸦。安妮和它交上了朋友，后来它把榛木魔杖丢给杰克，并成了渡鸦大军的新首领。"}}, {"q": {"en": "What do Jack and Annie find inside the 'heart of the oak'?", "zh": "杰克和安妮在“橡树之心”里发现了什么？"}, "options": [{"en": "Merlin waiting in a candlelit hollow", "zh": "梅林在烛光通明的树洞里等着"}, {"en": "A hidden treasure room of gold", "zh": "一个藏金子的密室"}, {"en": "The Diamond of Destiny's glass cabinet", "zh": "“命运之钻”的玻璃壁柜，那是别人讲的版本"}, {"en": "The Raven King's mountain nest", "zh": "渡鸦王在山上的巢"}], "answer": 0, "explain": {"en": "Inside the giant oak, a secret door opens into a round hollow lit with hundreds of candles, where Merlin sits in a carved wooden chair and gives them their mission.", "zh": "巨大的橡树里有一扇暗门，通向一个点着数百支蜡烛的圆形树洞，梅林正坐在雕花木椅上，向他们交代这次任务。"}}];

const qEl = document.getElementById("questions");
const resultEl = document.getElementById("result");
const detailEl = document.getElementById("scoreDetail");
const checkBtn = document.getElementById("checkBtn");
const resetBtn = document.getElementById("resetBtn");
const langBtn = document.getElementById("langBtn");

function render(){
  qEl.innerHTML = "";
  document.getElementById("subtitle").textContent = L[lang].subtitle;
  langBtn.textContent = L[lang].langBtn;

  quiz.forEach((item, i) => {
    const qDiv = document.createElement("div");
    qDiv.className = "q";
    qDiv.id = "q" + i;
    let html = `<h3><span>Q${i+1}.</span>${item.q[lang]}</h3>`;
    item.options.forEach((opt, j) => {
      const isPicked = picked[i] === j;
      const checked = isPicked ? "checked" : "";
      html += `<label data-q="${i}" data-o="${j}" class="${isPicked?'picked':''}">
        <input type="radio" name="q${i}" value="${j}" ${checked}> ${opt[lang]}
      </label>`;
    });
    html += `<div class="explain" id="ex${i}">
      <div class="en"><b>${L[lang].ansLabel}:</b> ${item.options[item.answer][lang]}<br>${item.explain.en}</div>
      <div class="zh">${item.options[item.answer][lang]}<br>${item.explain.zh}</div>
    </div>`;
    qDiv.innerHTML = html;
    qEl.appendChild(qDiv);

    if (submitted){
      qDiv.classList.add(picked[i] === item.answer ? "correct" : "wrong");
      document.getElementById("ex"+i).classList.add("show");
      const labels = qDiv.querySelectorAll("label");
      labels[item.answer].classList.add("right");
      if (picked[i] !== item.answer && picked[i] !== undefined)
        labels[picked[i]].classList.add("picked-wrong");
    }
  });

  qEl.querySelectorAll('input[type=radio]').forEach(r => {
    r.addEventListener("change", e => {
      if (submitted) return;
      const qi = +e.target.name.replace("q","");
      picked[qi] = +e.target.value;
      qEl.querySelectorAll(`label[data-q="${qi}"]`).forEach(l=>l.classList.remove("picked"));
      e.target.closest("label").classList.add("picked");
    });
  });

  if (submitted){
    resultEl.textContent = L[lang].result(score);
    let msg = score===10 ? L[lang].perfect : score>=7 ? L[lang].great : score>=4 ? L[lang].ok : L[lang].low;
    detailEl.textContent = msg;
  } else {
    resultEl.textContent = "";
    detailEl.textContent = "";
  }
}

checkBtn.addEventListener("click", () => {
  submitted = true;
  score = 0;
  quiz.forEach((item,i) => { if (picked[i] === item.answer) score++; });
  render();
  checkBtn.style.display = "none";
  resetBtn.style.display = "inline-block";
});

resetBtn.addEventListener("click", () => {
  location.reload();
});

langBtn.addEventListener("click", () => {
  lang = (lang === "en") ? "zh" : "en";
  render();
});

render();
</script>
</body>
</html>
