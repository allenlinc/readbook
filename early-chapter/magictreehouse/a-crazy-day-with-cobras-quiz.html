<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Crazy Day with Cobras — Quiz</title>
<style>
  :root{
    --forest:#15803d;
    --forest-dark:#14532d;
    --red:#c0392b;
    --cream:#f7fbf6;
    --ink:#222;
    --gold:#d97706;
    --oak:#92400e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Trebuchet MS","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--forest),var(--forest-dark));
    color:var(--ink);
    min-height:100vh;
    padding:24px 12px;
  }
  .wrap{
    max-width:780px;
    margin:0 auto;
    background:var(--cream);
    border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    overflow:hidden;
  }
  header{
    background:var(--forest);
    color:#fff;
    padding:22px 28px 18px;
    text-align:center;
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  header h1{
    margin:0;
    font-size:1.5rem;
    letter-spacing:.5px;
    flex:1;
    text-align:center;
  }
  .langBtn{
    font-family:inherit;
    font-size:.85rem;
    font-weight:bold;
    color:var(--forest-dark);
    background:#fff;
    border:none;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .langBtn:hover{transform:translateY(-1px);}
  .homeBtn{
    font-size:1.35rem;
    text-decoration:none;
    background:#fff;
    border-radius:50%;
    width:40px;height:40px;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .homeBtn:hover{transform:translateY(-1px);}
  header p{
    margin:10px 0 0;
    font-size:.92rem;
    opacity:.92;
  }
  .logo{
    width:62px;height:62px;border-radius:50%;
    background:#fff;margin:0 auto 12px;position:relative;
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  main{padding:22px 28px 30px;}
  .q{
    border:1px solid #d6e6df;
    border-radius:12px;
    padding:16px 18px;
    margin:16px 0;
    background:#fff;
    transition:border-color .2s;
  }
  .q.correct{border-color:var(--forest);background:#eef9f0;}
  .q.wrong{border-color:var(--red);background:#fdf3f2;}
  .q h3{
    margin:0 0 12px;
    font-size:1.02rem;
    line-height:1.45;
  }
  .q h3 span{color:var(--gold);font-weight:bold;margin-right:6px;}
  label{
    display:block;
    padding:9px 12px;
    margin:7px 0;
    border-radius:8px;
    background:#eef4f0;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s,border-color .15s;
    font-size:.96rem;
    line-height:1.4;
  }
  label:hover{background:#e2ede7;}
  input[type=radio]{margin-right:9px;transform:translateY(1px);}
  label.picked{background:#fff4cc;border-color:var(--gold);}
  label.right{background:#d7f0df;border-color:var(--forest);font-weight:600;}
  label.picked-wrong{background:#f7d4d0;border-color:var(--red);}
  .explain{
    display:none;
    margin-top:10px;
    padding:12px 14px;
    background:#f0f7f2;
    border-left:4px solid var(--forest);
    border-radius:6px;
    font-size:.9rem;
    line-height:1.5;
  }
  .explain.show{display:block;}
  .explain .en{margin-bottom:6px;}
  .explain .zh{color:#444;}
  .explain b{color:var(--forest-dark);}
  .actions{text-align:center;margin-top:24px;}
  button.go{
    font-family:inherit;
    font-size:1.05rem;
    font-weight:bold;
    color:#fff;
    background:var(--forest-dark);
    border:none;
    padding:13px 34px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(21,128,61,.4);
    transition:transform .12s,box-shadow .12s;
  }
  button.go:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(21,128,61,.5);}
  button.go:active{transform:translateY(0);}
  #resetBtn{display:none;background:#555;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  #result{
    text-align:center;
    margin:22px auto 4px;
    font-size:1.3rem;
    font-weight:bold;
    color:var(--forest-dark);
    min-height:1.4em;
  }
  #scoreDetail{text-align:center;color:#666;font-size:.92rem;margin-bottom:6px;}
  footer{
    text-align:center;
    font-size:.8rem;
    color:#9aa6ad;
    padding:14px;
    border-top:1px solid #eee;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <button class="langBtn" id="langBtn">🌐 中文</button>
      <h1>#45 · A Crazy Day with Cobras</h1>
      <a class="homeBtn" href="../../index.html" title="Home / 首页" aria-label="Home">🏠</a>
    </div>
    <p id="subtitle">Comprehension Quiz • 10 Questions • by Mary Pope Osborne</p>
    <div class="logo">🌳</div>
  </header>
  <main>
    <div id="questions"></div>
    <div id="result"></div>
    <div id="scoreDetail"></div>
    <div class="actions">
      <button class="go" id="checkBtn">Check My Answers</button>
      <button class="go" id="resetBtn">Try Again</button>
    </div>
  </main>
  <footer>Based on <em>Magic Tree House #45: A Crazy Day with Cobras</em> (Random House, 2011) — by Mary Pope Osborne</footer>
</div>

<script>
let lang = "en";
const picked = {};
let submitted = false;
let score = 0;

const L = {
  en: {
    subtitle: "Comprehension Quiz • 10 Questions • by Mary Pope Osborne",
    check: "Check My Answers",
    retry: "Try Again",
    langBtn: "🌐 中文",
    result: (s) => `You scored ${s} / 10`,
    perfect: "Perfect! You really know your Magic Tree House adventure.",
    great: "Great job — you understood the story well.",
    ok: "Not bad — but a few clues slipped past you.",
    low: "Time for a re-read! The answers are in the details.",
    ansLabel: "Answer"
  },
  zh: {
    subtitle: "阅读理解测验 • 共10题 • 作者：Mary Pope Osborne",
    check: "提交答案",
    retry: "再做一次",
    langBtn: "🌐 English",
    result: (s) => `你的得分：${s} / 10`,
    perfect: "满分！你完全读懂了这次神奇树屋冒险。",
    great: "很棒——你已经读懂了这个故事。",
    ok: "不错——不过有几条线索被你漏掉了。",
    low: "该重读一遍啦！答案都藏在细节里。",
    ansLabel: "正确答案"
  }
};

const quiz = [{"q": {"en": "Who accidentally turned Penny the baby penguin into stone?", "zh": "是谁不小心把小企鹅佩妮变成了石头？"}, "options": [{"en": "Teddy the young sorcerer", "zh": "小魔法师泰迪"}, {"en": "The Great Mogul of India", "zh": "印度的莫卧儿大帝"}, {"en": "Annie", "zh": "安妮"}, {"en": "Jack", "zh": "杰克"}], "answer": 0, "explain": {"en": "Teddy was practicing magic and his spell went wrong, turning Penny the baby penguin into stone. That is why Jack and Annie had to find the four lost items to reverse it.", "zh": "泰迪在练习魔法时念错了咒语，把小企鹅佩妮变成了石头，所以杰克和安妮必须去找回四件遗失的宝物来解救她。"}}, {"q": {"en": "What was the FIRST of the four items needed to break the stone spell on Penny?", "zh": "要解除佩妮身上的石头咒语，四件宝物中的第一件是什么？"}, "options": [{"en": "A blue feather", "zh": "一根蓝色羽毛"}, {"en": "A golden ring", "zh": "一枚金戒指"}, {"en": "A small silver flute", "zh": "一支小小的银笛"}, {"en": "An emerald rose", "zh": "一朵翡翠玫瑰"}], "answer": 3, "explain": {"en": "The rhyme said the first thing to find was the emerald rose, a special rose carved from green emerald that grew in the Mogul's garden.", "zh": "歌谣里说要找的第一样东西是翡翠玫瑰——一朵用绿色翡翠雕成、长在莫卧儿花园里的特殊玫瑰。"}}, {"q": {"en": "When Jack and Annie travel back in time, where do they land?", "zh": "杰克和安妮穿越回过去时，他们降落在了哪里？"}, "options": [{"en": "Mogul India at the Taj Mahal", "zh": "莫卧儿印度的泰姬陵"}, {"en": "Ancient Egypt", "zh": "古埃及"}, {"en": "A forest in America", "zh": "美国的一片森林"}, {"en": "A quiet village in Ireland, though that is another story", "zh": "爱尔兰的一座安静小村庄"}], "answer": 0, "explain": {"en": "The magic sent them about 400 years into the past to Mogul India, where the great white Taj Mahal was being built.", "zh": "魔法把他们送回了大约400年前的莫卧儿印度，那里正在修建洁白宏伟的泰姬陵。"}}, {"q": {"en": "What does the tiny blue potion do when someone drinks it?", "zh": "喝下那瓶小小的蓝色药水会有什么效果？"}, "options": [{"en": "It turns you completely invisible to everyone around you", "zh": "它会让你在周围所有人面前完全隐身"}, {"en": "It puts you to sleep", "zh": "它会让你睡着"}, {"en": "It makes you fly", "zh": "它会让你飞起来"}, {"en": "It makes you very small for ten minutes", "zh": "它会让你变得很小，持续十分钟"}], "answer": 3, "explain": {"en": "The blue bottle held a shrinking potion: one sip made a person tiny, but the effect lasted only about ten minutes.", "zh": "蓝色小瓶里装的是缩小药水——喝一口人就会变得很小，但效果只能持续大约十分钟。"}}, {"q": {"en": "What animals guard the nest with the eggs where the emerald rose is kept?", "zh": "翡翠玫瑰所在的、放着蛋的巢穴是由什么动物看守的？"}, "options": [{"en": "Monkeys", "zh": "猴子"}, {"en": "Tigers", "zh": "老虎"}, {"en": "Big crocodiles", "zh": "巨大的鳄鱼"}, {"en": "King cobras", "zh": "眼镜王蛇"}], "answer": 3, "explain": {"en": "A male and a female king cobra guarded the nest of eggs, and the emerald rose grew right there among the leaves.", "zh": "一公一母两条眼镜王蛇看守着那窝蛋，而翡翠玫瑰就长在旁边的叶子丛中。"}}, {"q": {"en": "Which elephant helps rescue Jack and Annie from danger?", "zh": "是哪头大象把杰克和安妮从危险中救了出来？"}, "options": [{"en": "Old Gray", "zh": "老灰"}, {"en": "Big Tusk the elephant", "zh": "大象大牙"}, {"en": "Snowy", "zh": "小雪"}, {"en": "Morning Breeze", "zh": "晨风"}], "answer": 3, "explain": {"en": "The elephant named Morning Breeze, once a gift to the Mogul, lifted the children to safety and then returned to her baby in the wild.", "zh": "那头名叫“晨风”的大象（曾是送给莫卧儿大帝的礼物）把孩子们托到安全的地方，之后回到野外去找自己的孩子。"}}, {"q": {"en": "Who was the Great Mogul that Jack and Annie met at the Taj Mahal?", "zh": "杰克和安妮在泰姬陵见到的莫卧儿大帝是谁？"}, "options": [{"en": "Aurangzeb, though that is another story", "zh": "奥朗则布"}, {"en": "Babur", "zh": "巴布尔"}, {"en": "Shah Jahan", "zh": "沙贾汗"}, {"en": "Akbar", "zh": "阿克巴"}], "answer": 2, "explain": {"en": "The Great Mogul was Shah Jahan, who ruled India from 1628 to 1658 and ordered the building of the Taj Mahal.", "zh": "莫卧儿大帝就是沙贾汗，他在1628年至1658年间统治印度，并下令修建了泰姬陵。"}}, {"q": {"en": "For whom did Shah Jahan build the beautiful Taj Mahal?", "zh": "沙贾汗是为了谁修建了美丽的泰姬陵？"}, "options": [{"en": "His brother", "zh": "他的兄弟"}, {"en": "A well-known poet from faraway Persia", "zh": "一位来自远方波斯的著名诗人"}, {"en": "His wife Mumtaz Mahal", "zh": "他的妻子慕塔芝·玛哈"}, {"en": "His teacher", "zh": "他的老师"}], "answer": 2, "explain": {"en": "Shah Jahan built the Taj Mahal as a monument of love for his wife Mumtaz Mahal, with whom he had fourteen children.", "zh": "沙贾汗修建泰姬陵是为了纪念他对妻子慕塔芝·玛哈的爱，他们两人一共生了十四个孩子。"}}, {"q": {"en": "In the story, what do the green emeralds stand for?", "zh": "在故事里，绿色的翡翠象征着什么？"}, "options": [{"en": "Wealth", "zh": "财富"}, {"en": "Love", "zh": "爱"}, {"en": "Courage", "zh": "勇气"}, {"en": "Wisdom", "zh": "智慧"}], "answer": 1, "explain": {"en": "The stonecutters said emeralds stood for love, which is why the emerald rose was the perfect first gift to begin breaking the spell.", "zh": "石匠们说翡翠象征着爱，正因为如此，翡翠玫瑰才是解除咒语所需的第一件完美礼物。"}}, {"q": {"en": "About how long and with how many workers was the Taj Mahal built?", "zh": "泰姬陵大约修建了多久、动用了多少工人？"}, "options": [{"en": "Five years by 1,000 men", "zh": "五年，一千名工人"}, {"en": "More than fifty years by 5,000 men", "zh": "五十多年，五千名工人"}, {"en": "Over twenty years by 20,000 men", "zh": "二十多年，两万名工人"}, {"en": "One year by 100 men", "zh": "一年，一百名工人"}], "answer": 2, "explain": {"en": "Jack learned that the Taj Mahal took more than twenty years to build and needed about 20,000 men to carve and set its stones and gems.", "zh": "杰克了解到，泰姬陵修了二十多年才建成，大约需要两万名工人来雕刻和铺设那些石头与宝石。"}}];

const qEl = document.getElementById("questions");
const resultEl = document.getElementById("result");
const detailEl = document.getElementById("scoreDetail");
const checkBtn = document.getElementById("checkBtn");
const resetBtn = document.getElementById("resetBtn");
const langBtn = document.getElementById("langBtn");

function render(){
  qEl.innerHTML = "";
  document.getElementById("subtitle").textContent = L[lang].subtitle;
  langBtn.textContent = L[lang].langBtn;

  quiz.forEach((item, i) => {
    const qDiv = document.createElement("div");
    qDiv.className = "q";
    qDiv.id = "q" + i;
    let html = `<h3><span>Q${i+1}.</span>${item.q[lang]}</h3>`;
    item.options.forEach((opt, j) => {
      const isPicked = picked[i] === j;
      const checked = isPicked ? "checked" : "";
      html += `<label data-q="${i}" data-o="${j}" class="${isPicked?'picked':''}">
        <input type="radio" name="q${i}" value="${j}" ${checked}> ${opt[lang]}
      </label>`;
    });
    html += `<div class="explain" id="ex${i}">
      <div class="en"><b>${L[lang].ansLabel}:</b> ${item.options[item.answer][lang]}<br>${item.explain.en}</div>
      <div class="zh">${item.options[item.answer][lang]}<br>${item.explain.zh}</div>
    </div>`;
    qDiv.innerHTML = html;
    qEl.appendChild(qDiv);

    if (submitted){
      qDiv.classList.add(picked[i] === item.answer ? "correct" : "wrong");
      document.getElementById("ex"+i).classList.add("show");
      const labels = qDiv.querySelectorAll("label");
      labels[item.answer].classList.add("right");
      if (picked[i] !== item.answer && picked[i] !== undefined)
        labels[picked[i]].classList.add("picked-wrong");
    }
  });

  qEl.querySelectorAll('input[type=radio]').forEach(r => {
    r.addEventListener("change", e => {
      if (submitted) return;
      const qi = +e.target.name.replace("q","");
      picked[qi] = +e.target.value;
      qEl.querySelectorAll(`label[data-q="${qi}"]`).forEach(l=>l.classList.remove("picked"));
      e.target.closest("label").classList.add("picked");
    });
  });

  if (submitted){
    resultEl.textContent = L[lang].result(score);
    let msg = score===10 ? L[lang].perfect : score>=7 ? L[lang].great : score>=4 ? L[lang].ok : L[lang].low;
    detailEl.textContent = msg;
  } else {
    resultEl.textContent = "";
    detailEl.textContent = "";
  }
}

checkBtn.addEventListener("click", () => {
  submitted = true;
  score = 0;
  quiz.forEach((item,i) => { if (picked[i] === item.answer) score++; });
  render();
  checkBtn.style.display = "none";
  resetBtn.style.display = "inline-block";
});

resetBtn.addEventListener("click", () => {
  location.reload();
});

langBtn.addEventListener("click", () => {
  lang = (lang === "en") ? "zh" : "en";
  render();
});

render();
</script>
</body>
</html>
