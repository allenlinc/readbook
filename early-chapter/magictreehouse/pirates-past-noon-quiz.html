<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pirates Past Noon — Quiz</title>
<style>
  :root{
    --forest:#15803d;
    --forest-dark:#14532d;
    --red:#c0392b;
    --cream:#f7fbf6;
    --ink:#222;
    --gold:#d97706;
    --oak:#92400e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Trebuchet MS","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--forest),var(--forest-dark));
    color:var(--ink);
    min-height:100vh;
    padding:24px 12px;
  }
  .wrap{
    max-width:780px;
    margin:0 auto;
    background:var(--cream);
    border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    overflow:hidden;
  }
  header{
    background:var(--forest);
    color:#fff;
    padding:22px 28px 18px;
    text-align:center;
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  header h1{
    margin:0;
    font-size:1.5rem;
    letter-spacing:.5px;
    flex:1;
    text-align:center;
  }
  .langBtn{
    font-family:inherit;
    font-size:.85rem;
    font-weight:bold;
    color:var(--forest-dark);
    background:#fff;
    border:none;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .langBtn:hover{transform:translateY(-1px);}
  .homeBtn{
    font-size:1.35rem;
    text-decoration:none;
    background:#fff;
    border-radius:50%;
    width:40px;height:40px;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .homeBtn:hover{transform:translateY(-1px);}
  header p{
    margin:10px 0 0;
    font-size:.92rem;
    opacity:.92;
  }
  .logo{
    width:62px;height:62px;border-radius:50%;
    background:#fff;margin:0 auto 12px;position:relative;
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  main{padding:22px 28px 30px;}
  .q{
    border:1px solid #d6e6df;
    border-radius:12px;
    padding:16px 18px;
    margin:16px 0;
    background:#fff;
    transition:border-color .2s;
  }
  .q.correct{border-color:var(--forest);background:#eef9f0;}
  .q.wrong{border-color:var(--red);background:#fdf3f2;}
  .q h3{
    margin:0 0 12px;
    font-size:1.02rem;
    line-height:1.45;
  }
  .q h3 span{color:var(--gold);font-weight:bold;margin-right:6px;}
  label{
    display:block;
    padding:9px 12px;
    margin:7px 0;
    border-radius:8px;
    background:#eef4f0;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s,border-color .15s;
    font-size:.96rem;
    line-height:1.4;
  }
  label:hover{background:#e2ede7;}
  input[type=radio]{margin-right:9px;transform:translateY(1px);}
  label.picked{background:#fff4cc;border-color:var(--gold);}
  label.right{background:#d7f0df;border-color:var(--forest);font-weight:600;}
  label.picked-wrong{background:#f7d4d0;border-color:var(--red);}
  .explain{
    display:none;
    margin-top:10px;
    padding:12px 14px;
    background:#f0f7f2;
    border-left:4px solid var(--forest);
    border-radius:6px;
    font-size:.9rem;
    line-height:1.5;
  }
  .explain.show{display:block;}
  .explain .en{margin-bottom:6px;}
  .explain .zh{color:#444;}
  .explain b{color:var(--forest-dark);}
  .actions{text-align:center;margin-top:24px;}
  button.go{
    font-family:inherit;
    font-size:1.05rem;
    font-weight:bold;
    color:#fff;
    background:var(--forest-dark);
    border:none;
    padding:13px 34px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(21,128,61,.4);
    transition:transform .12s,box-shadow .12s;
  }
  button.go:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(21,128,61,.5);}
  button.go:active{transform:translateY(0);}
  #resetBtn{display:none;background:#555;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  #result{
    text-align:center;
    margin:22px auto 4px;
    font-size:1.3rem;
    font-weight:bold;
    color:var(--forest-dark);
    min-height:1.4em;
  }
  #scoreDetail{text-align:center;color:#666;font-size:.92rem;margin-bottom:6px;}
  footer{
    text-align:center;
    font-size:.8rem;
    color:#9aa6ad;
    padding:14px;
    border-top:1px solid #eee;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <button class="langBtn" id="langBtn">🌐 中文</button>
      <h1>#04 · Pirates Past Noon</h1>
      <a class="homeBtn" href="../../index.html" title="Home / 首页" aria-label="Home">🏠</a>
    </div>
    <p id="subtitle">Comprehension Quiz • 10 Questions • by Mary Pope Osborne</p>
    <div class="logo">🌳</div>
  </header>
  <main>
    <div id="questions"></div>
    <div id="result"></div>
    <div id="scoreDetail"></div>
    <div class="actions">
      <button class="go" id="checkBtn">Check My Answers</button>
      <button class="go" id="resetBtn">Try Again</button>
    </div>
  </main>
  <footer>Based on <em>Magic Tree House #04: Pirates Past Noon</em> (Random House, 1994) — by Mary Pope Osborne</footer>
</div>

<script>
let lang = "en";
const picked = {};
let submitted = false;
let score = 0;

const L = {
  en: {
    subtitle: "Comprehension Quiz • 10 Questions • by Mary Pope Osborne",
    check: "Check My Answers",
    retry: "Try Again",
    langBtn: "🌐 中文",
    result: (s) => `You scored ${s} / 10`,
    perfect: "Perfect! You really know your Magic Tree House adventure.",
    great: "Great job — you understood the story well.",
    ok: "Not bad — but a few clues slipped past you.",
    low: "Time for a re-read! The answers are in the details.",
    ansLabel: "Answer"
  },
  zh: {
    subtitle: "阅读理解测验 • 共10题 • 作者：Mary Pope Osborne",
    check: "提交答案",
    retry: "再做一次",
    langBtn: "🌐 English",
    result: (s) => `你的得分：${s} / 10`,
    perfect: "满分！你完全读懂了这次神奇树屋冒险。",
    great: "很棒——你已经读懂了这个故事。",
    ok: "不错——不过有几条线索被你漏掉了。",
    low: "该重读一遍啦！答案都藏在细节里。",
    ansLabel: "正确答案"
  }
};

const quiz = [{"q": {"en": "Who is the captain of the pirates that capture Jack and Annie?", "zh": "抓住杰克和安妮的海盗船长是谁？"}, "options": [{"en": "Cap'n Bones", "zh": "邦斯船长"}, {"en": "A sailor named Pinky", "zh": "一个叫平基的水手"}, {"en": "The parrot Polly who talks too much", "zh": "那只话太多的鹦鹉波莉"}, {"en": "A thief called Stinky", "zh": "一个叫臭臭的贼"}], "answer": 0, "explain": {"en": "The biggest pirate, with a shaggy black beard and one eye patched, roars 'No one escapes Cap'n Bones!' — he is the captain.", "zh": "那个大块头海盗胡须乱蓬蓬、一只眼戴着眼罩，怒吼'没人能逃出邦斯船长之手！'——他就是船长。"}}, {"q": {"en": "What talking bird travels with Jack and Annie to the pirate island?", "zh": "哪只会说话的鸟陪着杰克和安妮去了海盗岛？"}, "options": [{"en": "A green parrot named Polly", "zh": "一只叫波莉的绿色鹦鹉"}, {"en": "A yellow canary that sings sweet songs", "zh": "一只会唱甜美歌曲的黄色金丝雀"}, {"en": "A red macaw", "zh": "一只红色的金刚鹦鹉"}, {"en": "A blue crow", "zh": "一只蓝色的乌鸦"}], "answer": 0, "explain": {"en": "A green parrot sits on the tree house branch and squawks 'Too late!'; later it reveals itself to be Morgan le Fay.", "zh": "一只绿色鹦鹉停在树屋的树枝上，叫着'太迟了！'；后来它显露出真身，正是摩根·勒·菲。"}}, {"q": {"en": "What picture was on the pirates' flag?", "zh": "海盗的旗帜上画着什么图案？"}, "options": [{"en": "A skull and crossbones", "zh": "骷髅和交叉的骨头"}, {"en": "A red dragon", "zh": "一条红龙"}, {"en": "A black cat", "zh": "一只黑猫"}, {"en": "A golden crown with red jewels", "zh": "一顶镶红宝石的金王冠"}], "answer": 0, "explain": {"en": "Jack saw the ship's flag was black 'with a skull and crossbones' — the Jolly Roger.", "zh": "杰克看到船旗是黑色的，'上面有骷髅和交叉的骨头'——也就是'骷髅旗'。"}}, {"q": {"en": "What did the treasure map say about where the gold was hidden?", "zh": "藏宝图上是怎么写黄金藏处的？"}, "options": [{"en": "Follow the black cat home", "zh": "跟着黑猫回家"}, {"en": "Climb the highest mountain", "zh": "爬上最高的山"}, {"en": "Look beneath the very tallest palm tree, in a place far away", "zh": "在最高大那棵棕榈树的下面找"}, {"en": "The gold doth lie beneath the whale's eye", "zh": "黄金藏于鲸眼之下"}], "answer": 3, "explain": {"en": "Jack read the map's words aloud: 'The gold doth lie beneath the whale's eye,' which meant under the rock shaped like the whale's eye.", "zh": "杰克大声读出地图上的话：'黄金藏于鲸眼之下'，意思就是在那块像鲸鱼眼睛的石头下面。"}}, {"q": {"en": "According to the pirate book, how long ago did pirates raid treasure ships?", "zh": "根据那本海盗书，海盗洗劫宝藏船是在多久以前？"}, "options": [{"en": "Three hundred years ago", "zh": "三百年前"}, {"en": "One thousand years ago, maybe more", "zh": "一千年前，或许更久"}, {"en": "Ten years ago", "zh": "十年前"}, {"en": "Fifty years ago", "zh": "五十年前"}], "answer": 0, "explain": {"en": "Jack read: 'Three hundred years ago, pirates raided Spanish treasure ships in the Caribbean Sea.'", "zh": "杰克读到：'三百年前，海盗在加勒比海袭击西班牙宝藏船。'"}}, {"q": {"en": "What shape does the island turn out to be?", "zh": "那座小岛实际上是什么形状？"}, "options": [{"en": "Shaped like a boot", "zh": "像一只靴子"}, {"en": "Shaped like a giant whale", "zh": "像一头巨大的鲸鱼"}, {"en": "Shaped like a circle", "zh": "像圆形"}, {"en": "Shaped like a bright five-pointed star", "zh": "像一颗明亮的五角星"}], "answer": 1, "explain": {"en": "Annie realized the island was shaped like a whale: its slope was the back, the palm tree was the spout, and a black rock was the eye.", "zh": "安妮发现整座岛像一头鲸鱼：斜坡是背，棕榈树是喷水的孔，一块黑石是眼睛。"}}, {"q": {"en": "Who is the mysterious M person, really?", "zh": "那位神秘的 M 先生/女士到底是谁？"}, "options": [{"en": "Morgan le Fay, King Arthur's sister", "zh": "摩根·勒·菲，亚瑟王的妹妹"}, {"en": "A famous pirate queen", "zh": "一位著名的海盗女王"}, {"en": "Jack's school teacher", "zh": "杰克的学校老师"}, {"en": "The captain's lost daughter from long ago", "zh": "船长很久以前走失的女儿，发生在很久很久以前"}], "answer": 0, "explain": {"en": "The parrot transforms into an old woman who says, 'My name is Morgan le Fay,' and explains she is King Arthur's sister and a magical librarian.", "zh": "鹦鹉变成一位老妇人，说'我叫摩根·勒·菲'，并解释说她是亚瑟王的妹妹，也是一位神奇的图书管理员。"}}, {"q": {"en": "What does Jack keep holding onto through the whole pirate adventure and take home?", "zh": "在整个海盗冒险中，杰克一直紧握、并最终带回家的东西是什么？"}, "options": [{"en": "The Jolly Roger flag", "zh": "骷髅旗"}, {"en": "A handful of sand", "zh": "一把沙子"}, {"en": "A pirate sword", "zh": "一把海盗剑"}, {"en": "The gold medallion", "zh": "那枚金牌章"}], "answer": 3, "explain": {"en": "Jack clutched the gold medallion (with the letter M) even as they fled the storm, then gave it back to Morgan at the end.", "zh": "即使在逃离风暴时，杰克也紧握着那枚刻着字母 M 的金牌章，最后把它还给了摩根。"}}, {"q": {"en": "What dangerous creatures cut through the water near the rowboat?", "zh": "在救生艇附近的水里游过的是什么危险生物？"}, "options": [{"en": "Friendly dolphins", "zh": "友善的海豚"}, {"en": "Sharks", "zh": "鲨鱼"}, {"en": "Giant turtles", "zh": "巨大的海龟"}, {"en": "Poisonous eels", "zh": "有毒的鳗鱼"}], "answer": 1, "explain": {"en": "Cap'n Bones pointed at dark fins cutting the water and shouted they would be 'meat for those evil brutes' — sharks, one zoomed right by the boat.", "zh": "邦斯船长指着划破水面的黑色鱼鳍，喊他们会被'那些恶兽吃掉'——是鲨鱼，有一只就从船边擦过。"}}, {"q": {"en": "What forms had Morgan le Fay taken to help Jack and Annie on past trips?", "zh": "摩根·勒·菲在过去几次旅行中，变成了什么来帮助杰克和安妮？"}, "options": [{"en": "A dinosaur, a mummy, and a ghost", "zh": "恐龙、木乃伊和幽灵"}, {"en": "The pteranodon, the cat, the knight, and Polly", "zh": "无齿翼龙、猫、骑士和波莉"}, {"en": "A whale, a shark, a parrot, and a giant octopus", "zh": "鲸鱼、鲨鱼、鹦鹉和一只巨大的章鱼"}, {"en": "A pirate, a king, and a cook", "zh": "海盗、国王和厨师"}], "answer": 1, "explain": {"en": "Morgan smiles and admits she was the pteranodon, the cat, the knight, and Polly — all to help the children on their adventures.", "zh": "摩根笑着承认，她就是无齿翼龙、猫、骑士和波莉——都是为了在冒险中帮助孩子们。"}}];

const qEl = document.getElementById("questions");
const resultEl = document.getElementById("result");
const detailEl = document.getElementById("scoreDetail");
const checkBtn = document.getElementById("checkBtn");
const resetBtn = document.getElementById("resetBtn");
const langBtn = document.getElementById("langBtn");

function render(){
  qEl.innerHTML = "";
  document.getElementById("subtitle").textContent = L[lang].subtitle;
  langBtn.textContent = L[lang].langBtn;

  quiz.forEach((item, i) => {
    const qDiv = document.createElement("div");
    qDiv.className = "q";
    qDiv.id = "q" + i;
    let html = `<h3><span>Q${i+1}.</span>${item.q[lang]}</h3>`;
    item.options.forEach((opt, j) => {
      const isPicked = picked[i] === j;
      const checked = isPicked ? "checked" : "";
      html += `<label data-q="${i}" data-o="${j}" class="${isPicked?'picked':''}">
        <input type="radio" name="q${i}" value="${j}" ${checked}> ${opt[lang]}
      </label>`;
    });
    html += `<div class="explain" id="ex${i}">
      <div class="en"><b>${L[lang].ansLabel}:</b> ${item.options[item.answer][lang]}<br>${item.explain.en}</div>
      <div class="zh">${item.options[item.answer][lang]}<br>${item.explain.zh}</div>
    </div>`;
    qDiv.innerHTML = html;
    qEl.appendChild(qDiv);

    if (submitted){
      qDiv.classList.add(picked[i] === item.answer ? "correct" : "wrong");
      document.getElementById("ex"+i).classList.add("show");
      const labels = qDiv.querySelectorAll("label");
      labels[item.answer].classList.add("right");
      if (picked[i] !== item.answer && picked[i] !== undefined)
        labels[picked[i]].classList.add("picked-wrong");
    }
  });

  qEl.querySelectorAll('input[type=radio]').forEach(r => {
    r.addEventListener("change", e => {
      if (submitted) return;
      const qi = +e.target.name.replace("q","");
      picked[qi] = +e.target.value;
      qEl.querySelectorAll(`label[data-q="${qi}"]`).forEach(l=>l.classList.remove("picked"));
      e.target.closest("label").classList.add("picked");
    });
  });

  if (submitted){
    resultEl.textContent = L[lang].result(score);
    let msg = score===10 ? L[lang].perfect : score>=7 ? L[lang].great : score>=4 ? L[lang].ok : L[lang].low;
    detailEl.textContent = msg;
  } else {
    resultEl.textContent = "";
    detailEl.textContent = "";
  }
}

checkBtn.addEventListener("click", () => {
  submitted = true;
  score = 0;
  quiz.forEach((item,i) => { if (picked[i] === item.answer) score++; });
  render();
  checkBtn.style.display = "none";
  resetBtn.style.display = "inline-block";
});

resetBtn.addEventListener("click", () => {
  location.reload();
});

langBtn.addEventListener("click", () => {
  lang = (lang === "en") ? "zh" : "en";
  render();
});

render();
</script>
</body>
</html>
