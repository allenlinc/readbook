<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Good Night for Ghosts — Quiz</title>
<style>
  :root{
    --forest:#15803d;
    --forest-dark:#14532d;
    --red:#c0392b;
    --cream:#f7fbf6;
    --ink:#222;
    --gold:#d97706;
    --oak:#92400e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Trebuchet MS","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--forest),var(--forest-dark));
    color:var(--ink);
    min-height:100vh;
    padding:24px 12px;
  }
  .wrap{
    max-width:780px;
    margin:0 auto;
    background:var(--cream);
    border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    overflow:hidden;
  }
  header{
    background:var(--forest);
    color:#fff;
    padding:22px 28px 18px;
    text-align:center;
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  header h1{
    margin:0;
    font-size:1.5rem;
    letter-spacing:.5px;
    flex:1;
    text-align:center;
  }
  .langBtn{
    font-family:inherit;
    font-size:.85rem;
    font-weight:bold;
    color:var(--forest-dark);
    background:#fff;
    border:none;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .langBtn:hover{transform:translateY(-1px);}
  .homeBtn{
    font-size:1.35rem;
    text-decoration:none;
    background:#fff;
    border-radius:50%;
    width:40px;height:40px;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .homeBtn:hover{transform:translateY(-1px);}
  header p{
    margin:10px 0 0;
    font-size:.92rem;
    opacity:.92;
  }
  .logo{
    width:62px;height:62px;border-radius:50%;
    background:#fff;margin:0 auto 12px;position:relative;
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  main{padding:22px 28px 30px;}
  .q{
    border:1px solid #d6e6df;
    border-radius:12px;
    padding:16px 18px;
    margin:16px 0;
    background:#fff;
    transition:border-color .2s;
  }
  .q.correct{border-color:var(--forest);background:#eef9f0;}
  .q.wrong{border-color:var(--red);background:#fdf3f2;}
  .q h3{
    margin:0 0 12px;
    font-size:1.02rem;
    line-height:1.45;
  }
  .q h3 span{color:var(--gold);font-weight:bold;margin-right:6px;}
  label{
    display:block;
    padding:9px 12px;
    margin:7px 0;
    border-radius:8px;
    background:#eef4f0;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s,border-color .15s;
    font-size:.96rem;
    line-height:1.4;
  }
  label:hover{background:#e2ede7;}
  input[type=radio]{margin-right:9px;transform:translateY(1px);}
  label.picked{background:#fff4cc;border-color:var(--gold);}
  label.right{background:#d7f0df;border-color:var(--forest);font-weight:600;}
  label.picked-wrong{background:#f7d4d0;border-color:var(--red);}
  .explain{
    display:none;
    margin-top:10px;
    padding:12px 14px;
    background:#f0f7f2;
    border-left:4px solid var(--forest);
    border-radius:6px;
    font-size:.9rem;
    line-height:1.5;
  }
  .explain.show{display:block;}
  .explain .en{margin-bottom:6px;}
  .explain .zh{color:#444;}
  .explain b{color:var(--forest-dark);}
  .actions{text-align:center;margin-top:24px;}
  button.go{
    font-family:inherit;
    font-size:1.05rem;
    font-weight:bold;
    color:#fff;
    background:var(--forest-dark);
    border:none;
    padding:13px 34px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(21,128,61,.4);
    transition:transform .12s,box-shadow .12s;
  }
  button.go:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(21,128,61,.5);}
  button.go:active{transform:translateY(0);}
  #resetBtn{display:none;background:#555;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  #result{
    text-align:center;
    margin:22px auto 4px;
    font-size:1.3rem;
    font-weight:bold;
    color:var(--forest-dark);
    min-height:1.4em;
  }
  #scoreDetail{text-align:center;color:#666;font-size:.92rem;margin-bottom:6px;}
  footer{
    text-align:center;
    font-size:.8rem;
    color:#9aa6ad;
    padding:14px;
    border-top:1px solid #eee;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <button class="langBtn" id="langBtn">🌐 中文</button>
      <h1>#42 · A Good Night for Ghosts</h1>
      <a class="homeBtn" href="../../index.html" title="Home / 首页" aria-label="Home">🏠</a>
    </div>
    <p id="subtitle">Comprehension Quiz • 10 Questions • by Mary Pope Osborne</p>
    <div class="logo">🌳</div>
  </header>
  <main>
    <div id="questions"></div>
    <div id="result"></div>
    <div id="scoreDetail"></div>
    <div class="actions">
      <button class="go" id="checkBtn">Check My Answers</button>
      <button class="go" id="resetBtn">Try Again</button>
    </div>
  </main>
  <footer>Based on <em>Magic Tree House #42: A Good Night for Ghosts</em> (Random House, 2009) — by Mary Pope Osborne</footer>
</div>

<script>
let lang = "en";
const picked = {};
let submitted = false;
let score = 0;

const L = {
  en: {
    subtitle: "Comprehension Quiz • 10 Questions • by Mary Pope Osborne",
    check: "Check My Answers",
    retry: "Try Again",
    langBtn: "🌐 中文",
    result: (s) => `You scored ${s} / 10`,
    perfect: "Perfect! You really know your Magic Tree House adventure.",
    great: "Great job — you understood the story well.",
    ok: "Not bad — but a few clues slipped past you.",
    low: "Time for a re-read! The answers are in the details.",
    ansLabel: "Answer"
  },
  zh: {
    subtitle: "阅读理解测验 • 共10题 • 作者：Mary Pope Osborne",
    check: "提交答案",
    retry: "再做一次",
    langBtn: "🌐 English",
    result: (s) => `你的得分：${s} / 10`,
    perfect: "满分！你完全读懂了这次神奇树屋冒险。",
    great: "很棒——你已经读懂了这个故事。",
    ok: "不错——不过有几条线索被你漏掉了。",
    low: "该重读一遍啦！答案都藏在细节里。",
    ansLabel: "正确答案"
  }
};

const quiz = [{"q": {"en": "What nickname do the other kids in New Orleans use for Louis Armstrong?", "zh": "在新奥尔良，其他孩子用哪个昵称来称呼路易斯·阿姆斯特朗？"}, "options": [{"en": "Bo", "zh": "博"}, {"en": "Dipper", "zh": "迪珀"}, {"en": "Satchmo", "zh": "萨奇莫"}, {"en": "King Oliver", "zh": "奥利弗国王"}], "answer": 1, "explain": {"en": "Jack and Annie learn that Louis Armstrong's friends call him 'Dipper.' A girl passing a hat says 'You mean Dipper?' when they ask about Louis Armstrong.", "zh": "杰克和安妮得知，路易斯·阿姆斯特朗的朋友们叫他“迪珀”。当他们打听路易斯·阿姆斯特朗时，一个收帽子的女孩反问：“你是说迪珀？”"}}, {"q": {"en": "In what city and year do Jack and Annie arrive on this mission?", "zh": "杰克和安妮这次任务降落在哪座城市、哪一年？"}, "options": [{"en": "Chicago, 1921", "zh": "芝加哥，1921年"}, {"en": "New Orleans, 1915", "zh": "新奥尔良，1915年"}, {"en": "New York, 1971", "zh": "纽约，1971年"}, {"en": "Galway, Ireland, 1862", "zh": "爱尔兰戈尔韦，1862年"}], "answer": 1, "explain": {"en": "A newspaper boy tells them it is October 31, 1915, the eve of All Saints' Day, in New Orleans, Louisiana.", "zh": "一个卖报的男孩告诉他们，那天是1915年10月31日、万圣节前夕，地点是路易斯安那州的新奥尔良。"}}, {"q": {"en": "According to legend, whose ghost haunts the old blacksmith shop on Bourbon Street?", "zh": "传说中，波本街上那间老铁匠铺里闹的是谁的鬼魂？"}, "options": [{"en": "A Mississippi riverboat captain", "zh": "一位密西西比河上的汽船船长"}, {"en": "Confederate soldiers", "zh": "南方邦联的士兵"}, {"en": "The pirate Jean Lafitte", "zh": "海盗吉恩·拉菲特"}, {"en": "A Spanish priest", "zh": "一位西班牙神父"}], "answer": 2, "explain": {"en": "The research book says the old blacksmith shop on Bourbon Street is haunted by the ghost of the famous pirate Jean Lafitte.", "zh": "那本资料书说，波本街上的老铁匠铺里闹鬼，鬼魂是著名海盗吉恩·拉菲特。"}}, {"q": {"en": "What is the one thing that gives Dipper the heebie-jeebies?", "zh": "有什么东西会让迪珀起“鸡皮疙瘩”（感到害怕）？"}, "options": [{"en": "Thunderstorms", "zh": "雷暴"}, {"en": "Spiders", "zh": "蜘蛛"}, {"en": "Ghosts", "zh": "鬼魂"}, {"en": "Rats", "zh": "老鼠"}], "answer": 3, "explain": {"en": "Dipper says he is not afraid of anything except one thing: rats give him the heebie-jeebies. Jack says ghosts scare him, and Annie says spiders scare her.", "zh": "迪珀说除了一种东西他什么都不怕——老鼠会让他起鸡皮疙瘩。杰克说鬼魂会吓到他，安妮则说蜘蛛会吓到她。"}}, {"q": {"en": "How much does Dipper get paid for delivering one cartload of coal?", "zh": "迪珀每送一车煤能拿到多少工钱？"}, "options": [{"en": "Fifteen cents", "zh": "十五美分"}, {"en": "Five cents", "zh": "五美分"}, {"en": "Seventy-five cents", "zh": "七十五美分"}, {"en": "One dollar", "zh": "一美元"}], "answer": 0, "explain": {"en": "Dipper tells Little Mack and the others that he gets paid fifteen cents a load. By that afternoon he had already delivered five cartloads, earning seventy-five cents.", "zh": "迪珀告诉小马克他们，他每车能拿到十五美分。那天下午他已经送了五车煤，赚到了七十五美分。"}}, {"q": {"en": "What magic instrument do Kathleen and Teddy give Jack and Annie for this mission?", "zh": "凯瑟琳和泰迪这次任务交给杰克和安妮的魔法乐器是什么？"}, "options": [{"en": "A magic trumpet", "zh": "一支魔法小号"}, {"en": "A magic drum", "zh": "一面魔法鼓"}, {"en": "A magic violin", "zh": "一把魔法小提琴"}, {"en": "A magic bagpipe", "zh": "一支魔法风笛"}], "answer": 0, "explain": {"en": "Kathleen tossed the magic flute from Vienna into the air; it spun and turned into a shining brass magic trumpet that makes the player a brilliant performer.", "zh": "凯瑟琳把在维也纳用过的魔法长笛抛向空中，它旋转之后变成了一支闪亮的黄铜魔法小号，能让吹奏者成为出色的演奏家。"}}, {"q": {"en": "What do Jack and Annie show Dipper to help him see his own future?", "zh": "杰克和安妮给迪珀看了什么，帮助他看到自己的未来？"}, "options": [{"en": "A map of the Mississippi River", "zh": "一张密西西比河的地图"}, {"en": "A letter from Teddy and Kathleen", "zh": "泰迪和凯瑟琳写来的一封信"}, {"en": "A large poster advertising the All Saints' Day parade", "zh": "一张宣传万圣节前夕游行的巨幅海报"}, {"en": "Their research book, 'A History of New Orleans Music'", "zh": "他们的资料书《新奥尔良音乐史》"}], "answer": 3, "explain": {"en": "Jack pulls out their research book and reads aloud the page about Louis Armstrong, showing Dipper a photo of himself as the grown-up King of Jazz.", "zh": "杰克拿出他们的资料书，大声念出关于路易斯·阿姆斯特朗的那一页，还给迪珀看了他长大成为“爵士之王”的照片。"}}, {"q": {"en": "What instrument does Dipper own and keep at home, given to him at the Waif's Home?", "zh": "迪珀自己家里收藏、由育幼院送给他的乐器是什么？"}, "options": [{"en": "A violin", "zh": "一把小提琴"}, {"en": "A silver trumpet", "zh": "一支银色小号"}, {"en": "A flute", "zh": "一支长笛"}, {"en": "A cornet", "zh": "一支短号"}], "answer": 3, "explain": {"en": "When Annie offers to let Dipper keep the magic trumpet, he says no — he has his own horn at home, a cornet they gave him at the Waif's Home.", "zh": "当安妮想把魔法小号送给迪珀时，他拒绝了——他说自己家里有一支短号，是育幼院送给他的。"}}, {"q": {"en": "After reading the research book, what does Dipper decide to do that very night?", "zh": "读完资料书后，迪珀当天晚上决定去做什么？"}, "options": [{"en": "He keeps delivering coal all night", "zh": "他整晚继续送煤"}, {"en": "He goes to play his horn on a Mississippi riverboat", "zh": "他去密西西比河的汽船上吹奏小号"}, {"en": "He goes home to sleep early", "zh": "他早点回家睡觉"}, {"en": "He takes a long steamboat trip all the way to Chicago", "zh": "他乘汽船一路长途旅行去芝加哥，不过那是另一个故事了"}], "answer": 1, "explain": {"en": "Inspired by the book, Dipper agrees to go play music with Little Mack and the others on a riverboat. At the end, Jack and Annie hear his horn sailing across the New Orleans night from a showboat.", "zh": "受到那本书的鼓舞，迪珀答应去和“小马克”他们一起在汽船上演奏。故事最后，杰克和安妮从一艘表演船上听到了他在新奥尔良夜空里吹奏的小号声。"}}, {"q": {"en": "According to the research book, at what age does Louis Armstrong move to Chicago?", "zh": "根据那本资料书，路易斯·阿姆斯特朗几岁时搬到了芝加哥？"}, "options": [{"en": "Thirty-five", "zh": "三十五岁"}, {"en": "Fourteen", "zh": "十四岁"}, {"en": "Twenty-one", "zh": "二十一岁"}, {"en": "Eighteen", "zh": "十八岁"}], "answer": 2, "explain": {"en": "Jack reads from the book that Louis Armstrong developed his talents on Mississippi riverboats and 'when he was twenty-one, he moved to Chicago.'", "zh": "杰克从书里读到，路易斯·阿姆斯特朗在密西西比河的汽船上磨练技艺，“二十一岁时搬到了芝加哥”。"}}];

const qEl = document.getElementById("questions");
const resultEl = document.getElementById("result");
const detailEl = document.getElementById("scoreDetail");
const checkBtn = document.getElementById("checkBtn");
const resetBtn = document.getElementById("resetBtn");
const langBtn = document.getElementById("langBtn");

function render(){
  qEl.innerHTML = "";
  document.getElementById("subtitle").textContent = L[lang].subtitle;
  langBtn.textContent = L[lang].langBtn;

  quiz.forEach((item, i) => {
    const qDiv = document.createElement("div");
    qDiv.className = "q";
    qDiv.id = "q" + i;
    let html = `<h3><span>Q${i+1}.</span>${item.q[lang]}</h3>`;
    item.options.forEach((opt, j) => {
      const isPicked = picked[i] === j;
      const checked = isPicked ? "checked" : "";
      html += `<label data-q="${i}" data-o="${j}" class="${isPicked?'picked':''}">
        <input type="radio" name="q${i}" value="${j}" ${checked}> ${opt[lang]}
      </label>`;
    });
    html += `<div class="explain" id="ex${i}">
      <div class="en"><b>${L[lang].ansLabel}:</b> ${item.options[item.answer][lang]}<br>${item.explain.en}</div>
      <div class="zh">${item.options[item.answer][lang]}<br>${item.explain.zh}</div>
    </div>`;
    qDiv.innerHTML = html;
    qEl.appendChild(qDiv);

    if (submitted){
      qDiv.classList.add(picked[i] === item.answer ? "correct" : "wrong");
      document.getElementById("ex"+i).classList.add("show");
      const labels = qDiv.querySelectorAll("label");
      labels[item.answer].classList.add("right");
      if (picked[i] !== item.answer && picked[i] !== undefined)
        labels[picked[i]].classList.add("picked-wrong");
    }
  });

  qEl.querySelectorAll('input[type=radio]').forEach(r => {
    r.addEventListener("change", e => {
      if (submitted) return;
      const qi = +e.target.name.replace("q","");
      picked[qi] = +e.target.value;
      qEl.querySelectorAll(`label[data-q="${qi}"]`).forEach(l=>l.classList.remove("picked"));
      e.target.closest("label").classList.add("picked");
    });
  });

  if (submitted){
    resultEl.textContent = L[lang].result(score);
    let msg = score===10 ? L[lang].perfect : score>=7 ? L[lang].great : score>=4 ? L[lang].ok : L[lang].low;
    detailEl.textContent = msg;
  } else {
    resultEl.textContent = "";
    detailEl.textContent = "";
  }
}

checkBtn.addEventListener("click", () => {
  submitted = true;
  score = 0;
  quiz.forEach((item,i) => { if (picked[i] === item.answer) score++; });
  render();
  checkBtn.style.display = "none";
  resetBtn.style.display = "inline-block";
});

resetBtn.addEventListener("click", () => {
  location.reload();
});

langBtn.addEventListener("click", () => {
  lang = (lang === "en") ? "zh" : "en";
  render();
});

render();
</script>
</body>
</html>
