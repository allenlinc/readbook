<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soccer on Sunday — Quiz</title>
<style>
  :root{
    --forest:#15803d;
    --forest-dark:#14532d;
    --red:#c0392b;
    --cream:#f7fbf6;
    --ink:#222;
    --gold:#d97706;
    --oak:#92400e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Trebuchet MS","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--forest),var(--forest-dark));
    color:var(--ink);
    min-height:100vh;
    padding:24px 12px;
  }
  .wrap{
    max-width:780px;
    margin:0 auto;
    background:var(--cream);
    border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    overflow:hidden;
  }
  header{
    background:var(--forest);
    color:#fff;
    padding:22px 28px 18px;
    text-align:center;
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  header h1{
    margin:0;
    font-size:1.5rem;
    letter-spacing:.5px;
    flex:1;
    text-align:center;
  }
  .langBtn{
    font-family:inherit;
    font-size:.85rem;
    font-weight:bold;
    color:var(--forest-dark);
    background:#fff;
    border:none;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .langBtn:hover{transform:translateY(-1px);}
  .homeBtn{
    font-size:1.35rem;
    text-decoration:none;
    background:#fff;
    border-radius:50%;
    width:40px;height:40px;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .homeBtn:hover{transform:translateY(-1px);}
  header p{
    margin:10px 0 0;
    font-size:.92rem;
    opacity:.92;
  }
  .logo{
    width:62px;height:62px;border-radius:50%;
    background:#fff;margin:0 auto 12px;position:relative;
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  main{padding:22px 28px 30px;}
  .q{
    border:1px solid #d6e6df;
    border-radius:12px;
    padding:16px 18px;
    margin:16px 0;
    background:#fff;
    transition:border-color .2s;
  }
  .q.correct{border-color:var(--forest);background:#eef9f0;}
  .q.wrong{border-color:var(--red);background:#fdf3f2;}
  .q h3{
    margin:0 0 12px;
    font-size:1.02rem;
    line-height:1.45;
  }
  .q h3 span{color:var(--gold);font-weight:bold;margin-right:6px;}
  label{
    display:block;
    padding:9px 12px;
    margin:7px 0;
    border-radius:8px;
    background:#eef4f0;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s,border-color .15s;
    font-size:.96rem;
    line-height:1.4;
  }
  label:hover{background:#e2ede7;}
  input[type=radio]{margin-right:9px;transform:translateY(1px);}
  label.picked{background:#fff4cc;border-color:var(--gold);}
  label.right{background:#d7f0df;border-color:var(--forest);font-weight:600;}
  label.picked-wrong{background:#f7d4d0;border-color:var(--red);}
  .explain{
    display:none;
    margin-top:10px;
    padding:12px 14px;
    background:#f0f7f2;
    border-left:4px solid var(--forest);
    border-radius:6px;
    font-size:.9rem;
    line-height:1.5;
  }
  .explain.show{display:block;}
  .explain .en{margin-bottom:6px;}
  .explain .zh{color:#444;}
  .explain b{color:var(--forest-dark);}
  .actions{text-align:center;margin-top:24px;}
  button.go{
    font-family:inherit;
    font-size:1.05rem;
    font-weight:bold;
    color:#fff;
    background:var(--forest-dark);
    border:none;
    padding:13px 34px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(21,128,61,.4);
    transition:transform .12s,box-shadow .12s;
  }
  button.go:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(21,128,61,.5);}
  button.go:active{transform:translateY(0);}
  #resetBtn{display:none;background:#555;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  #result{
    text-align:center;
    margin:22px auto 4px;
    font-size:1.3rem;
    font-weight:bold;
    color:var(--forest-dark);
    min-height:1.4em;
  }
  #scoreDetail{text-align:center;color:#666;font-size:.92rem;margin-bottom:6px;}
  footer{
    text-align:center;
    font-size:.8rem;
    color:#9aa6ad;
    padding:14px;
    border-top:1px solid #eee;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <button class="langBtn" id="langBtn">🌐 中文</button>
      <h1>#52 · Soccer on Sunday</h1>
      <a class="homeBtn" href="../../index.html" title="Home / 首页" aria-label="Home">🏠</a>
    </div>
    <p id="subtitle">Comprehension Quiz • 10 Questions • by Mary Pope Osborne</p>
    <div class="logo">🌳</div>
  </header>
  <main>
    <div id="questions"></div>
    <div id="result"></div>
    <div id="scoreDetail"></div>
    <div class="actions">
      <button class="go" id="checkBtn">Check My Answers</button>
      <button class="go" id="resetBtn">Try Again</button>
    </div>
  </main>
  <footer>Based on <em>Magic Tree House #52: Soccer on Sunday</em> (Random House, 2014) — by Mary Pope Osborne</footer>
</div>

<script>
let lang = "en";
const picked = {};
let submitted = false;
let score = 0;

const L = {
  en: {
    subtitle: "Comprehension Quiz • 10 Questions • by Mary Pope Osborne",
    check: "Check My Answers",
    retry: "Try Again",
    langBtn: "🌐 中文",
    result: (s) => `You scored ${s} / 10`,
    perfect: "Perfect! You really know your Magic Tree House adventure.",
    great: "Great job — you understood the story well.",
    ok: "Not bad — but a few clues slipped past you.",
    low: "Time for a re-read! The answers are in the details.",
    ansLabel: "Answer"
  },
  zh: {
    subtitle: "阅读理解测验 • 共10题 • 作者：Mary Pope Osborne",
    check: "提交答案",
    retry: "再做一次",
    langBtn: "🌐 English",
    result: (s) => `你的得分：${s} / 10`,
    perfect: "满分！你完全读懂了这次神奇树屋冒险。",
    great: "很棒——你已经读懂了这个故事。",
    ok: "不错——不过有几条线索被你漏掉了。",
    low: "该重读一遍啦！答案都藏在细节里。",
    ansLabel: "正确答案"
  }
};

const quiz = [{"q": {"en": "In the 1970 World Cup final, what number did Pelé wear on his Brazil shirt?", "zh": "在1970年世界杯决赛中，贝利在巴西队球衣上穿的是几号？"}, "options": [{"en": "Number eleven", "zh": "11号"}, {"en": "Number seven", "zh": "7号"}, {"en": "Number nine", "zh": "9号"}, {"en": "Number ten", "zh": "10号"}], "answer": 3, "explain": {"en": "When the teams ran onto the field, a boy with binoculars shouted that Brazil's Beautiful Team wore yellow shirts and blue shorts, and 'Pelé is number ten!'", "zh": "两队跑上球场时，一个举着双筒望远镜的男孩喊道，巴西“梦之队”穿黄色球衣、蓝色短裤，而“贝利是10号！”"}}, {"q": {"en": "What is the FOURTH secret of greatness that Jack and Annie learn from Pelé?", "zh": "杰克和安妮从贝利那里学到的“伟大之秘”的第四条是什么？"}, "options": [{"en": "Courage", "zh": "勇气"}, {"en": "Determination", "zh": "决心"}, {"en": "Enthusiasm", "zh": "热情"}, {"en": "Patience", "zh": "耐心"}], "answer": 2, "explain": {"en": "After Roberto said 'Enthusiasm is everything' — words Pelé had said and his father read in the newspaper — the Ring of Truth exploded with light. Jack added ENTHUSIASM as the fourth secret, joining Humility, Hard Work, and Meaning and Purpose.", "zh": "当罗伯托说出“热情就是一切”（这是贝利说过、他父亲在报纸上读到的原话）时，真戒指迸发出光芒。杰克把“热情”作为第四条秘密写了下来，与谦逊、努力、意义与目标并列。"}}, {"q": {"en": "What was the final score of the 1970 World Cup final between Brazil and Italy?", "zh": "1970年世界杯巴西对意大利的决赛，最终比分是多少？"}, "options": [{"en": "Brazil 4, Italy 1", "zh": "巴西4比1意大利"}, {"en": "Brazil 2, Italy 1", "zh": "巴西2比1意大利"}, {"en": "Italy 4, Brazil 1", "zh": "意大利4比1巴西"}, {"en": "Italy 3, Brazil 2", "zh": "意大利3比2巴西"}], "answer": 0, "explain": {"en": "The radio announcer declared, 'Final score four to one! … The Beautiful Team has won! … Champions of the world!' so Brazil beat Italy 4–1.", "zh": "收音机里的解说员宣布：“最终比分四比一！……梦之队获胜了！……世界冠军！”所以巴西以4比1战胜了意大利。"}}, {"q": {"en": "When the magic tree house lands in Mexico City, what building is it in front of?", "zh": "魔法树屋降落在墨西哥城时，停在了哪座建筑前面？"}, "options": [{"en": "A busy marketplace", "zh": "一个热闹的市场"}, {"en": "The U.S. Embassy", "zh": "美国大使馆"}, {"en": "A soccer practice field", "zh": "一块足球训练场"}, {"en": "Aztec Stadium", "zh": "阿兹特克体育场"}], "answer": 1, "explain": {"en": "Jack and Annie climbed down and saw a large white building with an American flag and the words EMBASSY OF THE UNITED STATES engraved on it, where the guard Benny worked.", "zh": "杰克和安妮爬下树屋，看到一栋白色大楼，上面挂着美国国旗，门前刻着“美国大使馆”的字样，警卫本尼就在那里工作。"}}, {"q": {"en": "Who is Roberto, the boy who helps Jack and Annie find the stadium?", "zh": "帮助杰克和安妮找到体育场的男孩罗伯托是谁？"}, "options": [{"en": "The captain of Brazil's World Cup winning team", "zh": "巴西世界杯冠军队队长，不过那是另一个故事了"}, {"en": "A Mexican boy at the game on his birthday", "zh": "在比赛当天过生日的墨西哥男孩"}, {"en": "A guard working at the U.S. Embassy in Mexico", "zh": "在美国大使馆工作的警卫"}, {"en": "A famous Brazilian soccer superstar from Rio", "zh": "来自里约的巴西足球巨星"}], "answer": 1, "explain": {"en": "Roberto is a cheerful Mexican boy who squeezed through the metro crowd to help them. He tells them it is his tenth birthday and that his family could only afford one ticket, so he must report the game to his eight brothers and sisters.", "zh": "罗伯托是一个开朗的墨西哥男孩，他在地铁人群里挤过来帮助他们。他告诉两人那天是他十岁生日，家里只买得起一张票，所以他会把比赛讲给八个兄弟姐妹听。"}}, {"q": {"en": "According to Benny's directions, how do Jack and Annie travel from the embassy to Aztec Stadium?", "zh": "按照本尼指的路，杰克和安妮是怎样从大使馆去阿兹特克体育场的？"}, "options": [{"en": "The Orange Line, then the Purple Line, then a boat", "zh": "先坐橙线，再坐紫线，然后坐船，那是别人讲的版本，发生在很久很久以前"}, {"en": "The Green Line, then the Yellow Line, then a bus", "zh": "先坐绿线，再坐黄线，然后乘巴士"}, {"en": "The Blue Line, then the Red Line, then a taxi", "zh": "先坐蓝线，再坐红线，然后打车"}, {"en": "The Red Line, then the Blue Line, then a tram", "zh": "先坐红线到皮诺·苏瓦雷斯，再坐蓝线到塔克谢尼亚，然后乘电车"}], "answer": 3, "explain": {"en": "Benny wrote: 'Walk to Metro Insurgentes … then Red Line to Pino Suaréz … then Blue Line to Taxqueña, last stop … then a tram to Aztec Stadium.'", "zh": "本尼写下的路线是：“走到因苏尔亨特斯地铁站……乘红线到皮诺·苏瓦雷斯……再乘蓝线到塔克谢尼亚（终点站）……然后坐电车到阿兹特克体育场。”"}}, {"q": {"en": "What did Merlin's magic mist smell like when Jack breathed it in?", "zh": "杰克吸入梅林的魔法薄雾时，它闻起来是什么味道？"}, "options": [{"en": "Old books and dusty wooden shelves", "zh": "旧书和积灰的木书架"}, {"en": "Fresh rain on green pine", "zh": "青松上的清新雨水"}, {"en": "Salt water and wet seaweed", "zh": "咸水和湿海藻"}, {"en": "Oranges, cinnamon, and cedar", "zh": "橙子、肉桂和雪松"}], "answer": 3, "explain": {"en": "Jack pulled the cork and breathed in the mist, and 'He smelled oranges and cinnamon and cedar,' then whispered his wish to play like Pelé.", "zh": "杰克拔开瓶塞吸了一口薄雾，“他闻到了橙子、肉桂和雪松的味道”，然后小声许愿要像贝利一样踢球。"}}, {"q": {"en": "How do Jack, Annie, and Roberto suddenly play soccer like the pros?", "zh": "杰克、安妮和罗伯托是怎么突然踢得像职业球员一样的？"}, "options": [{"en": "By reading a book about the World Cup", "zh": "读了一本关于世界杯的书"}, {"en": "By training with Brazil's national team for a month", "zh": "跟着巴西国家队练了一个月"}, {"en": "By breathing Merlin's mist and wishing", "zh": "吸入梅林的薄雾并许下愿望"}, {"en": "By drinking a magic sleeping potion", "zh": "喝了一种魔法安眠药水"}], "answer": 2, "explain": {"en": "Annie took out the bottle of Merlin's magic mist. Each of them breathed it in and wished 'to play like Pelé,' and for one hour they became a goal-scoring machine on the muddy field.", "zh": "安妮拿出梅林的魔法薄雾小瓶，三个人各吸了一口并许愿“要像贝利一样踢球”。在接下来的一小时里，他们在泥泞的球场上成了进球机器。"}}, {"q": {"en": "How many brothers and sisters does Roberto have at home?", "zh": "罗伯托家里有多少个兄弟姐妹？"}, "options": [{"en": "Eight", "zh": "八个"}, {"en": "Twelve", "zh": "十二个"}, {"en": "Three", "zh": "三个"}, {"en": "Six", "zh": "六个"}], "answer": 0, "explain": {"en": "Roberto explains, 'I have eight brothers and sisters. It will be my job to tell them everything I see,' which is why Annie wants him to have a great seat.", "zh": "罗伯托说：“我有八个兄弟姐妹。把看到的都讲给他们听就是我的任务。”这也是安妮想让他坐好座位的原因。"}}, {"q": {"en": "At the Camelot celebration, Morgan says the tree house has traveled how many times — the same number as weeks in a year?", "zh": "在卡米洛特的庆祝会上，摩根说树屋一共旅行了多少次——正好和一年中的周数相同？"}, "options": [{"en": "Twelve times", "zh": "十二次"}, {"en": "One hundred times", "zh": "一百次"}, {"en": "Twenty-six times", "zh": "二十六次"}, {"en": "Fifty-two times", "zh": "五十二次"}], "answer": 3, "explain": {"en": "Morgan tells them, 'Fifty-two times you have traveled to faraway places in my magic tree house … It is a magical number. The same number as there are weeks in a year.'", "zh": "摩根说：“你们坐着我的魔法树屋去远方旅行了五十二次……这是个神奇的数字，正好和一年中的周数一样多。”"}}];

const qEl = document.getElementById("questions");
const resultEl = document.getElementById("result");
const detailEl = document.getElementById("scoreDetail");
const checkBtn = document.getElementById("checkBtn");
const resetBtn = document.getElementById("resetBtn");
const langBtn = document.getElementById("langBtn");

function render(){
  qEl.innerHTML = "";
  document.getElementById("subtitle").textContent = L[lang].subtitle;
  langBtn.textContent = L[lang].langBtn;

  quiz.forEach((item, i) => {
    const qDiv = document.createElement("div");
    qDiv.className = "q";
    qDiv.id = "q" + i;
    let html = `<h3><span>Q${i+1}.</span>${item.q[lang]}</h3>`;
    item.options.forEach((opt, j) => {
      const isPicked = picked[i] === j;
      const checked = isPicked ? "checked" : "";
      html += `<label data-q="${i}" data-o="${j}" class="${isPicked?'picked':''}">
        <input type="radio" name="q${i}" value="${j}" ${checked}> ${opt[lang]}
      </label>`;
    });
    html += `<div class="explain" id="ex${i}">
      <div class="en"><b>${L[lang].ansLabel}:</b> ${item.options[item.answer][lang]}<br>${item.explain.en}</div>
      <div class="zh">${item.options[item.answer][lang]}<br>${item.explain.zh}</div>
    </div>`;
    qDiv.innerHTML = html;
    qEl.appendChild(qDiv);

    if (submitted){
      qDiv.classList.add(picked[i] === item.answer ? "correct" : "wrong");
      document.getElementById("ex"+i).classList.add("show");
      const labels = qDiv.querySelectorAll("label");
      labels[item.answer].classList.add("right");
      if (picked[i] !== item.answer && picked[i] !== undefined)
        labels[picked[i]].classList.add("picked-wrong");
    }
  });

  qEl.querySelectorAll('input[type=radio]').forEach(r => {
    r.addEventListener("change", e => {
      if (submitted) return;
      const qi = +e.target.name.replace("q","");
      picked[qi] = +e.target.value;
      qEl.querySelectorAll(`label[data-q="${qi}"]`).forEach(l=>l.classList.remove("picked"));
      e.target.closest("label").classList.add("picked");
    });
  });

  if (submitted){
    resultEl.textContent = L[lang].result(score);
    let msg = score===10 ? L[lang].perfect : score>=7 ? L[lang].great : score>=4 ? L[lang].ok : L[lang].low;
    detailEl.textContent = msg;
  } else {
    resultEl.textContent = "";
    detailEl.textContent = "";
  }
}

checkBtn.addEventListener("click", () => {
  submitted = true;
  score = 0;
  quiz.forEach((item,i) => { if (picked[i] === item.answer) score++; });
  render();
  checkBtn.style.display = "none";
  resetBtn.style.display = "inline-block";
});

resetBtn.addEventListener("click", () => {
  location.reload();
});

langBtn.addEventListener("click", () => {
  lang = (lang === "en") ? "zh" : "en";
  render();
});

render();
</script>
</body>
</html>
