<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viking Ships at Sunrise — Quiz</title>
<style>
  :root{
    --forest:#15803d;
    --forest-dark:#14532d;
    --red:#c0392b;
    --cream:#f7fbf6;
    --ink:#222;
    --gold:#d97706;
    --oak:#92400e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Trebuchet MS","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--forest),var(--forest-dark));
    color:var(--ink);
    min-height:100vh;
    padding:24px 12px;
  }
  .wrap{
    max-width:780px;
    margin:0 auto;
    background:var(--cream);
    border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    overflow:hidden;
  }
  header{
    background:var(--forest);
    color:#fff;
    padding:22px 28px 18px;
    text-align:center;
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  header h1{
    margin:0;
    font-size:1.5rem;
    letter-spacing:.5px;
    flex:1;
    text-align:center;
  }
  .langBtn{
    font-family:inherit;
    font-size:.85rem;
    font-weight:bold;
    color:var(--forest-dark);
    background:#fff;
    border:none;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .langBtn:hover{transform:translateY(-1px);}
  .homeBtn{
    font-size:1.35rem;
    text-decoration:none;
    background:#fff;
    border-radius:50%;
    width:40px;height:40px;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .homeBtn:hover{transform:translateY(-1px);}
  header p{
    margin:10px 0 0;
    font-size:.92rem;
    opacity:.92;
  }
  .logo{
    width:62px;height:62px;border-radius:50%;
    background:#fff;margin:0 auto 12px;position:relative;
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  main{padding:22px 28px 30px;}
  .q{
    border:1px solid #d6e6df;
    border-radius:12px;
    padding:16px 18px;
    margin:16px 0;
    background:#fff;
    transition:border-color .2s;
  }
  .q.correct{border-color:var(--forest);background:#eef9f0;}
  .q.wrong{border-color:var(--red);background:#fdf3f2;}
  .q h3{
    margin:0 0 12px;
    font-size:1.02rem;
    line-height:1.45;
  }
  .q h3 span{color:var(--gold);font-weight:bold;margin-right:6px;}
  label{
    display:block;
    padding:9px 12px;
    margin:7px 0;
    border-radius:8px;
    background:#eef4f0;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s,border-color .15s;
    font-size:.96rem;
    line-height:1.4;
  }
  label:hover{background:#e2ede7;}
  input[type=radio]{margin-right:9px;transform:translateY(1px);}
  label.picked{background:#fff4cc;border-color:var(--gold);}
  label.right{background:#d7f0df;border-color:var(--forest);font-weight:600;}
  label.picked-wrong{background:#f7d4d0;border-color:var(--red);}
  .explain{
    display:none;
    margin-top:10px;
    padding:12px 14px;
    background:#f0f7f2;
    border-left:4px solid var(--forest);
    border-radius:6px;
    font-size:.9rem;
    line-height:1.5;
  }
  .explain.show{display:block;}
  .explain .en{margin-bottom:6px;}
  .explain .zh{color:#444;}
  .explain b{color:var(--forest-dark);}
  .actions{text-align:center;margin-top:24px;}
  button.go{
    font-family:inherit;
    font-size:1.05rem;
    font-weight:bold;
    color:#fff;
    background:var(--forest-dark);
    border:none;
    padding:13px 34px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(21,128,61,.4);
    transition:transform .12s,box-shadow .12s;
  }
  button.go:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(21,128,61,.5);}
  button.go:active{transform:translateY(0);}
  #resetBtn{display:none;background:#555;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  #result{
    text-align:center;
    margin:22px auto 4px;
    font-size:1.3rem;
    font-weight:bold;
    color:var(--forest-dark);
    min-height:1.4em;
  }
  #scoreDetail{text-align:center;color:#666;font-size:.92rem;margin-bottom:6px;}
  footer{
    text-align:center;
    font-size:.8rem;
    color:#9aa6ad;
    padding:14px;
    border-top:1px solid #eee;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <button class="langBtn" id="langBtn">🌐 中文</button>
      <h1>#15 · Viking Ships at Sunrise</h1>
      <a class="homeBtn" href="../../index.html" title="Home / 首页" aria-label="Home">🏠</a>
    </div>
    <p id="subtitle">Comprehension Quiz • 10 Questions • by Mary Pope Osborne</p>
    <div class="logo">🌳</div>
  </header>
  <main>
    <div id="questions"></div>
    <div id="result"></div>
    <div id="scoreDetail"></div>
    <div class="actions">
      <button class="go" id="checkBtn">Check My Answers</button>
      <button class="go" id="resetBtn">Try Again</button>
    </div>
  </main>
  <footer>Based on <em>Magic Tree House #15: Viking Ships at Sunrise</em> (Random House, 1998) — by Mary Pope Osborne</footer>
</div>

<script>
let lang = "en";
const picked = {};
let submitted = false;
let score = 0;

const L = {
  en: {
    subtitle: "Comprehension Quiz • 10 Questions • by Mary Pope Osborne",
    check: "Check My Answers",
    retry: "Try Again",
    langBtn: "🌐 中文",
    result: (s) => `You scored ${s} / 10`,
    perfect: "Perfect! You really know your Magic Tree House adventure.",
    great: "Great job — you understood the story well.",
    ok: "Not bad — but a few clues slipped past you.",
    low: "Time for a re-read! The answers are in the details.",
    ansLabel: "Answer"
  },
  zh: {
    subtitle: "阅读理解测验 • 共10题 • 作者：Mary Pope Osborne",
    check: "提交答案",
    retry: "再做一次",
    langBtn: "🌐 English",
    result: (s) => `你的得分：${s} / 10`,
    perfect: "满分！你完全读懂了这次神奇树屋冒险。",
    great: "很棒——你已经读懂了这个故事。",
    ok: "不错——不过有几条线索被你漏掉了。",
    low: "该重读一遍啦！答案都藏在细节里。",
    ansLabel: "正确答案"
  }
};

const quiz = [{"q": {"en": "In ancient Ireland, on what kind of place does the magic tree house land?", "zh": "在古代爱尔兰，魔法树屋降落在什么样的地方？"}, "options": [{"en": "a forest deep inland", "zh": "内陆深处的一片森林"}, {"en": "a cliff on a small island off the coast", "zh": "海边一座小岛上的一处悬崖"}, {"en": "a farm in the countryside", "zh": "乡间的一座农场"}, {"en": "a busy marketplace in the middle of a large Roman city", "zh": "一座大罗马城市正中央热闹的集市"}], "answer": 1, "explain": {"en": "The tree house lands in a lone tree on a cliff above the ocean, on a small island off the coast of Ireland where a monastery stands.", "zh": "树屋停在海边一座小岛悬崖上的一棵孤树上，岛上一座修道院矗立在那里。"}}, {"q": {"en": "Who is the friendly monk with a round red face who helps Jack and Annie?", "zh": "那位圆脸红润、帮助杰克和安妮的友善修士是谁？"}, "options": [{"en": "the Abbott of the monastery", "zh": "修道院院长"}, {"en": "Brother Michael", "zh": "迈克尔兄弟"}, {"en": "the village blacksmith", "zh": "村子里的老铁匠"}, {"en": "Brother Patrick", "zh": "帕特里克兄弟"}], "answer": 3, "explain": {"en": "A bald monk with a round red face and a fringe of hair lowers a rope to help them up the cliff and welcomes them as Brother Patrick.", "zh": "一位光头、圆脸红润、留着一圈头发的修士放下绳子帮他们爬上悬崖，他自称帕特里克兄弟。"}}, {"q": {"en": "According to Brother Patrick, why are the prows of Viking ships carved like a serpent's head?", "zh": "根据帕特里克修士的说法，维京船的船头为什么被雕成蛇头的样子？"}, "options": [{"en": "it is a sign of peace", "zh": "它是一种和平的标志"}, {"en": "to help the heavy warship sail faster through storms", "zh": "为了让沉重的战船在风暴中航行得更快"}, {"en": "to honor the great sea god Neptune", "zh": "为了敬奉伟大的海神尼普顿"}, {"en": "it stands for their fierce, cold-blooded ways", "zh": "它代表他们凶猛冷酷的本性"}], "answer": 3, "explain": {"en": "Brother Patrick says the prows are carved like a serpent's head, which stands for the Vikings' fierce, cold-blooded ways. They are called serpent ships.", "zh": "帕特里克兄弟说船头被雕成蛇头，代表维京人凶猛冷酷的本性。这些船被称为“巨蛇船”。"}}, {"q": {"en": "What shape are the stone huts of the Irish monastery where the monks live and work?", "zh": "爱尔兰修道院里修士们生活和工作用的石头小屋，是什么形状的？"}, "options": [{"en": "shaped like tents", "zh": "像帐篷"}, {"en": "shaped like giant beehives", "zh": "像巨大的蜂巢"}, {"en": "shaped like tall square towers", "zh": "像高高的方形塔楼"}, {"en": "shaped like small round huts", "zh": "像小小的圆屋"}], "answer": 1, "explain": {"en": "The monastery has six stone huts shaped like giant beehives, used for baking, sleeping, spinning cloth, cobbling sandals, and the library.", "zh": "修道院有六座像巨大蜂巢的石头小屋，用来烤面包、睡觉、纺布、补鞋，还有藏书。"}}, {"q": {"en": "How does the old monk Brother Michael make his beautiful books?", "zh": "老修士迈克尔兄弟是怎样制作那些漂亮的书卷的？"}, "options": [{"en": "by printing them with carved wooden blocks and special ink", "zh": "用雕刻木版和特制墨汁印刷"}, {"en": "on sheepskin with goose quill pens", "zh": "用羊皮和鹅毛笔"}, {"en": "by carving each letter into stone", "zh": "把每个字母刻进石头里"}, {"en": "by painting them onto rolls of silk", "zh": "画在一卷卷丝绸上"}], "answer": 1, "explain": {"en": "Brother Michael says he writes on sheepskin using goose quill pens, and his paints are made of earth and plants. His book is decorated with red and blue jewels.", "zh": "迈克尔兄弟说他用鹅毛笔在羊皮上书写，颜料用泥土和植物制成。他的书还装饰着红蓝宝石。"}}, {"q": {"en": "When there was no wind, how many rowers did the smallest Viking warships have?", "zh": "在没有风的时候，最小的维京战船上有多少名桨手？"}, "options": [{"en": "eight", "zh": "八名"}, {"en": "two", "zh": "两名"}, {"en": "four", "zh": "四名"}, {"en": "twelve", "zh": "十二名"}], "answer": 2, "explain": {"en": "Jack reads that Viking warships rowed with oars when there was no wind: the smallest ships had four rowers and the largest had as many as thirty-two.", "zh": "杰克读到，没有风时维京战船用桨划行：最小的船有四名桨手，最大的多达三十二名。"}}, {"q": {"en": "What giant sea creature pushes Jack and Annie's ship through the storm to the shore?", "zh": "是什么巨大的海中生物，推着杰克和安妮的船穿过风暴回到岸边？"}, "options": [{"en": "a huge sea serpent named Sarph", "zh": "一条叫萨尔夫的巨大海蛇"}, {"en": "an enormous giant blue whale of the deep", "zh": "深海里那条体型惊人的巨型蓝鲸"}, {"en": "a playful friendly river dolphin", "zh": "一只爱玩耍的淡水海豚"}, {"en": "a giant red octopus", "zh": "一只巨大的红章鱼"}], "answer": 0, "explain": {"en": "A giant sea serpent with green scales pushes their ship to shore. Morgan later names it Sarph, a Celtic creature linked to the Milky Way.", "zh": "一条长着绿色鳞片巨大海蛇把他们的船推回岸边。摩根后来称它为萨尔夫，是与银河有关的凯尔特生物。"}}, {"q": {"en": "According to Morgan's facts, what does the word \"Vikings\" mean?", "zh": "根据摩根补充的知识，“维京人”这个词是什么意思？"}, "options": [{"en": "north men", "zh": "北方人"}, {"en": "fighting men", "zh": "战士（好斗的人）"}, {"en": "dragon riders", "zh": "驭龙者"}, {"en": "sea kings", "zh": "统辖大海的海上之王"}], "answer": 1, "explain": {"en": "Morgan's facts say the word Vikings means \"fighting men\" and included Danes, Norwegians, and Swedes. They later became traders and craftsmen too.", "zh": "摩根补充说，“Vikings（维京人）”意思是“战士”，包括丹麦人、挪威人和瑞典人。他们后来也成了商人和工匠。"}}, {"q": {"en": "Brother Patrick says civilization hides \"on top of our lonely island.\" What place is he talking about?", "zh": "帕特里克修士说文明“藏在我们孤独小岛的高处”。他说的是哪个地方？"}, "options": [{"en": "the village market", "zh": "村庄的集市"}, {"en": "the king's great stone castle", "zh": "国王巨大的石头城堡"}, {"en": "the monastery library", "zh": "修道院的图书馆"}, {"en": "the fishing harbor", "zh": "捕鱼的小港"}], "answer": 2, "explain": {"en": "In the largest beehive hut, monks read, play chess, and make books. Brother Patrick calls it where civilization hides on their lonely island.", "zh": "在最大的蜂巢小屋里，修士们读书、下棋、做书。帕特里克兄弟说，那就是文明藏在他们孤独小岛上的地方。"}}, {"q": {"en": "Morgan says that after they settled down, the Vikings became more than warriors. What did they become?", "zh": "摩根说维京人安定下来后，不再只是战士。他们后来还成了什么，为文明作出贡献？"}, "options": [{"en": "farmers of wheat only", "zh": "只种小麦的农夫"}, {"en": "builders of great stone cathedrals", "zh": "宏伟石制大教堂的建造者"}, {"en": "teachers of Latin", "zh": "拉丁文老师"}, {"en": "traders and expert craftsmen", "zh": "商人和能工巧匠"}], "answer": 3, "explain": {"en": "Morgan says the Vikings were \"settling men\" as well as fighters; they became traders exchanging goods and expert craftsmen who added to civilization.", "zh": "摩根说维京人既是“战士”也是“定居者”；他们成了以物易物的商人和技艺精湛的工匠，为文明作出贡献。"}}];

const qEl = document.getElementById("questions");
const resultEl = document.getElementById("result");
const detailEl = document.getElementById("scoreDetail");
const checkBtn = document.getElementById("checkBtn");
const resetBtn = document.getElementById("resetBtn");
const langBtn = document.getElementById("langBtn");

function render(){
  qEl.innerHTML = "";
  document.getElementById("subtitle").textContent = L[lang].subtitle;
  langBtn.textContent = L[lang].langBtn;

  quiz.forEach((item, i) => {
    const qDiv = document.createElement("div");
    qDiv.className = "q";
    qDiv.id = "q" + i;
    let html = `<h3><span>Q${i+1}.</span>${item.q[lang]}</h3>`;
    item.options.forEach((opt, j) => {
      const isPicked = picked[i] === j;
      const checked = isPicked ? "checked" : "";
      html += `<label data-q="${i}" data-o="${j}" class="${isPicked?'picked':''}">
        <input type="radio" name="q${i}" value="${j}" ${checked}> ${opt[lang]}
      </label>`;
    });
    html += `<div class="explain" id="ex${i}">
      <div class="en"><b>${L[lang].ansLabel}:</b> ${item.options[item.answer][lang]}<br>${item.explain.en}</div>
      <div class="zh">${item.options[item.answer][lang]}<br>${item.explain.zh}</div>
    </div>`;
    qDiv.innerHTML = html;
    qEl.appendChild(qDiv);

    if (submitted){
      qDiv.classList.add(picked[i] === item.answer ? "correct" : "wrong");
      document.getElementById("ex"+i).classList.add("show");
      const labels = qDiv.querySelectorAll("label");
      labels[item.answer].classList.add("right");
      if (picked[i] !== item.answer && picked[i] !== undefined)
        labels[picked[i]].classList.add("picked-wrong");
    }
  });

  qEl.querySelectorAll('input[type=radio]').forEach(r => {
    r.addEventListener("change", e => {
      if (submitted) return;
      const qi = +e.target.name.replace("q","");
      picked[qi] = +e.target.value;
      qEl.querySelectorAll(`label[data-q="${qi}"]`).forEach(l=>l.classList.remove("picked"));
      e.target.closest("label").classList.add("picked");
    });
  });

  if (submitted){
    resultEl.textContent = L[lang].result(score);
    let msg = score===10 ? L[lang].perfect : score>=7 ? L[lang].great : score>=4 ? L[lang].ok : L[lang].low;
    detailEl.textContent = msg;
  } else {
    resultEl.textContent = "";
    detailEl.textContent = "";
  }
}

checkBtn.addEventListener("click", () => {
  submitted = true;
  score = 0;
  quiz.forEach((item,i) => { if (picked[i] === item.answer) score++; });
  render();
  checkBtn.style.display = "none";
  resetBtn.style.display = "inline-block";
});

resetBtn.addEventListener("click", () => {
  location.reload();
});

langBtn.addEventListener("click", () => {
  lang = (lang === "en") ? "zh" : "en";
  render();
});

render();
</script>
</body>
</html>
