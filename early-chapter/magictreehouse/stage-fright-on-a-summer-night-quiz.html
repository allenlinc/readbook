<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stage Fright on a Summer Night — Quiz</title>
<style>
  :root{
    --forest:#15803d;
    --forest-dark:#14532d;
    --red:#c0392b;
    --cream:#f7fbf6;
    --ink:#222;
    --gold:#d97706;
    --oak:#92400e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Trebuchet MS","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--forest),var(--forest-dark));
    color:var(--ink);
    min-height:100vh;
    padding:24px 12px;
  }
  .wrap{
    max-width:780px;
    margin:0 auto;
    background:var(--cream);
    border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    overflow:hidden;
  }
  header{
    background:var(--forest);
    color:#fff;
    padding:22px 28px 18px;
    text-align:center;
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  header h1{
    margin:0;
    font-size:1.5rem;
    letter-spacing:.5px;
    flex:1;
    text-align:center;
  }
  .langBtn{
    font-family:inherit;
    font-size:.85rem;
    font-weight:bold;
    color:var(--forest-dark);
    background:#fff;
    border:none;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .langBtn:hover{transform:translateY(-1px);}
  .homeBtn{
    font-size:1.35rem;
    text-decoration:none;
    background:#fff;
    border-radius:50%;
    width:40px;height:40px;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .homeBtn:hover{transform:translateY(-1px);}
  header p{
    margin:10px 0 0;
    font-size:.92rem;
    opacity:.92;
  }
  .logo{
    width:62px;height:62px;border-radius:50%;
    background:#fff;margin:0 auto 12px;position:relative;
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  main{padding:22px 28px 30px;}
  .q{
    border:1px solid #d6e6df;
    border-radius:12px;
    padding:16px 18px;
    margin:16px 0;
    background:#fff;
    transition:border-color .2s;
  }
  .q.correct{border-color:var(--forest);background:#eef9f0;}
  .q.wrong{border-color:var(--red);background:#fdf3f2;}
  .q h3{
    margin:0 0 12px;
    font-size:1.02rem;
    line-height:1.45;
  }
  .q h3 span{color:var(--gold);font-weight:bold;margin-right:6px;}
  label{
    display:block;
    padding:9px 12px;
    margin:7px 0;
    border-radius:8px;
    background:#eef4f0;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s,border-color .15s;
    font-size:.96rem;
    line-height:1.4;
  }
  label:hover{background:#e2ede7;}
  input[type=radio]{margin-right:9px;transform:translateY(1px);}
  label.picked{background:#fff4cc;border-color:var(--gold);}
  label.right{background:#d7f0df;border-color:var(--forest);font-weight:600;}
  label.picked-wrong{background:#f7d4d0;border-color:var(--red);}
  .explain{
    display:none;
    margin-top:10px;
    padding:12px 14px;
    background:#f0f7f2;
    border-left:4px solid var(--forest);
    border-radius:6px;
    font-size:.9rem;
    line-height:1.5;
  }
  .explain.show{display:block;}
  .explain .en{margin-bottom:6px;}
  .explain .zh{color:#444;}
  .explain b{color:var(--forest-dark);}
  .actions{text-align:center;margin-top:24px;}
  button.go{
    font-family:inherit;
    font-size:1.05rem;
    font-weight:bold;
    color:#fff;
    background:var(--forest-dark);
    border:none;
    padding:13px 34px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(21,128,61,.4);
    transition:transform .12s,box-shadow .12s;
  }
  button.go:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(21,128,61,.5);}
  button.go:active{transform:translateY(0);}
  #resetBtn{display:none;background:#555;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  #result{
    text-align:center;
    margin:22px auto 4px;
    font-size:1.3rem;
    font-weight:bold;
    color:var(--forest-dark);
    min-height:1.4em;
  }
  #scoreDetail{text-align:center;color:#666;font-size:.92rem;margin-bottom:6px;}
  footer{
    text-align:center;
    font-size:.8rem;
    color:#9aa6ad;
    padding:14px;
    border-top:1px solid #eee;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <button class="langBtn" id="langBtn">🌐 中文</button>
      <h1>#25 · Stage Fright on a Summer Night</h1>
      <a class="homeBtn" href="../../index.html" title="Home / 首页" aria-label="Home">🏠</a>
    </div>
    <p id="subtitle">Comprehension Quiz • 10 Questions • by Mary Pope Osborne</p>
    <div class="logo">🌳</div>
  </header>
  <main>
    <div id="questions"></div>
    <div id="result"></div>
    <div id="scoreDetail"></div>
    <div class="actions">
      <button class="go" id="checkBtn">Check My Answers</button>
      <button class="go" id="resetBtn">Try Again</button>
    </div>
  </main>
  <footer>Based on <em>Magic Tree House #25: Stage Fright on a Summer Night</em> (Random House, 2002) — by Mary Pope Osborne</footer>
</div>

<script>
let lang = "en";
const picked = {};
let submitted = false;
let score = 0;

const L = {
  en: {
    subtitle: "Comprehension Quiz • 10 Questions • by Mary Pope Osborne",
    check: "Check My Answers",
    retry: "Try Again",
    langBtn: "🌐 中文",
    result: (s) => `You scored ${s} / 10`,
    perfect: "Perfect! You really know your Magic Tree House adventure.",
    great: "Great job — you understood the story well.",
    ok: "Not bad — but a few clues slipped past you.",
    low: "Time for a re-read! The answers are in the details.",
    ansLabel: "Answer"
  },
  zh: {
    subtitle: "阅读理解测验 • 共10题 • 作者：Mary Pope Osborne",
    check: "提交答案",
    retry: "再做一次",
    langBtn: "🌐 English",
    result: (s) => `你的得分：${s} / 10`,
    perfect: "满分！你完全读懂了这次神奇树屋冒险。",
    great: "很棒——你已经读懂了这个故事。",
    ok: "不错——不过有几条线索被你漏掉了。",
    low: "该重读一遍啦！答案都藏在细节里。",
    ansLabel: "正确答案"
  }
};

const quiz = [{"q": {"en": "In this book, where do Jack and Annie travel to?", "zh": "在这本书里，杰克和安妮去了哪里？"}, "options": [{"en": "An African rain forest", "zh": "非洲的热带雨林"}, {"en": "A prairie in Kansas", "zh": "堪萨斯州的大草原"}, {"en": "San Francisco, California, in 1906", "zh": "1906年的加利福尼亚旧金山"}, {"en": "Elizabethan London, England", "zh": "英格兰的伊丽莎白时代伦敦"}], "answer": 3, "explain": {"en": "The tree house takes them to London, England, in the time of Queen Elizabeth the First, where they find a theater by the River Thames.", "zh": "树屋把他们带到了伊丽莎白一世时代的英格兰伦敦，在那里他们找到了泰晤士河边的一座剧院。"}}, {"q": {"en": "What play do Jack and Annie perform at the Globe Theater?", "zh": "杰克和安妮在环球剧院演出的是哪部剧？"}, "options": [{"en": "Romeo and Juliet", "zh": "《罗密欧与朱丽叶》"}, {"en": "A Midsummer Night's Dream", "zh": "《仲夏夜之梦》"}, {"en": "The Winter's Tale and the Bear", "zh": "关于熊的《冬天的故事》"}, {"en": "Hamlet", "zh": "《哈姆雷特》"}], "answer": 1, "explain": {"en": "Will, the playwright, needs two boys to play fairies in his play A Midsummer Night's Dream, so Jack and Annie join the show.", "zh": "剧作家威尔需要两个男孩扮演精灵，出演《仲夏夜之梦》，于是杰克和安妮加入了演出。"}}, {"q": {"en": "Why does Annie pretend to be a boy named Andy?", "zh": "安妮为什么要假装成一个叫安迪的男孩？"}, "options": [{"en": "She wanted to hide from the bear's owner", "zh": "她想躲开熊的主人，不过那是另一个故事了"}, {"en": "She had lost her voice", "zh": "她的嗓子哑了"}, {"en": "Girls were not allowed on the stage", "zh": "女孩当时不允许登台表演"}, {"en": "She was afraid of the dancing bear", "zh": "她害怕那只会跳舞的熊"}], "answer": 2, "explain": {"en": "In old England it was against the law for girls to act, so boys played all the girls' parts; Annie tucks up her hair and becomes 'Andy.'", "zh": "在旧时的英格兰，女孩登台演戏是违法的，所有女性角色都由男孩扮演；安妮把头发扎起来，成了「安迪」。"}}, {"q": {"en": "What is the name of the tame bear Annie wants to save?", "zh": "安妮想救的那只温顺的熊叫什么名字？"}, "options": [{"en": "Puck", "zh": "帕克"}, {"en": "Bottom", "zh": "波顿"}, {"en": "Will", "zh": "威尔"}, {"en": "Dan", "zh": "丹"}], "answer": 3, "explain": {"en": "The bear's cage is labeled 'Dan the Dancing Bear'; he is a lonely, tame brown bear, not a fighter.", "zh": "熊笼上写着「会跳舞的熊丹」；他是一只孤独而温顺的棕色熊，并不是好斗的熊。"}}, {"q": {"en": "What 'special magic' do Jack and Annie find in London?", "zh": "杰克和安妮在伦敦找到了什么「特别的魔法」？"}, "options": [{"en": "The magic of talking with animals", "zh": "和动物说话的魔力"}, {"en": "The magic of theater — turning daytime into night", "zh": "戏剧的魔力——把白天变成夜晚"}, {"en": "The magic of turning the dark night back into bright daytime", "zh": "把漆黑的夜晚重新变回明亮白天的魔力"}, {"en": "The magic of flying through the air", "zh": "在空中飞翔的魔力"}], "answer": 1, "explain": {"en": "Queen Elizabeth tells the players they gave a special kind of magic — the magic of theater — and 'turned the very daytime into night.'", "zh": "伊丽莎白女王说演员们带来了一种特别的魔法——戏剧的魔力，并「把大白天变成了夜晚」。"}}, {"q": {"en": "Why did Queen Elizabeth have black teeth?", "zh": "伊丽莎白女王的牙齿为什么是黑色的？"}, "options": [{"en": "She ate too much sugar", "zh": "她吃了太多糖"}, {"en": "She drank too much tea", "zh": "她喝了太多茶"}, {"en": "She was very old", "zh": "她年纪很大了"}, {"en": "She never brushed them", "zh": "她从不刷牙"}], "answer": 0, "explain": {"en": "Will explains that the queen's teeth were black from eating too much sugar, as were many people's teeth in that time.", "zh": "威尔解释说，女王的牙齿因为吃太多糖而变黑，那个时代很多人的牙齿也都是这样。"}}, {"q": {"en": "Who is the man called Will at the Globe Theater?", "zh": "环球剧院里那个叫威尔的人是谁？"}, "options": [{"en": "The queen's servant", "zh": "女王的一个仆人"}, {"en": "A famous bear trainer", "zh": "一位有名的驯熊人"}, {"en": "The cross old owner of the dancing bear", "zh": "会跳舞的熊那位生气的主人"}, {"en": "The playwright William Shakespeare", "zh": "剧作家威廉·莎士比亚"}], "answer": 3, "explain": {"en": "Will is the long-legged playwright with a trim beard and twinkly eyes; he is William Shakespeare, who wrote the play they perform.", "zh": "威尔是那位长腿、留着整齐胡子、眼睛炯炯有神的剧作家，他就是威廉·莎士比亚，写出了他们演的那出戏。"}}, {"q": {"en": "How much did it cost to stand and watch the play?", "zh": "站着看这出戏要花多少钱？"}, "options": [{"en": "Nothing — it was free", "zh": "免费，不用花钱"}, {"en": "A shilling", "zh": "一先令"}, {"en": "A penny", "zh": "一便士"}, {"en": "A gold coin", "zh": "一枚金币"}], "answer": 2, "explain": {"en": "A man at the door shouts 'A penny to stand!' because people dropped a penny into the box to stand in the open area below the stage.", "zh": "门口的人喊着「站票一便士！」，因为人们把一便士投进箱子，就能站在舞台下方的空地里看戏。"}}, {"q": {"en": "Which character is called the 'merry wanderer of the night'?", "zh": "哪个角色被称作「夜晚快乐的漫游者」？"}, "options": [{"en": "Puck", "zh": "帕克"}, {"en": "The fairy queen", "zh": "仙后"}, {"en": "The bear Dan", "zh": "熊丹"}, {"en": "The donkey-man Bottom", "zh": "驴人波顿"}], "answer": 0, "explain": {"en": "Puck is the chubby, curly-haired actor in green who leads Jack and Annie onstage and is called the 'merry wanderer of the night.'", "zh": "帕克是那个胖胖的、卷头发、穿绿衣的演员，他把杰克和安妮带上台，被称为「夜晚快乐的漫游者」。"}}, {"q": {"en": "How does Will help the tame bear Dan?", "zh": "威尔是怎样帮助温顺的熊丹的？"}, "options": [{"en": "He sets Dan free in the forest", "zh": "他把丹放回森林"}, {"en": "He buys Dan with gold coins for a play", "zh": "他付金币买下丹，写进戏里"}, {"en": "He sends the tame dancing bear Dan back to his angry owner", "zh": "他把温顺的会跳舞的熊丹送回给那位愤怒的主人"}, {"en": "He sells Dan to the fights", "zh": "他把丹卖去斗熊场"}], "answer": 1, "explain": {"en": "Will gives the bear's owner gold coins and says he plans to write a play with a part for a bear, then Puck leads Dan to the stables.", "zh": "威尔给了熊的主人金币，说想写一出有熊角色的戏，接着帕克把丹领到了马厩。"}}];

const qEl = document.getElementById("questions");
const resultEl = document.getElementById("result");
const detailEl = document.getElementById("scoreDetail");
const checkBtn = document.getElementById("checkBtn");
const resetBtn = document.getElementById("resetBtn");
const langBtn = document.getElementById("langBtn");

function render(){
  qEl.innerHTML = "";
  document.getElementById("subtitle").textContent = L[lang].subtitle;
  langBtn.textContent = L[lang].langBtn;

  quiz.forEach((item, i) => {
    const qDiv = document.createElement("div");
    qDiv.className = "q";
    qDiv.id = "q" + i;
    let html = `<h3><span>Q${i+1}.</span>${item.q[lang]}</h3>`;
    item.options.forEach((opt, j) => {
      const isPicked = picked[i] === j;
      const checked = isPicked ? "checked" : "";
      html += `<label data-q="${i}" data-o="${j}" class="${isPicked?'picked':''}">
        <input type="radio" name="q${i}" value="${j}" ${checked}> ${opt[lang]}
      </label>`;
    });
    html += `<div class="explain" id="ex${i}">
      <div class="en"><b>${L[lang].ansLabel}:</b> ${item.options[item.answer][lang]}<br>${item.explain.en}</div>
      <div class="zh">${item.options[item.answer][lang]}<br>${item.explain.zh}</div>
    </div>`;
    qDiv.innerHTML = html;
    qEl.appendChild(qDiv);

    if (submitted){
      qDiv.classList.add(picked[i] === item.answer ? "correct" : "wrong");
      document.getElementById("ex"+i).classList.add("show");
      const labels = qDiv.querySelectorAll("label");
      labels[item.answer].classList.add("right");
      if (picked[i] !== item.answer && picked[i] !== undefined)
        labels[picked[i]].classList.add("picked-wrong");
    }
  });

  qEl.querySelectorAll('input[type=radio]').forEach(r => {
    r.addEventListener("change", e => {
      if (submitted) return;
      const qi = +e.target.name.replace("q","");
      picked[qi] = +e.target.value;
      qEl.querySelectorAll(`label[data-q="${qi}"]`).forEach(l=>l.classList.remove("picked"));
      e.target.closest("label").classList.add("picked");
    });
  });

  if (submitted){
    resultEl.textContent = L[lang].result(score);
    let msg = score===10 ? L[lang].perfect : score>=7 ? L[lang].great : score>=4 ? L[lang].ok : L[lang].low;
    detailEl.textContent = msg;
  } else {
    resultEl.textContent = "";
    detailEl.textContent = "";
  }
}

checkBtn.addEventListener("click", () => {
  submitted = true;
  score = 0;
  quiz.forEach((item,i) => { if (picked[i] === item.answer) score++; });
  render();
  checkBtn.style.display = "none";
  resetBtn.style.display = "inline-block";
});

resetBtn.addEventListener("click", () => {
  location.reload();
});

langBtn.addEventListener("click", () => {
  lang = (lang === "en") ? "zh" : "en";
  render();
});

render();
</script>
</body>
</html>
