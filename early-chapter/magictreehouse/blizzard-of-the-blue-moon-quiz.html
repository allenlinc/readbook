<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blizzard of the Blue Moon — Quiz</title>
<style>
  :root{
    --forest:#15803d;
    --forest-dark:#14532d;
    --red:#c0392b;
    --cream:#f7fbf6;
    --ink:#222;
    --gold:#d97706;
    --oak:#92400e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Trebuchet MS","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--forest),var(--forest-dark));
    color:var(--ink);
    min-height:100vh;
    padding:24px 12px;
  }
  .wrap{
    max-width:780px;
    margin:0 auto;
    background:var(--cream);
    border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    overflow:hidden;
  }
  header{
    background:var(--forest);
    color:#fff;
    padding:22px 28px 18px;
    text-align:center;
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  header h1{
    margin:0;
    font-size:1.5rem;
    letter-spacing:.5px;
    flex:1;
    text-align:center;
  }
  .langBtn{
    font-family:inherit;
    font-size:.85rem;
    font-weight:bold;
    color:var(--forest-dark);
    background:#fff;
    border:none;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .langBtn:hover{transform:translateY(-1px);}
  .homeBtn{
    font-size:1.35rem;
    text-decoration:none;
    background:#fff;
    border-radius:50%;
    width:40px;height:40px;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .homeBtn:hover{transform:translateY(-1px);}
  header p{
    margin:10px 0 0;
    font-size:.92rem;
    opacity:.92;
  }
  .logo{
    width:62px;height:62px;border-radius:50%;
    background:#fff;margin:0 auto 12px;position:relative;
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  main{padding:22px 28px 30px;}
  .q{
    border:1px solid #d6e6df;
    border-radius:12px;
    padding:16px 18px;
    margin:16px 0;
    background:#fff;
    transition:border-color .2s;
  }
  .q.correct{border-color:var(--forest);background:#eef9f0;}
  .q.wrong{border-color:var(--red);background:#fdf3f2;}
  .q h3{
    margin:0 0 12px;
    font-size:1.02rem;
    line-height:1.45;
  }
  .q h3 span{color:var(--gold);font-weight:bold;margin-right:6px;}
  label{
    display:block;
    padding:9px 12px;
    margin:7px 0;
    border-radius:8px;
    background:#eef4f0;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s,border-color .15s;
    font-size:.96rem;
    line-height:1.4;
  }
  label:hover{background:#e2ede7;}
  input[type=radio]{margin-right:9px;transform:translateY(1px);}
  label.picked{background:#fff4cc;border-color:var(--gold);}
  label.right{background:#d7f0df;border-color:var(--forest);font-weight:600;}
  label.picked-wrong{background:#f7d4d0;border-color:var(--red);}
  .explain{
    display:none;
    margin-top:10px;
    padding:12px 14px;
    background:#f0f7f2;
    border-left:4px solid var(--forest);
    border-radius:6px;
    font-size:.9rem;
    line-height:1.5;
  }
  .explain.show{display:block;}
  .explain .en{margin-bottom:6px;}
  .explain .zh{color:#444;}
  .explain b{color:var(--forest-dark);}
  .actions{text-align:center;margin-top:24px;}
  button.go{
    font-family:inherit;
    font-size:1.05rem;
    font-weight:bold;
    color:#fff;
    background:var(--forest-dark);
    border:none;
    padding:13px 34px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(21,128,61,.4);
    transition:transform .12s,box-shadow .12s;
  }
  button.go:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(21,128,61,.5);}
  button.go:active{transform:translateY(0);}
  #resetBtn{display:none;background:#555;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  #result{
    text-align:center;
    margin:22px auto 4px;
    font-size:1.3rem;
    font-weight:bold;
    color:var(--forest-dark);
    min-height:1.4em;
  }
  #scoreDetail{text-align:center;color:#666;font-size:.92rem;margin-bottom:6px;}
  footer{
    text-align:center;
    font-size:.8rem;
    color:#9aa6ad;
    padding:14px;
    border-top:1px solid #eee;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <button class="langBtn" id="langBtn">🌐 中文</button>
      <h1>#36 · Blizzard of the Blue Moon</h1>
      <a class="homeBtn" href="../../index.html" title="Home / 首页" aria-label="Home">🏠</a>
    </div>
    <p id="subtitle">Comprehension Quiz • 10 Questions • by Mary Pope Osborne</p>
    <div class="logo">🌳</div>
  </header>
  <main>
    <div id="questions"></div>
    <div id="result"></div>
    <div id="scoreDetail"></div>
    <div class="actions">
      <button class="go" id="checkBtn">Check My Answers</button>
      <button class="go" id="resetBtn">Try Again</button>
    </div>
  </main>
  <footer>Based on <em>Magic Tree House #36: Blizzard of the Blue Moon</em> (Random House, 2006) — by Mary Pope Osborne</footer>
</div>

<script>
let lang = "en";
const picked = {};
let submitted = false;
let score = 0;

const L = {
  en: {
    subtitle: "Comprehension Quiz • 10 Questions • by Mary Pope Osborne",
    check: "Check My Answers",
    retry: "Try Again",
    langBtn: "🌐 中文",
    result: (s) => `You scored ${s} / 10`,
    perfect: "Perfect! You really know your Magic Tree House adventure.",
    great: "Great job — you understood the story well.",
    ok: "Not bad — but a few clues slipped past you.",
    low: "Time for a re-read! The answers are in the details.",
    ansLabel: "Answer"
  },
  zh: {
    subtitle: "阅读理解测验 • 共10题 • 作者：Mary Pope Osborne",
    check: "提交答案",
    retry: "再做一次",
    langBtn: "🌐 English",
    result: (s) => `你的得分：${s} / 10`,
    perfect: "满分！你完全读懂了这次神奇树屋冒险。",
    great: "很棒——你已经读懂了这个故事。",
    ok: "不错——不过有几条线索被你漏掉了。",
    low: "该重读一遍啦！答案都藏在细节里。",
    ansLabel: "正确答案"
  }
};

const quiz = [{"q": {"en": "What is the name of the unicorn Jack and Annie must help?", "zh": "杰克和安妮要帮助的那只独角兽叫什么名字？"}, "options": [{"en": "Teddy, an enchanter from Camelot", "zh": "泰迪，卡美洛的小魔法师"}, {"en": "Dianthus, the last unicorn", "zh": "狄安瑟斯，世界上最后一只独角兽"}, {"en": "Grinda, a sorceress from the magic world", "zh": "格林达，魔法世界的女巫，不过那是另一个故事了"}, {"en": "Balor, a servant of the Dark Wizard", "zh": "巴洛尔，黑暗巫师的仆人"}], "answer": 1, "explain": {"en": "The unicorn's name is Dianthus. Grinda calls him out of the tapestry by shouting 'Dianthus!' and he is described as a milky-white unicorn with a spiraled, glowing horn.", "zh": "独角兽的名字叫狄安瑟斯。格林达对着挂毯大喊“狄安瑟斯！”把他唤了出来，他是一只乳白色的独角兽，长着会发光的螺旋角。"}}, {"q": {"en": "Where do Jack and Annie go for this mission?", "zh": "杰克和安妮这次的任务去了哪里？"}, "options": [{"en": "Rome in the year 1498, many centuries past", "zh": "许多世纪以前的 1498 年罗马"}, {"en": "London in the year 1900", "zh": "1900 年的伦敦"}, {"en": "Paris in the year 1889", "zh": "1889 年的巴黎"}, {"en": "New York City in the year 1938", "zh": "1938 年的纽约市"}], "answer": 3, "explain": {"en": "Morgan's research book is the 'New York City Guide Book, 1938,' and the story takes place in New York during the Great Depression, with Jack and Annie visiting Central Park and the Cloisters.", "zh": "摩根查阅的书是《1938 年纽约市指南》，故事发生在经济大萧条时期的纽约，杰克和安妮去了中央公园和修道院博物馆。"}}, {"q": {"en": "Who are Balor and Grinda working for?", "zh": "巴洛尔和格林达在为谁卖命？"}, "options": [{"en": "Morgan le Fay", "zh": "摩根·勒·菲"}, {"en": "the Dark Wizard", "zh": "黑暗巫师"}, {"en": "Teddy and Kathleen", "zh": "泰迪和凯瑟琳"}, {"en": "Merlin the magician", "zh": "魔法师梅林"}], "answer": 1, "explain": {"en": "Balor and Grinda come from the magic world and obey a master they call the Dark Wizard, who wants to capture the unicorn for himself.", "zh": "巴洛尔和格林达来自魔法世界，听命于他们口中的“黑暗巫师”，而黑暗巫师想把独角兽占为己有。"}}, {"q": {"en": "How does Annie finally stop Balor and Grinda?", "zh": "安妮最后是怎样制住巴洛尔和格林达的？"}, "options": [{"en": "She turns them into ducks.", "zh": "她把他们变成了鸭子。"}, {"en": "She sends them back to Camelot.", "zh": "她把他们送回了卡美洛。"}, {"en": "She locks them inside the Cloisters.", "zh": "她把他们锁进了修道院博物馆。"}, {"en": "She makes them fall fast asleep.", "zh": "她让他们沉沉地睡着了。"}], "answer": 0, "explain": {"en": "Annie uses the rhyme 'Turn into Ducks' (Fowl of air, appear now here! / Aka-aka-aka-mere!) to change Balor and Grinda into two green-headed ducks.", "zh": "安妮用了“变成鸭子”的咒语（空中飞禽，快快现身！/ 阿卡-阿卡-阿卡-米勒！）把巴洛尔和格林达变成了两只绿头鸭。"}}, {"q": {"en": "What does Jack do to make a fog so they can escape?", "zh": "杰克为了制造大雾帮助他们逃走，做了什么？"}, "options": [{"en": "He waves the Wand of Dianthus.", "zh": "他挥舞狄安瑟斯魔杖。"}, {"en": "He asks Dianthus for help.", "zh": "他向狄安瑟斯求助。"}, {"en": "He says a rhyme about the wind.", "zh": "他念了一段关于风的咒语。"}, {"en": "He pulls a cloud from the sky.", "zh": "他从天上拽下一片云。"}], "answer": 3, "explain": {"en": "Jack uses the rhyme 'Pull a Cloud from the Sky' (Down from high, out of the sky / Ee-no-fain-ee-ro-lie!) to cover the park in thick fog and slip away.", "zh": "杰克用了“从天上拽下一片云”的咒语（从高高的天上，飘落下来 / 伊诺-费内-伊罗-利！）让浓雾笼罩公园，趁机溜走。"}}, {"q": {"en": "In the story, what is a 'blue moon'?", "zh": "在故事里，“蓝月”指的是什么？"}, "options": [{"en": "The second full moon in one month.", "zh": "一个月里出现的第二次满月。"}, {"en": "A magic moon that grants wishes.", "zh": "一颗能实现愿望的魔法月亮。"}, {"en": "A moon that looks blue in winter.", "zh": "冬天里看起来发蓝的月亮。"}, {"en": "The moon that shines over the Cloisters.", "zh": "照耀着修道院博物馆的月亮。"}], "answer": 0, "explain": {"en": "Merlin's poem says the unicorn must be awakened before the blue moon. A blue moon is when a second full moon appears in the same calendar month.", "zh": "梅林的诗中说，必须在蓝月升起前唤醒独角兽。蓝月指的是同一个日历月里出现的第二次满月。"}}, {"q": {"en": "Where do Teddy and Kathleen take Dianthus at the end?", "zh": "最后，泰迪和凯瑟琳把狄安瑟斯带去了哪里？"}, "options": [{"en": "To Frog Creek, Pennsylvania.", "zh": "宾夕法尼亚州的青蛙溪镇。"}, {"en": "Back to the Cloisters museum.", "zh": "回到修道院博物馆。"}, {"en": "Home to his own world.", "zh": "回他自己的世界老家。"}, {"en": "To the Central Park zoo.", "zh": "中央公园的动物园。"}], "answer": 2, "explain": {"en": "After saying good-bye, Dianthus leaps away in a flash of silver with Teddy and Kathleen, who promise to show the unicorn the way home to his own world.", "zh": "道别之后，狄安瑟斯在一道银光中纵身跃起，和泰迪、凯瑟琳一起离开，他们答应带独角兽回到他自己世界的家。"}}, {"q": {"en": "What gift do Teddy and Kathleen leave with Jack and Annie?", "zh": "泰迪和凯瑟琳留给杰克和安妮的礼物是什么？"}, "options": [{"en": "The Unicorn Tapestry", "zh": "独角兽挂毯"}, {"en": "The Wand of Dianthus", "zh": "狄安瑟斯魔杖"}, {"en": "A book of New York rhymes", "zh": "一本纽约咒语书"}, {"en": "A magic blue ring", "zh": "一枚魔法蓝戒指"}], "answer": 1, "explain": {"en": "Teddy and Kathleen give Jack and Annie the Wand of Dianthus, a spiraled wand shaped like a unicorn's horn that they keep safe for their next mission.", "zh": "泰迪和凯瑟琳把狄安瑟斯魔杖送给了杰克和安妮，那是一根螺旋形的、像独角兽角一样的魔杖，他们好好收着以备下次任务之用。"}}, {"q": {"en": "Which rhyme does Jack use to find Annie when she is lost?", "zh": "安妮走丢时，杰克用了哪句咒语找到她？"}, "options": [{"en": "Turn into Ducks when enemies get too close", "zh": "敌人逼近时把他们变成鸭子"}, {"en": "Make the Blizzard Stop", "zh": "让暴风雪停下"}, {"en": "Find a Treasure You Must Never Lose", "zh": "找到你永不能失去的珍宝"}, {"en": "Pull a Cloud from the Sky", "zh": "从天上拽下一片云"}], "answer": 2, "explain": {"en": "Jack tells Annie he already used the rhyme 'Find a Treasure You Must Never Lose' to find her when she got lost in Central Park — he thought of Annie herself as the treasure.", "zh": "杰克告诉安妮，他早就把“找到你永不能失去的珍宝”这句咒语用掉了——在安妮于中央公园走丢时，他心中把安妮当成了那件珍宝，从而找到了她。"}}, {"q": {"en": "What makes Dianthus special in the story?", "zh": "在故事里，狄安瑟斯有什么特别之处？"}, "options": [{"en": "He can talk and sing just like any person.", "zh": "他能像人一样说话和唱歌。，那是别人讲的版本"}, {"en": "He is made of silver and ice.", "zh": "他是由银和冰做成的。"}, {"en": "He is the last unicorn in the world.", "zh": "他是世界上最后一只独角兽。"}, {"en": "He is the smallest horse in the park.", "zh": "他是公园里最小的马。"}], "answer": 2, "explain": {"en": "Jack and Annie's mission is to save the last unicorn on earth. Dianthus is milky white with a glowing spiraled horn, and his calm stops the blizzard over New York.", "zh": "杰克和安妮的任务就是要拯救世界上最后一只独角兽。狄安瑟斯浑身乳白，长着会发光的螺旋角，他的平静还让纽约上空的暴风雪停了下来。"}}];

const qEl = document.getElementById("questions");
const resultEl = document.getElementById("result");
const detailEl = document.getElementById("scoreDetail");
const checkBtn = document.getElementById("checkBtn");
const resetBtn = document.getElementById("resetBtn");
const langBtn = document.getElementById("langBtn");

function render(){
  qEl.innerHTML = "";
  document.getElementById("subtitle").textContent = L[lang].subtitle;
  langBtn.textContent = L[lang].langBtn;

  quiz.forEach((item, i) => {
    const qDiv = document.createElement("div");
    qDiv.className = "q";
    qDiv.id = "q" + i;
    let html = `<h3><span>Q${i+1}.</span>${item.q[lang]}</h3>`;
    item.options.forEach((opt, j) => {
      const isPicked = picked[i] === j;
      const checked = isPicked ? "checked" : "";
      html += `<label data-q="${i}" data-o="${j}" class="${isPicked?'picked':''}">
        <input type="radio" name="q${i}" value="${j}" ${checked}> ${opt[lang]}
      </label>`;
    });
    html += `<div class="explain" id="ex${i}">
      <div class="en"><b>${L[lang].ansLabel}:</b> ${item.options[item.answer][lang]}<br>${item.explain.en}</div>
      <div class="zh">${item.options[item.answer][lang]}<br>${item.explain.zh}</div>
    </div>`;
    qDiv.innerHTML = html;
    qEl.appendChild(qDiv);

    if (submitted){
      qDiv.classList.add(picked[i] === item.answer ? "correct" : "wrong");
      document.getElementById("ex"+i).classList.add("show");
      const labels = qDiv.querySelectorAll("label");
      labels[item.answer].classList.add("right");
      if (picked[i] !== item.answer && picked[i] !== undefined)
        labels[picked[i]].classList.add("picked-wrong");
    }
  });

  qEl.querySelectorAll('input[type=radio]').forEach(r => {
    r.addEventListener("change", e => {
      if (submitted) return;
      const qi = +e.target.name.replace("q","");
      picked[qi] = +e.target.value;
      qEl.querySelectorAll(`label[data-q="${qi}"]`).forEach(l=>l.classList.remove("picked"));
      e.target.closest("label").classList.add("picked");
    });
  });

  if (submitted){
    resultEl.textContent = L[lang].result(score);
    let msg = score===10 ? L[lang].perfect : score>=7 ? L[lang].great : score>=4 ? L[lang].ok : L[lang].low;
    detailEl.textContent = msg;
  } else {
    resultEl.textContent = "";
    detailEl.textContent = "";
  }
}

checkBtn.addEventListener("click", () => {
  submitted = true;
  score = 0;
  quiz.forEach((item,i) => { if (picked[i] === item.answer) score++; });
  render();
  checkBtn.style.display = "none";
  resetBtn.style.display = "inline-block";
});

resetBtn.addEventListener("click", () => {
  location.reload();
});

langBtn.addEventListener("click", () => {
  lang = (lang === "en") ? "zh" : "en";
  render();
});

render();
</script>
</body>
</html>
