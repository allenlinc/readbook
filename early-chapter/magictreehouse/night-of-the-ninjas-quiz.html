<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Night of the Ninjas — Quiz</title>
<style>
  :root{
    --forest:#15803d;
    --forest-dark:#14532d;
    --red:#c0392b;
    --cream:#f7fbf6;
    --ink:#222;
    --gold:#d97706;
    --oak:#92400e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Trebuchet MS","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--forest),var(--forest-dark));
    color:var(--ink);
    min-height:100vh;
    padding:24px 12px;
  }
  .wrap{
    max-width:780px;
    margin:0 auto;
    background:var(--cream);
    border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    overflow:hidden;
  }
  header{
    background:var(--forest);
    color:#fff;
    padding:22px 28px 18px;
    text-align:center;
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  header h1{
    margin:0;
    font-size:1.5rem;
    letter-spacing:.5px;
    flex:1;
    text-align:center;
  }
  .langBtn{
    font-family:inherit;
    font-size:.85rem;
    font-weight:bold;
    color:var(--forest-dark);
    background:#fff;
    border:none;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .langBtn:hover{transform:translateY(-1px);}
  .homeBtn{
    font-size:1.35rem;
    text-decoration:none;
    background:#fff;
    border-radius:50%;
    width:40px;height:40px;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .homeBtn:hover{transform:translateY(-1px);}
  header p{
    margin:10px 0 0;
    font-size:.92rem;
    opacity:.92;
  }
  .logo{
    width:62px;height:62px;border-radius:50%;
    background:#fff;margin:0 auto 12px;position:relative;
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  main{padding:22px 28px 30px;}
  .q{
    border:1px solid #d6e6df;
    border-radius:12px;
    padding:16px 18px;
    margin:16px 0;
    background:#fff;
    transition:border-color .2s;
  }
  .q.correct{border-color:var(--forest);background:#eef9f0;}
  .q.wrong{border-color:var(--red);background:#fdf3f2;}
  .q h3{
    margin:0 0 12px;
    font-size:1.02rem;
    line-height:1.45;
  }
  .q h3 span{color:var(--gold);font-weight:bold;margin-right:6px;}
  label{
    display:block;
    padding:9px 12px;
    margin:7px 0;
    border-radius:8px;
    background:#eef4f0;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s,border-color .15s;
    font-size:.96rem;
    line-height:1.4;
  }
  label:hover{background:#e2ede7;}
  input[type=radio]{margin-right:9px;transform:translateY(1px);}
  label.picked{background:#fff4cc;border-color:var(--gold);}
  label.right{background:#d7f0df;border-color:var(--forest);font-weight:600;}
  label.picked-wrong{background:#f7d4d0;border-color:var(--red);}
  .explain{
    display:none;
    margin-top:10px;
    padding:12px 14px;
    background:#f0f7f2;
    border-left:4px solid var(--forest);
    border-radius:6px;
    font-size:.9rem;
    line-height:1.5;
  }
  .explain.show{display:block;}
  .explain .en{margin-bottom:6px;}
  .explain .zh{color:#444;}
  .explain b{color:var(--forest-dark);}
  .actions{text-align:center;margin-top:24px;}
  button.go{
    font-family:inherit;
    font-size:1.05rem;
    font-weight:bold;
    color:#fff;
    background:var(--forest-dark);
    border:none;
    padding:13px 34px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(21,128,61,.4);
    transition:transform .12s,box-shadow .12s;
  }
  button.go:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(21,128,61,.5);}
  button.go:active{transform:translateY(0);}
  #resetBtn{display:none;background:#555;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  #result{
    text-align:center;
    margin:22px auto 4px;
    font-size:1.3rem;
    font-weight:bold;
    color:var(--forest-dark);
    min-height:1.4em;
  }
  #scoreDetail{text-align:center;color:#666;font-size:.92rem;margin-bottom:6px;}
  footer{
    text-align:center;
    font-size:.8rem;
    color:#9aa6ad;
    padding:14px;
    border-top:1px solid #eee;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <button class="langBtn" id="langBtn">🌐 中文</button>
      <h1>#05 · Night of the Ninjas</h1>
      <a class="homeBtn" href="../../index.html" title="Home / 首页" aria-label="Home">🏠</a>
    </div>
    <p id="subtitle">Comprehension Quiz • 10 Questions • by Mary Pope Osborne</p>
    <div class="logo">🌳</div>
  </header>
  <main>
    <div id="questions"></div>
    <div id="result"></div>
    <div id="scoreDetail"></div>
    <div class="actions">
      <button class="go" id="checkBtn">Check My Answers</button>
      <button class="go" id="resetBtn">Try Again</button>
    </div>
  </main>
  <footer>Based on <em>Magic Tree House #05: Night of the Ninjas</em> (Random House, 1995) — by Mary Pope Osborne</footer>
</div>

<script>
let lang = "en";
const picked = {};
let submitted = false;
let score = 0;

const L = {
  en: {
    subtitle: "Comprehension Quiz • 10 Questions • by Mary Pope Osborne",
    check: "Check My Answers",
    retry: "Try Again",
    langBtn: "🌐 中文",
    result: (s) => `You scored ${s} / 10`,
    perfect: "Perfect! You really know your Magic Tree House adventure.",
    great: "Great job — you understood the story well.",
    ok: "Not bad — but a few clues slipped past you.",
    low: "Time for a re-read! The answers are in the details.",
    ansLabel: "Answer"
  },
  zh: {
    subtitle: "阅读理解测验 • 共10题 • 作者：Mary Pope Osborne",
    check: "提交答案",
    retry: "再做一次",
    langBtn: "🌐 English",
    result: (s) => `你的得分：${s} / 10`,
    perfect: "满分！你完全读懂了这次神奇树屋冒险。",
    great: "很棒——你已经读懂了这个故事。",
    ok: "不错——不过有几条线索被你漏掉了。",
    low: "该重读一遍啦！答案都藏在细节里。",
    ansLabel: "正确答案"
  }
};

const quiz = [{"q": {"en": "What is the name Annie gives to the little mouse in the tree house?", "zh": "安妮给树屋里那只小老鼠起了什么名字？"}, "options": [{"en": "Cocoa", "zh": "可可"}, {"en": "Whiskers", "zh": "胡须"}, {"en": "Peanut", "zh": "花生"}, {"en": "Shadow", "zh": "影子"}], "answer": 2, "explain": {"en": "Annie pats the tiny brown-and-white mouse and says, 'Hi, Peanut,' asking if she can call it that.", "zh": "安妮拍拍那只棕白相间的小老鼠说：'你好，花生'，问能不能这么叫它。"}}, {"q": {"en": "What country do Jack and Annie visit in this adventure?", "zh": "这次冒险中，杰克和安妮去的是哪个国家？"}, "options": [{"en": "India", "zh": "印度"}, {"en": "China", "zh": "中国"}, {"en": "Korea, a land of high mountains", "zh": "朝鲜/韩国，多高山的国家"}, {"en": "Japan (feudal Japan)", "zh": "日本（封建时代的日本）"}], "answer": 3, "explain": {"en": "Jack reads that ninjas lived in Japan between the 14th and 17th centuries, and they land among white-flowered trees on a mountain in Japan.", "zh": "杰克读到忍者生活在14到17世纪的日本，而他们降落在日本一座开白花的山上。"}}, {"q": {"en": "What surprising fact does the ninja master reveal about the short ninja?", "zh": "忍者大师透露了关于那个矮忍者的什么惊人事实？"}, "options": [{"en": "He is the captain", "zh": "他是队长"}, {"en": "She is a woman", "zh": "她是个女人"}, {"en": "He is very young", "zh": "他年纪很小"}, {"en": "He is the master's son", "zh": "他是大师的儿子"}], "answer": 1, "explain": {"en": "The master says, 'You gave the message to her,' and the short ninja's eyes sparkle — the 'short ninja' is actually a woman.", "zh": "大师说'你把这消息给了她'，矮忍者眼中闪着光——原来'矮忍者'是个女人。"}}, {"q": {"en": "What three rules does the ninja master tell Jack and Annie to remember?", "zh": "忍者大师让杰克和安妮记住哪三条法则？"}, "options": [{"en": "Run fast, hide well, and fight with all your might", "zh": "快快跑、好好躲、使出全力战斗"}, {"en": "Use nature, be nature, follow nature", "zh": "运用自然、成为自然、跟随自然"}, {"en": "Eat, sleep, climb", "zh": "吃、睡、爬"}, {"en": "Read, write, draw", "zh": "读、写、画"}], "answer": 1, "explain": {"en": "The master says, 'Remember three things: Use nature. Be nature. Follow nature.'", "zh": "大师说：'记住三件事：运用自然、成为自然、跟随自然。'"}}, {"q": {"en": "How do Jack and Annie figure out which way is east?", "zh": "杰克和安妮是怎么判断哪边是东的？"}, "options": [{"en": "By watching the stars move across the night sky", "zh": "看着星星在夜空中移动"}, {"en": "By the shadow of a stick in the moonlight", "zh": "借着月光下木棍的影子"}, {"en": "By reading a compass", "zh": "看指南针"}, {"en": "By asking the ninjas", "zh": "问忍者"}], "answer": 1, "explain": {"en": "Jack remembers a camping tip: push a stick into the ground; if its shadow is more than six inches, the shadow points east.", "zh": "杰克想起露营书里的方法：把木棍插进土里，如果影子超过六英寸，影子就指向东方。"}}, {"q": {"en": "What does the ninja master give Jack before they go home?", "zh": "在回家之前，忍者大师给了杰克什么？"}, "options": [{"en": "A white flower", "zh": "一朵白花"}, {"en": "A folded map", "zh": "一张折叠的地图"}, {"en": "A small round stone called a moonstone", "zh": "一块叫月光石的小圆石"}, {"en": "A shiny sword with a golden handle and a jewel", "zh": "一把镶着宝石、带金色剑柄的闪亮宝剑"}], "answer": 2, "explain": {"en": "The master hands Jack 'a small, round stone' and says, 'This moonstone will help you find your missing friend.'", "zh": "大师递给杰克'一块小圆石'，说：'这块月光石会帮你找到失踪的朋友。'"}}, {"q": {"en": "Who are the enemies with torches and bamboo armor that chase the children?", "zh": "举着火把、穿竹甲追孩子的敌人是谁？"}, "options": [{"en": "The castle guards", "zh": "城堡守卫"}, {"en": "The samurai", "zh": "武士"}, {"en": "The ninja family", "zh": "忍者一家"}, {"en": "The village farmers", "zh": "村里的农夫"}], "answer": 1, "explain": {"en": "The master says his family is at war with the samurai, who wear bamboo armor and carry two swords, and will show no mercy.", "zh": "大师说他们家族正与武士交战，武士穿竹甲、佩双刀，而且绝不留情。"}}, {"q": {"en": "How does Peanut help Jack and Annie cross the wild stream?", "zh": "花生是怎样帮杰克和安妮渡过湍急溪流的？"}, "options": [{"en": "She leads them to a fallen branch bridge", "zh": "她把他们引到一根倒下的树枝桥"}, {"en": "She shows them a cave", "zh": "她指给他们一个山洞"}, {"en": "She fetches a boat", "zh": "她找来一只船"}, {"en": "She carries them safely on her tiny back", "zh": "她把他们稳稳地背在小小的背上"}], "answer": 0, "explain": {"en": "Peanut scampers along the stream to a moonlit branch fallen across it; the children 'walk the branch' like mice to cross.", "zh": "花生沿着溪流跑到一根横在水面的、被月光照亮的树枝旁；孩子们像老鼠一样'走树枝'过了河。"}}, {"q": {"en": "What do Jack and Annie pretend to be so they can cross the tiny branch?", "zh": "为了走过那根细小的树枝，杰克和安妮假装自己是什么？"}, "options": [{"en": "Flying birds", "zh": "会飞的鸟"}, {"en": "Tiny mice", "zh": "小小的老鼠"}, {"en": "Calm rocks", "zh": "安静的石头"}, {"en": "Swift fish", "zh": "敏捷的鱼"}], "answer": 1, "explain": {"en": "Annie says, 'If you could be a rock, you can be a mouse' — they say 'squeak' and dart across the branch like Peanut.", "zh": "安妮说'你能当石头，也能当老鼠'——他们学着'吱吱'叫，像花生一样飞快地窜过树枝。"}}, {"q": {"en": "How many special things must Jack and Annie find to free Morgan from her spell?", "zh": "为了解除摩根身上的魔咒，杰克和安妮必须找齐几件特别的东西？"}, "options": [{"en": "Four", "zh": "四件"}, {"en": "Two", "zh": "两件"}, {"en": "Three", "zh": "三件"}, {"en": "Five", "zh": "五件"}], "answer": 0, "explain": {"en": "Morgan's note hints at 'four things,' and after Japan Jack says, 'I guess we have one of the four things' — the moonstone.", "zh": "摩根的纸条暗示要找'四件东西'，从日本回来后杰克说'我们大概已经有了四件中的一件'——就是月光石。"}}];

const qEl = document.getElementById("questions");
const resultEl = document.getElementById("result");
const detailEl = document.getElementById("scoreDetail");
const checkBtn = document.getElementById("checkBtn");
const resetBtn = document.getElementById("resetBtn");
const langBtn = document.getElementById("langBtn");

function render(){
  qEl.innerHTML = "";
  document.getElementById("subtitle").textContent = L[lang].subtitle;
  langBtn.textContent = L[lang].langBtn;

  quiz.forEach((item, i) => {
    const qDiv = document.createElement("div");
    qDiv.className = "q";
    qDiv.id = "q" + i;
    let html = `<h3><span>Q${i+1}.</span>${item.q[lang]}</h3>`;
    item.options.forEach((opt, j) => {
      const isPicked = picked[i] === j;
      const checked = isPicked ? "checked" : "";
      html += `<label data-q="${i}" data-o="${j}" class="${isPicked?'picked':''}">
        <input type="radio" name="q${i}" value="${j}" ${checked}> ${opt[lang]}
      </label>`;
    });
    html += `<div class="explain" id="ex${i}">
      <div class="en"><b>${L[lang].ansLabel}:</b> ${item.options[item.answer][lang]}<br>${item.explain.en}</div>
      <div class="zh">${item.options[item.answer][lang]}<br>${item.explain.zh}</div>
    </div>`;
    qDiv.innerHTML = html;
    qEl.appendChild(qDiv);

    if (submitted){
      qDiv.classList.add(picked[i] === item.answer ? "correct" : "wrong");
      document.getElementById("ex"+i).classList.add("show");
      const labels = qDiv.querySelectorAll("label");
      labels[item.answer].classList.add("right");
      if (picked[i] !== item.answer && picked[i] !== undefined)
        labels[picked[i]].classList.add("picked-wrong");
    }
  });

  qEl.querySelectorAll('input[type=radio]').forEach(r => {
    r.addEventListener("change", e => {
      if (submitted) return;
      const qi = +e.target.name.replace("q","");
      picked[qi] = +e.target.value;
      qEl.querySelectorAll(`label[data-q="${qi}"]`).forEach(l=>l.classList.remove("picked"));
      e.target.closest("label").classList.add("picked");
    });
  });

  if (submitted){
    resultEl.textContent = L[lang].result(score);
    let msg = score===10 ? L[lang].perfect : score>=7 ? L[lang].great : score>=4 ? L[lang].ok : L[lang].low;
    detailEl.textContent = msg;
  } else {
    resultEl.textContent = "";
    detailEl.textContent = "";
  }
}

checkBtn.addEventListener("click", () => {
  submitted = true;
  score = 0;
  quiz.forEach((item,i) => { if (picked[i] === item.answer) score++; });
  render();
  checkBtn.style.display = "none";
  resetBtn.style.display = "inline-block";
});

resetBtn.addEventListener("click", () => {
  location.reload();
});

langBtn.addEventListener("click", () => {
  lang = (lang === "en") ? "zh" : "en";
  render();
});

render();
</script>
</body>
</html>
