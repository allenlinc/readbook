<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghost Town at Sundown — Quiz</title>
<style>
  :root{
    --forest:#15803d;
    --forest-dark:#14532d;
    --red:#c0392b;
    --cream:#f7fbf6;
    --ink:#222;
    --gold:#d97706;
    --oak:#92400e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Trebuchet MS","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--forest),var(--forest-dark));
    color:var(--ink);
    min-height:100vh;
    padding:24px 12px;
  }
  .wrap{
    max-width:780px;
    margin:0 auto;
    background:var(--cream);
    border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    overflow:hidden;
  }
  header{
    background:var(--forest);
    color:#fff;
    padding:22px 28px 18px;
    text-align:center;
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  header h1{
    margin:0;
    font-size:1.5rem;
    letter-spacing:.5px;
    flex:1;
    text-align:center;
  }
  .langBtn{
    font-family:inherit;
    font-size:.85rem;
    font-weight:bold;
    color:var(--forest-dark);
    background:#fff;
    border:none;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .langBtn:hover{transform:translateY(-1px);}
  .homeBtn{
    font-size:1.35rem;
    text-decoration:none;
    background:#fff;
    border-radius:50%;
    width:40px;height:40px;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .homeBtn:hover{transform:translateY(-1px);}
  header p{
    margin:10px 0 0;
    font-size:.92rem;
    opacity:.92;
  }
  .logo{
    width:62px;height:62px;border-radius:50%;
    background:#fff;margin:0 auto 12px;position:relative;
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  main{padding:22px 28px 30px;}
  .q{
    border:1px solid #d6e6df;
    border-radius:12px;
    padding:16px 18px;
    margin:16px 0;
    background:#fff;
    transition:border-color .2s;
  }
  .q.correct{border-color:var(--forest);background:#eef9f0;}
  .q.wrong{border-color:var(--red);background:#fdf3f2;}
  .q h3{
    margin:0 0 12px;
    font-size:1.02rem;
    line-height:1.45;
  }
  .q h3 span{color:var(--gold);font-weight:bold;margin-right:6px;}
  label{
    display:block;
    padding:9px 12px;
    margin:7px 0;
    border-radius:8px;
    background:#eef4f0;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s,border-color .15s;
    font-size:.96rem;
    line-height:1.4;
  }
  label:hover{background:#e2ede7;}
  input[type=radio]{margin-right:9px;transform:translateY(1px);}
  label.picked{background:#fff4cc;border-color:var(--gold);}
  label.right{background:#d7f0df;border-color:var(--forest);font-weight:600;}
  label.picked-wrong{background:#f7d4d0;border-color:var(--red);}
  .explain{
    display:none;
    margin-top:10px;
    padding:12px 14px;
    background:#f0f7f2;
    border-left:4px solid var(--forest);
    border-radius:6px;
    font-size:.9rem;
    line-height:1.5;
  }
  .explain.show{display:block;}
  .explain .en{margin-bottom:6px;}
  .explain .zh{color:#444;}
  .explain b{color:var(--forest-dark);}
  .actions{text-align:center;margin-top:24px;}
  button.go{
    font-family:inherit;
    font-size:1.05rem;
    font-weight:bold;
    color:#fff;
    background:var(--forest-dark);
    border:none;
    padding:13px 34px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(21,128,61,.4);
    transition:transform .12s,box-shadow .12s;
  }
  button.go:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(21,128,61,.5);}
  button.go:active{transform:translateY(0);}
  #resetBtn{display:none;background:#555;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  #result{
    text-align:center;
    margin:22px auto 4px;
    font-size:1.3rem;
    font-weight:bold;
    color:var(--forest-dark);
    min-height:1.4em;
  }
  #scoreDetail{text-align:center;color:#666;font-size:.92rem;margin-bottom:6px;}
  footer{
    text-align:center;
    font-size:.8rem;
    color:#9aa6ad;
    padding:14px;
    border-top:1px solid #eee;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <button class="langBtn" id="langBtn">🌐 中文</button>
      <h1>#10 · Ghost Town at Sundown</h1>
      <a class="homeBtn" href="../../index.html" title="Home / 首页" aria-label="Home">🏠</a>
    </div>
    <p id="subtitle">Comprehension Quiz • 10 Questions • by Mary Pope Osborne</p>
    <div class="logo">🌳</div>
  </header>
  <main>
    <div id="questions"></div>
    <div id="result"></div>
    <div id="scoreDetail"></div>
    <div class="actions">
      <button class="go" id="checkBtn">Check My Answers</button>
      <button class="go" id="resetBtn">Try Again</button>
    </div>
  </main>
  <footer>Based on <em>Magic Tree House #10: Ghost Town at Sundown</em> (Random House, 1997) — by Mary Pope Osborne</footer>
</div>

<script>
let lang = "en";
const picked = {};
let submitted = false;
let score = 0;

const L = {
  en: {
    subtitle: "Comprehension Quiz • 10 Questions • by Mary Pope Osborne",
    check: "Check My Answers",
    retry: "Try Again",
    langBtn: "🌐 中文",
    result: (s) => `You scored ${s} / 10`,
    perfect: "Perfect! You really know your Magic Tree House adventure.",
    great: "Great job — you understood the story well.",
    ok: "Not bad — but a few clues slipped past you.",
    low: "Time for a re-read! The answers are in the details.",
    ansLabel: "Answer"
  },
  zh: {
    subtitle: "阅读理解测验 • 共10题 • 作者：Mary Pope Osborne",
    check: "提交答案",
    retry: "再做一次",
    langBtn: "🌐 English",
    result: (s) => `你的得分：${s} / 10`,
    perfect: "满分！你完全读懂了这次神奇树屋冒险。",
    great: "很棒——你已经读懂了这个故事。",
    ok: "不错——不过有几条线索被你漏掉了。",
    low: "该重读一遍啦！答案都藏在细节里。",
    ansLabel: "正确答案"
  }
};

const quiz = [{"q": {"en": "What is the name of the empty, spooky town where the tree house lands?", "zh": "树屋降落的那个空荡荡、阴森森的小镇叫什么名字？"}, "options": [{"en": "Silver Creek by the dried-up river", "zh": "银溪镇，在干涸的河边"}, {"en": "Cactus Corner near the old fort", "zh": "仙人掌角，在旧堡垒附近"}, {"en": "The town of Dusty Springs, far out on the prairie", "zh": "尘土泉镇，在草原深处，不过那是另一个故事了，那是别人讲的版本"}, {"en": "Rattlesnake Flats", "zh": "响尾蛇滩（Rattlesnake Flats）"}], "answer": 3, "explain": {"en": "Jack read in the Wild West book that in the 1870s, Rattlesnake Flats was a rest stop for the stagecoach, but when the creek dried up everyone left, and by 1880 it was a 'ghost town' — the very empty, spooky place they found.", "zh": "杰克在《狂野西部岁月》里读到，19 世纪 70 年代响尾蛇滩是驿站马车的歇脚点，但溪水干涸后大家都走了，到 1880 年就成了“鬼镇”——正是他们看到的那个空荡荡、阴森森的地方。"}}, {"q": {"en": "Why does the piano in the hotel seem to play all by itself?", "zh": "旅馆里的钢琴为什么会自己弹起来？"}, "options": [{"en": "The wind blows through the open window and plucks the strings", "zh": "风吹进开着的窗户，拨动了琴弦"}, {"en": "A ghost named Lonesome Luke is really sitting at the piano keys playing the tune", "zh": "一个叫孤独卢克的幽灵真的坐在琴键前弹奏，那是别人讲的版本"}, {"en": "It is a player piano that plays automatically when its pedals are pumped", "zh": "那是一架自动演奏钢琴，踩动踏板就会自己弹"}, {"en": "Jack and Annie are only imagining the music in their heads", "zh": "杰克和安妮只是在脑海里想象出音乐"}], "answer": 2, "explain": {"en": "Jack looked it up and read that player pianos were popular in the Old West and 'played automatically when someone pumped its floor pedals,' so the moving keys were not a ghost but a player piano.", "zh": "杰克查书得知，自动钢琴在旧西部很流行，“只要有人踩动踏板就会自动演奏”，所以那些动着的琴键不是幽灵，而是一架自动演奏钢琴。"}}, {"q": {"en": "What kind of wild horses are the red mare and her colt, Sunset?", "zh": "那匹红色的母马和她的孩子小日落，是什么种类的野马？"}, "options": [{"en": "Farm horses that escaped from a nearby cattle ranch long ago", "zh": "很久以前从附近牧场逃跑的农庄马，发生在很久很久以前"}, {"en": "Mustangs, wild horses descended from Spanish horses", "zh": "野马（mustang），祖先是西班牙逃马"}, {"en": "Ponies that live high up in the snowy mountains", "zh": "住在雪山高处的小马"}, {"en": "Zebra relatives with stripes like a tiger", "zh": "和斑马是亲戚、长着老虎般条纹的马"}], "answer": 1, "explain": {"en": "Jack read that at the end of the 1800s over a million wild horses called mustangs wandered the West; they were tough, fast descendants of runaway Spanish horses, and the red mare and her colt Sunset were mustangs.", "zh": "杰克读到，19 世纪末有上百万匹叫“野马”的野马在西部长游荡，它们是顽强迅捷的西班牙逃马的后代，而那匹红母马和她的孩子小日落正是野马。"}}, {"q": {"en": "What name does Annie give to the lost little colt?", "zh": "安妮给那只迷路的小马驹起了什么名字？"}, "options": [{"en": "Lightning", "zh": "闪电（Lightning）"}, {"en": "Dusty", "zh": "灰灰（Dusty）"}, {"en": "Blaze", "zh": "烈焰（Blaze）"}, {"en": "Sunset", "zh": "日落（Sunset）"}], "answer": 3, "explain": {"en": "After the rustlers rode off with the red mare, her little colt (as red as his mother, with the same black mane and white star) showed up alone; Annie calmed him, sat on his back, and named him Sunset.", "zh": "偷马贼把红母马带走后，她的小马驹（和妈妈一样红，同样的黑鬃和白星）独自出现了；安妮安抚它、骑上它的背，给它起名叫“日落”。"}}, {"q": {"en": "When Jack and Annie first see the rattlesnake, about how far away is it?", "zh": "杰克和安妮第一次看到响尾蛇时，它大约离他们多远？"}, "options": [{"en": "About a hundred feet away", "zh": "大约一百英尺远"}, {"en": "More than a mile away across the wide, empty prairie", "zh": "在宽阔空旷的草原另一头，有一英里多远"}, {"en": "Right next to their shoes on the ground", "zh": "就在他们脚边的地上"}, {"en": "Up in the tree that holds the magic tree house", "zh": "在树屋所在的树上"}], "answer": 0, "explain": {"en": "Annie pointed to a rattlesnake that 'was about a hundred feet away,' coiled up and rattling; Jack and Annie ran past the graveyard and into the ghost town to get away from it — which is also why the town is called Rattlesnake Flats.", "zh": "安妮指着一条“大约一百英尺外”、盘着身子发出响声的响尾蛇；杰克和安妮跑过墓地冲进鬼镇躲开它——这也正是小镇叫“响尾蛇滩”的原因。"}}, {"q": {"en": "What is the answer to Morgan's riddle: 'Out of the blue, my lonely voice calls out to you'?", "zh": "摩根的谜语“出其不意，我孤独的声音向你呼唤”的答案是什么？"}, "options": [{"en": "A ghost who plays the hotel piano", "zh": "弹旅馆钢琴的幽灵"}, {"en": "A lonely coyote howling at the full moon on the prairie", "zh": "在草原上对着满月孤独嚎叫的土狼，那是别人讲的版本"}, {"en": "The whistling of the dry prairie wind", "zh": "干燥草原上呼啸的风声"}, {"en": "An echo, a sound bouncing back off the canyon walls", "zh": "回声，声音从峡谷壁反弹回来的声音"}], "answer": 3, "explain": {"en": "In Blue Canyon, Slim shouted 'Who am I?' and the distant voice called back 'Am I?' — Jack realized the 'lonely voice' was an echo, caused by sound bouncing off the canyon walls, and the scroll then glowed the word ECHO.", "zh": "在蓝峡谷，斯利姆大喊“我是谁？”，远处传来“谁？”的回声——杰克恍然大悟，那“孤独的声音”就是回声，是声音撞在峡谷壁上反弹回来，卷轴上随即闪出了 ECHO（回声）一词。"}}, {"q": {"en": "Who is Slim Cooley, the cowboy they meet?", "zh": "他们遇到的牛仔斯利姆·库利是谁？"}, "options": [{"en": "A rich banker who lives in the town of Laramie", "zh": "住在拉勒米镇的富有的银行家"}, {"en": "A sheriff who locks up the horse rustlers", "zh": "把偷马贼关起来的警长"}, {"en": "A mustang herder, who later becomes a writer", "zh": "一个野马牧人，后来成了作家"}, {"en": "A stagecoach driver just passing through town", "zh": "只是路过小镇的驿站马车车夫"}], "answer": 2, "explain": {"en": "Slim Cooley rode a gray horse named Dusty and said 'I'm a mustang herder'; he helped Jack and Annie rescue Sunset, and later revealed he had come west to write a book — 'Days of the Wild West,' which he dedicated to Smiley and Shorty.", "zh": "斯利姆·库利骑着一匹叫“灰灰”的灰马，说自己是“野马牧人”；他帮杰克和安妮救了小日落，后来还透露自己来西部是为了写书——《狂野西部岁月》，并把书题献给了“微笑”和“小个子”。"}}, {"q": {"en": "What song does the ghost Lonesome Luke play on the hotel piano?", "zh": "幽灵“孤独卢克”在旅馆钢琴上弹的是哪首歌？"}, "options": [{"en": "Red River Valley", "zh": "《红河谷》"}, {"en": "Home on the Range", "zh": "《牧场上的家》"}, {"en": "Old MacDonald Had a Farm", "zh": "《王老先生有块地》"}, {"en": "Twinkle, Twinkle, Little Star, the nursery song", "zh": "《一闪一闪小星星》这首儿歌"}], "answer": 0, "explain": {"en": "Slim told them Lonesome Luke was a ghost cowboy whose gal went back east; he went loco and played 'Red River Valley' over and over at the hotel piano, and the same sad tune played by itself when Jack and Annie visited the hotel.", "zh": "斯利姆说，孤独卢克是个幽灵牛仔，他的恋人回了东部，他因此发疯，在旅馆钢琴上一遍遍弹《红河谷》；杰克和安妮待在旅馆时，那首忧伤的曲子也自己响了起来。"}}, {"q": {"en": "According to Jack's book, what are the basic rules for treating a horse?", "zh": "根据杰克的书，对待马的基本原则是什么？"}, "options": [{"en": "A soft hand, a firm voice, a sunny attitude, praise, and reward", "zh": "温柔的手、坚定的声音、阳光般的态度、表扬和奖励"}, {"en": "Always whip it hard and keep it locked up all day in a dark, cold barn", "zh": "总是狠狠抽它，把它锁在黑暗寒冷的马厩里，不过那是另一个故事了"}, {"en": "Feed it only sugar cubes exactly three times a day", "zh": "一天只喂三次方糖"}, {"en": "Never let a child come anywhere near a horse", "zh": "绝不让小孩靠近马一步"}], "answer": 0, "explain": {"en": "In the chapter 'How to Treat a Horse,' the book said the basic rules are simple: a soft hand, a firm voice, a sunny attitude, praise, and reward — and Jack used 'a soft hand, a firm voice' to keep Dusty quiet while Slim freed the mare.", "zh": "在“如何对待马”一章里，书说基本原则很简单：温柔的手、坚定的声音、阳光般的态度、表扬和奖励——杰克正是用“温柔的手、坚定的声音”在斯利姆解救母马时让灰灰安静下来。"}}, {"q": {"en": "Where does Slim corral the freed mustangs for the night?", "zh": "斯利姆把获救的野马圈起来过夜的地方是哪里？"}, "options": [{"en": "A cave hidden deep inside the old graveyard", "zh": "旧墓地深处的一个隐藏山洞里"}, {"en": "The empty, dusty streets of the old ghost town of Rattlesnake Flats", "zh": "响尾蛇滩鬼镇空荡荡、满是灰尘的街道上"}, {"en": "The porch of the hotel in the ghost town", "zh": "鬼镇旅馆的门廊上"}, {"en": "Blue Canyon, a boxy open space with walls of rock", "zh": "蓝峡谷，一个四周是石壁的方形开阔地"}], "answer": 3, "explain": {"en": "After escaping the rustlers, Slim led the herd through a deep narrow pass to 'Blue Canyon,' a boxy open space surrounded by walls of rock and lit by moonlight, where they corralled the mustangs.", "zh": "甩开偷马贼后，斯利姆把马群领过一道又深又窄的山口，来到“蓝峡谷”——一个四周是石壁、被月光照亮的方形开阔地，他们在那里把野马圈了起来。"}}];

const qEl = document.getElementById("questions");
const resultEl = document.getElementById("result");
const detailEl = document.getElementById("scoreDetail");
const checkBtn = document.getElementById("checkBtn");
const resetBtn = document.getElementById("resetBtn");
const langBtn = document.getElementById("langBtn");

function render(){
  qEl.innerHTML = "";
  document.getElementById("subtitle").textContent = L[lang].subtitle;
  langBtn.textContent = L[lang].langBtn;

  quiz.forEach((item, i) => {
    const qDiv = document.createElement("div");
    qDiv.className = "q";
    qDiv.id = "q" + i;
    let html = `<h3><span>Q${i+1}.</span>${item.q[lang]}</h3>`;
    item.options.forEach((opt, j) => {
      const isPicked = picked[i] === j;
      const checked = isPicked ? "checked" : "";
      html += `<label data-q="${i}" data-o="${j}" class="${isPicked?'picked':''}">
        <input type="radio" name="q${i}" value="${j}" ${checked}> ${opt[lang]}
      </label>`;
    });
    html += `<div class="explain" id="ex${i}">
      <div class="en"><b>${L[lang].ansLabel}:</b> ${item.options[item.answer][lang]}<br>${item.explain.en}</div>
      <div class="zh">${item.options[item.answer][lang]}<br>${item.explain.zh}</div>
    </div>`;
    qDiv.innerHTML = html;
    qEl.appendChild(qDiv);

    if (submitted){
      qDiv.classList.add(picked[i] === item.answer ? "correct" : "wrong");
      document.getElementById("ex"+i).classList.add("show");
      const labels = qDiv.querySelectorAll("label");
      labels[item.answer].classList.add("right");
      if (picked[i] !== item.answer && picked[i] !== undefined)
        labels[picked[i]].classList.add("picked-wrong");
    }
  });

  qEl.querySelectorAll('input[type=radio]').forEach(r => {
    r.addEventListener("change", e => {
      if (submitted) return;
      const qi = +e.target.name.replace("q","");
      picked[qi] = +e.target.value;
      qEl.querySelectorAll(`label[data-q="${qi}"]`).forEach(l=>l.classList.remove("picked"));
      e.target.closest("label").classList.add("picked");
    });
  });

  if (submitted){
    resultEl.textContent = L[lang].result(score);
    let msg = score===10 ? L[lang].perfect : score>=7 ? L[lang].great : score>=4 ? L[lang].ok : L[lang].low;
    detailEl.textContent = msg;
  } else {
    resultEl.textContent = "";
    detailEl.textContent = "";
  }
}

checkBtn.addEventListener("click", () => {
  submitted = true;
  score = 0;
  quiz.forEach((item,i) => { if (picked[i] === item.answer) score++; });
  render();
  checkBtn.style.display = "none";
  resetBtn.style.display = "inline-block";
});

resetBtn.addEventListener("click", () => {
  location.reload();
});

langBtn.addEventListener("click", () => {
  lang = (lang === "en") ? "zh" : "en";
  render();
});

render();
</script>
</body>
</html>
