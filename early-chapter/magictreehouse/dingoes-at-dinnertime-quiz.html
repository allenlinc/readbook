<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dingoes at Dinnertime — Quiz</title>
<style>
  :root{
    --forest:#15803d;
    --forest-dark:#14532d;
    --red:#c0392b;
    --cream:#f7fbf6;
    --ink:#222;
    --gold:#d97706;
    --oak:#92400e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Trebuchet MS","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--forest),var(--forest-dark));
    color:var(--ink);
    min-height:100vh;
    padding:24px 12px;
  }
  .wrap{
    max-width:780px;
    margin:0 auto;
    background:var(--cream);
    border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    overflow:hidden;
  }
  header{
    background:var(--forest);
    color:#fff;
    padding:22px 28px 18px;
    text-align:center;
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  header h1{
    margin:0;
    font-size:1.5rem;
    letter-spacing:.5px;
    flex:1;
    text-align:center;
  }
  .langBtn{
    font-family:inherit;
    font-size:.85rem;
    font-weight:bold;
    color:var(--forest-dark);
    background:#fff;
    border:none;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .langBtn:hover{transform:translateY(-1px);}
  .homeBtn{
    font-size:1.35rem;
    text-decoration:none;
    background:#fff;
    border-radius:50%;
    width:40px;height:40px;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .homeBtn:hover{transform:translateY(-1px);}
  header p{
    margin:10px 0 0;
    font-size:.92rem;
    opacity:.92;
  }
  .logo{
    width:62px;height:62px;border-radius:50%;
    background:#fff;margin:0 auto 12px;position:relative;
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  main{padding:22px 28px 30px;}
  .q{
    border:1px solid #d6e6df;
    border-radius:12px;
    padding:16px 18px;
    margin:16px 0;
    background:#fff;
    transition:border-color .2s;
  }
  .q.correct{border-color:var(--forest);background:#eef9f0;}
  .q.wrong{border-color:var(--red);background:#fdf3f2;}
  .q h3{
    margin:0 0 12px;
    font-size:1.02rem;
    line-height:1.45;
  }
  .q h3 span{color:var(--gold);font-weight:bold;margin-right:6px;}
  label{
    display:block;
    padding:9px 12px;
    margin:7px 0;
    border-radius:8px;
    background:#eef4f0;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s,border-color .15s;
    font-size:.96rem;
    line-height:1.4;
  }
  label:hover{background:#e2ede7;}
  input[type=radio]{margin-right:9px;transform:translateY(1px);}
  label.picked{background:#fff4cc;border-color:var(--gold);}
  label.right{background:#d7f0df;border-color:var(--forest);font-weight:600;}
  label.picked-wrong{background:#f7d4d0;border-color:var(--red);}
  .explain{
    display:none;
    margin-top:10px;
    padding:12px 14px;
    background:#f0f7f2;
    border-left:4px solid var(--forest);
    border-radius:6px;
    font-size:.9rem;
    line-height:1.5;
  }
  .explain.show{display:block;}
  .explain .en{margin-bottom:6px;}
  .explain .zh{color:#444;}
  .explain b{color:var(--forest-dark);}
  .actions{text-align:center;margin-top:24px;}
  button.go{
    font-family:inherit;
    font-size:1.05rem;
    font-weight:bold;
    color:#fff;
    background:var(--forest-dark);
    border:none;
    padding:13px 34px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(21,128,61,.4);
    transition:transform .12s,box-shadow .12s;
  }
  button.go:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(21,128,61,.5);}
  button.go:active{transform:translateY(0);}
  #resetBtn{display:none;background:#555;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  #result{
    text-align:center;
    margin:22px auto 4px;
    font-size:1.3rem;
    font-weight:bold;
    color:var(--forest-dark);
    min-height:1.4em;
  }
  #scoreDetail{text-align:center;color:#666;font-size:.92rem;margin-bottom:6px;}
  footer{
    text-align:center;
    font-size:.8rem;
    color:#9aa6ad;
    padding:14px;
    border-top:1px solid #eee;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <button class="langBtn" id="langBtn">🌐 中文</button>
      <h1>#20 · Dingoes at Dinnertime</h1>
      <a class="homeBtn" href="../../index.html" title="Home / 首页" aria-label="Home">🏠</a>
    </div>
    <p id="subtitle">Comprehension Quiz • 10 Questions • by Mary Pope Osborne</p>
    <div class="logo">🌳</div>
  </header>
  <main>
    <div id="questions"></div>
    <div id="result"></div>
    <div id="scoreDetail"></div>
    <div class="actions">
      <button class="go" id="checkBtn">Check My Answers</button>
      <button class="go" id="resetBtn">Try Again</button>
    </div>
  </main>
  <footer>Based on <em>Magic Tree House #20: Dingoes at Dinnertime</em> (Random House, 2000) — by Mary Pope Osborne</footer>
</div>

<script>
let lang = "en";
const picked = {};
let submitted = false;
let score = 0;

const L = {
  en: {
    subtitle: "Comprehension Quiz • 10 Questions • by Mary Pope Osborne",
    check: "Check My Answers",
    retry: "Try Again",
    langBtn: "🌐 中文",
    result: (s) => `You scored ${s} / 10`,
    perfect: "Perfect! You really know your Magic Tree House adventure.",
    great: "Great job — you understood the story well.",
    ok: "Not bad — but a few clues slipped past you.",
    low: "Time for a re-read! The answers are in the details.",
    ansLabel: "Answer"
  },
  zh: {
    subtitle: "阅读理解测验 • 共10题 • 作者：Mary Pope Osborne",
    check: "提交答案",
    retry: "再做一次",
    langBtn: "🌐 English",
    result: (s) => `你的得分：${s} / 10`,
    perfect: "满分！你完全读懂了这次神奇树屋冒险。",
    great: "很棒——你已经读懂了这个故事。",
    ok: "不错——不过有几条线索被你漏掉了。",
    low: "该重读一遍啦！答案都藏在细节里。",
    ansLabel: "正确答案"
  }
};

const quiz = [{"q": {"en": "In which country did this adventure take place?", "zh": "这次冒险发生在哪个国家？"}, "options": [{"en": "Brazil", "zh": "巴西"}, {"en": "Canada, though that is another story", "zh": "加拿大，不过那是另一个故事了"}, {"en": "Egypt", "zh": "埃及"}, {"en": "Australia", "zh": "澳大利亚"}], "answer": 3, "explain": {"en": "Their book was 'Adventure in Australia,' and they landed in the dry Australian forests.", "zh": "他们带的书是《澳大利亚冒险》，落地点是澳大利亚干旱的森林。"}}, {"q": {"en": "What is an emu?", "zh": "鸸鹋是一种什么动物？"}, "options": [{"en": "A kind of fish", "zh": "一种鱼"}, {"en": "A bird that cannot fly", "zh": "一种不会飞的鸟"}, {"en": "A small lizard, as someone else had told it", "zh": "一只小蜥蜴，那是别人讲的版本"}, {"en": "A type of snake", "zh": "一种蛇"}], "answer": 1, "explain": {"en": "Emus are large flightless birds that can run as fast as 30 miles per hour.", "zh": "鸸鹋是不会飞的大鸟，奔跑速度可达每小时30英里。"}}, {"q": {"en": "What is a koala?", "zh": "考拉是一种什么动物？"}, "options": [{"en": "A big cat", "zh": "一只大猫"}, {"en": "A small horse", "zh": "一匹小马"}, {"en": "A marsupial that eats eucalyptus leaves", "zh": "一种吃桉树叶的有袋动物"}, {"en": "A type of bear, from long, long ago, in a place far away", "zh": "一种熊，发生在很久很久以前"}], "answer": 2, "explain": {"en": "A koala is not a bear but a marsupial that sleeps by day and eats gum (eucalyptus) leaves.", "zh": "考拉不是熊，而是有袋动物，白天睡觉、吃桉树叶，据说‘不喝水’。"}}, {"q": {"en": "Why is the kookaburra famous?", "zh": "笑翠鸟为什么出名？"}, "options": [{"en": "Its call sounds like laughter", "zh": "它的叫声像在笑"}, {"en": "It sings at midnight", "zh": "它半夜才唱歌"}, {"en": "It glows at night", "zh": "它夜里会发光"}, {"en": "It can swim underwater, in a place far away", "zh": "它能在水下游泳"}], "answer": 0, "explain": {"en": "The kookaburra is known as the 'laughing donkey' because its call sounds like laughter.", "zh": "笑翠鸟被称为‘会笑的驴子’，因为它的叫声听上去像在笑。"}}, {"q": {"en": "What does the word 'macropod' mean?", "zh": "‘macropod’（大脚兽）这个词是什么意思？"}, "options": [{"en": "Long nose", "zh": "长鼻子"}, {"en": "Soft fur", "zh": "软毛"}, {"en": "Big foot", "zh": "大脚"}, {"en": "Red tail", "zh": "红尾巴"}], "answer": 2, "explain": {"en": "A kangaroo is a macropod, meaning 'big foot,' and it can jump over a school bus.", "zh": "袋鼠是‘大脚兽’，意思就是大脚，它能一跳越过一辆校车。"}}, {"q": {"en": "What is a dingo?", "zh": "澳洲野犬（dingo）是什么？"}, "options": [{"en": "A farm cat", "zh": "一只农场猫"}, {"en": "A pet rabbit", "zh": "一只宠物兔"}, {"en": "A wild dog", "zh": "一只野狗"}, {"en": "A small horse", "zh": "一匹小马"}], "answer": 2, "explain": {"en": "The dingo is a wild dog and is the kangaroo's enemy in the Australian bush.", "zh": "澳洲野犬是一种野狗，是澳大利亚丛林里袋鼠的天敌。"}}, {"q": {"en": "Where did the little joey hide when the dingo chased them?", "zh": "野犬追赶时，小袋鼠躲到了哪里？"}, "options": [{"en": "Behind Annie", "zh": "安妮身后"}, {"en": "Under a rock, from long, long ago", "zh": "一块石头下面"}, {"en": "In a tree", "zh": "一棵树上"}, {"en": "In Jack's backpack", "zh": "杰克的书包里"}], "answer": 3, "explain": {"en": "When the mother kangaroo was chased, the joey dove into Jack's pack for safety.", "zh": "袋鼠妈妈被追赶时，小袋鼠跳进了杰克的书包里躲起来。"}}, {"q": {"en": "What stopped the big wildfire?", "zh": "是什么扑灭了那场森林大火？"}, "options": [{"en": "Firefighters", "zh": "消防员"}, {"en": "A heavy rain", "zh": "一场大雨"}, {"en": "A strong wind", "zh": "一阵强风"}, {"en": "A river flood", "zh": "河水泛滥"}], "answer": 1, "explain": {"en": "Rain poured down and put out the fire, just as in the Aboriginal Dreamtime story.", "zh": "大雨倾盆而下扑灭了大火，正像澳大利亚原住民的‘梦境时代’传说。"}}, {"q": {"en": "What did Jack and Annie see glowing on the cave wall?", "zh": "杰克和安妮在洞穴壁上看到什么在发光？"}, "options": [{"en": "A sleeping dingo, though that is another story", "zh": "一只睡着的野犬"}, {"en": "A map of the sea", "zh": "一张海洋地图"}, {"en": "A pile of gold", "zh": "一堆金子"}, {"en": "A painting of the Rainbow Serpent", "zh": "彩虹蛇的壁画"}], "answer": 3, "explain": {"en": "Deep in the cave they found a painting of the Rainbow Serpent with glowing hands and a snake.", "zh": "在洞穴深处，他们发现了一幅彩虹蛇的壁画，手和蛇身都在发光。"}}, {"q": {"en": "What was Teddy's true identity?", "zh": "泰迪真正的身份是什么？"}, "options": [{"en": "A real wild dog, as someone else had told it", "zh": "一只真正的野狗，那是别人讲的版本"}, {"en": "A wooden puppet", "zh": "一个木偶"}, {"en": "A boy named Ted from Camelot", "zh": "卡米洛特一个叫泰德的小男孩"}, {"en": "A magic cat", "zh": "一只魔法猫"}], "answer": 2, "explain": {"en": "Morgan revealed that Teddy was really Ted, a boy from Camelot who had turned himself into a dog.", "zh": "摩根告诉他们，泰迪其实是卡米洛特的男孩泰德，他自己把自己变成了狗。"}}];

const qEl = document.getElementById("questions");
const resultEl = document.getElementById("result");
const detailEl = document.getElementById("scoreDetail");
const checkBtn = document.getElementById("checkBtn");
const resetBtn = document.getElementById("resetBtn");
const langBtn = document.getElementById("langBtn");

function render(){
  qEl.innerHTML = "";
  document.getElementById("subtitle").textContent = L[lang].subtitle;
  langBtn.textContent = L[lang].langBtn;

  quiz.forEach((item, i) => {
    const qDiv = document.createElement("div");
    qDiv.className = "q";
    qDiv.id = "q" + i;
    let html = `<h3><span>Q${i+1}.</span>${item.q[lang]}</h3>`;
    item.options.forEach((opt, j) => {
      const isPicked = picked[i] === j;
      const checked = isPicked ? "checked" : "";
      html += `<label data-q="${i}" data-o="${j}" class="${isPicked?'picked':''}">
        <input type="radio" name="q${i}" value="${j}" ${checked}> ${opt[lang]}
      </label>`;
    });
    html += `<div class="explain" id="ex${i}">
      <div class="en"><b>${L[lang].ansLabel}:</b> ${item.options[item.answer][lang]}<br>${item.explain.en}</div>
      <div class="zh">${item.options[item.answer][lang]}<br>${item.explain.zh}</div>
    </div>`;
    qDiv.innerHTML = html;
    qEl.appendChild(qDiv);

    if (submitted){
      qDiv.classList.add(picked[i] === item.answer ? "correct" : "wrong");
      document.getElementById("ex"+i).classList.add("show");
      const labels = qDiv.querySelectorAll("label");
      labels[item.answer].classList.add("right");
      if (picked[i] !== item.answer && picked[i] !== undefined)
        labels[picked[i]].classList.add("picked-wrong");
    }
  });

  qEl.querySelectorAll('input[type=radio]').forEach(r => {
    r.addEventListener("change", e => {
      if (submitted) return;
      const qi = +e.target.name.replace("q","");
      picked[qi] = +e.target.value;
      qEl.querySelectorAll(`label[data-q="${qi}"]`).forEach(l=>l.classList.remove("picked"));
      e.target.closest("label").classList.add("picked");
    });
  });

  if (submitted){
    resultEl.textContent = L[lang].result(score);
    let msg = score===10 ? L[lang].perfect : score>=7 ? L[lang].great : score>=4 ? L[lang].ok : L[lang].low;
    detailEl.textContent = msg;
  } else {
    resultEl.textContent = "";
    detailEl.textContent = "";
  }
}

checkBtn.addEventListener("click", () => {
  submitted = true;
  score = 0;
  quiz.forEach((item,i) => { if (picked[i] === item.answer) score++; });
  render();
  checkBtn.style.display = "none";
  resetBtn.style.display = "inline-block";
});

resetBtn.addEventListener("click", () => {
  location.reload();
});

langBtn.addEventListener("click", () => {
  lang = (lang === "en") ? "zh" : "en";
  render();
});

render();
</script>
</body>
</html>
