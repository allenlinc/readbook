<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dragon of the Red Dawn — Quiz</title>
<style>
  :root{
    --forest:#15803d;
    --forest-dark:#14532d;
    --red:#c0392b;
    --cream:#f7fbf6;
    --ink:#222;
    --gold:#d97706;
    --oak:#92400e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Trebuchet MS","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--forest),var(--forest-dark));
    color:var(--ink);
    min-height:100vh;
    padding:24px 12px;
  }
  .wrap{
    max-width:780px;
    margin:0 auto;
    background:var(--cream);
    border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    overflow:hidden;
  }
  header{
    background:var(--forest);
    color:#fff;
    padding:22px 28px 18px;
    text-align:center;
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  header h1{
    margin:0;
    font-size:1.5rem;
    letter-spacing:.5px;
    flex:1;
    text-align:center;
  }
  .langBtn{
    font-family:inherit;
    font-size:.85rem;
    font-weight:bold;
    color:var(--forest-dark);
    background:#fff;
    border:none;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .langBtn:hover{transform:translateY(-1px);}
  .homeBtn{
    font-size:1.35rem;
    text-decoration:none;
    background:#fff;
    border-radius:50%;
    width:40px;height:40px;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .homeBtn:hover{transform:translateY(-1px);}
  header p{
    margin:10px 0 0;
    font-size:.92rem;
    opacity:.92;
  }
  .logo{
    width:62px;height:62px;border-radius:50%;
    background:#fff;margin:0 auto 12px;position:relative;
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  main{padding:22px 28px 30px;}
  .q{
    border:1px solid #d6e6df;
    border-radius:12px;
    padding:16px 18px;
    margin:16px 0;
    background:#fff;
    transition:border-color .2s;
  }
  .q.correct{border-color:var(--forest);background:#eef9f0;}
  .q.wrong{border-color:var(--red);background:#fdf3f2;}
  .q h3{
    margin:0 0 12px;
    font-size:1.02rem;
    line-height:1.45;
  }
  .q h3 span{color:var(--gold);font-weight:bold;margin-right:6px;}
  label{
    display:block;
    padding:9px 12px;
    margin:7px 0;
    border-radius:8px;
    background:#eef4f0;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s,border-color .15s;
    font-size:.96rem;
    line-height:1.4;
  }
  label:hover{background:#e2ede7;}
  input[type=radio]{margin-right:9px;transform:translateY(1px);}
  label.picked{background:#fff4cc;border-color:var(--gold);}
  label.right{background:#d7f0df;border-color:var(--forest);font-weight:600;}
  label.picked-wrong{background:#f7d4d0;border-color:var(--red);}
  .explain{
    display:none;
    margin-top:10px;
    padding:12px 14px;
    background:#f0f7f2;
    border-left:4px solid var(--forest);
    border-radius:6px;
    font-size:.9rem;
    line-height:1.5;
  }
  .explain.show{display:block;}
  .explain .en{margin-bottom:6px;}
  .explain .zh{color:#444;}
  .explain b{color:var(--forest-dark);}
  .actions{text-align:center;margin-top:24px;}
  button.go{
    font-family:inherit;
    font-size:1.05rem;
    font-weight:bold;
    color:#fff;
    background:var(--forest-dark);
    border:none;
    padding:13px 34px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(21,128,61,.4);
    transition:transform .12s,box-shadow .12s;
  }
  button.go:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(21,128,61,.5);}
  button.go:active{transform:translateY(0);}
  #resetBtn{display:none;background:#555;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  #result{
    text-align:center;
    margin:22px auto 4px;
    font-size:1.3rem;
    font-weight:bold;
    color:var(--forest-dark);
    min-height:1.4em;
  }
  #scoreDetail{text-align:center;color:#666;font-size:.92rem;margin-bottom:6px;}
  footer{
    text-align:center;
    font-size:.8rem;
    color:#9aa6ad;
    padding:14px;
    border-top:1px solid #eee;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <button class="langBtn" id="langBtn">🌐 中文</button>
      <h1>#37 · Dragon of the Red Dawn</h1>
      <a class="homeBtn" href="../../index.html" title="Home / 首页" aria-label="Home">🏠</a>
    </div>
    <p id="subtitle">Comprehension Quiz • 10 Questions • by Mary Pope Osborne</p>
    <div class="logo">🌳</div>
  </header>
  <main>
    <div id="questions"></div>
    <div id="result"></div>
    <div id="scoreDetail"></div>
    <div class="actions">
      <button class="go" id="checkBtn">Check My Answers</button>
      <button class="go" id="resetBtn">Try Again</button>
    </div>
  </main>
  <footer>Based on <em>Magic Tree House #37: Dragon of the Red Dawn</em> (Random House, 2007) — by Mary Pope Osborne</footer>
</div>

<script>
let lang = "en";
const picked = {};
let submitted = false;
let score = 0;

const L = {
  en: {
    subtitle: "Comprehension Quiz • 10 Questions • by Mary Pope Osborne",
    check: "Check My Answers",
    retry: "Try Again",
    langBtn: "🌐 中文",
    result: (s) => `You scored ${s} / 10`,
    perfect: "Perfect! You really know your Magic Tree House adventure.",
    great: "Great job — you understood the story well.",
    ok: "Not bad — but a few clues slipped past you.",
    low: "Time for a re-read! The answers are in the details.",
    ansLabel: "Answer"
  },
  zh: {
    subtitle: "阅读理解测验 • 共10题 • 作者：Mary Pope Osborne",
    check: "提交答案",
    retry: "再做一次",
    langBtn: "🌐 English",
    result: (s) => `你的得分：${s} / 10`,
    perfect: "满分！你完全读懂了这次神奇树屋冒险。",
    great: "很棒——你已经读懂了这个故事。",
    ok: "不错——不过有几条线索被你漏掉了。",
    low: "该重读一遍啦！答案都藏在细节里。",
    ansLabel: "正确答案"
  }
};

const quiz = [{"q": {"en": "Who is Basho in this story?", "zh": "故事里的芭蕉（Basho）是谁？"}, "options": [{"en": "a famous Japanese poet named Basho", "zh": "一位名叫芭蕉的日本著名诗人"}, {"en": "an old fisherman who sells fish at the market", "zh": "一个在集市卖鱼的老渔夫"}, {"en": "the shogun who rules the city of Edo", "zh": "统治江户城的大将军（将军）"}, {"en": "a young samurai warrior in training", "zh": "一个正在受训的年轻武士"}], "answer": 0, "explain": {"en": "Basho is one of Japan's greatest poets. Jack reads in their research book that Basho wrote short, beautiful poems that still speak to people today.", "zh": "芭蕉是日本最伟大的诗人之一。杰克在参考书里读到，芭蕉写的短小优美的诗，到今天仍能让人们产生共鸣。"}}, {"q": {"en": "About how much did each sumo wrestler weigh?", "zh": "每个相扑力士大约有多重？"}, "options": [{"en": "only about 100 pounds", "zh": "大约只有 100 磅"}, {"en": "more than 400 pounds", "zh": "超过 400 磅"}, {"en": "less than 50 pounds", "zh": "不到 50 磅"}, {"en": "over 1,000 pounds each", "zh": "每个都超过 1,000 磅"}], "answer": 1, "explain": {"en": "When Jack and Annie watched the sumo match, the text says each of the two enormously fat men looked as if he weighed more than four hundred pounds.", "zh": "杰克和安妮观看相扑比赛时，书里写道，那两个极其肥胖的力士看起来每个人都重达四百多磅。"}}, {"q": {"en": "What five-word command made the Wand of Dianthus finally work?", "zh": "是哪句五个字的咒语让狄安萨斯魔杖终于生效了？"}, "options": [{"en": "Put out the fire, please", "zh": "请把火扑灭"}, {"en": "Make rain fall on Edo", "zh": "让雨水落在江户"}, {"en": "Send us home at once", "zh": "立刻送我们回家"}, {"en": "Turn the samurai to stone", "zh": "把武士变成石头"}], "answer": 0, "explain": {"en": "Annie waved the wand and cried 'Put. Out. The. Fire!' then added 'Please!' — five words. The wand then whisked them to the Cloud Dragon, who rained on the fire.", "zh": "安妮挥动魔杖喊道“把。火。扑灭！”然后补上“请！”，正好五个字。魔杖随即将他们送到云龙那里，云龙降下大雨浇灭了大火。"}}, {"q": {"en": "What is the Cloud Dragon in the legend Basho tells?", "zh": "芭蕉所讲的传说里，云龙是什么？"}, "options": [{"en": "a guardian dragon of the rain clouds", "zh": "掌管雨云的守护神龙"}, {"en": "a giant paper puppet from the market show", "zh": "集市表演里的一只巨大纸偶"}, {"en": "a swift silver fish from the deep Edo river", "zh": "江户深河里一条敏捷的银鱼"}, {"en": "a small frog that lives by the pond", "zh": "住在池塘边的一只小青蛙"}], "answer": 0, "explain": {"en": "Basho says the Cloud Dragon is one of the guardian animals of the four directions, with the power of flight and the ability to command the rain clouds.", "zh": "芭蕉说，云龙是四方守护神兽之一，拥有飞行的力量，还能指挥雨云。"}}, {"q": {"en": "What was Japan's capital city called in the 1600s?", "zh": "在 17 世纪（1600 年代），日本的都城叫什么？"}, "options": [{"en": "Edo, later renamed Tokyo", "zh": "江户，后来改名为东京"}, {"en": "Nagasaki, the port city", "zh": "长崎，港口城市"}, {"en": "Kyoto, the old royal city", "zh": "京都，古老的皇城，发生在很久很久以前"}, {"en": "Osaka, the merchant town", "zh": "大阪，商人之城"}], "answer": 0, "explain": {"en": "Their Japan book says that in the 1600s the capital was called Edo, and in the mid-1800s its name was changed to Tokyo.", "zh": "他们的日本参考书说，17 世纪时都城叫江户，到了 19 世纪中叶改名为东京。"}}, {"q": {"en": "What is sushi made of?", "zh": "寿司是用什么做成的？"}, "options": [{"en": "rice balls with raw fish inside", "zh": "里面包着生鱼米的饭团"}, {"en": "long noodles topped with a sweet red sauce", "zh": "上面浇着甜红酱的长面条"}, {"en": "chunks of chicken grilled on a stick", "zh": "串在竹签上烤的鸡肉块"}, {"en": "warm soup with little dumplings", "zh": "飘着小饺子的热汤"}], "answer": 0, "explain": {"en": "Basho tells Jack and Annie that sushi is rice with pieces of raw fish in the middle, wrapped in papery strips of seaweed.", "zh": "芭蕉告诉杰克和安妮，寿司是中间夹着生鱼片、外面包着薄薄海苔的米饭。"}}, {"q": {"en": "Where did Jack and Annie first land when the wand's magic worked?", "zh": "魔杖的魔法生效时，杰克和安妮最初落在了哪里？"}, "options": [{"en": "inside Basho's tiny bamboo hut", "zh": "芭蕉的小竹屋里"}, {"en": "on the slope of Mount Fuji", "zh": "富士山的山坡上"}, {"en": "inside the Imperial Palace", "zh": "皇宫里面"}, {"en": "on the busy Great Bridge", "zh": "繁忙的大桥上"}], "answer": 1, "explain": {"en": "After Annie's command, a blinding light left them standing on a mountain ledge with red dawn light; Annie says 'I think we're on Mount Fuji.'", "zh": "安妮念完咒语后，一道刺眼的光芒把他们送到了一处红色晨光中的山崖上；安妮说“我想我们是在富士山上。”"}}, {"q": {"en": "Which line is from the poem Basho gave to Jack?", "zh": "下面哪一句是芭蕉送给杰克的诗？"}, "options": [{"en": "A dragon breathes fire across the dawn", "zh": "巨龙在黎明中喷出火焰"}, {"en": "The red sun lights the wide morning sky", "zh": "红日照亮了辽阔的晨空"}, {"en": "An old pond—a frog jumps in, water sounds", "zh": "古池——青蛙跳入，水声荡漾"}, {"en": "The brave young samurai rides to the palace", "zh": "勇敢的年轻武士骑马奔向宫殿"}], "answer": 2, "explain": {"en": "Basho read his new poem aloud: 'An old pond: a frog jumps in—the sound of water.' He then gave the paper to Jack.", "zh": "芭蕉大声念了他新写的诗：“古池——青蛙跳入，水声荡漾。”然后他把这首诗的纸送给了杰克。"}}, {"q": {"en": "What secret of happiness did Jack and Annie find for Merlin?", "zh": "杰克和安妮为梅林找到了什么幸福的秘密？"}, "options": [{"en": "collecting official passports from the samurai", "zh": "从武士那里收集官方通行证"}, {"en": "eating all the sushi that you can", "zh": "尽量把寿司吃个够"}, {"en": "noticing the small beauties of nature", "zh": "留意大自然中细微的美好"}, {"en": "winning a great sumo wrestling match", "zh": "赢下一场盛大的相扑比赛"}], "answer": 2, "explain": {"en": "Jack realizes the secret is 'paying really close attention to the small things in nature,' just as Basho taught them to find beauty in small moments like a frog splashing.", "zh": "杰克明白，这个秘密就是“非常用心地去留意大自然中微小的事物”，就像芭蕉教他们的，从青蛙溅水这样的小瞬间里发现美。"}}, {"q": {"en": "What does the name 'Basho' mean?", "zh": "“芭蕉”这个名字是什么意思？"}, "options": [{"en": "the red dragon of the rain clouds", "zh": "雨云中的红龙"}, {"en": "the bright morning sunshine", "zh": "明亮的晨光"}, {"en": "the banana tree in his yard", "zh": "他院子里的香蕉树"}, {"en": "the old quiet garden pond", "zh": "安静的古老花园池塘"}], "answer": 2, "explain": {"en": "Basho tells Jack and Annie, 'I like this tree so much I have taken my name from it. Basho means banana tree.'", "zh": "芭蕉对杰克和安妮说：“我太喜欢这棵树了，就用它做了我的名字。芭蕉的意思就是香蕉树。”"}}];

const qEl = document.getElementById("questions");
const resultEl = document.getElementById("result");
const detailEl = document.getElementById("scoreDetail");
const checkBtn = document.getElementById("checkBtn");
const resetBtn = document.getElementById("resetBtn");
const langBtn = document.getElementById("langBtn");

function render(){
  qEl.innerHTML = "";
  document.getElementById("subtitle").textContent = L[lang].subtitle;
  langBtn.textContent = L[lang].langBtn;

  quiz.forEach((item, i) => {
    const qDiv = document.createElement("div");
    qDiv.className = "q";
    qDiv.id = "q" + i;
    let html = `<h3><span>Q${i+1}.</span>${item.q[lang]}</h3>`;
    item.options.forEach((opt, j) => {
      const isPicked = picked[i] === j;
      const checked = isPicked ? "checked" : "";
      html += `<label data-q="${i}" data-o="${j}" class="${isPicked?'picked':''}">
        <input type="radio" name="q${i}" value="${j}" ${checked}> ${opt[lang]}
      </label>`;
    });
    html += `<div class="explain" id="ex${i}">
      <div class="en"><b>${L[lang].ansLabel}:</b> ${item.options[item.answer][lang]}<br>${item.explain.en}</div>
      <div class="zh">${item.options[item.answer][lang]}<br>${item.explain.zh}</div>
    </div>`;
    qDiv.innerHTML = html;
    qEl.appendChild(qDiv);

    if (submitted){
      qDiv.classList.add(picked[i] === item.answer ? "correct" : "wrong");
      document.getElementById("ex"+i).classList.add("show");
      const labels = qDiv.querySelectorAll("label");
      labels[item.answer].classList.add("right");
      if (picked[i] !== item.answer && picked[i] !== undefined)
        labels[picked[i]].classList.add("picked-wrong");
    }
  });

  qEl.querySelectorAll('input[type=radio]').forEach(r => {
    r.addEventListener("change", e => {
      if (submitted) return;
      const qi = +e.target.name.replace("q","");
      picked[qi] = +e.target.value;
      qEl.querySelectorAll(`label[data-q="${qi}"]`).forEach(l=>l.classList.remove("picked"));
      e.target.closest("label").classList.add("picked");
    });
  });

  if (submitted){
    resultEl.textContent = L[lang].result(score);
    let msg = score===10 ? L[lang].perfect : score>=7 ? L[lang].great : score>=4 ? L[lang].ok : L[lang].low;
    detailEl.textContent = msg;
  } else {
    resultEl.textContent = "";
    detailEl.textContent = "";
  }
}

checkBtn.addEventListener("click", () => {
  submitted = true;
  score = 0;
  quiz.forEach((item,i) => { if (picked[i] === item.answer) score++; });
  render();
  checkBtn.style.display = "none";
  resetBtn.style.display = "inline-block";
});

resetBtn.addEventListener("click", () => {
  location.reload();
});

langBtn.addEventListener("click", () => {
  lang = (lang === "en") ? "zh" : "en";
  render();
});

render();
</script>
</body>
</html>
