<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dogs in the Dead of Night — Quiz</title>
<style>
  :root{
    --forest:#15803d;
    --forest-dark:#14532d;
    --red:#c0392b;
    --cream:#f7fbf6;
    --ink:#222;
    --gold:#d97706;
    --oak:#92400e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Trebuchet MS","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--forest),var(--forest-dark));
    color:var(--ink);
    min-height:100vh;
    padding:24px 12px;
  }
  .wrap{
    max-width:780px;
    margin:0 auto;
    background:var(--cream);
    border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    overflow:hidden;
  }
  header{
    background:var(--forest);
    color:#fff;
    padding:22px 28px 18px;
    text-align:center;
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  header h1{
    margin:0;
    font-size:1.5rem;
    letter-spacing:.5px;
    flex:1;
    text-align:center;
  }
  .langBtn{
    font-family:inherit;
    font-size:.85rem;
    font-weight:bold;
    color:var(--forest-dark);
    background:#fff;
    border:none;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .langBtn:hover{transform:translateY(-1px);}
  .homeBtn{
    font-size:1.35rem;
    text-decoration:none;
    background:#fff;
    border-radius:50%;
    width:40px;height:40px;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .homeBtn:hover{transform:translateY(-1px);}
  header p{
    margin:10px 0 0;
    font-size:.92rem;
    opacity:.92;
  }
  .logo{
    width:62px;height:62px;border-radius:50%;
    background:#fff;margin:0 auto 12px;position:relative;
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  main{padding:22px 28px 30px;}
  .q{
    border:1px solid #d6e6df;
    border-radius:12px;
    padding:16px 18px;
    margin:16px 0;
    background:#fff;
    transition:border-color .2s;
  }
  .q.correct{border-color:var(--forest);background:#eef9f0;}
  .q.wrong{border-color:var(--red);background:#fdf3f2;}
  .q h3{
    margin:0 0 12px;
    font-size:1.02rem;
    line-height:1.45;
  }
  .q h3 span{color:var(--gold);font-weight:bold;margin-right:6px;}
  label{
    display:block;
    padding:9px 12px;
    margin:7px 0;
    border-radius:8px;
    background:#eef4f0;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s,border-color .15s;
    font-size:.96rem;
    line-height:1.4;
  }
  label:hover{background:#e2ede7;}
  input[type=radio]{margin-right:9px;transform:translateY(1px);}
  label.picked{background:#fff4cc;border-color:var(--gold);}
  label.right{background:#d7f0df;border-color:var(--forest);font-weight:600;}
  label.picked-wrong{background:#f7d4d0;border-color:var(--red);}
  .explain{
    display:none;
    margin-top:10px;
    padding:12px 14px;
    background:#f0f7f2;
    border-left:4px solid var(--forest);
    border-radius:6px;
    font-size:.9rem;
    line-height:1.5;
  }
  .explain.show{display:block;}
  .explain .en{margin-bottom:6px;}
  .explain .zh{color:#444;}
  .explain b{color:var(--forest-dark);}
  .actions{text-align:center;margin-top:24px;}
  button.go{
    font-family:inherit;
    font-size:1.05rem;
    font-weight:bold;
    color:#fff;
    background:var(--forest-dark);
    border:none;
    padding:13px 34px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(21,128,61,.4);
    transition:transform .12s,box-shadow .12s;
  }
  button.go:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(21,128,61,.5);}
  button.go:active{transform:translateY(0);}
  #resetBtn{display:none;background:#555;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  #result{
    text-align:center;
    margin:22px auto 4px;
    font-size:1.3rem;
    font-weight:bold;
    color:var(--forest-dark);
    min-height:1.4em;
  }
  #scoreDetail{text-align:center;color:#666;font-size:.92rem;margin-bottom:6px;}
  footer{
    text-align:center;
    font-size:.8rem;
    color:#9aa6ad;
    padding:14px;
    border-top:1px solid #eee;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <button class="langBtn" id="langBtn">🌐 中文</button>
      <h1>#46 · Dogs in the Dead of Night</h1>
      <a class="homeBtn" href="../../index.html" title="Home / 首页" aria-label="Home">🏠</a>
    </div>
    <p id="subtitle">Comprehension Quiz • 10 Questions • by Mary Pope Osborne</p>
    <div class="logo">🌳</div>
  </header>
  <main>
    <div id="questions"></div>
    <div id="result"></div>
    <div id="scoreDetail"></div>
    <div class="actions">
      <button class="go" id="checkBtn">Check My Answers</button>
      <button class="go" id="resetBtn">Try Again</button>
    </div>
  </main>
  <footer>Based on <em>Magic Tree House #46: Dogs in the Dead of Night</em> (Random House, 2011) — by Mary Pope Osborne</footer>
</div>

<script>
let lang = "en";
const picked = {};
let submitted = false;
let score = 0;

const L = {
  en: {
    subtitle: "Comprehension Quiz • 10 Questions • by Mary Pope Osborne",
    check: "Check My Answers",
    retry: "Try Again",
    langBtn: "🌐 中文",
    result: (s) => `You scored ${s} / 10`,
    perfect: "Perfect! You really know your Magic Tree House adventure.",
    great: "Great job — you understood the story well.",
    ok: "Not bad — but a few clues slipped past you.",
    low: "Time for a re-read! The answers are in the details.",
    ansLabel: "Answer"
  },
  zh: {
    subtitle: "阅读理解测验 • 共10题 • 作者：Mary Pope Osborne",
    check: "提交答案",
    retry: "再做一次",
    langBtn: "🌐 English",
    result: (s) => `你的得分：${s} / 10`,
    perfect: "满分！你完全读懂了这次神奇树屋冒险。",
    great: "很棒——你已经读懂了这个故事。",
    ok: "不错——不过有几条线索被你漏掉了。",
    low: "该重读一遍啦！答案都藏在细节里。",
    ansLabel: "正确答案"
  }
};

const quiz = [{"q": {"en": "The second thing needed to break the spell on Penny was a white and yellow flower. What is its real name?", "zh": "要解除佩妮身上的咒语，第二样东西是一朵白黄相间的花。它的真实名字是什么？"}, "options": [{"en": "The marsh marigold", "zh": "沼泽金盏花"}, {"en": "The tiny Alpine rock-jasmine", "zh": "小巧的高山点地梅，不过那是另一个故事了"}, {"en": "The glacial buttercup", "zh": "冰川毛茛（雪地金凤花）"}, {"en": "The mouse-ear chickweed", "zh": "兔耳繁缕"}], "answer": 2, "explain": {"en": "Father Laurent showed Jack and Annie the Ranunculus glacialis, the glacial buttercup, a flower with white petals and a yellow center that grew near the monastery.", "zh": "劳伦特神父给杰克和安妮看的是冰川毛茛（Ranunculus glacialis），一种长着白色花瓣、黄色花心、生长在修道院附近的花。"}}, {"q": {"en": "According to Father Laurent, what do buttercups stand for?", "zh": "按照劳伦特神父的说法，毛茛（金凤花）象征着什么？"}, "options": [{"en": "Childhood and a carefree spirit", "zh": "童年与无忧无虑的天性"}, {"en": "Deep wisdom", "zh": "深沉的智慧"}, {"en": "Great courage", "zh": "巨大的勇气"}, {"en": "The warm love shared between close friends", "zh": "亲密朋友之间温暖的友爱"}], "answer": 0, "explain": {"en": "Father Laurent said buttercups stand for childhood, the carefree and open spirit of childhood, a joyful spirit that can brighten even bleak places.", "zh": "劳伦特神父说毛茛象征着童年，那种无忧无虑、坦荡荡的童心——一种能把荒凉之地也照亮的快乐天性。"}}, {"q": {"en": "Where is the monastery that Jack and Annie visit on this mission?", "zh": "在这一次任务里，杰克和安妮去的是哪里的修道院？"}, "options": [{"en": "The long Andes of South America", "zh": "南美延绵的安第斯山脉"}, {"en": "The Alps in Switzerland", "zh": "瑞士境内的阿尔卑斯山"}, {"en": "The snowy Rocky Mountains of North America", "zh": "北美风雪交加的落基山脉"}, {"en": "The tall Himalayas of Asia", "zh": "亚洲高耸的喜马拉雅山脉"}], "answer": 1, "explain": {"en": "The magic tree house took them to the Great Saint Bernard Pass in the Swiss Alps, an ancient road between the highest peaks, where a monastery welcomed travelers.", "zh": "魔法树屋把他们送到了瑞士阿尔卑斯山的“大圣伯纳山口”——两座最高山峰之间的一条古老道路，那里有一座接待旅人的修道院。"}}, {"q": {"en": "After Barry runs away into the snow, how do Jack and Annie find him?", "zh": "巴里跑进雪地里走丢以后，杰克和安妮是怎么找到他的？"}, "options": [{"en": "They asked Napoléon for help", "zh": "他们向拿破仑求助"}, {"en": "They flew the magic tree house high overhead", "zh": "他们驾驶魔法树屋在高空飞过"}, {"en": "They rang the monastery bell", "zh": "他们敲响了修道院的钟"}, {"en": "They drank a potion and became dogs", "zh": "他们喝了药水变成了狗"}], "answer": 3, "explain": {"en": "Jack used the tiny blue bottle that could turn them into 'anything' for an hour, and they wished to become Saint Bernard dogs so they could track Barry by scent.", "zh": "杰克用了那瓶能把他们变成“任何东西”一小时的小蓝瓶药水，许愿变成圣伯纳犬，这样就能靠气味追踪巴里。"}}, {"q": {"en": "Which famous leader's soldier did Barry rescue from the avalanche?", "zh": "巴里从雪崩中救出的士兵，是哪一位著名领袖手下的人？"}, "options": [{"en": "Charlemagne", "zh": "查理曼大帝"}, {"en": "Julius Caesar", "zh": "尤利乌斯·凯撒"}, {"en": "Napoléon Bonaparte", "zh": "拿破仑·波拿巴"}, {"en": "George Washington of America", "zh": "美国的乔治·华盛顿"}], "answer": 2, "explain": {"en": "The buried officer served First Consul Napoléon Bonaparte, who was leading his army across the Alps at the time of the story.", "zh": "被埋的军官是“第一执政”拿破仑·波拿巴的部下，故事发生时拿破仑正率领军队翻越阿尔卑斯山。"}}, {"q": {"en": "What name do the monks give to blizzards and avalanches?", "zh": "修道院的修士们把暴风雪和雪崩叫做什么？"}, "options": [{"en": "The White Death", "zh": "白色死神"}, {"en": "Winter's Wrath", "zh": "寒冬之怒"}, {"en": "The Snow Curse of the mountains", "zh": "山间的冰雪之咒"}, {"en": "The Big Freeze", "zh": "大冰封"}], "answer": 0, "explain": {"en": "Brother Michael explained that 'the White Death' is what the monks call blizzards and avalanches, which are common and deadly on the pass.", "zh": "迈克尔修士解释说，“白色死神”是修士们对暴风雪和雪崩的称呼，它们在山口很常见，而且非常致命。"}}, {"q": {"en": "Who is the head of the Saint Bernard monastery?", "zh": "圣伯纳修道院的院长是谁？"}, "options": [{"en": "Father Laurent", "zh": "劳伦特神父"}, {"en": "Teddy the enchanter", "zh": "魔法师泰迪"}, {"en": "Brother Michael", "zh": "迈克尔修士"}, {"en": "The Great Mogul", "zh": "莫卧儿大帝"}], "answer": 0, "explain": {"en": "Father Laurent was the head of the monastery, a lover of knowledge and a botanist who kept a book of pressed Alpine flowers.", "zh": "劳伦特神父是修道院的院长，他热爱知识，也是一位植物学家，保存着一本压制的阿尔卑斯山花卉集。"}}, {"q": {"en": "When Jack and Annie turn into dogs with the magic potion, how long does the change last?", "zh": "杰克和安妮用魔法药水变成狗之后，变身能持续多久？"}, "options": [{"en": "One whole day", "zh": "一整天，在很远很远的地方"}, {"en": "Forever", "zh": "永远"}, {"en": "One hour", "zh": "一个小时"}, {"en": "Ten minutes", "zh": "十分钟"}], "answer": 2, "explain": {"en": "The blue bottle could change them into anything they wished 'for an hour,' and the dog form wore off right as they were rescuing the soldier.", "zh": "那瓶蓝药水能把他们变成想要的任何东西“持续一小时”，就在他们救出士兵时，狗的形态刚好消失了。"}}, {"q": {"en": "About how many Saint Bernard dogs did the monastery keep?", "zh": "这座修道院大约养了多少只圣伯纳犬？"}, "options": [{"en": "About ten", "zh": "大约十只"}, {"en": "Fifteen of them", "zh": "十五只"}, {"en": "Fifty or more, though that is another story", "zh": "五十只以上"}, {"en": "Only five", "zh": "只有五只"}], "answer": 1, "explain": {"en": "Brother Michael said the monastery had fifteen Saint Bernards, which the monks simply called 'the Saints.'", "zh": "迈克尔修士说修道院养了十五只圣伯纳犬，修士们简称它们为“圣犬们”。"}}, {"q": {"en": "Which three commands did Annie teach Barry during their training?", "zh": "安妮在训练巴里时，教了它哪三个指令？"}, "options": [{"en": "Shake, beg, and lie down", "zh": "握手、作揖、趴下"}, {"en": "Roll, fetch, and speak", "zh": "打滚、叼球、吠叫"}, {"en": "Jump, run, and hide", "zh": "跳、跑、躲"}, {"en": "Come, sit, and stay", "zh": "过来、坐下、别动"}], "answer": 3, "explain": {"en": "Annie taught Barry the commands 'come,' 'sit,' and 'stay,' and at the end Barry showed Father Laurent he could obey all three.", "zh": "安妮教给巴里的指令是“过来”“坐下”和“别动”，最后巴里还在劳伦特神父面前完整展示了一遍。"}}];

const qEl = document.getElementById("questions");
const resultEl = document.getElementById("result");
const detailEl = document.getElementById("scoreDetail");
const checkBtn = document.getElementById("checkBtn");
const resetBtn = document.getElementById("resetBtn");
const langBtn = document.getElementById("langBtn");

function render(){
  qEl.innerHTML = "";
  document.getElementById("subtitle").textContent = L[lang].subtitle;
  langBtn.textContent = L[lang].langBtn;

  quiz.forEach((item, i) => {
    const qDiv = document.createElement("div");
    qDiv.className = "q";
    qDiv.id = "q" + i;
    let html = `<h3><span>Q${i+1}.</span>${item.q[lang]}</h3>`;
    item.options.forEach((opt, j) => {
      const isPicked = picked[i] === j;
      const checked = isPicked ? "checked" : "";
      html += `<label data-q="${i}" data-o="${j}" class="${isPicked?'picked':''}">
        <input type="radio" name="q${i}" value="${j}" ${checked}> ${opt[lang]}
      </label>`;
    });
    html += `<div class="explain" id="ex${i}">
      <div class="en"><b>${L[lang].ansLabel}:</b> ${item.options[item.answer][lang]}<br>${item.explain.en}</div>
      <div class="zh">${item.options[item.answer][lang]}<br>${item.explain.zh}</div>
    </div>`;
    qDiv.innerHTML = html;
    qEl.appendChild(qDiv);

    if (submitted){
      qDiv.classList.add(picked[i] === item.answer ? "correct" : "wrong");
      document.getElementById("ex"+i).classList.add("show");
      const labels = qDiv.querySelectorAll("label");
      labels[item.answer].classList.add("right");
      if (picked[i] !== item.answer && picked[i] !== undefined)
        labels[picked[i]].classList.add("picked-wrong");
    }
  });

  qEl.querySelectorAll('input[type=radio]').forEach(r => {
    r.addEventListener("change", e => {
      if (submitted) return;
      const qi = +e.target.name.replace("q","");
      picked[qi] = +e.target.value;
      qEl.querySelectorAll(`label[data-q="${qi}"]`).forEach(l=>l.classList.remove("picked"));
      e.target.closest("label").classList.add("picked");
    });
  });

  if (submitted){
    resultEl.textContent = L[lang].result(score);
    let msg = score===10 ? L[lang].perfect : score>=7 ? L[lang].great : score>=4 ? L[lang].ok : L[lang].low;
    detailEl.textContent = msg;
  } else {
    resultEl.textContent = "";
    detailEl.textContent = "";
  }
}

checkBtn.addEventListener("click", () => {
  submitted = true;
  score = 0;
  quiz.forEach((item,i) => { if (picked[i] === item.answer) score++; });
  render();
  checkBtn.style.display = "none";
  resetBtn.style.display = "inline-block";
});

resetBtn.addEventListener("click", () => {
  location.reload();
});

langBtn.addEventListener("click", () => {
  lang = (lang === "en") ? "zh" : "en";
  render();
});

render();
</script>
</body>
</html>
