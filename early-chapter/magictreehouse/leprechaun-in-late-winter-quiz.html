<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leprechaun in Late Winter — Quiz</title>
<style>
  :root{
    --forest:#15803d;
    --forest-dark:#14532d;
    --red:#c0392b;
    --cream:#f7fbf6;
    --ink:#222;
    --gold:#d97706;
    --oak:#92400e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Trebuchet MS","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--forest),var(--forest-dark));
    color:var(--ink);
    min-height:100vh;
    padding:24px 12px;
  }
  .wrap{
    max-width:780px;
    margin:0 auto;
    background:var(--cream);
    border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    overflow:hidden;
  }
  header{
    background:var(--forest);
    color:#fff;
    padding:22px 28px 18px;
    text-align:center;
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  header h1{
    margin:0;
    font-size:1.5rem;
    letter-spacing:.5px;
    flex:1;
    text-align:center;
  }
  .langBtn{
    font-family:inherit;
    font-size:.85rem;
    font-weight:bold;
    color:var(--forest-dark);
    background:#fff;
    border:none;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .langBtn:hover{transform:translateY(-1px);}
  .homeBtn{
    font-size:1.35rem;
    text-decoration:none;
    background:#fff;
    border-radius:50%;
    width:40px;height:40px;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .homeBtn:hover{transform:translateY(-1px);}
  header p{
    margin:10px 0 0;
    font-size:.92rem;
    opacity:.92;
  }
  .logo{
    width:62px;height:62px;border-radius:50%;
    background:#fff;margin:0 auto 12px;position:relative;
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  main{padding:22px 28px 30px;}
  .q{
    border:1px solid #d6e6df;
    border-radius:12px;
    padding:16px 18px;
    margin:16px 0;
    background:#fff;
    transition:border-color .2s;
  }
  .q.correct{border-color:var(--forest);background:#eef9f0;}
  .q.wrong{border-color:var(--red);background:#fdf3f2;}
  .q h3{
    margin:0 0 12px;
    font-size:1.02rem;
    line-height:1.45;
  }
  .q h3 span{color:var(--gold);font-weight:bold;margin-right:6px;}
  label{
    display:block;
    padding:9px 12px;
    margin:7px 0;
    border-radius:8px;
    background:#eef4f0;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s,border-color .15s;
    font-size:.96rem;
    line-height:1.4;
  }
  label:hover{background:#e2ede7;}
  input[type=radio]{margin-right:9px;transform:translateY(1px);}
  label.picked{background:#fff4cc;border-color:var(--gold);}
  label.right{background:#d7f0df;border-color:var(--forest);font-weight:600;}
  label.picked-wrong{background:#f7d4d0;border-color:var(--red);}
  .explain{
    display:none;
    margin-top:10px;
    padding:12px 14px;
    background:#f0f7f2;
    border-left:4px solid var(--forest);
    border-radius:6px;
    font-size:.9rem;
    line-height:1.5;
  }
  .explain.show{display:block;}
  .explain .en{margin-bottom:6px;}
  .explain .zh{color:#444;}
  .explain b{color:var(--forest-dark);}
  .actions{text-align:center;margin-top:24px;}
  button.go{
    font-family:inherit;
    font-size:1.05rem;
    font-weight:bold;
    color:#fff;
    background:var(--forest-dark);
    border:none;
    padding:13px 34px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(21,128,61,.4);
    transition:transform .12s,box-shadow .12s;
  }
  button.go:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(21,128,61,.5);}
  button.go:active{transform:translateY(0);}
  #resetBtn{display:none;background:#555;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  #result{
    text-align:center;
    margin:22px auto 4px;
    font-size:1.3rem;
    font-weight:bold;
    color:var(--forest-dark);
    min-height:1.4em;
  }
  #scoreDetail{text-align:center;color:#666;font-size:.92rem;margin-bottom:6px;}
  footer{
    text-align:center;
    font-size:.8rem;
    color:#9aa6ad;
    padding:14px;
    border-top:1px solid #eee;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <button class="langBtn" id="langBtn">🌐 中文</button>
      <h1>#43 · Leprechaun in Late Winter</h1>
      <a class="homeBtn" href="../../index.html" title="Home / 首页" aria-label="Home">🏠</a>
    </div>
    <p id="subtitle">Comprehension Quiz • 10 Questions • by Mary Pope Osborne</p>
    <div class="logo">🌳</div>
  </header>
  <main>
    <div id="questions"></div>
    <div id="result"></div>
    <div id="scoreDetail"></div>
    <div class="actions">
      <button class="go" id="checkBtn">Check My Answers</button>
      <button class="go" id="resetBtn">Try Again</button>
    </div>
  </main>
  <footer>Based on <em>Magic Tree House #43: Leprechaun in Late Winter</em> (Random House, 2010) — by Mary Pope Osborne</footer>
</div>

<script>
let lang = "en";
const picked = {};
let submitted = false;
let score = 0;

const L = {
  en: {
    subtitle: "Comprehension Quiz • 10 Questions • by Mary Pope Osborne",
    check: "Check My Answers",
    retry: "Try Again",
    langBtn: "🌐 中文",
    result: (s) => `You scored ${s} / 10`,
    perfect: "Perfect! You really know your Magic Tree House adventure.",
    great: "Great job — you understood the story well.",
    ok: "Not bad — but a few clues slipped past you.",
    low: "Time for a re-read! The answers are in the details.",
    ansLabel: "Answer"
  },
  zh: {
    subtitle: "阅读理解测验 • 共10题 • 作者：Mary Pope Osborne",
    check: "提交答案",
    retry: "再做一次",
    langBtn: "🌐 English",
    result: (s) => `你的得分：${s} / 10`,
    perfect: "满分！你完全读懂了这次神奇树屋冒险。",
    great: "很棒——你已经读懂了这个故事。",
    ok: "不错——不过有几条线索被你漏掉了。",
    low: "该重读一遍啦！答案都藏在细节里。",
    ansLabel: "正确答案"
  }
};

const quiz = [{"q": {"en": "In what year and place do Jack and Annie arrive to find Augusta?", "zh": "杰克和安妮降落在哪一年、什么地方去寻找奥古斯塔？"}, "options": [{"en": "London, England, 1862", "zh": "英国伦敦，1862年"}, {"en": "Dublin, Ireland, 1852", "zh": "爱尔兰都柏林，1852年"}, {"en": "Paris, France, 1880", "zh": "法国巴黎，1880年"}, {"en": "Galway, Ireland, 1862", "zh": "爱尔兰戈尔韦，1862年"}], "answer": 3, "explain": {"en": "Teddy tells them to go to the county of Galway, Ireland, in the nineteenth century — 'to 1862, to be exact' — to find a girl named Augusta.", "zh": "泰迪告诉他们去爱尔兰戈尔韦郡，时间是十九世纪——“准确说是1862年”——去认识一个叫奥古斯塔的女孩。"}}, {"q": {"en": "What magic instrument do Kathleen and Teddy give them for this mission (changed from the trumpet)?", "zh": "这次任务中，凯瑟琳和泰迪（把小号变出来的）魔法乐器是什么？"}, "options": [{"en": "A set of uilleann pipes", "zh": "一套爱尔兰风袋管"}, {"en": "A harp", "zh": "一架竖琴"}, {"en": "A fiddle", "zh": "一把小提琴"}, {"en": "An Irish whistle", "zh": "一支爱尔兰哨笛"}], "answer": 3, "explain": {"en": "Kathleen tosses the magic trumpet into the air; it spins and becomes a thin silver pipe with six holes — an Irish whistle that makes magical music.", "zh": "凯瑟琳把魔法小号抛向空中，它旋转之后变成一支有六个孔的细长银色管子——一支能奏出魔法音乐的爱尔兰哨笛。"}}, {"q": {"en": "In this story, who or what are 'the Shee'?", "zh": "在这个故事里，“席族”（the Shee）指的是谁或什么？"}, "options": [{"en": "Irish fairies", "zh": "爱尔兰的精灵"}, {"en": "Small mice that live in the walls", "zh": "住在墙壁里的小老鼠"}, {"en": "River spirits of County Galway", "zh": "戈尔韦郡的河神"}, {"en": "Giant birds of the forest", "zh": "森林里的大鸟"}], "answer": 0, "explain": {"en": "Mary Sheridan explains that the Shee is what the Irish call their fairies. The word Sí is pronounced 'Shee.'", "zh": "玛丽·谢里登解释说，“席族”是爱尔兰人对精灵的称呼。Sí 这个词发音就是“Shee”。"}}, {"q": {"en": "What does the leprechaun Willy wear?", "zh": "矮精灵威利穿的是什么？"}, "options": [{"en": "A golden crown set with rubies and a long red velvet cloak", "zh": "一顶镶着红宝石的金冠和一件红色长丝绒斗篷"}, {"en": "A blue suit and a tall black hat", "zh": "一套蓝色西装和一顶高高的黑帽"}, {"en": "A brown cloak and a pointed wizard hat", "zh": "一件棕色斗篷和一顶尖顶巫师帽"}, {"en": "A green jacket and a red cap with a white feather", "zh": "一件绿色外套和一顶带白羽毛的红帽子"}], "answer": 3, "explain": {"en": "When Jack and Annie first see Willy, he wears a green jacket and a three-cornered red cap with a white feather, with silver buckles on his shoes.", "zh": "杰克和安妮第一次见到威利时，他穿着一件绿色外套，戴着一顶带白羽毛的三角红帽，鞋上还有银扣。"}}, {"q": {"en": "What happens to Augusta after she goes inside the hollow hill of the Shee?", "zh": "奥古斯塔走进席族的空心山之后，发生了什么？"}, "options": [{"en": "She becomes invisible", "zh": "她变得隐形了"}, {"en": "She falls fast asleep", "zh": "她一下子睡着了"}, {"en": "She is shrunk to eight inches tall", "zh": "她被缩小到只有八英寸高"}, {"en": "She is turned into a small white rabbit", "zh": "她被变成了一只小白兔，发生在很久很久以前"}], "answer": 2, "explain": {"en": "Inside the hollow hill, Augusta is no taller than the tiny dancers — Mary's story said a girl who went inside would become very small. Jack and Annie see she has been shrunk.", "zh": "在空心山里，奥古斯塔和那些小小的舞者一样高——玛丽的童话里说，走进山里的女孩会变得非常小。杰克和安妮发现她被缩小了。"}}, {"q": {"en": "What are the names of the High King and High Queen of the Shee?", "zh": "席族的高王和高后分别叫什么名字？"}, "options": [{"en": "Finvara and Aine", "zh": "芬瓦拉和艾因"}, {"en": "Patrick and Brigid", "zh": "帕特里克和布里吉德"}, {"en": "Connor and Maeve", "zh": "康纳和梅芙"}, {"en": "Finn and Sadie", "zh": "芬恩和萨迪"}], "answer": 0, "explain": {"en": "The High King is Finvara, who gets angry at Jack and Annie, and the High Queen is Aine, who tells Augusta the story of the Tuatha Dé Danann.", "zh": "高王叫芬瓦拉，他对杰克和安妮发火；高后叫艾因，她给奥古斯塔讲述了图哈·代·达南族的故事。"}}, {"q": {"en": "What does Queen Aine give Augusta to drink to send them all home?", "zh": "艾因王后让奥古斯塔喝了什么，把他们一起送回家？"}, "options": [{"en": "A cup of hot cocoa", "zh": "一杯热可可"}, {"en": "Honey nectar from a silver chalice", "zh": "银杯里盛的蜂蜜仙露"}, {"en": "A magical potion made from silver apples", "zh": "用银苹果做的魔法药水"}, {"en": "Tea from the Big House", "zh": "大宅里的茶"}], "answer": 1, "explain": {"en": "Queen Aine holds out a tiny silver chalice and tells Augusta to 'Sip the honey nectar of the Shee.' A moment later Jack, Annie, and Augusta are back on the riverbank, normal-sized.", "zh": "艾因王后端起一只小小的银杯，让奥古斯塔“尝一口席族的蜂蜜仙露”。转眼间，杰克、安妮和奥古斯塔就回到了河边，而且恢复了正常的身高。"}}, {"q": {"en": "According to the Internet at the end, who does Augusta grow up to become?", "zh": "根据故事结尾上网查到的资料，奥古斯塔长大后成了谁？"}, "options": [{"en": "Lady Augusta Gregory, writer and Abbey Theatre co-founder", "zh": "奥古斯塔·格雷戈里夫人，作家兼艾比剧院共同创办人"}, {"en": "Queen of all of Ireland", "zh": "全爱尔兰的女王"}, {"en": "A world-famous novelist who wrote over one hundred fairy books", "zh": "一位写了一百多本精灵小说的世界闻名小说家，那是别人讲的版本"}, {"en": "A schoolteacher in Galway", "zh": "戈尔韦的一位老师"}], "answer": 0, "explain": {"en": "Jack and Annie search online and find Lady Augusta Gregory, born in Galway in 1852. She wrote over forty plays and, with W.B. Yeats, co-founded the Abbey Theatre, Ireland's national theater.", "zh": "杰克和安妮上网查到奥古斯塔·格雷戈里夫人，1852年生于戈尔韦。她写下了四十多部戏剧，并与叶芝共同创办了爱尔兰的国家剧院——艾比剧院。"}}, {"q": {"en": "In what year did Lady Gregory and W.B. Yeats found the Abbey Theatre?", "zh": "格雷戈里夫人和叶芝是在哪一年创办艾比剧院的？"}, "options": [{"en": "In 1904", "zh": "1904年"}, {"en": "In 1852, the year Augusta was born", "zh": "1852年，奥古斯塔出生的那一年"}, {"en": "In 1862, when Jack and Annie visited", "zh": "1862年，杰克和安妮去拜访的那一年"}, {"en": "In 1922, when Irish became an official language", "zh": "1922年，爱尔兰语成为官方语言那年"}], "answer": 0, "explain": {"en": "The 'More Facts' section says that in 1904 Lady Gregory and the poet W.B. Yeats founded Dublin's Abbey Theatre, the national theater of Ireland.", "zh": "“更多事实”里写道，1904年，格雷戈里夫人和诗人叶芝在都柏林创办了艾比剧院，即爱尔兰的国家剧院。"}}, {"q": {"en": "How does Jack cross the river to reach the Shee's forest?", "zh": "杰克是怎样过河去席族所在的森林的？"}, "options": [{"en": "He hops from stone to stone, slips, falls in, and wades across soaking wet", "zh": "他踩石头跳过去，滑倒掉进河里，又浑身湿透地涉水过了河"}, {"en": "He swims all the way across by himself", "zh": "他自己一路游过去"}, {"en": "He rides across the river on Willy's back", "zh": "他骑在威利的背上过河"}, {"en": "He hops from stone to stone but slips and falls in", "zh": "他踩着石头一块块跳过去，却脚下一滑掉进了河里"}], "answer": 3, "explain": {"en": "Willy tells them to hop from stone to stone. On his third hop Jack's boot slides off a mossy rock and he splashes into the freezing water before wading to the other side.", "zh": "威利让他们踩着石头一块块跳过去。杰克跳到第三块时，靴子在长满青苔的石头上一滑，扑通掉进冰冷的河水里，然后涉水到了对岸。"}}];

const qEl = document.getElementById("questions");
const resultEl = document.getElementById("result");
const detailEl = document.getElementById("scoreDetail");
const checkBtn = document.getElementById("checkBtn");
const resetBtn = document.getElementById("resetBtn");
const langBtn = document.getElementById("langBtn");

function render(){
  qEl.innerHTML = "";
  document.getElementById("subtitle").textContent = L[lang].subtitle;
  langBtn.textContent = L[lang].langBtn;

  quiz.forEach((item, i) => {
    const qDiv = document.createElement("div");
    qDiv.className = "q";
    qDiv.id = "q" + i;
    let html = `<h3><span>Q${i+1}.</span>${item.q[lang]}</h3>`;
    item.options.forEach((opt, j) => {
      const isPicked = picked[i] === j;
      const checked = isPicked ? "checked" : "";
      html += `<label data-q="${i}" data-o="${j}" class="${isPicked?'picked':''}">
        <input type="radio" name="q${i}" value="${j}" ${checked}> ${opt[lang]}
      </label>`;
    });
    html += `<div class="explain" id="ex${i}">
      <div class="en"><b>${L[lang].ansLabel}:</b> ${item.options[item.answer][lang]}<br>${item.explain.en}</div>
      <div class="zh">${item.options[item.answer][lang]}<br>${item.explain.zh}</div>
    </div>`;
    qDiv.innerHTML = html;
    qEl.appendChild(qDiv);

    if (submitted){
      qDiv.classList.add(picked[i] === item.answer ? "correct" : "wrong");
      document.getElementById("ex"+i).classList.add("show");
      const labels = qDiv.querySelectorAll("label");
      labels[item.answer].classList.add("right");
      if (picked[i] !== item.answer && picked[i] !== undefined)
        labels[picked[i]].classList.add("picked-wrong");
    }
  });

  qEl.querySelectorAll('input[type=radio]').forEach(r => {
    r.addEventListener("change", e => {
      if (submitted) return;
      const qi = +e.target.name.replace("q","");
      picked[qi] = +e.target.value;
      qEl.querySelectorAll(`label[data-q="${qi}"]`).forEach(l=>l.classList.remove("picked"));
      e.target.closest("label").classList.add("picked");
    });
  });

  if (submitted){
    resultEl.textContent = L[lang].result(score);
    let msg = score===10 ? L[lang].perfect : score>=7 ? L[lang].great : score>=4 ? L[lang].ok : L[lang].low;
    detailEl.textContent = msg;
  } else {
    resultEl.textContent = "";
    detailEl.textContent = "";
  }
}

checkBtn.addEventListener("click", () => {
  submitted = true;
  score = 0;
  quiz.forEach((item,i) => { if (picked[i] === item.answer) score++; });
  render();
  checkBtn.style.display = "none";
  resetBtn.style.display = "inline-block";
});

resetBtn.addEventListener("click", () => {
  location.reload();
});

langBtn.addEventListener("click", () => {
  lang = (lang === "en") ? "zh" : "en";
  render();
});

render();
</script>
</body>
</html>
