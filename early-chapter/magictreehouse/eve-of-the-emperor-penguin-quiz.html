<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eve of the Emperor Penguin — Quiz</title>
<style>
  :root{
    --forest:#15803d;
    --forest-dark:#14532d;
    --red:#c0392b;
    --cream:#f7fbf6;
    --ink:#222;
    --gold:#d97706;
    --oak:#92400e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Trebuchet MS","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--forest),var(--forest-dark));
    color:var(--ink);
    min-height:100vh;
    padding:24px 12px;
  }
  .wrap{
    max-width:780px;
    margin:0 auto;
    background:var(--cream);
    border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    overflow:hidden;
  }
  header{
    background:var(--forest);
    color:#fff;
    padding:22px 28px 18px;
    text-align:center;
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  header h1{
    margin:0;
    font-size:1.5rem;
    letter-spacing:.5px;
    flex:1;
    text-align:center;
  }
  .langBtn{
    font-family:inherit;
    font-size:.85rem;
    font-weight:bold;
    color:var(--forest-dark);
    background:#fff;
    border:none;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .langBtn:hover{transform:translateY(-1px);}
  .homeBtn{
    font-size:1.35rem;
    text-decoration:none;
    background:#fff;
    border-radius:50%;
    width:40px;height:40px;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .homeBtn:hover{transform:translateY(-1px);}
  header p{
    margin:10px 0 0;
    font-size:.92rem;
    opacity:.92;
  }
  .logo{
    width:62px;height:62px;border-radius:50%;
    background:#fff;margin:0 auto 12px;position:relative;
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  main{padding:22px 28px 30px;}
  .q{
    border:1px solid #d6e6df;
    border-radius:12px;
    padding:16px 18px;
    margin:16px 0;
    background:#fff;
    transition:border-color .2s;
  }
  .q.correct{border-color:var(--forest);background:#eef9f0;}
  .q.wrong{border-color:var(--red);background:#fdf3f2;}
  .q h3{
    margin:0 0 12px;
    font-size:1.02rem;
    line-height:1.45;
  }
  .q h3 span{color:var(--gold);font-weight:bold;margin-right:6px;}
  label{
    display:block;
    padding:9px 12px;
    margin:7px 0;
    border-radius:8px;
    background:#eef4f0;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s,border-color .15s;
    font-size:.96rem;
    line-height:1.4;
  }
  label:hover{background:#e2ede7;}
  input[type=radio]{margin-right:9px;transform:translateY(1px);}
  label.picked{background:#fff4cc;border-color:var(--gold);}
  label.right{background:#d7f0df;border-color:var(--forest);font-weight:600;}
  label.picked-wrong{background:#f7d4d0;border-color:var(--red);}
  .explain{
    display:none;
    margin-top:10px;
    padding:12px 14px;
    background:#f0f7f2;
    border-left:4px solid var(--forest);
    border-radius:6px;
    font-size:.9rem;
    line-height:1.5;
  }
  .explain.show{display:block;}
  .explain .en{margin-bottom:6px;}
  .explain .zh{color:#444;}
  .explain b{color:var(--forest-dark);}
  .actions{text-align:center;margin-top:24px;}
  button.go{
    font-family:inherit;
    font-size:1.05rem;
    font-weight:bold;
    color:#fff;
    background:var(--forest-dark);
    border:none;
    padding:13px 34px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(21,128,61,.4);
    transition:transform .12s,box-shadow .12s;
  }
  button.go:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(21,128,61,.5);}
  button.go:active{transform:translateY(0);}
  #resetBtn{display:none;background:#555;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  #result{
    text-align:center;
    margin:22px auto 4px;
    font-size:1.3rem;
    font-weight:bold;
    color:var(--forest-dark);
    min-height:1.4em;
  }
  #scoreDetail{text-align:center;color:#666;font-size:.92rem;margin-bottom:6px;}
  footer{
    text-align:center;
    font-size:.8rem;
    color:#9aa6ad;
    padding:14px;
    border-top:1px solid #eee;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <button class="langBtn" id="langBtn">🌐 中文</button>
      <h1>#40 · Eve of the Emperor Penguin</h1>
      <a class="homeBtn" href="../../index.html" title="Home / 首页" aria-label="Home">🏠</a>
    </div>
    <p id="subtitle">Comprehension Quiz • 10 Questions • by Mary Pope Osborne</p>
    <div class="logo">🌳</div>
  </header>
  <main>
    <div id="questions"></div>
    <div id="result"></div>
    <div id="scoreDetail"></div>
    <div class="actions">
      <button class="go" id="checkBtn">Check My Answers</button>
      <button class="go" id="resetBtn">Try Again</button>
    </div>
  </main>
  <footer>Based on <em>Magic Tree House #40: Eve of the Emperor Penguin</em> (Random House, 2008) — by Mary Pope Osborne</footer>
</div>

<script>
let lang = "en";
const picked = {};
let submitted = false;
let score = 0;

const L = {
  en: {
    subtitle: "Comprehension Quiz • 10 Questions • by Mary Pope Osborne",
    check: "Check My Answers",
    retry: "Try Again",
    langBtn: "🌐 中文",
    result: (s) => `You scored ${s} / 10`,
    perfect: "Perfect! You really know your Magic Tree House adventure.",
    great: "Great job — you understood the story well.",
    ok: "Not bad — but a few clues slipped past you.",
    low: "Time for a re-read! The answers are in the details.",
    ansLabel: "Answer"
  },
  zh: {
    subtitle: "阅读理解测验 • 共10题 • 作者：Mary Pope Osborne",
    check: "提交答案",
    retry: "再做一次",
    langBtn: "🌐 English",
    result: (s) => `你的得分：${s} / 10`,
    perfect: "满分！你完全读懂了这次神奇树屋冒险。",
    great: "很棒——你已经读懂了这个故事。",
    ok: "不错——不过有几条线索被你漏掉了。",
    low: "该重读一遍啦！答案都藏在细节里。",
    ansLabel: "正确答案"
  }
};

const quiz = [{"q": {"en": "What cold continent do Jack and Annie travel to in this story?", "zh": "在这个故事里，杰克和安妮去了哪个寒冷的大陆？"}, "options": [{"en": "Greenland", "zh": "格陵兰"}, {"en": "Australia, though that is another story", "zh": "澳大利亚"}, {"en": "Iceland", "zh": "冰岛"}, {"en": "Antarctica", "zh": "南极洲"}], "answer": 3, "explain": {"en": "Jack and Annie are sent to Antarctica, where they explore Mount Erebus and meet the emperor penguins.", "zh": "杰克和安妮被派往南极洲，在那里他们探索了埃里伯斯火山，并遇见了帝企鹅。"}}, {"q": {"en": "What is the 'burning mountain of ice and snow' that they climb?", "zh": "他们攀登的那座“冰雪中的燃烧之山”是哪座山？"}, "options": [{"en": "Mount Erebus", "zh": "埃里伯斯火山"}, {"en": "Mount Fuji", "zh": "富士山"}, {"en": "Mount Everest", "zh": "珠穆朗玛峰"}, {"en": "Mount Rushmore", "zh": "拉什莫尔山，那是别人讲的版本"}], "answer": 0, "explain": {"en": "Mount Erebus is the volcano in Antarctica with a lake of boiling lava, called the 'burning mountain of ice and snow.'", "zh": "埃里伯斯火山是南极洲的一座火山，山顶有一个沸腾的熔岩湖，被称为“冰雪中的燃烧之山”。"}}, {"q": {"en": "What are the 'lava bombs' that Ali warns them about?", "zh": "阿里警告他们的“熔岩炸弹”到底是什么？"}, "options": [{"en": "Frozen chunks of sea ice", "zh": "冻结的海冰碎块"}, {"en": "Hard snowballs thrown by the wind", "zh": "被风抛起的硬雪球，发生在很久很久以前"}, {"en": "Sharp crystals of clear ice", "zh": "透明的尖锐冰晶"}, {"en": "Blobs of fiery hot liquid rock", "zh": "炽热液态岩浆的团块"}], "answer": 3, "explain": {"en": "Ali explains that lava bombs are blobs of fiery hot liquid rock spat from the crater; some can be as big as a car.", "zh": "阿里解释说，熔岩炸弹是从火山口喷出的炽热液态岩浆团块，有些能像汽车一样大。"}}, {"q": {"en": "Why does Jack feel dizzy and sick while on the mountain?", "zh": "杰克在山上为什么会感到头晕、不舒服？"}, "options": [{"en": "His fingers were frostbitten", "zh": "他的手指冻伤了"}, {"en": "He had altitude sickness", "zh": "他得了高原反应"}, {"en": "He ate too much seafood", "zh": "他海鲜吃太多了"}, {"en": "He got a bad sunburn", "zh": "他严重晒伤了"}], "answer": 1, "explain": {"en": "High on Mount Erebus, Jack feels the room spinning and says, 'I think I've got altitude sickness.'", "zh": "在埃里伯斯火山高处，杰克感到屋子在旋转，他说：“我想我得了高原反应。”"}}, {"q": {"en": "What carries Jack and Annie through the dark tunnel to the Cave of the Ancient Crown?", "zh": "是什么载着杰克和安妮穿过黑暗隧道，来到“远古王冠之洞”的？"}, "options": [{"en": "A wooden sled", "zh": "一个木制雪橇"}, {"en": "A spinning helicopter, though that is another story", "zh": "一架旋转的直升机"}, {"en": "A red snowmobile", "zh": "一辆红色雪地摩托"}, {"en": "A floating slab of ice", "zh": "一块漂浮的冰块"}], "answer": 3, "explain": {"en": "After falling into a hole, Jack and Annie ride a slab of ice down a narrow river and slip out into the glowing cavern.", "zh": "掉进洞里后，杰克和安妮乘着一块冰块沿狭窄的河流漂下，滑入那座发光的洞穴。"}}, {"q": {"en": "What does the emperor penguin wear that shows he is royal?", "zh": "那只帝企鹅戴着什么，显示出他的王者身份？"}, "options": [{"en": "A glittering crown", "zh": "一顶闪闪发光的王冠"}, {"en": "A pair of round glasses", "zh": "一副圆框眼镜，那是别人讲的版本"}, {"en": "A long red scarf", "zh": "一条红色长围巾"}, {"en": "A tiny silver bell", "zh": "一只小银铃"}], "answer": 0, "explain": {"en": "When their ice raft reaches the ledge, Jack sees the penguin wearing a glittering crown — the ancient crown they were sent to find.", "zh": "当他们的冰块漂到岩架边时，杰克看到那只企鹅戴着一顶闪闪发光的王冠——也就是他们奉命要找的远古王冠。"}}, {"q": {"en": "Who gives the little orphan penguin the name 'Penny'?", "zh": "是谁给那只小孤儿企鹅起了“佩妮”这个名字？"}, "options": [{"en": "Teddy", "zh": "泰迪"}, {"en": "Jack", "zh": "杰克"}, {"en": "Annie", "zh": "安妮"}, {"en": "Morgan le Fay", "zh": "摩根·勒·菲"}], "answer": 1, "explain": {"en": "Jack pats the baby's head and says 'Thanks, Penny.' Annie giggles because usually she is the one who names the animals.", "zh": "杰克拍了拍小企鹅的头说“谢谢你，佩妮”。安妮咯咯笑，因为平时都是她给动物起名字。"}}, {"q": {"en": "What secret of happiness is connected to the nautilus shell from the deep ocean?", "zh": "从深海带回的鹦鹉螺壳，代表了哪一种幸福的秘密？"}, "options": [{"en": "Having compassion for all living things", "zh": "对所有生命怀有怜悯之心"}, {"en": "Paying attention to small things in nature", "zh": "留意大自然中的细微事物"}, {"en": "Learning something new every day", "zh": "每天都学到新东西"}, {"en": "Winning every race you enter", "zh": "赢下你参加的每个比赛"}], "answer": 0, "explain": {"en": "Annie tells Merlin the shell teaches that happiness comes from having compassion for all living things, from a tiny shell creature to a giant octopus.", "zh": "安妮告诉梅林，这只壳教会我们：幸福来自对所有生命的怜悯，从微小的壳中生物到巨大的章鱼。"}}, {"q": {"en": "What is the fourth secret of happiness Jack and Annie learn in Antarctica?", "zh": "杰克和安妮在南极学到的第四个幸福秘密是什么？"}, "options": [{"en": "Collect as many shells as possible", "zh": "尽可能多地收集贝壳"}, {"en": "Win a contest against a friend", "zh": "和朋友比赛并获胜"}, {"en": "Travel to faraway frozen lands", "zh": "去遥远的冰封之地旅行"}, {"en": "Take care of someone who needs you", "zh": "照顾一个需要你的人"}], "answer": 3, "explain": {"en": "Morgan explains the fourth secret: taking loving care of another can make one very happy, because it helps us look outside ourselves.", "zh": "摩根解释了第四个秘密：关爱地照顾他人能让人非常幸福，因为这能帮我们把目光放到自己之外。"}}, {"q": {"en": "Mount Erebus was named after a god from which mythology?", "zh": "埃里伯斯火山是以哪个神话体系中的神命名的？"}, "options": [{"en": "Norse mythology", "zh": "北欧神话"}, {"en": "Egyptian mythology", "zh": "埃及神话"}, {"en": "Greek mythology", "zh": "希腊神话"}, {"en": "Roman mythology", "zh": "罗马神话"}], "answer": 2, "explain": {"en": "The book says Mount Erebus was named after Erebus, a god from Greek mythology who was the son of Chaos and the god of darkness.", "zh": "书里说，埃里伯斯火山以希腊神话中的神“厄瑞玻斯”命名，他是混沌之子，也是黑暗之神。"}}];

const qEl = document.getElementById("questions");
const resultEl = document.getElementById("result");
const detailEl = document.getElementById("scoreDetail");
const checkBtn = document.getElementById("checkBtn");
const resetBtn = document.getElementById("resetBtn");
const langBtn = document.getElementById("langBtn");

function render(){
  qEl.innerHTML = "";
  document.getElementById("subtitle").textContent = L[lang].subtitle;
  langBtn.textContent = L[lang].langBtn;

  quiz.forEach((item, i) => {
    const qDiv = document.createElement("div");
    qDiv.className = "q";
    qDiv.id = "q" + i;
    let html = `<h3><span>Q${i+1}.</span>${item.q[lang]}</h3>`;
    item.options.forEach((opt, j) => {
      const isPicked = picked[i] === j;
      const checked = isPicked ? "checked" : "";
      html += `<label data-q="${i}" data-o="${j}" class="${isPicked?'picked':''}">
        <input type="radio" name="q${i}" value="${j}" ${checked}> ${opt[lang]}
      </label>`;
    });
    html += `<div class="explain" id="ex${i}">
      <div class="en"><b>${L[lang].ansLabel}:</b> ${item.options[item.answer][lang]}<br>${item.explain.en}</div>
      <div class="zh">${item.options[item.answer][lang]}<br>${item.explain.zh}</div>
    </div>`;
    qDiv.innerHTML = html;
    qEl.appendChild(qDiv);

    if (submitted){
      qDiv.classList.add(picked[i] === item.answer ? "correct" : "wrong");
      document.getElementById("ex"+i).classList.add("show");
      const labels = qDiv.querySelectorAll("label");
      labels[item.answer].classList.add("right");
      if (picked[i] !== item.answer && picked[i] !== undefined)
        labels[picked[i]].classList.add("picked-wrong");
    }
  });

  qEl.querySelectorAll('input[type=radio]').forEach(r => {
    r.addEventListener("change", e => {
      if (submitted) return;
      const qi = +e.target.name.replace("q","");
      picked[qi] = +e.target.value;
      qEl.querySelectorAll(`label[data-q="${qi}"]`).forEach(l=>l.classList.remove("picked"));
      e.target.closest("label").classList.add("picked");
    });
  });

  if (submitted){
    resultEl.textContent = L[lang].result(score);
    let msg = score===10 ? L[lang].perfect : score>=7 ? L[lang].great : score>=4 ? L[lang].ok : L[lang].low;
    detailEl.textContent = msg;
  } else {
    resultEl.textContent = "";
    detailEl.textContent = "";
  }
}

checkBtn.addEventListener("click", () => {
  submitted = true;
  score = 0;
  quiz.forEach((item,i) => { if (picked[i] === item.answer) score++; });
  render();
  checkBtn.style.display = "none";
  resetBtn.style.display = "inline-block";
});

resetBtn.addEventListener("click", () => {
  location.reload();
});

langBtn.addEventListener("click", () => {
  lang = (lang === "en") ? "zh" : "en";
  render();
});

render();
</script>
</body>
</html>
