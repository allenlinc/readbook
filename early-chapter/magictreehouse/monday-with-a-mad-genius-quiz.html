<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monday With a Mad Genius — Quiz</title>
<style>
  :root{
    --forest:#15803d;
    --forest-dark:#14532d;
    --red:#c0392b;
    --cream:#f7fbf6;
    --ink:#222;
    --gold:#d97706;
    --oak:#92400e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Trebuchet MS","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--forest),var(--forest-dark));
    color:var(--ink);
    min-height:100vh;
    padding:24px 12px;
  }
  .wrap{
    max-width:780px;
    margin:0 auto;
    background:var(--cream);
    border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    overflow:hidden;
  }
  header{
    background:var(--forest);
    color:#fff;
    padding:22px 28px 18px;
    text-align:center;
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  header h1{
    margin:0;
    font-size:1.5rem;
    letter-spacing:.5px;
    flex:1;
    text-align:center;
  }
  .langBtn{
    font-family:inherit;
    font-size:.85rem;
    font-weight:bold;
    color:var(--forest-dark);
    background:#fff;
    border:none;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .langBtn:hover{transform:translateY(-1px);}
  .homeBtn{
    font-size:1.35rem;
    text-decoration:none;
    background:#fff;
    border-radius:50%;
    width:40px;height:40px;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .homeBtn:hover{transform:translateY(-1px);}
  header p{
    margin:10px 0 0;
    font-size:.92rem;
    opacity:.92;
  }
  .logo{
    width:62px;height:62px;border-radius:50%;
    background:#fff;margin:0 auto 12px;position:relative;
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  main{padding:22px 28px 30px;}
  .q{
    border:1px solid #d6e6df;
    border-radius:12px;
    padding:16px 18px;
    margin:16px 0;
    background:#fff;
    transition:border-color .2s;
  }
  .q.correct{border-color:var(--forest);background:#eef9f0;}
  .q.wrong{border-color:var(--red);background:#fdf3f2;}
  .q h3{
    margin:0 0 12px;
    font-size:1.02rem;
    line-height:1.45;
  }
  .q h3 span{color:var(--gold);font-weight:bold;margin-right:6px;}
  label{
    display:block;
    padding:9px 12px;
    margin:7px 0;
    border-radius:8px;
    background:#eef4f0;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s,border-color .15s;
    font-size:.96rem;
    line-height:1.4;
  }
  label:hover{background:#e2ede7;}
  input[type=radio]{margin-right:9px;transform:translateY(1px);}
  label.picked{background:#fff4cc;border-color:var(--gold);}
  label.right{background:#d7f0df;border-color:var(--forest);font-weight:600;}
  label.picked-wrong{background:#f7d4d0;border-color:var(--red);}
  .explain{
    display:none;
    margin-top:10px;
    padding:12px 14px;
    background:#f0f7f2;
    border-left:4px solid var(--forest);
    border-radius:6px;
    font-size:.9rem;
    line-height:1.5;
  }
  .explain.show{display:block;}
  .explain .en{margin-bottom:6px;}
  .explain .zh{color:#444;}
  .explain b{color:var(--forest-dark);}
  .actions{text-align:center;margin-top:24px;}
  button.go{
    font-family:inherit;
    font-size:1.05rem;
    font-weight:bold;
    color:#fff;
    background:var(--forest-dark);
    border:none;
    padding:13px 34px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(21,128,61,.4);
    transition:transform .12s,box-shadow .12s;
  }
  button.go:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(21,128,61,.5);}
  button.go:active{transform:translateY(0);}
  #resetBtn{display:none;background:#555;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  #result{
    text-align:center;
    margin:22px auto 4px;
    font-size:1.3rem;
    font-weight:bold;
    color:var(--forest-dark);
    min-height:1.4em;
  }
  #scoreDetail{text-align:center;color:#666;font-size:.92rem;margin-bottom:6px;}
  footer{
    text-align:center;
    font-size:.8rem;
    color:#9aa6ad;
    padding:14px;
    border-top:1px solid #eee;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <button class="langBtn" id="langBtn">🌐 中文</button>
      <h1>#38 · Monday With a Mad Genius</h1>
      <a class="homeBtn" href="../../index.html" title="Home / 首页" aria-label="Home">🏠</a>
    </div>
    <p id="subtitle">Comprehension Quiz • 10 Questions • by Mary Pope Osborne</p>
    <div class="logo">🌳</div>
  </header>
  <main>
    <div id="questions"></div>
    <div id="result"></div>
    <div id="scoreDetail"></div>
    <div class="actions">
      <button class="go" id="checkBtn">Check My Answers</button>
      <button class="go" id="resetBtn">Try Again</button>
    </div>
  </main>
  <footer>Based on <em>Magic Tree House #38: Monday With a Mad Genius</em> (Random House, 2007) — by Mary Pope Osborne</footer>
</div>

<script>
let lang = "en";
const picked = {};
let submitted = false;
let score = 0;

const L = {
  en: {
    subtitle: "Comprehension Quiz • 10 Questions • by Mary Pope Osborne",
    check: "Check My Answers",
    retry: "Try Again",
    langBtn: "🌐 中文",
    result: (s) => `You scored ${s} / 10`,
    perfect: "Perfect! You really know your Magic Tree House adventure.",
    great: "Great job — you understood the story well.",
    ok: "Not bad — but a few clues slipped past you.",
    low: "Time for a re-read! The answers are in the details.",
    ansLabel: "Answer"
  },
  zh: {
    subtitle: "阅读理解测验 • 共10题 • 作者：Mary Pope Osborne",
    check: "提交答案",
    retry: "再做一次",
    langBtn: "🌐 English",
    result: (s) => `你的得分：${s} / 10`,
    perfect: "满分！你完全读懂了这次神奇树屋冒险。",
    great: "很棒——你已经读懂了这个故事。",
    ok: "不错——不过有几条线索被你漏掉了。",
    low: "该重读一遍啦！答案都藏在细节里。",
    ansLabel: "正确答案"
  }
};

const quiz = [{"q": {"en": "What city do Jack and Annie travel to on this mission?", "zh": "在这一次任务里，杰克和安妮去了哪座城市？"}, "options": [{"en": "Rome, the capital city of Italy", "zh": "罗马，意大利的首都"}, {"en": "Venice, the famous city of canals", "zh": "威尼斯，著名的运河之城"}, {"en": "Milan, a center of fashion", "zh": "米兰，时尚中心"}, {"en": "the city of Florence, Italy", "zh": "意大利的佛罗伦萨城"}], "answer": 3, "explain": {"en": "Teddy tells them they will travel back to Florence, Italy, five hundred years ago to help Leonardo da Vinci all day long.", "zh": "泰迪告诉他们，要回到五百年前的意大利佛罗伦萨，一整天陪着达·芬奇帮忙。"}}, {"q": {"en": "Why does Leonardo da Vinci write his notebooks backward?", "zh": "达·芬奇为什么要把笔记倒着写？"}, "options": [{"en": "to keep his ideas hidden from enemies", "zh": "为了把想法藏起来不让敌人知道，那是别人讲的版本"}, {"en": "he never learned to read properly", "zh": "他从来没好好学过认字"}, {"en": "he was left-handed and smeared ink", "zh": "他是左撇子，正常写字会把墨水蹭花"}, {"en": "he wanted a secret code for spies", "zh": "他想编一套给间谍用的暗号"}], "answer": 2, "explain": {"en": "Leonardo says people think he is hiding secrets, but in truth he is left-handed and when he writes normally he smears ink, so writing backward keeps the page neat.", "zh": "达·芬奇说，别人以为他在藏秘密，但其实他是左撇子，正常写字会把墨水蹭花，所以倒着写页面更工整。"}}, {"q": {"en": "At first, what does Leonardo say is the secret of happiness?", "zh": "起初，达·芬奇认为幸福的秘密是什么？"}, "options": [{"en": "winning great glorious battles", "zh": "赢得伟大而光荣的战斗"}, {"en": "fame — being admired by strangers", "zh": "名声——被陌生人仰慕"}, {"en": "eating the very finest bread", "zh": "吃最精美的面包"}, {"en": "having piles and piles of gold coins every day", "zh": "每天都有成堆成堆的金币"}], "answer": 1, "explain": {"en": "When Jack and Annie first ask, Leonardo says the secret of happiness is fame — seeing awe and admiration in strangers' eyes. He later learns this is wrong.", "zh": "杰克和安妮刚问起时，达·芬奇说幸福的秘密是名声——在陌生人眼中看到敬畏与崇拜。他后来明白这是错的。"}}, {"q": {"en": "What is the name of Leonardo's flying machine?", "zh": "达·芬奇的飞行器叫什么名字？"}, "options": [{"en": "the Magic Wing", "zh": "魔法之翼"}, {"en": "the Great Bird", "zh": "大鸟"}, {"en": "the Silver Eagle", "zh": "银鹰"}, {"en": "the Flying Carpet", "zh": "飞毯"}], "answer": 1, "explain": {"en": "Leonardo spent years building a flying machine with bat-like wings large enough for a man, which he called the Great Bird.", "zh": "达·芬奇花了多年打造一架长着蝙蝠般大翅膀、足以载人飞行的机器，他称之为“大鸟”。"}}, {"q": {"en": "What kind of bird does Annie free from a cage, and which later sings at the end?", "zh": "安妮从笼子里放走的是哪种鸟？它在故事结尾又唱起歌来。"}, "options": [{"en": "a pigeon from the market", "zh": "一只从集市来的鸽子"}, {"en": "a nightingale", "zh": "一只夜莺"}, {"en": "a crow that caws loudly", "zh": "一只呱呱叫的乌鸦"}, {"en": "a parrot with bright colors", "zh": "一只羽毛鲜艳的鹦鹉"}], "answer": 1, "explain": {"en": "Annie frees a plain brown bird with a reddish tail. Leonardo later calls it a nightingale, and it sings its song at twilight, ending their day.", "zh": "安妮放走的是一只普普通通、尾巴泛红的棕色小鸟。达·芬奇后来称它为夜莺，黄昏时它唱起歌，宣告了这一天的结束。"}}, {"q": {"en": "What is the Mona Lisa's real first name in the story?", "zh": "故事里蒙娜丽莎真正的名字叫什么？"}, "options": [{"en": "Beatrice", "zh": "贝阿特丽切"}, {"en": "Annie", "zh": "安妮"}, {"en": "Lisa", "zh": "丽莎"}, {"en": "Mona", "zh": "蒙娜"}], "answer": 2, "explain": {"en": "The woman Leonardo paints is Lisa (Lisa del Gioconda). 'Mona' is Italian for 'my lady,' and Leonardo kept her portrait with him until he died.", "zh": "达·芬奇画的那位女士叫丽莎（Lisa del Gioconda）。“蒙娜”在意大利语里是“我的女士”的意思，达·芬奇一直到去世都带着这幅画像。"}}, {"q": {"en": "What finally makes Lisa smile for Leonardo's painting?", "zh": "是什么终于让丽莎对着达·芬奇的画露出了微笑？"}, "options": [{"en": "a little nightingale lands softly on her shoulder", "zh": "一只小夜莺轻轻落在她肩头"}, {"en": "Leonardo gives Lisa a bag of gold coins", "zh": "达·芬奇给了丽莎一袋金币"}, {"en": "Leonardo swears he will never sell her portrait", "zh": "达·芬奇发誓永远不会卖掉她的画像"}, {"en": "Annie tells a very silly joke to try to make Lisa laugh", "zh": "安妮讲了一个很傻的笑话，想逗丽莎笑"}], "answer": 2, "explain": {"en": "Lisa feared that if she smiled, Leonardo would finish and sell the portrait and forget her. He promised never to sell it and to keep it always, so she smiled — the famous Mona Lisa smile.", "zh": "丽莎担心自己一笑，达·芬奇就会画完并把画像卖掉、从此忘了她。达·芬奇承诺永不出售、永远带在身边，于是她笑了——这就是著名的蒙娜丽莎微笑。"}}, {"q": {"en": "How many types of noses did Leonardo count from the side?", "zh": "从侧面看，达·芬奇数出了多少种鼻子？"}, "options": [{"en": "ten from the side, eleven from the front", "zh": "侧面十种，正面十一种"}, {"en": "about fifty different kinds", "zh": "大约五十种"}, {"en": "only two — straight and round, in a place far away", "zh": "只有两种——直的和圆的"}, {"en": "exactly one hundred kinds", "zh": "正好一百种"}], "answer": 0, "explain": {"en": "Leonardo tells Jack and Annie that after years of observation he knows there are ten different types of noses from the side, and eleven if you look straight at the face.", "zh": "达·芬奇告诉杰克和安妮，经过多年观察，他发现从侧面看有十种鼻子，正面看则有十一种。"}}, {"q": {"en": "What is the real secret of happiness Leonardo finally discovers?", "zh": "达·芬奇最终发现的幸福真正的秘密是什么？"}, "options": [{"en": "winning a great flying contest", "zh": "赢得一场盛大的飞行比赛"}, {"en": "curiosity — asking questions", "zh": "好奇心——不断提问"}, {"en": "being the most famous person alive", "zh": "成为世上最有名的人"}, {"en": "eating cheese and fresh bread every day", "zh": "每天吃奶酪和新鲜面包"}], "answer": 1, "explain": {"en": "At the end Leonardo says the secret is curiosity: always ask questions, always try to learn something new, and you can find happiness every hour of every day.", "zh": "最后达·芬奇说，秘密是好奇心：永远提问，永远尝试学习新东西，这样每一天每一刻都能找到幸福。"}}, {"q": {"en": "What five-word command did Annie give the Wand of Dianthus to make them fly?", "zh": "安妮对狄安萨斯魔杖说了哪句五个字的咒语，让他们飞了起来？"}, "options": [{"en": "Give us wings right now", "zh": "立刻给我们翅膀"}, {"en": "Send us home to Frog Creek", "zh": "送我们回青蛙溪的家"}, {"en": "Turn the Great Bird to gold", "zh": "把大鸟变成金色"}, {"en": "Make us fly like birds", "zh": "让我们像鸟儿一样飞"}], "answer": 3, "explain": {"en": "Annie waved the wand and counted five words: 'Make. Us. Fly. Like. Birds.' Their arms sprouted feathers and they soared through the sky with Leonardo.", "zh": "安妮挥动魔杖，数着五个字：“让。我们。像。鸟儿。飞。”他们的手臂长出了羽毛，和达·芬奇一起飞上了天空。"}}];

const qEl = document.getElementById("questions");
const resultEl = document.getElementById("result");
const detailEl = document.getElementById("scoreDetail");
const checkBtn = document.getElementById("checkBtn");
const resetBtn = document.getElementById("resetBtn");
const langBtn = document.getElementById("langBtn");

function render(){
  qEl.innerHTML = "";
  document.getElementById("subtitle").textContent = L[lang].subtitle;
  langBtn.textContent = L[lang].langBtn;

  quiz.forEach((item, i) => {
    const qDiv = document.createElement("div");
    qDiv.className = "q";
    qDiv.id = "q" + i;
    let html = `<h3><span>Q${i+1}.</span>${item.q[lang]}</h3>`;
    item.options.forEach((opt, j) => {
      const isPicked = picked[i] === j;
      const checked = isPicked ? "checked" : "";
      html += `<label data-q="${i}" data-o="${j}" class="${isPicked?'picked':''}">
        <input type="radio" name="q${i}" value="${j}" ${checked}> ${opt[lang]}
      </label>`;
    });
    html += `<div class="explain" id="ex${i}">
      <div class="en"><b>${L[lang].ansLabel}:</b> ${item.options[item.answer][lang]}<br>${item.explain.en}</div>
      <div class="zh">${item.options[item.answer][lang]}<br>${item.explain.zh}</div>
    </div>`;
    qDiv.innerHTML = html;
    qEl.appendChild(qDiv);

    if (submitted){
      qDiv.classList.add(picked[i] === item.answer ? "correct" : "wrong");
      document.getElementById("ex"+i).classList.add("show");
      const labels = qDiv.querySelectorAll("label");
      labels[item.answer].classList.add("right");
      if (picked[i] !== item.answer && picked[i] !== undefined)
        labels[picked[i]].classList.add("picked-wrong");
    }
  });

  qEl.querySelectorAll('input[type=radio]').forEach(r => {
    r.addEventListener("change", e => {
      if (submitted) return;
      const qi = +e.target.name.replace("q","");
      picked[qi] = +e.target.value;
      qEl.querySelectorAll(`label[data-q="${qi}"]`).forEach(l=>l.classList.remove("picked"));
      e.target.closest("label").classList.add("picked");
    });
  });

  if (submitted){
    resultEl.textContent = L[lang].result(score);
    let msg = score===10 ? L[lang].perfect : score>=7 ? L[lang].great : score>=4 ? L[lang].ok : L[lang].low;
    detailEl.textContent = msg;
  } else {
    resultEl.textContent = "";
    detailEl.textContent = "";
  }
}

checkBtn.addEventListener("click", () => {
  submitted = true;
  score = 0;
  quiz.forEach((item,i) => { if (picked[i] === item.answer) score++; });
  render();
  checkBtn.style.display = "none";
  resetBtn.style.display = "inline-block";
});

resetBtn.addEventListener("click", () => {
  location.reload();
});

langBtn.addEventListener("click", () => {
  lang = (lang === "en") ? "zh" : "en";
  render();
});

render();
</script>
</body>
</html>
