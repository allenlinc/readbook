<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunset of the Sabertooth — Quiz</title>
<style>
  :root{
    --forest:#15803d;
    --forest-dark:#14532d;
    --red:#c0392b;
    --cream:#f7fbf6;
    --ink:#222;
    --gold:#d97706;
    --oak:#92400e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Trebuchet MS","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--forest),var(--forest-dark));
    color:var(--ink);
    min-height:100vh;
    padding:24px 12px;
  }
  .wrap{
    max-width:780px;
    margin:0 auto;
    background:var(--cream);
    border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    overflow:hidden;
  }
  header{
    background:var(--forest);
    color:#fff;
    padding:22px 28px 18px;
    text-align:center;
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  header h1{
    margin:0;
    font-size:1.5rem;
    letter-spacing:.5px;
    flex:1;
    text-align:center;
  }
  .langBtn{
    font-family:inherit;
    font-size:.85rem;
    font-weight:bold;
    color:var(--forest-dark);
    background:#fff;
    border:none;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .langBtn:hover{transform:translateY(-1px);}
  .homeBtn{
    font-size:1.35rem;
    text-decoration:none;
    background:#fff;
    border-radius:50%;
    width:40px;height:40px;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .homeBtn:hover{transform:translateY(-1px);}
  header p{
    margin:10px 0 0;
    font-size:.92rem;
    opacity:.92;
  }
  .logo{
    width:62px;height:62px;border-radius:50%;
    background:#fff;margin:0 auto 12px;position:relative;
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  main{padding:22px 28px 30px;}
  .q{
    border:1px solid #d6e6df;
    border-radius:12px;
    padding:16px 18px;
    margin:16px 0;
    background:#fff;
    transition:border-color .2s;
  }
  .q.correct{border-color:var(--forest);background:#eef9f0;}
  .q.wrong{border-color:var(--red);background:#fdf3f2;}
  .q h3{
    margin:0 0 12px;
    font-size:1.02rem;
    line-height:1.45;
  }
  .q h3 span{color:var(--gold);font-weight:bold;margin-right:6px;}
  label{
    display:block;
    padding:9px 12px;
    margin:7px 0;
    border-radius:8px;
    background:#eef4f0;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s,border-color .15s;
    font-size:.96rem;
    line-height:1.4;
  }
  label:hover{background:#e2ede7;}
  input[type=radio]{margin-right:9px;transform:translateY(1px);}
  label.picked{background:#fff4cc;border-color:var(--gold);}
  label.right{background:#d7f0df;border-color:var(--forest);font-weight:600;}
  label.picked-wrong{background:#f7d4d0;border-color:var(--red);}
  .explain{
    display:none;
    margin-top:10px;
    padding:12px 14px;
    background:#f0f7f2;
    border-left:4px solid var(--forest);
    border-radius:6px;
    font-size:.9rem;
    line-height:1.5;
  }
  .explain.show{display:block;}
  .explain .en{margin-bottom:6px;}
  .explain .zh{color:#444;}
  .explain b{color:var(--forest-dark);}
  .actions{text-align:center;margin-top:24px;}
  button.go{
    font-family:inherit;
    font-size:1.05rem;
    font-weight:bold;
    color:#fff;
    background:var(--forest-dark);
    border:none;
    padding:13px 34px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(21,128,61,.4);
    transition:transform .12s,box-shadow .12s;
  }
  button.go:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(21,128,61,.5);}
  button.go:active{transform:translateY(0);}
  #resetBtn{display:none;background:#555;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  #result{
    text-align:center;
    margin:22px auto 4px;
    font-size:1.3rem;
    font-weight:bold;
    color:var(--forest-dark);
    min-height:1.4em;
  }
  #scoreDetail{text-align:center;color:#666;font-size:.92rem;margin-bottom:6px;}
  footer{
    text-align:center;
    font-size:.8rem;
    color:#9aa6ad;
    padding:14px;
    border-top:1px solid #eee;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <button class="langBtn" id="langBtn">🌐 中文</button>
      <h1>#07 · Sunset of the Sabertooth</h1>
      <a class="homeBtn" href="../../index.html" title="Home / 首页" aria-label="Home">🏠</a>
    </div>
    <p id="subtitle">Comprehension Quiz • 10 Questions • by Mary Pope Osborne</p>
    <div class="logo">🌳</div>
  </header>
  <main>
    <div id="questions"></div>
    <div id="result"></div>
    <div id="scoreDetail"></div>
    <div class="actions">
      <button class="go" id="checkBtn">Check My Answers</button>
      <button class="go" id="resetBtn">Try Again</button>
    </div>
  </main>
  <footer>Based on <em>Magic Tree House #07: Sunset of the Sabertooth</em> (Random House, 1996) — by Mary Pope Osborne</footer>
</div>

<script>
let lang = "en";
const picked = {};
let submitted = false;
let score = 0;

const L = {
  en: {
    subtitle: "Comprehension Quiz • 10 Questions • by Mary Pope Osborne",
    check: "Check My Answers",
    retry: "Try Again",
    langBtn: "🌐 中文",
    result: (s) => `You scored ${s} / 10`,
    perfect: "Perfect! You really know your Magic Tree House adventure.",
    great: "Great job — you understood the story well.",
    ok: "Not bad — but a few clues slipped past you.",
    low: "Time for a re-read! The answers are in the details.",
    ansLabel: "Answer"
  },
  zh: {
    subtitle: "阅读理解测验 • 共10题 • 作者：Mary Pope Osborne",
    check: "提交答案",
    retry: "再做一次",
    langBtn: "🌐 English",
    result: (s) => `你的得分：${s} / 10`,
    perfect: "满分！你完全读懂了这次神奇树屋冒险。",
    great: "很棒——你已经读懂了这个故事。",
    ok: "不错——不过有几条线索被你漏掉了。",
    low: "该重读一遍啦！答案都藏在细节里。",
    ansLabel: "正确答案"
  }
};

const quiz = [{"q": {"en": "After Annie wishes to visit the snowy picture, where does the magic tree house take Jack and Annie?", "zh": "安妮许愿想去书里那幅雪景后，魔法树屋把杰克和安妮带到了哪里？"}, "options": [{"en": "To a busy modern city full of tall buildings", "zh": "满是高楼大厦的繁忙现代都市"}, {"en": "To a sunny tropical beach by the sea", "zh": "海边阳光明媚的热带海滩"}, {"en": "To the freezing Ice Age, with falling snow and rocky cliffs", "zh": "冰天雪地的冰河时代，飘着雪、立着悬崖"}, {"en": "To the bottom of the deep blue ocean, swimming among the colorful coral and many fish", "zh": "海底的珊瑚和鱼群之中，发生在很久很久以前"}], "answer": 2, "explain": {"en": "When Annie wished to go to the snowy picture, the tree house spun away and landed in the Ice Age — Jack read the open book's title, 'Life in the Ice Age,' and they saw snow falling from a gray sky with rocky cliffs beyond a wide white plain.", "zh": "安妮对着雪景许愿后，树屋旋转着落到了冰河时代——杰克看到那本翻开的书名叫《冰河时代生活》，外面灰色的天空飘着雪，广阔的雪原尽头是岩石峭壁。"}}, {"q": {"en": "According to Jack's Ice Age book, how tall were the great cave bears?", "zh": "按照杰克的《冰河时代生活》一书，巨大的洞熊有多高？"}, "options": [{"en": "More than twenty feet tall, taller than a house", "zh": "超过二十英尺高，比一座房子还高"}, {"en": "About the size of a small cat", "zh": "差不多像一只小猫那么大"}, {"en": "About three feet tall, like a big dog", "zh": "大约三英尺高，像一条大狗"}, {"en": "Over eight feet tall", "zh": "超过八英尺高"}], "answer": 3, "explain": {"en": "Jack read that the great cave bears of the Ice Age were over eight feet tall and larger and fiercer than today's grizzlies, and their caves were filled with the bones of their ancestors.", "zh": "杰克读到，冰河时代的巨大洞熊超过八英尺高，比今天的灰熊更大更凶猛，它们的洞穴里满是祖先的骸骨。"}}, {"q": {"en": "What did the Cro-Magnons use to make their flute-like musical instruments?", "zh": "克罗马农人用什幺来做他们像笛子一样的乐器？"}, "options": [{"en": "Polished stones shaped like little tubes", "zh": "打磨成小管状的石头"}, {"en": "Hollow seashells picked up from the seashore", "zh": "从海边捡来的镂空贝壳"}, {"en": "Thin strips of peeled tree bark", "zh": "薄薄的树皮条"}, {"en": "The bones of woolly mammoths", "zh": "长毛象的骨头"}], "answer": 3, "explain": {"en": "Jack read that Cro-Magnons made flute-like musical instruments from mammoth bones, and later the sorcerer gave Jack a smooth white hollow mammoth bone with holes along its sides — his flute.", "zh": "杰克读到，克罗马农人用长毛象的骨头制作像笛子一样的乐器；后来巫师还送给杰克一支光滑的白色中空象骨，两侧有孔洞——那就是他的笛子。"}}, {"q": {"en": "How do Jack and Annie get out of the deep pit they fall into?", "zh": "杰克和安妮掉进深坑后，是怎么出来的？"}, "options": [{"en": "They dig a long tunnel all the way back to the tree house", "zh": "他们挖了一条直通树屋的长隧道"}, {"en": "A woolly mammoth named Lulu pulls them up with a rope", "zh": "一只叫露露的长毛象用绳子把他们拉上来"}, {"en": "The Cro-Magnon family lowers a wooden ladder for them", "zh": "克罗马农人放下一架木梯接他们"}, {"en": "A sabertooth tiger carries them out on its striped back", "zh": "一只剑齿虎把他们驮在条纹脊背上带出来"}], "answer": 1, "explain": {"en": "The sorcerer threw a rope into the pit and the other end was tied around the neck of the woolly mammoth Lulu, who pulled Jack and Annie up out of the trap.", "zh": "巫师把绳子扔进坑里，绳子的另一头系在长毛象露露的脖子上，是露露把杰克和安妮从陷阱里拉了上来。"}}, {"q": {"en": "What is the third special 'M' thing that Jack and Annie find to help free Morgan?", "zh": "杰克和安妮在冰河时代找到的、能帮助解救摩根的第三件“M”宝物是什么？"}, "options": [{"en": "A shiny blue moonstone", "zh": "一颗闪亮的蓝色月光石"}, {"en": "A hollow mammoth bone flute", "zh": "一支中空的猛犸象骨笛"}, {"en": "A ripe yellow mango", "zh": "一只熟透的黄色芒果"}, {"en": "A golden medallion carved with the letter M", "zh": "一枚刻着字母 M 的金奖章"}], "answer": 1, "explain": {"en": "The sorcerer gave Jack a smooth white hollow mammoth bone (his flute), and Jack realized 'mammoth bone' starts with M — it became the third M thing, joining the moonstone and mango on the carved M.", "zh": "巫师送给杰克一支光滑的白色中空猛犸象骨（他的笛子），杰克想到“猛犸象骨 mammoth bone”以 M 开头——它就成为了第三件 M 宝物，和月光石、芒果一起放在刻着 M 的地上。"}}, {"q": {"en": "What did the sorcerer known as the 'Master of the Animals' wear?", "zh": "被称为“动物之主”的巫师戴着什么、穿着什么？"}, "options": [{"en": "A full suit of shiny metal armor", "zh": "一身闪亮的金属铠甲"}, {"en": "A heavy crown made of pure gold and bright jewels", "zh": "一顶纯金和亮晶晶宝石做成的沉重王冠"}, {"en": "A tall pointed purple wizard's hat", "zh": "一顶高高的紫色尖顶巫师帽"}, {"en": "Reindeer antlers and an owl mask", "zh": "鹿角和猫头鹰面具"}], "answer": 3, "explain": {"en": "The cave painting and the book showed the 'Master of the Animals' as a figure with human arms and legs, reindeer antlers, and an owl face, holding a flute; Jack said he may have worn antlers to run like a reindeer and an owl mask to see like an owl.", "zh": "洞穴壁画和书上画的“动物之主”有人的手臂和腿、鹿角，还有一张猫头鹰的脸，手里拿着笛子；杰克说，他戴鹿角是为了像驯鹿一样奔跑，戴猫头鹰面具是为了像猫头鹰一样看东西。"}}, {"q": {"en": "How do Jack and Annie light their way to see the cave paintings in the dark?", "zh": "杰克和安妮在黑暗的洞穴深处，靠什么看清墙壁上的画？"}, "options": [{"en": "They tie many dry sticks together to make a burning torch", "zh": "他们把许多干树枝绑在一起做成燃烧的火把"}, {"en": "Glowing fireflies that live in the cave light the way", "zh": "洞里发光的萤火虫为他们照路"}, {"en": "They carry stone lamps filled with animal fat and moss", "zh": "他们提着装满动物油脂和苔藓的石灯"}, {"en": "They use the flashlight Jack packed in his backpack", "zh": "他们用杰克背包里带的手电筒"}], "answer": 2, "explain": {"en": "Jack read that Cro-Magnons made stone lamps by hollowing out a rock, filling it with animal fat, and burning a wick of moss; he and Annie lit two such stone lamps to explore the painted cavern.", "zh": "杰克读到，克罗马农人把石头挖空、装满动物油脂、再用苔藓做灯芯来制成石灯；他和安妮点亮了两盏这样的石灯，去探看画满壁画的洞窟。"}}, {"q": {"en": "How does Jack finally make the sabertooth tiger leave them alone?", "zh": "杰克最后是用什么办法让剑齿虎离开他们的？"}, "options": [{"en": "The mammoth scares it away with a very loud, angry roar", "zh": "长毛象发出一声巨响的怒吼把它吓跑"}, {"en": "Annie waves the Pennsylvania book in its face", "zh": "安妮在它面前挥舞那本宾州书"}, {"en": "He plays a strange song on the mammoth-bone flute", "zh": "他用猛犸象骨笛吹出奇特的曲子"}, {"en": "He throws a pile of snowballs right at the tiger", "zh": "他朝老虎扔了一把雪球"}], "answer": 2, "explain": {"en": "When the sabertooth crept toward them, Annie told Jack to play the flute; Jack blew the mammoth-bone flute again and again until the strange music made the tiger freeze and then slink off toward the cliffs.", "zh": "剑齿虎逼近时，安妮让杰克吹笛子；杰克一遍遍吹响猛犸象骨笛，奇特的乐声让老虎先是僵住，最后悄悄溜回了悬崖边。"}}, {"q": {"en": "What do Jack and Annie leave behind as a thank-you gift for the Cro-Magnon cave people?", "zh": "杰克和安妮留下什么，作为送给克罗马农洞人的谢礼？"}, "options": [{"en": "Their wet towels and Annie's swimming goggles", "zh": "他们湿漉漉的毛巾和安妮的泳镜"}, {"en": "A small piece of the sabertooth's broken tooth", "zh": "一小片剑齿虎断裂的牙齿"}, {"en": "The moonstone they found in old Japan", "zh": "他们在古老日本找到的月光石"}, {"en": "Their notebook and a freshly sharpened pencil", "zh": "他们的笔记本和一支刚削好的铅笔"}], "answer": 0, "explain": {"en": "After borrowing the reindeer-skin coats, Annie suggested they thank the cave people by leaving their towels and her goggles on top of the animal skins, and Jack agreed it was a good idea.", "zh": "借了驯鹿皮外套后，安妮提议把他们的毛巾和她的泳镜留在兽皮堆上，向洞人道谢，杰克也觉得这是个好主意。"}}, {"q": {"en": "Which animals travel alongside Jack and Annie in the 'great parade' back to the tree house?", "zh": "在护送他们回树屋的“大游行”中，哪些动物一路同行？"}, "options": [{"en": "Elk, reindeer, a woolly rhino, and a bison", "zh": "麋鹿、驯鹿、一头披毛犀和一头野牛"}, {"en": "A whole big pack of hungry, howling gray wolves that live on the plains", "zh": "一整群饥肠辘辘、嚎叫着的灰狼，在很远很远的地方"}, {"en": "Only the woolly mammoth, Lulu", "zh": "只有长毛象露露"}, {"en": "Penguins and a family of polar bears", "zh": "企鹅和一家北极熊"}], "answer": 0, "explain": {"en": "As Lulu carried them across the snow, a herd of elk, then reindeer, a woolly rhino, and a bison moved along at a distance, seeming to escort Jack and Annie back to the tree house in a 'great parade.'", "zh": "露露驮着他们走过雪原时，远处出现了一群麋鹿，接着是驯鹿、一头披毛犀和一头野牛，它们一路相随，仿佛在护送杰克和安妮回树屋，构成了一场“大游行”。"}}];

const qEl = document.getElementById("questions");
const resultEl = document.getElementById("result");
const detailEl = document.getElementById("scoreDetail");
const checkBtn = document.getElementById("checkBtn");
const resetBtn = document.getElementById("resetBtn");
const langBtn = document.getElementById("langBtn");

function render(){
  qEl.innerHTML = "";
  document.getElementById("subtitle").textContent = L[lang].subtitle;
  langBtn.textContent = L[lang].langBtn;

  quiz.forEach((item, i) => {
    const qDiv = document.createElement("div");
    qDiv.className = "q";
    qDiv.id = "q" + i;
    let html = `<h3><span>Q${i+1}.</span>${item.q[lang]}</h3>`;
    item.options.forEach((opt, j) => {
      const isPicked = picked[i] === j;
      const checked = isPicked ? "checked" : "";
      html += `<label data-q="${i}" data-o="${j}" class="${isPicked?'picked':''}">
        <input type="radio" name="q${i}" value="${j}" ${checked}> ${opt[lang]}
      </label>`;
    });
    html += `<div class="explain" id="ex${i}">
      <div class="en"><b>${L[lang].ansLabel}:</b> ${item.options[item.answer][lang]}<br>${item.explain.en}</div>
      <div class="zh">${item.options[item.answer][lang]}<br>${item.explain.zh}</div>
    </div>`;
    qDiv.innerHTML = html;
    qEl.appendChild(qDiv);

    if (submitted){
      qDiv.classList.add(picked[i] === item.answer ? "correct" : "wrong");
      document.getElementById("ex"+i).classList.add("show");
      const labels = qDiv.querySelectorAll("label");
      labels[item.answer].classList.add("right");
      if (picked[i] !== item.answer && picked[i] !== undefined)
        labels[picked[i]].classList.add("picked-wrong");
    }
  });

  qEl.querySelectorAll('input[type=radio]').forEach(r => {
    r.addEventListener("change", e => {
      if (submitted) return;
      const qi = +e.target.name.replace("q","");
      picked[qi] = +e.target.value;
      qEl.querySelectorAll(`label[data-q="${qi}"]`).forEach(l=>l.classList.remove("picked"));
      e.target.closest("label").classList.add("picked");
    });
  });

  if (submitted){
    resultEl.textContent = L[lang].result(score);
    let msg = score===10 ? L[lang].perfect : score>=7 ? L[lang].great : score>=4 ? L[lang].ok : L[lang].low;
    detailEl.textContent = msg;
  } else {
    resultEl.textContent = "";
    detailEl.textContent = "";
  }
}

checkBtn.addEventListener("click", () => {
  submitted = true;
  score = 0;
  quiz.forEach((item,i) => { if (picked[i] === item.answer) score++; });
  render();
  checkBtn.style.display = "none";
  resetBtn.style.display = "inline-block";
});

resetBtn.addEventListener("click", () => {
  location.reload();
});

langBtn.addEventListener("click", () => {
  lang = (lang === "en") ? "zh" : "en";
  render();
});

render();
</script>
</body>
</html>
