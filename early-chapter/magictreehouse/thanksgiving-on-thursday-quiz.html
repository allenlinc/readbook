<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thanksgiving on Thursday — Quiz</title>
<style>
  :root{
    --forest:#15803d;
    --forest-dark:#14532d;
    --red:#c0392b;
    --cream:#f7fbf6;
    --ink:#222;
    --gold:#d97706;
    --oak:#92400e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Trebuchet MS","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--forest),var(--forest-dark));
    color:var(--ink);
    min-height:100vh;
    padding:24px 12px;
  }
  .wrap{
    max-width:780px;
    margin:0 auto;
    background:var(--cream);
    border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    overflow:hidden;
  }
  header{
    background:var(--forest);
    color:#fff;
    padding:22px 28px 18px;
    text-align:center;
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  header h1{
    margin:0;
    font-size:1.5rem;
    letter-spacing:.5px;
    flex:1;
    text-align:center;
  }
  .langBtn{
    font-family:inherit;
    font-size:.85rem;
    font-weight:bold;
    color:var(--forest-dark);
    background:#fff;
    border:none;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .langBtn:hover{transform:translateY(-1px);}
  .homeBtn{
    font-size:1.35rem;
    text-decoration:none;
    background:#fff;
    border-radius:50%;
    width:40px;height:40px;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .homeBtn:hover{transform:translateY(-1px);}
  header p{
    margin:10px 0 0;
    font-size:.92rem;
    opacity:.92;
  }
  .logo{
    width:62px;height:62px;border-radius:50%;
    background:#fff;margin:0 auto 12px;position:relative;
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  main{padding:22px 28px 30px;}
  .q{
    border:1px solid #d6e6df;
    border-radius:12px;
    padding:16px 18px;
    margin:16px 0;
    background:#fff;
    transition:border-color .2s;
  }
  .q.correct{border-color:var(--forest);background:#eef9f0;}
  .q.wrong{border-color:var(--red);background:#fdf3f2;}
  .q h3{
    margin:0 0 12px;
    font-size:1.02rem;
    line-height:1.45;
  }
  .q h3 span{color:var(--gold);font-weight:bold;margin-right:6px;}
  label{
    display:block;
    padding:9px 12px;
    margin:7px 0;
    border-radius:8px;
    background:#eef4f0;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s,border-color .15s;
    font-size:.96rem;
    line-height:1.4;
  }
  label:hover{background:#e2ede7;}
  input[type=radio]{margin-right:9px;transform:translateY(1px);}
  label.picked{background:#fff4cc;border-color:var(--gold);}
  label.right{background:#d7f0df;border-color:var(--forest);font-weight:600;}
  label.picked-wrong{background:#f7d4d0;border-color:var(--red);}
  .explain{
    display:none;
    margin-top:10px;
    padding:12px 14px;
    background:#f0f7f2;
    border-left:4px solid var(--forest);
    border-radius:6px;
    font-size:.9rem;
    line-height:1.5;
  }
  .explain.show{display:block;}
  .explain .en{margin-bottom:6px;}
  .explain .zh{color:#444;}
  .explain b{color:var(--forest-dark);}
  .actions{text-align:center;margin-top:24px;}
  button.go{
    font-family:inherit;
    font-size:1.05rem;
    font-weight:bold;
    color:#fff;
    background:var(--forest-dark);
    border:none;
    padding:13px 34px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(21,128,61,.4);
    transition:transform .12s,box-shadow .12s;
  }
  button.go:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(21,128,61,.5);}
  button.go:active{transform:translateY(0);}
  #resetBtn{display:none;background:#555;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  #result{
    text-align:center;
    margin:22px auto 4px;
    font-size:1.3rem;
    font-weight:bold;
    color:var(--forest-dark);
    min-height:1.4em;
  }
  #scoreDetail{text-align:center;color:#666;font-size:.92rem;margin-bottom:6px;}
  footer{
    text-align:center;
    font-size:.8rem;
    color:#9aa6ad;
    padding:14px;
    border-top:1px solid #eee;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <button class="langBtn" id="langBtn">🌐 中文</button>
      <h1>#27 · Thanksgiving on Thursday</h1>
      <a class="homeBtn" href="../../index.html" title="Home / 首页" aria-label="Home">🏠</a>
    </div>
    <p id="subtitle">Comprehension Quiz • 10 Questions • by Mary Pope Osborne</p>
    <div class="logo">🌳</div>
  </header>
  <main>
    <div id="questions"></div>
    <div id="result"></div>
    <div id="scoreDetail"></div>
    <div class="actions">
      <button class="go" id="checkBtn">Check My Answers</button>
      <button class="go" id="resetBtn">Try Again</button>
    </div>
  </main>
  <footer>Based on <em>Magic Tree House #27: Thanksgiving on Thursday</em> (Random House, 2002) — by Mary Pope Osborne</footer>
</div>

<script>
let lang = "en";
const picked = {};
let submitted = false;
let score = 0;

const L = {
  en: {
    subtitle: "Comprehension Quiz • 10 Questions • by Mary Pope Osborne",
    check: "Check My Answers",
    retry: "Try Again",
    langBtn: "🌐 中文",
    result: (s) => `You scored ${s} / 10`,
    perfect: "Perfect! You really know your Magic Tree House adventure.",
    great: "Great job — you understood the story well.",
    ok: "Not bad — but a few clues slipped past you.",
    low: "Time for a re-read! The answers are in the details.",
    ansLabel: "Answer"
  },
  zh: {
    subtitle: "阅读理解测验 • 共10题 • 作者：Mary Pope Osborne",
    check: "提交答案",
    retry: "再做一次",
    langBtn: "🌐 English",
    result: (s) => `你的得分：${s} / 10`,
    perfect: "满分！你完全读懂了这次神奇树屋冒险。",
    great: "很棒——你已经读懂了这个故事。",
    ok: "不错——不过有几条线索被你漏掉了。",
    low: "该重读一遍啦！答案都藏在细节里。",
    ansLabel: "正确答案"
  }
};

const quiz = [{"q": {"en": "What year and place do Jack and Annie travel to in this adventure?", "zh": "杰克和安妮在这次冒险中穿越到了哪一年、什么地方？"}, "options": [{"en": "Plymouth in 1621", "zh": "1621年的普利茅斯"}, {"en": "London in the year 1900", "zh": "1900年的伦敦"}, {"en": "Hawaii in the 1700s", "zh": "1700年代的夏威夷"}, {"en": "Camelot in the year 800", "zh": "公元800年的卡美洛"}], "answer": 0, "explain": {"en": "The tree house takes Jack and Annie to Plymouth Colony in 1621, where the Pilgrims and the Wampanoag people are holding the harvest feast we call the first Thanksgiving.", "zh": "树屋把杰克和安妮带到了1621年的普利茅斯殖民地，清教徒和万帕诺亚格人正在举行我们称为“第一个感恩节”的丰收盛宴。"}}, {"q": {"en": "Who taught the Pilgrims how to plant and grow corn?", "zh": "是谁教清教徒们种植和培育玉米的？"}, "options": [{"en": "Squanto, the Wampanoag who helped them", "zh": "帮助他们的万帕诺亚格人斯匡托"}, {"en": "Chief Massasoit, the Wampanoag leader", "zh": "万帕诺亚格人的领袖马萨索伊特酋长"}, {"en": "Governor Bradford, the colony's leader", "zh": "殖民地的领袖布拉德福德总督"}, {"en": "Captain Standish, the man with the long gun", "zh": "扛着长枪的斯坦迪什船长"}], "answer": 0, "explain": {"en": "Squanto, a Wampanoag man, had taught the Pilgrims how to grow corn. He later shows Jack and Annie how to plant it, even giving them a pouch of seeds to take home.", "zh": "万帕诺亚格人斯匡托曾经教清教徒种植玉米。后来他还向杰克和安妮演示如何种玉米，并送了他们一小袋种子带回家。"}}, {"q": {"en": "When Priscilla asks Jack to go 'fowling,' what does that mean?", "zh": "普丽西拉让杰克去“fowling（捕鸟）”，这是什么意思？"}, "options": [{"en": "Building fences in the fields", "zh": "在田里修筑栅栏"}, {"en": "Gathering pumpkins and squash", "zh": "采摘南瓜和西葫芦"}, {"en": "Fishing for eels in the bay", "zh": "在海湾里捉鳗鱼"}, {"en": "Hunting water birds", "zh": "捕猎水鸟"}], "answer": 3, "explain": {"en": "A little girl explains that 'fowling' means hunting water birds. Jack does not know this at first, so Annie says he will go catch fish instead.", "zh": "一个小女孩解释说，“fowling”就是捕猎水鸟。杰克一开始并不知道，所以安妮说他改去捉鱼好了。"}}, {"q": {"en": "How did Squanto show the Pilgrims to catch eels?", "zh": "斯匡托教清教徒怎样捕捉鳗鱼？"}, "options": [{"en": "With fishing rods, hooks, and a long line", "zh": "用鱼竿、鱼钩和长钓线"}, {"en": "Push them out of the wet sand with their feet, then grab", "zh": "用脚把鳗鱼从湿沙里踩出来，再用手抓住"}, {"en": "By scooping the big fat eels into large woven nets after dark", "zh": "天黑后用宽大的编织渔网把肥大的鳗鱼捞起"}, {"en": "By striking them with a wooden spear", "zh": "用木矛刺它们"}], "answer": 1, "explain": {"en": "The research book says Squanto showed the Pilgrims to push eels out of the wet sand with their bare feet, then grab them with their hands. Jack tries this and catches a long, slimy eel.", "zh": "那本参考书里说，斯匡托教清教徒用光脚把鳗鱼从湿沙里踩出来，再用手抓住。杰克试了试，真的抓住了一条又长又滑的鳗鱼。"}}, {"q": {"en": "When Captain Standish's men 'exercise their arms,' what are they really doing?", "zh": "斯坦迪什船长的部下“exercise their arms（操练手臂）”，其实是在做什么？"}, "options": [{"en": "Waving flags to welcome guests", "zh": "挥舞旗帜欢迎客人"}, {"en": "Lifting heavy barrels above their heads", "zh": "把沉重的木桶举过头顶"}, {"en": "Firing their muskets into the air", "zh": "向空中发射火枪"}, {"en": "Rowing a boat out to sea", "zh": "划船出海"}], "answer": 2, "explain": {"en": "Jack first thinks 'exercising arms' means stretching his arms, but Priscilla laughs—the men actually fired their long guns (muskets) with a loud bang to show off on the special day.", "zh": "杰克一开始以为“操练手臂”是伸展胳膊，结果普丽西拉笑了——那些人其实是“砰”地一声向空中发射长枪（火枪），在特别的日子里炫耀武力。"}}, {"q": {"en": "What happens to the turkey when Jack tries to take it off the spit?", "zh": "杰克想把火鸡从烤叉上取下来时，发生了什么？"}, "options": [{"en": "It falls into the fire and burns black", "zh": "它掉进火里，烧成了黑色"}, {"en": "It slides onto the platter perfectly", "zh": "它完好地滑到了盘子上"}, {"en": "Squanto cooks it with herbs", "zh": "斯匡托用香草把它煮了"}, {"en": "A hungry dog quickly carries it out of the house", "zh": "一只饿坏的狗飞快把它叼出了屋子"}], "answer": 0, "explain": {"en": "The iron handle is super hot. Jack yanks his hand away, knocks the spit over, and the turkey falls into the fire and bursts into flame. It turns completely black, but Priscilla says he did not ruin the feast—there was plenty of other food.", "zh": "铁把手烫得厉害，杰克猛地抽手，把烤叉碰倒，火鸡掉进火里燃起火焰，最后烧得漆黑。但普丽西拉说他也并没有毁掉盛宴——别处还有很多食物。"}}, {"q": {"en": "What special magic do Jack and Annie discover on this trip?", "zh": "杰克和安妮这趟旅程发现了什么特别的魔法？"}, "options": [{"en": "The magic of the theater and the stage", "zh": "戏剧与舞台的魔法，不过那是另一个故事了"}, {"en": "The magic of the moon", "zh": "月亮的魔法"}, {"en": "The magic of animals", "zh": "动物的魔法"}, {"en": "The magic of community", "zh": "社区（团聚）的魔法"}], "answer": 3, "explain": {"en": "Morgan's rhyme said to 'turn three worlds into one.' Governor Bradford says their world, Jack and Annie's world, and the Wampanoag world become one—'the magic of community.' That is the special magic they found.", "zh": "摩根的诗谜说要“把三个世界变成一个”。布拉德福德总督说，他们的世界、杰克和安妮的世界、以及万帕诺亚格人的世界合而为一——这就是“社区的魔法”。这就是他们找到的特别魔法。"}}, {"q": {"en": "How many deer did the Wampanoag men bring back from the forest for the feast?", "zh": "万帕诺亚格人从树林里为盛宴带回了多少只鹿？"}, "options": [{"en": "Five deer", "zh": "五只鹿"}, {"en": "Two deer", "zh": "两只鹿"}, {"en": "Three deer", "zh": "三只鹿"}, {"en": "Ten deer", "zh": "十只鹿"}], "answer": 0, "explain": {"en": "Priscilla tells Jack and Annie that their Wampanoag neighbors brought back five deer from the forest for the feast, along with many other foods.", "zh": "普丽西拉告诉杰克和安妮，万帕诺亚格邻居们从树林里为盛宴带回了五只鹿，还有许许多多别的食物。"}}, {"q": {"en": "In the book's 'More Facts' section, what year did President Lincoln declare Thanksgiving a national holiday?", "zh": "在书末“更多事实”一节里，林肯总统是哪一年把感恩节定为全国节日的？"}, "options": [{"en": "1863", "zh": "1863年"}, {"en": "1776", "zh": "1776年"}, {"en": "1621", "zh": "1621年"}, {"en": "1939", "zh": "1939年"}], "answer": 0, "explain": {"en": "The 'More Facts' section says that in 1863 President Abraham Lincoln designated the last Thursday in November as America's national day of Thanksgiving.", "zh": "书末“更多事实”里说，1863年亚伯拉罕·林肯总统把十一月的最后一个星期四定为美国的感恩节全国节日。"}}, {"q": {"en": "When Squanto teaches Jack and Annie to plant corn, what does he say to put in each hole with the seeds?", "zh": "斯匡托教杰克和安妮种玉米时，说要在每个坑里和种子一起放什么？"}, "options": [{"en": "Three acorns", "zh": "三颗橡子"}, {"en": "A handful of berries", "zh": "一把浆果，在很远很远的地方"}, {"en": "Two rotting fish", "zh": "两条腐烂的鱼"}, {"en": "Two small stones", "zh": "两块小石头"}], "answer": 2, "explain": {"en": "Squanto instructs them to dig holes, put two rotting fish in each hole as food for the soil, then place four corn seeds on top and cover them with dirt.", "zh": "斯匡托教他们挖坑，在每个坑里放两条腐烂的鱼当作土壤的养料，然后在上面放四颗玉米种子，再用土盖好。"}}];

const qEl = document.getElementById("questions");
const resultEl = document.getElementById("result");
const detailEl = document.getElementById("scoreDetail");
const checkBtn = document.getElementById("checkBtn");
const resetBtn = document.getElementById("resetBtn");
const langBtn = document.getElementById("langBtn");

function render(){
  qEl.innerHTML = "";
  document.getElementById("subtitle").textContent = L[lang].subtitle;
  langBtn.textContent = L[lang].langBtn;

  quiz.forEach((item, i) => {
    const qDiv = document.createElement("div");
    qDiv.className = "q";
    qDiv.id = "q" + i;
    let html = `<h3><span>Q${i+1}.</span>${item.q[lang]}</h3>`;
    item.options.forEach((opt, j) => {
      const isPicked = picked[i] === j;
      const checked = isPicked ? "checked" : "";
      html += `<label data-q="${i}" data-o="${j}" class="${isPicked?'picked':''}">
        <input type="radio" name="q${i}" value="${j}" ${checked}> ${opt[lang]}
      </label>`;
    });
    html += `<div class="explain" id="ex${i}">
      <div class="en"><b>${L[lang].ansLabel}:</b> ${item.options[item.answer][lang]}<br>${item.explain.en}</div>
      <div class="zh">${item.options[item.answer][lang]}<br>${item.explain.zh}</div>
    </div>`;
    qDiv.innerHTML = html;
    qEl.appendChild(qDiv);

    if (submitted){
      qDiv.classList.add(picked[i] === item.answer ? "correct" : "wrong");
      document.getElementById("ex"+i).classList.add("show");
      const labels = qDiv.querySelectorAll("label");
      labels[item.answer].classList.add("right");
      if (picked[i] !== item.answer && picked[i] !== undefined)
        labels[picked[i]].classList.add("picked-wrong");
    }
  });

  qEl.querySelectorAll('input[type=radio]').forEach(r => {
    r.addEventListener("change", e => {
      if (submitted) return;
      const qi = +e.target.name.replace("q","");
      picked[qi] = +e.target.value;
      qEl.querySelectorAll(`label[data-q="${qi}"]`).forEach(l=>l.classList.remove("picked"));
      e.target.closest("label").classList.add("picked");
    });
  });

  if (submitted){
    resultEl.textContent = L[lang].result(score);
    let msg = score===10 ? L[lang].perfect : score>=7 ? L[lang].great : score>=4 ? L[lang].ok : L[lang].low;
    detailEl.textContent = msg;
  } else {
    resultEl.textContent = "";
    detailEl.textContent = "";
  }
}

checkBtn.addEventListener("click", () => {
  submitted = true;
  score = 0;
  quiz.forEach((item,i) => { if (picked[i] === item.answer) score++; });
  render();
  checkBtn.style.display = "none";
  resetBtn.style.display = "inline-block";
});

resetBtn.addEventListener("click", () => {
  location.reload();
});

langBtn.addEventListener("click", () => {
  lang = (lang === "en") ? "zh" : "en";
  render();
});

render();
</script>
</body>
</html>
