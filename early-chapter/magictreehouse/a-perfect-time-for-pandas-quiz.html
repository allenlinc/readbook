<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Perfect Time for Pandas — Quiz</title>
<style>
  :root{
    --forest:#15803d;
    --forest-dark:#14532d;
    --red:#c0392b;
    --cream:#f7fbf6;
    --ink:#222;
    --gold:#d97706;
    --oak:#92400e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Trebuchet MS","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--forest),var(--forest-dark));
    color:var(--ink);
    min-height:100vh;
    padding:24px 12px;
  }
  .wrap{
    max-width:780px;
    margin:0 auto;
    background:var(--cream);
    border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    overflow:hidden;
  }
  header{
    background:var(--forest);
    color:#fff;
    padding:22px 28px 18px;
    text-align:center;
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  header h1{
    margin:0;
    font-size:1.5rem;
    letter-spacing:.5px;
    flex:1;
    text-align:center;
  }
  .langBtn{
    font-family:inherit;
    font-size:.85rem;
    font-weight:bold;
    color:var(--forest-dark);
    background:#fff;
    border:none;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .langBtn:hover{transform:translateY(-1px);}
  .homeBtn{
    font-size:1.35rem;
    text-decoration:none;
    background:#fff;
    border-radius:50%;
    width:40px;height:40px;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .homeBtn:hover{transform:translateY(-1px);}
  header p{
    margin:10px 0 0;
    font-size:.92rem;
    opacity:.92;
  }
  .logo{
    width:62px;height:62px;border-radius:50%;
    background:#fff;margin:0 auto 12px;position:relative;
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  main{padding:22px 28px 30px;}
  .q{
    border:1px solid #d6e6df;
    border-radius:12px;
    padding:16px 18px;
    margin:16px 0;
    background:#fff;
    transition:border-color .2s;
  }
  .q.correct{border-color:var(--forest);background:#eef9f0;}
  .q.wrong{border-color:var(--red);background:#fdf3f2;}
  .q h3{
    margin:0 0 12px;
    font-size:1.02rem;
    line-height:1.45;
  }
  .q h3 span{color:var(--gold);font-weight:bold;margin-right:6px;}
  label{
    display:block;
    padding:9px 12px;
    margin:7px 0;
    border-radius:8px;
    background:#eef4f0;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s,border-color .15s;
    font-size:.96rem;
    line-height:1.4;
  }
  label:hover{background:#e2ede7;}
  input[type=radio]{margin-right:9px;transform:translateY(1px);}
  label.picked{background:#fff4cc;border-color:var(--gold);}
  label.right{background:#d7f0df;border-color:var(--forest);font-weight:600;}
  label.picked-wrong{background:#f7d4d0;border-color:var(--red);}
  .explain{
    display:none;
    margin-top:10px;
    padding:12px 14px;
    background:#f0f7f2;
    border-left:4px solid var(--forest);
    border-radius:6px;
    font-size:.9rem;
    line-height:1.5;
  }
  .explain.show{display:block;}
  .explain .en{margin-bottom:6px;}
  .explain .zh{color:#444;}
  .explain b{color:var(--forest-dark);}
  .actions{text-align:center;margin-top:24px;}
  button.go{
    font-family:inherit;
    font-size:1.05rem;
    font-weight:bold;
    color:#fff;
    background:var(--forest-dark);
    border:none;
    padding:13px 34px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(21,128,61,.4);
    transition:transform .12s,box-shadow .12s;
  }
  button.go:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(21,128,61,.5);}
  button.go:active{transform:translateY(0);}
  #resetBtn{display:none;background:#555;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  #result{
    text-align:center;
    margin:22px auto 4px;
    font-size:1.3rem;
    font-weight:bold;
    color:var(--forest-dark);
    min-height:1.4em;
  }
  #scoreDetail{text-align:center;color:#666;font-size:.92rem;margin-bottom:6px;}
  footer{
    text-align:center;
    font-size:.8rem;
    color:#9aa6ad;
    padding:14px;
    border-top:1px solid #eee;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <button class="langBtn" id="langBtn">🌐 中文</button>
      <h1>#48 · A Perfect Time for Pandas</h1>
      <a class="homeBtn" href="../../index.html" title="Home / 首页" aria-label="Home">🏠</a>
    </div>
    <p id="subtitle">Comprehension Quiz • 10 Questions • by Mary Pope Osborne</p>
    <div class="logo">🌳</div>
  </header>
  <main>
    <div id="questions"></div>
    <div id="result"></div>
    <div id="scoreDetail"></div>
    <div class="actions">
      <button class="go" id="checkBtn">Check My Answers</button>
      <button class="go" id="resetBtn">Try Again</button>
    </div>
  </main>
  <footer>Based on <em>Magic Tree House #48: A Perfect Time for Pandas</em> (Random House, 2012) — by Mary Pope Osborne</footer>
</div>

<script>
let lang = "en";
const picked = {};
let submitted = false;
let score = 0;

const L = {
  en: {
    subtitle: "Comprehension Quiz • 10 Questions • by Mary Pope Osborne",
    check: "Check My Answers",
    retry: "Try Again",
    langBtn: "🌐 中文",
    result: (s) => `You scored ${s} / 10`,
    perfect: "Perfect! You really know your Magic Tree House adventure.",
    great: "Great job — you understood the story well.",
    ok: "Not bad — but a few clues slipped past you.",
    low: "Time for a re-read! The answers are in the details.",
    ansLabel: "Answer"
  },
  zh: {
    subtitle: "阅读理解测验 • 共10题 • 作者：Mary Pope Osborne",
    check: "提交答案",
    retry: "再做一次",
    langBtn: "🌐 English",
    result: (s) => `你的得分：${s} / 10`,
    perfect: "满分！你完全读懂了这次神奇树屋冒险。",
    great: "很棒——你已经读懂了这个故事。",
    ok: "不错——不过有几条线索被你漏掉了。",
    low: "该重读一遍啦！答案都藏在细节里。",
    ansLabel: "正确答案"
  }
};

const quiz = [{"q": {"en": "What is the 'fourth thing' Jack and Annie must find in China to help break the spell on Penny?", "zh": "为了解开佩妮的魔咒，杰克和安妮必须在中国找到的“第四样东西”是什么？"}, "options": [{"en": "A jar of honey from the bamboo forest", "zh": "一罐从竹林里采来的蜂蜜"}, {"en": "A sweet rice cake shaped like a flower", "zh": "一块做成花朵形状的甜米糕，不过那是另一个故事了"}, {"en": "A bowl of noodles from a market stall", "zh": "一碗从路边摊买来的面条"}, {"en": "Panda bread, round and sandy in color", "zh": "熊猫面包，一种沙土颜色的圆面包"}], "answer": 3, "explain": {"en": "The rhyme calls it 'a healthy food, grainy and good, baked with love, tough as wood, round in shape, the color of sand.' Jack realizes the fourth thing is panda bread, which Master Lee feeds Bing-Bing.", "zh": "谜语说它是“健康的食物，颗粒分明，充满爱意地烤成，硬如木头，圆圆的，沙土的颜色”。杰克意识到第四样东西就是山姆（Master Lee）喂给“冰冰”的熊猫面包。"}}, {"q": {"en": "What does the magic potion in the small bottle do?", "zh": "小瓶子里的魔法药水有什么作用？"}, "options": [{"en": "Turns the drinker into a tiny mouse", "zh": "把喝下的人变成一只小老鼠"}, {"en": "Makes the drinker invisible for a whole day", "zh": "让喝下的人隐身一整天"}, {"en": "Turns the drinker into a fish that can breathe underwater", "zh": "把喝下的人变成一条能在水下呼吸的鱼"}, {"en": "Makes you grow to five times your size", "zh": "让你长到原来身高的五倍"}], "answer": 3, "explain": {"en": "The label says: 'Use only once. Take one sip and grow to five times your size. The magic lasts for one hour.' Jack becomes almost twenty-five feet tall after drinking it.", "zh": "瓶身上的说明写道：“仅能使用一次。喝一口就能长到原来身高的五倍。魔法持续一小时。”杰克喝下后长到了将近二十五英尺高。"}}, {"q": {"en": "Where does the magic tree house take Jack and Annie for this mission?", "zh": "魔法树屋把杰克和安妮送到了哪里执行这次任务？"}, "options": [{"en": "Ancient Egypt", "zh": "古埃及"}, {"en": "To Southwest China", "zh": "中国西南地区的一个大熊猫中心"}, {"en": "The Swiss Alps, from long, long ago", "zh": "瑞士阿尔卑斯山，发生在很久很久以前"}, {"en": "The South Pole", "zh": "南极"}], "answer": 1, "explain": {"en": "The guide book shows China, and Teddy and Kathleen's note says the fourth object is found in Southwest China, at the Conservation and Research Center for the Giant Panda near Wolong.", "zh": "指南书显示的是中国，泰迪和凯瑟琳的纸条也说第四样东西在中国西南地区，位于卧龙附近的大熊猫保护研究中心。"}}, {"q": {"en": "Who is Dr. Ling in the story?", "zh": "故事里的“林博士”是谁？"}, "options": [{"en": "The young scientist leading the volunteers", "zh": "在熊猫中心带领志愿者们的年轻科学家"}, {"en": "The keeper of the panda Bing-Bing, a shy eight-year-old", "zh": "熊猫“冰冰”的饲养员，一只害羞的八岁大熊猫"}, {"en": "A tourist visiting from New York who loves pandas", "zh": "一位从纽约来、喜欢熊猫的游客"}, {"en": "The military helicopter pilot who flies the cubs out", "zh": "把熊猫幼崽空运出去的军用直升机飞行员"}], "answer": 0, "explain": {"en": "Dr. Ling is the young Chinese scientist who welcomes the group and explains that the center is the largest giant panda reserve in the world and that volunteers may help.", "zh": "林博士是一位年轻的中国科学家，她迎接大家并介绍说，这个中心是世界上最大的大熊猫保护区，志愿者可以进来帮忙。"}}, {"q": {"en": "What does the newborn panda cub look like in the nursery?", "zh": "育幼室里刚出生的熊猫幼崽长什么样？"}, "options": [{"en": "A fuzzy pink mouse", "zh": "一只毛茸茸的粉色小老鼠"}, {"en": "A baby black bear", "zh": "一只小黑熊"}, {"en": "A tiny green frog", "zh": "一只绿色的小青蛙，不过那是另一个故事了"}, {"en": "A small white tiger", "zh": "一只小白虎"}], "answer": 0, "explain": {"en": "When the volunteers peek into the incubator, the newborn doesn't look like a panda at all — Jack and Annie see a creature that looks more like a fuzzy pink mouse. Sylvia notes newborns weigh less than half a pound.", "zh": "当志愿者们往保温箱里看时，这只新生儿一点也不像熊猫——杰克和安妮看到的是一只更像毛茸茸粉色小老鼠的小家伙。西尔维娅说新生熊猫体重不到半磅。"}}, {"q": {"en": "What disaster strikes while Jack and Annie are biking to the panda center?", "zh": "杰克和安妮骑车去熊猫中心的路上，发生了什么灾难？"}, "options": [{"en": "A strong earthquake", "zh": "一场强烈的地震"}, {"en": "A forest fire", "zh": "一场森林大火"}, {"en": "A terrible snowstorm", "zh": "一场可怕的大暴雪"}, {"en": "A flood that washes away the bridge", "zh": "一场冲走桥梁的洪水"}], "answer": 0, "explain": {"en": "While they bike up the mountain, boulders crash down the slope and the ground shakes. Jack says one word: 'Earthquake.' The quake is the real 2008 Sichuan earthquake, and aftershocks follow.", "zh": "当他们骑车上山时，巨石从山坡滚落，大地开始震动。杰克说出了一个词：“地震。”这场地震正是真实的2008年四川大地震，之后还发生了余震。"}}, {"q": {"en": "When Jack drinks the potion to become a giant, what happens to Annie?", "zh": "当杰克喝下药水变成巨人时，安妮发生了什么？"}, "options": [{"en": "She shrinks to the size of a tiny bug on the ground", "zh": "她缩小成了地面上的一只小虫子"}, {"en": "She drops the bottle and it breaks, so she stays normal size", "zh": "她把瓶子掉在地上摔碎了，所以她还是原来的大小"}, {"en": "She turns into a giant panda by accident", "zh": "她不小心变成了一只大熊猫"}, {"en": "She grows even taller than Jack and becomes a true giant, from long, long ago", "zh": "她长得比杰克还高，成了一个真正的巨人，发生在很久很久以前"}], "answer": 1, "explain": {"en": "Jack starts to grow, but Annie drops the bottle and it breaks before she can drink. She stays her normal size and rides on Jack's shoulder as his lookout.", "zh": "杰克开始变大，但安妮把瓶子掉在地上摔碎了，没来得及喝。她保持着原来的身高，坐在杰克的肩膀上给他当“瞭望员”。"}}, {"q": {"en": "Who is Master Lee, and which panda does he care for?", "zh": "“李师傅”是谁？他照顾的是哪只熊猫？"}, "options": [{"en": "Bing-Bing's keeper, who feeds the shy eight-year-old panda", "zh": "“冰冰”的饲养员，他喂养那只害羞的八岁大熊猫"}, {"en": "A volunteer from New York named Sylvia who loves pandas, in a place far away", "zh": "一位从纽约来的、喜欢熊猫的志愿者西尔维娅，在很远很远的地方"}, {"en": "The military helicopter pilot flying the rescue mission", "zh": "执行救援任务的军用直升机飞行员"}, {"en": "Dr. Ling's young assistant at the nursery", "zh": "林博士在育幼室的年轻助手"}], "answer": 0, "explain": {"en": "Dr. Ling puts Jack and Annie with Master Lee, who is Bing-Bing's keeper. Bing-Bing is an eight-year-old adult panda who is so shy that Master Lee says they may not see her that day.", "zh": "林博士把杰克和安妮交给李师傅，他是“冰冰”的饲养员。冰冰是一只八岁的成年大熊猫，非常害羞，李师傅说他们那天可能见不到她。"}}, {"q": {"en": "What is panda bread actually made from?", "zh": "“熊猫面包”实际上是用什么做的？"}, "options": [{"en": "Ground bamboo mixed with molasses, grains, and vitamins", "zh": "磨碎的竹子，混合糖蜜、谷物和维生素"}, {"en": "Cornmeal mixed with wild honey", "zh": "玉米粉拌野蜂蜜"}, {"en": "Rice and sweet red beans steamed in bamboo leaves, though that is another story", "zh": "用竹叶包裹蒸熟的米饭和甜红豆，不过那是另一个故事了"}, {"en": "Wheat flour and melted cheese", "zh": "小麦面粉和融化的奶酪"}], "answer": 0, "explain": {"en": "Master Lee tells Jack the bread is bamboo that has been ground up and mixed with molasses, grains, and vitamins. It is very healthy but 'tough as wood.'", "zh": "李师傅告诉杰克，这种面包是把竹子磨碎后，混合糖蜜、谷物和维生素做成的。它很健康，但“硬如木头”。"}}, {"q": {"en": "According to Dr. Ling, about how many giant pandas are left in the wild?", "zh": "根据林博士的说法，野外大约还有多少只大熊猫？"}, "options": [{"en": "Only a few dozen", "zh": "只有几十只"}, {"en": "Around five thousand, as someone else had told it", "zh": "大约五千只，那是别人讲的版本"}, {"en": "About sixteen hundred", "zh": "大约一千六百只"}, {"en": "Almost one million", "zh": "接近一百万只"}], "answer": 2, "explain": {"en": "Dr. Ling tells the group that throughout the world only about sixteen hundred giant pandas remain in the wild, and the species is threatened with extinction.", "zh": "林博士告诉大家，全世界野外只剩下大约一千六百只大熊猫，这个物种正面临灭绝的威胁。"}}];

const qEl = document.getElementById("questions");
const resultEl = document.getElementById("result");
const detailEl = document.getElementById("scoreDetail");
const checkBtn = document.getElementById("checkBtn");
const resetBtn = document.getElementById("resetBtn");
const langBtn = document.getElementById("langBtn");

function render(){
  qEl.innerHTML = "";
  document.getElementById("subtitle").textContent = L[lang].subtitle;
  langBtn.textContent = L[lang].langBtn;

  quiz.forEach((item, i) => {
    const qDiv = document.createElement("div");
    qDiv.className = "q";
    qDiv.id = "q" + i;
    let html = `<h3><span>Q${i+1}.</span>${item.q[lang]}</h3>`;
    item.options.forEach((opt, j) => {
      const isPicked = picked[i] === j;
      const checked = isPicked ? "checked" : "";
      html += `<label data-q="${i}" data-o="${j}" class="${isPicked?'picked':''}">
        <input type="radio" name="q${i}" value="${j}" ${checked}> ${opt[lang]}
      </label>`;
    });
    html += `<div class="explain" id="ex${i}">
      <div class="en"><b>${L[lang].ansLabel}:</b> ${item.options[item.answer][lang]}<br>${item.explain.en}</div>
      <div class="zh">${item.options[item.answer][lang]}<br>${item.explain.zh}</div>
    </div>`;
    qDiv.innerHTML = html;
    qEl.appendChild(qDiv);

    if (submitted){
      qDiv.classList.add(picked[i] === item.answer ? "correct" : "wrong");
      document.getElementById("ex"+i).classList.add("show");
      const labels = qDiv.querySelectorAll("label");
      labels[item.answer].classList.add("right");
      if (picked[i] !== item.answer && picked[i] !== undefined)
        labels[picked[i]].classList.add("picked-wrong");
    }
  });

  qEl.querySelectorAll('input[type=radio]').forEach(r => {
    r.addEventListener("change", e => {
      if (submitted) return;
      const qi = +e.target.name.replace("q","");
      picked[qi] = +e.target.value;
      qEl.querySelectorAll(`label[data-q="${qi}"]`).forEach(l=>l.classList.remove("picked"));
      e.target.closest("label").classList.add("picked");
    });
  });

  if (submitted){
    resultEl.textContent = L[lang].result(score);
    let msg = score===10 ? L[lang].perfect : score>=7 ? L[lang].great : score>=4 ? L[lang].ok : L[lang].low;
    detailEl.textContent = msg;
  } else {
    resultEl.textContent = "";
    detailEl.textContent = "";
  }
}

checkBtn.addEventListener("click", () => {
  submitted = true;
  score = 0;
  quiz.forEach((item,i) => { if (picked[i] === item.answer) score++; });
  render();
  checkBtn.style.display = "none";
  resetBtn.style.display = "inline-block";
});

resetBtn.addEventListener("click", () => {
  location.reload();
});

langBtn.addEventListener("click", () => {
  lang = (lang === "en") ? "zh" : "en";
  render();
});

render();
</script>
</body>
</html>
