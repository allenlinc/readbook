<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Civil War on Sunday — Quiz</title>
<style>
  :root{
    --forest:#15803d;
    --forest-dark:#14532d;
    --red:#c0392b;
    --cream:#f7fbf6;
    --ink:#222;
    --gold:#d97706;
    --oak:#92400e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Trebuchet MS","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--forest),var(--forest-dark));
    color:var(--ink);
    min-height:100vh;
    padding:24px 12px;
  }
  .wrap{
    max-width:780px;
    margin:0 auto;
    background:var(--cream);
    border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    overflow:hidden;
  }
  header{
    background:var(--forest);
    color:#fff;
    padding:22px 28px 18px;
    text-align:center;
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  header h1{
    margin:0;
    font-size:1.5rem;
    letter-spacing:.5px;
    flex:1;
    text-align:center;
  }
  .langBtn{
    font-family:inherit;
    font-size:.85rem;
    font-weight:bold;
    color:var(--forest-dark);
    background:#fff;
    border:none;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .langBtn:hover{transform:translateY(-1px);}
  .homeBtn{
    font-size:1.35rem;
    text-decoration:none;
    background:#fff;
    border-radius:50%;
    width:40px;height:40px;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .homeBtn:hover{transform:translateY(-1px);}
  header p{
    margin:10px 0 0;
    font-size:.92rem;
    opacity:.92;
  }
  .logo{
    width:62px;height:62px;border-radius:50%;
    background:#fff;margin:0 auto 12px;position:relative;
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  main{padding:22px 28px 30px;}
  .q{
    border:1px solid #d6e6df;
    border-radius:12px;
    padding:16px 18px;
    margin:16px 0;
    background:#fff;
    transition:border-color .2s;
  }
  .q.correct{border-color:var(--forest);background:#eef9f0;}
  .q.wrong{border-color:var(--red);background:#fdf3f2;}
  .q h3{
    margin:0 0 12px;
    font-size:1.02rem;
    line-height:1.45;
  }
  .q h3 span{color:var(--gold);font-weight:bold;margin-right:6px;}
  label{
    display:block;
    padding:9px 12px;
    margin:7px 0;
    border-radius:8px;
    background:#eef4f0;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s,border-color .15s;
    font-size:.96rem;
    line-height:1.4;
  }
  label:hover{background:#e2ede7;}
  input[type=radio]{margin-right:9px;transform:translateY(1px);}
  label.picked{background:#fff4cc;border-color:var(--gold);}
  label.right{background:#d7f0df;border-color:var(--forest);font-weight:600;}
  label.picked-wrong{background:#f7d4d0;border-color:var(--red);}
  .explain{
    display:none;
    margin-top:10px;
    padding:12px 14px;
    background:#f0f7f2;
    border-left:4px solid var(--forest);
    border-radius:6px;
    font-size:.9rem;
    line-height:1.5;
  }
  .explain.show{display:block;}
  .explain .en{margin-bottom:6px;}
  .explain .zh{color:#444;}
  .explain b{color:var(--forest-dark);}
  .actions{text-align:center;margin-top:24px;}
  button.go{
    font-family:inherit;
    font-size:1.05rem;
    font-weight:bold;
    color:#fff;
    background:var(--forest-dark);
    border:none;
    padding:13px 34px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(21,128,61,.4);
    transition:transform .12s,box-shadow .12s;
  }
  button.go:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(21,128,61,.5);}
  button.go:active{transform:translateY(0);}
  #resetBtn{display:none;background:#555;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  #result{
    text-align:center;
    margin:22px auto 4px;
    font-size:1.3rem;
    font-weight:bold;
    color:var(--forest-dark);
    min-height:1.4em;
  }
  #scoreDetail{text-align:center;color:#666;font-size:.92rem;margin-bottom:6px;}
  footer{
    text-align:center;
    font-size:.8rem;
    color:#9aa6ad;
    padding:14px;
    border-top:1px solid #eee;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <button class="langBtn" id="langBtn">🌐 中文</button>
      <h1>#21 · Civil War on Sunday</h1>
      <a class="homeBtn" href="../../index.html" title="Home / 首页" aria-label="Home">🏠</a>
    </div>
    <p id="subtitle">Comprehension Quiz • 10 Questions • by Mary Pope Osborne</p>
    <div class="logo">🌳</div>
  </header>
  <main>
    <div id="questions"></div>
    <div id="result"></div>
    <div id="scoreDetail"></div>
    <div class="actions">
      <button class="go" id="checkBtn">Check My Answers</button>
      <button class="go" id="resetBtn">Try Again</button>
    </div>
  </main>
  <footer>Based on <em>Magic Tree House #21: Civil War on Sunday</em> (Random House, 2000) — by Mary Pope Osborne</footer>
</div>

<script>
let lang = "en";
const picked = {};
let submitted = false;
let score = 0;

const L = {
  en: {
    subtitle: "Comprehension Quiz • 10 Questions • by Mary Pope Osborne",
    check: "Check My Answers",
    retry: "Try Again",
    langBtn: "🌐 中文",
    result: (s) => `You scored ${s} / 10`,
    perfect: "Perfect! You really know your Magic Tree House adventure.",
    great: "Great job — you understood the story well.",
    ok: "Not bad — but a few clues slipped past you.",
    low: "Time for a re-read! The answers are in the details.",
    ansLabel: "Answer"
  },
  zh: {
    subtitle: "阅读理解测验 • 共10题 • 作者：Mary Pope Osborne",
    check: "提交答案",
    retry: "再做一次",
    langBtn: "🌐 English",
    result: (s) => `你的得分：${s} / 10`,
    perfect: "满分！你完全读懂了这次神奇树屋冒险。",
    great: "很棒——你已经读懂了这个故事。",
    ok: "不错——不过有几条线索被你漏掉了。",
    low: "该重读一遍啦！答案都藏在细节里。",
    ansLabel: "正确答案"
  }
};

const quiz = [{"q": {"en": "How did the story begin?", "zh": "故事是在怎样的日子里开始的？"}, "options": [{"en": "On a dreary, stormy Sunday", "zh": "一个阴沉、暴风雨的星期日"}, {"en": "On a bright summer morning", "zh": "一个明亮的夏日清晨，发生在很久很久以前"}, {"en": "On a snowy winter night", "zh": "一个下雪的冬夜"}, {"en": "On a sunny holiday", "zh": "一个阳光明媚的假日"}], "answer": 0, "explain": {"en": "It was a dreary Sunday with dark clouds and thunder when the magic tree house came back.", "zh": "那是一个阴沉的星期日，乌云密布、雷声滚滚，魔法树屋就是在那时回来的。"}}, {"q": {"en": "Which was one of the four special writings Morgan asked for?", "zh": "下面哪一个是摩根要的四种特别文字之一？"}, "options": [{"en": "Something to eat", "zh": "可以吃的某样东西"}, {"en": "Something to follow", "zh": "可以遵循的某样东西"}, {"en": "Something to buy", "zh": "可以买的某样东西"}, {"en": "Something to hide, in a place far away", "zh": "可以藏起来的某样东西"}], "answer": 1, "explain": {"en": "Morgan asked for 'something to follow, send, learn, and lend' to save Camelot's library.", "zh": "摩根要的是‘可以遵循、可以寄送、可以学习、可以借出的’四种文字，用来拯救卡米洛特的图书馆。"}}, {"q": {"en": "Who fought in the American Civil War?", "zh": "美国南北战争是哪两方在交战？"}, "options": [{"en": "The Northern and Southern states", "zh": "北方的州和南方的州"}, {"en": "Three small islands", "zh": "三座小岛"}, {"en": "Two big cities", "zh": "两座大城市"}, {"en": "Two faraway kings, though that is another story", "zh": "两位远方的国王，不过那是另一个故事了"}], "answer": 0, "explain": {"en": "The Civil War was fought between the Northern (Union) and Southern (Confederate) states.", "zh": "南北战争是北方的联邦州与南方的邦联州之间的战争。"}}, {"q": {"en": "What color were the Union soldiers' uniforms?", "zh": "联邦（北方）士兵的军服是什么颜色？"}, "options": [{"en": "Green", "zh": "绿色"}, {"en": "Blue", "zh": "蓝色"}, {"en": "Red", "zh": "红色"}, {"en": "Gray", "zh": "灰色"}], "answer": 1, "explain": {"en": "Northerners wore blue uniforms and were called Union soldiers; Southerners wore gray.", "zh": "北方人穿蓝色军服，叫联邦士兵；南方人穿灰色军服。"}}, {"q": {"en": "About how many patients did the field hospital care for?", "zh": "那所战地医院大约照料了多少名伤员？"}, "options": [{"en": "Over 400", "zh": "四百多人"}, {"en": "Over 4,000", "zh": "四千多人"}, {"en": "About 4", "zh": "大约四人"}, {"en": "About 40", "zh": "大约四十人"}], "answer": 0, "explain": {"en": "The field hospital in Virginia took care of over 400 patients at one time.", "zh": "弗吉尼亚的那所战地医院一次就照料了四百多名伤员。"}}, {"q": {"en": "What was Clara Barton called?", "zh": "克拉拉·巴顿被人们称作什么？"}, "options": [{"en": "The Lady of the Lake", "zh": "湖中仙子"}, {"en": "The Queen of the Sea, in a place far away", "zh": "海洋女王"}, {"en": "The Star of the North", "zh": "北极星"}, {"en": "The Angel of the Battlefield", "zh": "战场天使"}], "answer": 3, "explain": {"en": "Clara Barton drove her wagon onto battlefields to help the wounded, earning the name 'Angel of the Battlefield.'", "zh": "克拉拉·巴顿把马车开上战场去救助伤员，因此被称为‘战场天使’。"}}, {"q": {"en": "One rule on Clara's list said never to do what?", "zh": "克拉拉清单上的一条规矩说永远不要做什么？"}, "options": [{"en": "Be unkind", "zh": "不友善"}, {"en": "Eat too much", "zh": "吃太多"}, {"en": "Laugh loudly", "zh": "大声笑"}, {"en": "Give up", "zh": "放弃"}], "answer": 3, "explain": {"en": "One of Clara's kind rules was 'Don't give up,' which Jack remembered when he wanted to go home.", "zh": "克拉拉的一条善意规矩是‘不要放弃’，杰克本想回家时想起了它。"}}, {"q": {"en": "What was wrong with the drummer boy John?", "zh": "鼓手男孩约翰怎么了？"}, "options": [{"en": "He broke his leg, as someone else had told it", "zh": "他摔断了腿"}, {"en": "He had a cold", "zh": "他感冒了"}, {"en": "He lost his voice", "zh": "他失声了"}, {"en": "He had heat stroke", "zh": "他中暑了"}], "answer": 3, "explain": {"en": "Young John, the Union drummer boy, suffered from heat stroke and looked a lot like Jack.", "zh": "联邦军的鼓手男孩约翰中暑了，他长得和杰克非常像。"}}, {"q": {"en": "What did the silver-haired soldier tell Jack about his past?", "zh": "那位银发士兵告诉杰克，自己过去是什么人？"}, "options": [{"en": "He had been a famous general, from long, long ago, in a place far away", "zh": "他曾经是一位名将，发生在很久很久以前"}, {"en": "He had been a ship captain", "zh": "他曾经是一艘船的船长"}, {"en": "He had been a slave who ran away to fight for freedom", "zh": "他曾经是奴隶，逃跑后为自由而战"}, {"en": "He had been a school teacher", "zh": "他曾经是一名教师"}], "answer": 2, "explain": {"en": "The elderly soldier in the second tent said he and the others had once been slaves who ran away to end slavery.", "zh": "第二个帐篷里那位年长的士兵说，他和同伴们曾经是奴隶，逃跑是为了结束奴隶制、争取自由。"}}, {"q": {"en": "What song did the soldiers sing around the campfire?", "zh": "士兵们围在营火旁唱的是什么歌？"}, "options": [{"en": "The Star-Spangled Banner, in a place far away", "zh": "《星条旗》，在很远很远的地方"}, {"en": "Yankee Doodle", "zh": "《扬基歌》"}, {"en": "Tenting Tonight on the Old Camp Ground", "zh": "《今夜露营在旧营地》"}, {"en": "Home on the Range", "zh": "《牧场之家》"}], "answer": 2, "explain": {"en": "The weary soldiers sang 'Tenting Tonight on the Old Camp Ground' as night fell.", "zh": "夜幕降临，疲惫的士兵们唱起了《今夜露营在旧营地》。"}}];

const qEl = document.getElementById("questions");
const resultEl = document.getElementById("result");
const detailEl = document.getElementById("scoreDetail");
const checkBtn = document.getElementById("checkBtn");
const resetBtn = document.getElementById("resetBtn");
const langBtn = document.getElementById("langBtn");

function render(){
  qEl.innerHTML = "";
  document.getElementById("subtitle").textContent = L[lang].subtitle;
  langBtn.textContent = L[lang].langBtn;

  quiz.forEach((item, i) => {
    const qDiv = document.createElement("div");
    qDiv.className = "q";
    qDiv.id = "q" + i;
    let html = `<h3><span>Q${i+1}.</span>${item.q[lang]}</h3>`;
    item.options.forEach((opt, j) => {
      const isPicked = picked[i] === j;
      const checked = isPicked ? "checked" : "";
      html += `<label data-q="${i}" data-o="${j}" class="${isPicked?'picked':''}">
        <input type="radio" name="q${i}" value="${j}" ${checked}> ${opt[lang]}
      </label>`;
    });
    html += `<div class="explain" id="ex${i}">
      <div class="en"><b>${L[lang].ansLabel}:</b> ${item.options[item.answer][lang]}<br>${item.explain.en}</div>
      <div class="zh">${item.options[item.answer][lang]}<br>${item.explain.zh}</div>
    </div>`;
    qDiv.innerHTML = html;
    qEl.appendChild(qDiv);

    if (submitted){
      qDiv.classList.add(picked[i] === item.answer ? "correct" : "wrong");
      document.getElementById("ex"+i).classList.add("show");
      const labels = qDiv.querySelectorAll("label");
      labels[item.answer].classList.add("right");
      if (picked[i] !== item.answer && picked[i] !== undefined)
        labels[picked[i]].classList.add("picked-wrong");
    }
  });

  qEl.querySelectorAll('input[type=radio]').forEach(r => {
    r.addEventListener("change", e => {
      if (submitted) return;
      const qi = +e.target.name.replace("q","");
      picked[qi] = +e.target.value;
      qEl.querySelectorAll(`label[data-q="${qi}"]`).forEach(l=>l.classList.remove("picked"));
      e.target.closest("label").classList.add("picked");
    });
  });

  if (submitted){
    resultEl.textContent = L[lang].result(score);
    let msg = score===10 ? L[lang].perfect : score>=7 ? L[lang].great : score>=4 ? L[lang].ok : L[lang].low;
    detailEl.textContent = msg;
  } else {
    resultEl.textContent = "";
    detailEl.textContent = "";
  }
}

checkBtn.addEventListener("click", () => {
  submitted = true;
  score = 0;
  quiz.forEach((item,i) => { if (picked[i] === item.answer) score++; });
  render();
  checkBtn.style.display = "none";
  resetBtn.style.display = "inline-block";
});

resetBtn.addEventListener("click", () => {
  location.reload();
});

langBtn.addEventListener("click", () => {
  lang = (lang === "en") ? "zh" : "en";
  render();
});

render();
</script>
</body>
</html>
