<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earthquake in the Early Morning — Quiz</title>
<style>
  :root{
    --forest:#15803d;
    --forest-dark:#14532d;
    --red:#c0392b;
    --cream:#f7fbf6;
    --ink:#222;
    --gold:#d97706;
    --oak:#92400e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Trebuchet MS","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--forest),var(--forest-dark));
    color:var(--ink);
    min-height:100vh;
    padding:24px 12px;
  }
  .wrap{
    max-width:780px;
    margin:0 auto;
    background:var(--cream);
    border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    overflow:hidden;
  }
  header{
    background:var(--forest);
    color:#fff;
    padding:22px 28px 18px;
    text-align:center;
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  header h1{
    margin:0;
    font-size:1.5rem;
    letter-spacing:.5px;
    flex:1;
    text-align:center;
  }
  .langBtn{
    font-family:inherit;
    font-size:.85rem;
    font-weight:bold;
    color:var(--forest-dark);
    background:#fff;
    border:none;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .langBtn:hover{transform:translateY(-1px);}
  .homeBtn{
    font-size:1.35rem;
    text-decoration:none;
    background:#fff;
    border-radius:50%;
    width:40px;height:40px;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .homeBtn:hover{transform:translateY(-1px);}
  header p{
    margin:10px 0 0;
    font-size:.92rem;
    opacity:.92;
  }
  .logo{
    width:62px;height:62px;border-radius:50%;
    background:#fff;margin:0 auto 12px;position:relative;
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  main{padding:22px 28px 30px;}
  .q{
    border:1px solid #d6e6df;
    border-radius:12px;
    padding:16px 18px;
    margin:16px 0;
    background:#fff;
    transition:border-color .2s;
  }
  .q.correct{border-color:var(--forest);background:#eef9f0;}
  .q.wrong{border-color:var(--red);background:#fdf3f2;}
  .q h3{
    margin:0 0 12px;
    font-size:1.02rem;
    line-height:1.45;
  }
  .q h3 span{color:var(--gold);font-weight:bold;margin-right:6px;}
  label{
    display:block;
    padding:9px 12px;
    margin:7px 0;
    border-radius:8px;
    background:#eef4f0;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s,border-color .15s;
    font-size:.96rem;
    line-height:1.4;
  }
  label:hover{background:#e2ede7;}
  input[type=radio]{margin-right:9px;transform:translateY(1px);}
  label.picked{background:#fff4cc;border-color:var(--gold);}
  label.right{background:#d7f0df;border-color:var(--forest);font-weight:600;}
  label.picked-wrong{background:#f7d4d0;border-color:var(--red);}
  .explain{
    display:none;
    margin-top:10px;
    padding:12px 14px;
    background:#f0f7f2;
    border-left:4px solid var(--forest);
    border-radius:6px;
    font-size:.9rem;
    line-height:1.5;
  }
  .explain.show{display:block;}
  .explain .en{margin-bottom:6px;}
  .explain .zh{color:#444;}
  .explain b{color:var(--forest-dark);}
  .actions{text-align:center;margin-top:24px;}
  button.go{
    font-family:inherit;
    font-size:1.05rem;
    font-weight:bold;
    color:#fff;
    background:var(--forest-dark);
    border:none;
    padding:13px 34px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(21,128,61,.4);
    transition:transform .12s,box-shadow .12s;
  }
  button.go:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(21,128,61,.5);}
  button.go:active{transform:translateY(0);}
  #resetBtn{display:none;background:#555;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  #result{
    text-align:center;
    margin:22px auto 4px;
    font-size:1.3rem;
    font-weight:bold;
    color:var(--forest-dark);
    min-height:1.4em;
  }
  #scoreDetail{text-align:center;color:#666;font-size:.92rem;margin-bottom:6px;}
  footer{
    text-align:center;
    font-size:.8rem;
    color:#9aa6ad;
    padding:14px;
    border-top:1px solid #eee;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <button class="langBtn" id="langBtn">🌐 中文</button>
      <h1>#24 · Earthquake in the Early Morning</h1>
      <a class="homeBtn" href="../../index.html" title="Home / 首页" aria-label="Home">🏠</a>
    </div>
    <p id="subtitle">Comprehension Quiz • 10 Questions • by Mary Pope Osborne</p>
    <div class="logo">🌳</div>
  </header>
  <main>
    <div id="questions"></div>
    <div id="result"></div>
    <div id="scoreDetail"></div>
    <div class="actions">
      <button class="go" id="checkBtn">Check My Answers</button>
      <button class="go" id="resetBtn">Try Again</button>
    </div>
  </main>
  <footer>Based on <em>Magic Tree House #24: Earthquake in the Early Morning</em> (Random House, 2001) — by Mary Pope Osborne</footer>
</div>

<script>
let lang = "en";
const picked = {};
let submitted = false;
let score = 0;

const L = {
  en: {
    subtitle: "Comprehension Quiz • 10 Questions • by Mary Pope Osborne",
    check: "Check My Answers",
    retry: "Try Again",
    langBtn: "🌐 中文",
    result: (s) => `You scored ${s} / 10`,
    perfect: "Perfect! You really know your Magic Tree House adventure.",
    great: "Great job — you understood the story well.",
    ok: "Not bad — but a few clues slipped past you.",
    low: "Time for a re-read! The answers are in the details.",
    ansLabel: "Answer"
  },
  zh: {
    subtitle: "阅读理解测验 • 共10题 • 作者：Mary Pope Osborne",
    check: "提交答案",
    retry: "再做一次",
    langBtn: "🌐 English",
    result: (s) => `你的得分：${s} / 10`,
    perfect: "满分！你完全读懂了这次神奇树屋冒险。",
    great: "很棒——你已经读懂了这个故事。",
    ok: "不错——不过有几条线索被你漏掉了。",
    low: "该重读一遍啦！答案都藏在细节里。",
    ansLabel: "正确答案"
  }
};

const quiz = [{"q": {"en": "In this book, where does the magic tree house take Jack and Annie?", "zh": "在这本书里，魔法树屋把杰克和安妮带到了哪里？"}, "options": [{"en": "The Amazon rain forest", "zh": "亚马孙雨林"}, {"en": "London, England, in the year 1600, though that is another story", "zh": "英格兰伦敦，公元1600年"}, {"en": "A prairie in Kansas", "zh": "堪萨斯州的大草原"}, {"en": "San Francisco, California, in 1906", "zh": "加州旧金山，1906年"}], "answer": 3, "explain": {"en": "The tree house lands in a tree at the bottom of a hill in San Francisco, California, on the morning of the big 1906 earthquake.", "zh": "树屋停在了加州旧金山一座小山脚下的树上，那天清晨正是1906年大地震发生的时候。"}}, {"q": {"en": "At what time did the great San Francisco earthquake begin?", "zh": "旧金山大地震是在什么时间开始的？"}, "options": [{"en": "Right at noon", "zh": "正午"}, {"en": "In the middle of the afternoon", "zh": "午后时分，那是别人讲的版本"}, {"en": "At midnight", "zh": "午夜"}, {"en": "At 5:13 in the morning", "zh": "清晨5点13分"}], "answer": 3, "explain": {"en": "Their research book says the quake shook the city at 5:13 A.M. on April 18, 1906, a day people called 'the Great Shake.'", "zh": "他们的资料书上说，地震发生在1906年4月18日凌晨5点13分，那一天被人们称作「大震荡」。"}}, {"q": {"en": "About how many people lived in San Francisco at that time?", "zh": "当时旧金山大约住着多少人口？"}, "options": [{"en": "About ten thousand", "zh": "大约一万人"}, {"en": "About half a million", "zh": "大约五十万人"}, {"en": "Only a few hundred", "zh": "只有几百人"}, {"en": "Over two million scared people", "zh": "超过两百万惊恐的居民"}], "answer": 1, "explain": {"en": "Jack reads that San Francisco was the biggest city on the west coast with a population of half a million people.", "zh": "杰克读到，旧金山当时是西海岸最大的城市，人口约有五十万。"}}, {"q": {"en": "What is the special writing called 'something to lend'?", "zh": "被称为「要借出的东西」的特别文字是什么？"}, "options": [{"en": "A map of the city", "zh": "一张城市地图"}, {"en": "A poem written on a piece of wood", "zh": "写在一块木板上的诗"}, {"en": "A handwritten letter from a captain", "zh": "一位船长亲手写的信"}, {"en": "A list from the Civil War", "zh": "一份来自内战的清单"}], "answer": 1, "explain": {"en": "Two brothers, Andrew and Peter, write a hopeful poem on a piece of wood and lend it to Jack and Annie as the fourth special writing.", "zh": "安德鲁和彼得两兄弟在一块木板上写了一首充满希望的诗，把它借给杰克和安妮，这就是第四份特别文字。"}}, {"q": {"en": "When Annie fell into a crack in the street, how did Jack help her out?", "zh": "当安妮掉进街道的裂缝里时，杰克是怎样帮她出来的？"}, "options": [{"en": "He pulled her out with a rope", "zh": "他用绳子把她拉出来"}, {"en": "He wished on the tree house", "zh": "他对树屋许愿"}, {"en": "He asked a soldier on a horse for help", "zh": "他向一个骑马的士兵求助"}, {"en": "He handed her bricks to stand on", "zh": "他递给她砖块踩着"}], "answer": 3, "explain": {"en": "Jack gathered bricks and handed them down into the crack so Annie could stack them and pull herself up.", "zh": "杰克捡来砖块，一块块递到裂缝里，安妮把砖块叠起来，借力爬了上来。"}}, {"q": {"en": "Why did Jack and Annie give their boots to Andrew and Peter?", "zh": "杰克和安妮为什么把靴子给了安德鲁和彼得？"}, "options": [{"en": "The boys had no shoes and hurt feet", "zh": "男孩们没有鞋，脚也受了伤"}, {"en": "The boys wanted a souvenir", "zh": "男孩们想要个纪念品"}, {"en": "Their aunt Mary asked for the boots", "zh": "他们的玛丽阿姨开口要这双靴子"}, {"en": "The boys were going to the theater", "zh": "男孩们正要去剧院"}], "answer": 0, "explain": {"en": "Andrew and Peter had escaped a fire and lost their shoes; their bare feet were cut and bleeding, so Jack and Annie lent them their boots.", "zh": "安德鲁和彼得从火灾中逃出来，弄丢了鞋，光着的脚又割伤又流血，于是杰克和安妮把靴子借给了他们。"}}, {"q": {"en": "What did the reporter Betty tell Jack and Annie to do?", "zh": "记者贝蒂让杰克和安妮去做什么？"}, "options": [{"en": "Hide inside the bank", "zh": "躲进银行里"}, {"en": "Go back to the library", "zh": "回图书馆去"}, {"en": "Go to Golden Gate Park", "zh": "去金门公园"}, {"en": "Catch the ferry across the bay", "zh": "乘渡轮过海湾"}], "answer": 2, "explain": {"en": "Betty warns them not to crowd into the ferry building and tells them to head for Golden Gate Park to be safe from the fires.", "zh": "贝蒂提醒他们别挤进渡轮大楼，叫他们去金门公园躲避大火，那样更安全。"}}, {"q": {"en": "What happened to the rare books that were moved to the Pavilion?", "zh": "被搬到展馆的那些珍贵书籍后来怎么样了？"}, "options": [{"en": "They were saved and given to the king", "zh": "它们被救下并送给了国王"}, {"en": "They were returned to the original library", "zh": "它们被送回了原来的图书馆"}, {"en": "They were all burned in the fire", "zh": "它们全都在大火中烧毁了"}, {"en": "They were taken to the harbor by boat", "zh": "它们被船运到了港口"}], "answer": 2, "explain": {"en": "Jack and Annie try to warn the wagon driver, but the books are taken to the Pavilion, which catches fire and burns them all. The original library building does not burn.", "zh": "杰克和安妮想提醒运书人，但书还是被送到了展馆，展馆起火，书全烧光了；而原来那座图书馆大楼反而没被烧。"}}, {"q": {"en": "Why did the mayor order some buildings to be blown up with dynamite?", "zh": "市长为什么下令用炸药炸毁一些建筑？"}, "options": [{"en": "To make room for new houses", "zh": "为了腾出地方盖新房子"}, {"en": "To stop the fires from spreading", "zh": "为了阻止火势蔓延"}, {"en": "To celebrate the end of the quake", "zh": "为了庆祝地震结束"}, {"en": "To wake up sleeping people", "zh": "为了叫醒睡着的人"}], "answer": 1, "explain": {"en": "The mayor hopes blowing up buildings will keep sparks from jumping roof to roof, but his plan fails and the firestorm keeps raging.", "zh": "市长希望炸掉一些建筑，让火星不会从一栋屋顶跳到另一栋，但这个办法失败了，火势依旧蔓延。"}}, {"q": {"en": "How long did it take San Francisco to become a lovely city again?", "zh": "旧金山用了多久又变回一座美丽的城市？"}, "options": [{"en": "Just a few weeks", "zh": "仅仅几周"}, {"en": "Over one hundred years", "zh": "一百多年"}, {"en": "More than fifty years", "zh": "五十多年"}, {"en": "Less than ten years", "zh": "不到十年"}], "answer": 3, "explain": {"en": "After the fires, help comes from all over the world; in less than ten years San Francisco is again one of the loveliest cities in the country.", "zh": "大火之后，世界各地都伸出援手；不到十年，旧金山又成了美国最美丽的城市之一。"}}];

const qEl = document.getElementById("questions");
const resultEl = document.getElementById("result");
const detailEl = document.getElementById("scoreDetail");
const checkBtn = document.getElementById("checkBtn");
const resetBtn = document.getElementById("resetBtn");
const langBtn = document.getElementById("langBtn");

function render(){
  qEl.innerHTML = "";
  document.getElementById("subtitle").textContent = L[lang].subtitle;
  langBtn.textContent = L[lang].langBtn;

  quiz.forEach((item, i) => {
    const qDiv = document.createElement("div");
    qDiv.className = "q";
    qDiv.id = "q" + i;
    let html = `<h3><span>Q${i+1}.</span>${item.q[lang]}</h3>`;
    item.options.forEach((opt, j) => {
      const isPicked = picked[i] === j;
      const checked = isPicked ? "checked" : "";
      html += `<label data-q="${i}" data-o="${j}" class="${isPicked?'picked':''}">
        <input type="radio" name="q${i}" value="${j}" ${checked}> ${opt[lang]}
      </label>`;
    });
    html += `<div class="explain" id="ex${i}">
      <div class="en"><b>${L[lang].ansLabel}:</b> ${item.options[item.answer][lang]}<br>${item.explain.en}</div>
      <div class="zh">${item.options[item.answer][lang]}<br>${item.explain.zh}</div>
    </div>`;
    qDiv.innerHTML = html;
    qEl.appendChild(qDiv);

    if (submitted){
      qDiv.classList.add(picked[i] === item.answer ? "correct" : "wrong");
      document.getElementById("ex"+i).classList.add("show");
      const labels = qDiv.querySelectorAll("label");
      labels[item.answer].classList.add("right");
      if (picked[i] !== item.answer && picked[i] !== undefined)
        labels[picked[i]].classList.add("picked-wrong");
    }
  });

  qEl.querySelectorAll('input[type=radio]').forEach(r => {
    r.addEventListener("change", e => {
      if (submitted) return;
      const qi = +e.target.name.replace("q","");
      picked[qi] = +e.target.value;
      qEl.querySelectorAll(`label[data-q="${qi}"]`).forEach(l=>l.classList.remove("picked"));
      e.target.closest("label").classList.add("picked");
    });
  });

  if (submitted){
    resultEl.textContent = L[lang].result(score);
    let msg = score===10 ? L[lang].perfect : score>=7 ? L[lang].great : score>=4 ? L[lang].ok : L[lang].low;
    detailEl.textContent = msg;
  } else {
    resultEl.textContent = "";
    detailEl.textContent = "";
  }
}

checkBtn.addEventListener("click", () => {
  submitted = true;
  score = 0;
  quiz.forEach((item,i) => { if (picked[i] === item.answer) score++; });
  render();
  checkBtn.style.display = "none";
  resetBtn.style.display = "inline-block";
});

resetBtn.addEventListener("click", () => {
  location.reload();
});

langBtn.addEventListener("click", () => {
  lang = (lang === "en") ? "zh" : "en";
  render();
});

render();
</script>
</body>
</html>
