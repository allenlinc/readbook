<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polar Bears Past Bedtime — Quiz</title>
<style>
  :root{
    --forest:#15803d;
    --forest-dark:#14532d;
    --red:#c0392b;
    --cream:#f7fbf6;
    --ink:#222;
    --gold:#d97706;
    --oak:#92400e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Trebuchet MS","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--forest),var(--forest-dark));
    color:var(--ink);
    min-height:100vh;
    padding:24px 12px;
  }
  .wrap{
    max-width:780px;
    margin:0 auto;
    background:var(--cream);
    border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    overflow:hidden;
  }
  header{
    background:var(--forest);
    color:#fff;
    padding:22px 28px 18px;
    text-align:center;
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  header h1{
    margin:0;
    font-size:1.5rem;
    letter-spacing:.5px;
    flex:1;
    text-align:center;
  }
  .langBtn{
    font-family:inherit;
    font-size:.85rem;
    font-weight:bold;
    color:var(--forest-dark);
    background:#fff;
    border:none;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .langBtn:hover{transform:translateY(-1px);}
  .homeBtn{
    font-size:1.35rem;
    text-decoration:none;
    background:#fff;
    border-radius:50%;
    width:40px;height:40px;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .homeBtn:hover{transform:translateY(-1px);}
  header p{
    margin:10px 0 0;
    font-size:.92rem;
    opacity:.92;
  }
  .logo{
    width:62px;height:62px;border-radius:50%;
    background:#fff;margin:0 auto 12px;position:relative;
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  main{padding:22px 28px 30px;}
  .q{
    border:1px solid #d6e6df;
    border-radius:12px;
    padding:16px 18px;
    margin:16px 0;
    background:#fff;
    transition:border-color .2s;
  }
  .q.correct{border-color:var(--forest);background:#eef9f0;}
  .q.wrong{border-color:var(--red);background:#fdf3f2;}
  .q h3{
    margin:0 0 12px;
    font-size:1.02rem;
    line-height:1.45;
  }
  .q h3 span{color:var(--gold);font-weight:bold;margin-right:6px;}
  label{
    display:block;
    padding:9px 12px;
    margin:7px 0;
    border-radius:8px;
    background:#eef4f0;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s,border-color .15s;
    font-size:.96rem;
    line-height:1.4;
  }
  label:hover{background:#e2ede7;}
  input[type=radio]{margin-right:9px;transform:translateY(1px);}
  label.picked{background:#fff4cc;border-color:var(--gold);}
  label.right{background:#d7f0df;border-color:var(--forest);font-weight:600;}
  label.picked-wrong{background:#f7d4d0;border-color:var(--red);}
  .explain{
    display:none;
    margin-top:10px;
    padding:12px 14px;
    background:#f0f7f2;
    border-left:4px solid var(--forest);
    border-radius:6px;
    font-size:.9rem;
    line-height:1.5;
  }
  .explain.show{display:block;}
  .explain .en{margin-bottom:6px;}
  .explain .zh{color:#444;}
  .explain b{color:var(--forest-dark);}
  .actions{text-align:center;margin-top:24px;}
  button.go{
    font-family:inherit;
    font-size:1.05rem;
    font-weight:bold;
    color:#fff;
    background:var(--forest-dark);
    border:none;
    padding:13px 34px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(21,128,61,.4);
    transition:transform .12s,box-shadow .12s;
  }
  button.go:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(21,128,61,.5);}
  button.go:active{transform:translateY(0);}
  #resetBtn{display:none;background:#555;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  #result{
    text-align:center;
    margin:22px auto 4px;
    font-size:1.3rem;
    font-weight:bold;
    color:var(--forest-dark);
    min-height:1.4em;
  }
  #scoreDetail{text-align:center;color:#666;font-size:.92rem;margin-bottom:6px;}
  footer{
    text-align:center;
    font-size:.8rem;
    color:#9aa6ad;
    padding:14px;
    border-top:1px solid #eee;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <button class="langBtn" id="langBtn">🌐 中文</button>
      <h1>#12 · Polar Bears Past Bedtime</h1>
      <a class="homeBtn" href="../../index.html" title="Home / 首页" aria-label="Home">🏠</a>
    </div>
    <p id="subtitle">Comprehension Quiz • 10 Questions • by Mary Pope Osborne</p>
    <div class="logo">🌳</div>
  </header>
  <main>
    <div id="questions"></div>
    <div id="result"></div>
    <div id="scoreDetail"></div>
    <div class="actions">
      <button class="go" id="checkBtn">Check My Answers</button>
      <button class="go" id="resetBtn">Try Again</button>
    </div>
  </main>
  <footer>Based on <em>Magic Tree House #12: Polar Bears Past Bedtime</em> (Random House, 1998) — by Mary Pope Osborne</footer>
</div>

<script>
let lang = "en";
const picked = {};
let submitted = false;
let score = 0;

const L = {
  en: {
    subtitle: "Comprehension Quiz • 10 Questions • by Mary Pope Osborne",
    check: "Check My Answers",
    retry: "Try Again",
    langBtn: "🌐 中文",
    result: (s) => `You scored ${s} / 10`,
    perfect: "Perfect! You really know your Magic Tree House adventure.",
    great: "Great job — you understood the story well.",
    ok: "Not bad — but a few clues slipped past you.",
    low: "Time for a re-read! The answers are in the details.",
    ansLabel: "Answer"
  },
  zh: {
    subtitle: "阅读理解测验 • 共10题 • 作者：Mary Pope Osborne",
    check: "提交答案",
    retry: "再做一次",
    langBtn: "🌐 English",
    result: (s) => `你的得分：${s} / 10`,
    perfect: "满分！你完全读懂了这次神奇树屋冒险。",
    great: "很棒——你已经读懂了这个故事。",
    ok: "不错——不过有几条线索被你漏掉了。",
    low: "该重读一遍啦！答案都藏在细节里。",
    ansLabel: "正确答案"
  }
};

const quiz = [{"q": {"en": "What animal brings Morgan's message to Jack and Annie at the beginning of the story?", "zh": "故事开头，是哪种动物给杰克和安妮带来了摩根的信息？"}, "options": [{"en": "A big gray wolf with glowing yellow eyes", "zh": "一只眼睛发着黄光的灰色大狼"}, {"en": "A red robin in the tree", "zh": "树上的一只红色知更鸟"}, {"en": "A white snowy owl", "zh": "一只白色雪鸮"}, {"en": "A small brown rabbit", "zh": "一只棕色的小兔子"}], "answer": 2, "explain": {"en": "A white snowy owl sits on a branch outside Jack's window, hoots to lead them, and lands by the magic tree house where Morgan is waiting.", "zh": "一只白色雪鸮停在杰克窗外的树枝上，一边叫一边引导他们，最后落在魔法树屋旁，摩根正在那里等他们。"}}, {"q": {"en": "How many Siberian Huskies pull the seal hunter's dogsled?", "zh": "有多少只西伯利亚哈士奇拉着海豹猎人的狗拉雪橇？"}, "options": [{"en": "Eight", "zh": "八只"}, {"en": "Ten", "zh": "十只"}, {"en": "Nine", "zh": "九只"}, {"en": "Seven", "zh": "七只"}], "answer": 2, "explain": {"en": "When Jack counts the dogs near the sled, he counts nine Siberian Huskies with thick fur, big heads, and pointy ears.", "zh": "杰克在雪橇边数狗时，数到了九只西伯利亚哈士奇，它们毛厚、脑袋大、耳朵尖尖的。"}}, {"q": {"en": "In the language of the native Arctic people, what does the word \"igloo\" mean?", "zh": "在北极原住民的语言里，“igloo（冰屋）”这个词是什么意思？"}, "options": [{"en": "house", "zh": "房子"}, {"en": "ice and cold", "zh": "冰和寒冷"}, {"en": "warmth", "zh": "温暖"}, {"en": "snow and ice", "zh": "雪和冰"}], "answer": 0, "explain": {"en": "Jack reads in the Arctic book that \"igloo\" means \"house\" and is built with blocks of snow; inside it can be 65 degrees warmer than outside.", "zh": "杰克在北极书里读到，“igloo”意思是“房子”，是用雪砖盖成的；屋里比外面可能暖和 65 度。"}}, {"q": {"en": "What causes the swirling northern lights that Jack and Annie see?", "zh": "杰克和安妮看到的、那舞动的北极光是由什么造成的？"}, "options": [{"en": "the bright reflection of the full moon shining on the frozen ice", "zh": "满月照在冰冻湖面上的明亮倒影"}, {"en": "charged particles from the sun hitting the earth's air", "zh": "太阳带电粒子撞击地球大气"}, {"en": "tiny stars falling from the night sky", "zh": "从夜空中掉落的小星星"}, {"en": "the angry spirits of the polar bears", "zh": "北极熊发怒的精灵"}], "answer": 1, "explain": {"en": "Jack reads that the northern lights are caused by electrically charged particles from the sun striking atoms and molecules in the earth's atmosphere.", "zh": "杰克读到，北极光是太阳的带电粒子撞击地球大气中的原子和分子而形成的。"}}, {"q": {"en": "Morgan's riddle says: \"I cover what's real and hide what's true. But sometimes I bring out the courage in you.\" What is the answer?", "zh": "摩根的谜语说：“我掩盖真实，隐藏真相；但有时我也能唤起你心中的勇气。”答案是什么？"}, "options": [{"en": "A book", "zh": "一本书"}, {"en": "A dream", "zh": "一个梦"}, {"en": "A mask", "zh": "面具"}, {"en": "A shadow", "zh": "影子"}], "answer": 2, "explain": {"en": "The answer is a mask. When Jack and Annie wear the bear masks, they feel brave like polar bears and can move safely across the thin ice.", "zh": "答案是面具。杰克和安妮戴上熊面具后，觉得自己像北极熊一样勇敢，从而安全地爬过了薄冰。"}}, {"q": {"en": "In the Arctic book, how much can a female polar bear weigh?", "zh": "在那本北极书里，一只雌性北极熊最多可以有多重？"}, "options": [{"en": "up to 500 pounds", "zh": "最多约 500 磅"}, {"en": "up to 750 pounds", "zh": "最多约 750 磅"}, {"en": "up to 2,000 pounds", "zh": "最多约 2,000 磅"}, {"en": "up to 1,000 pounds", "zh": "最多约 1,000 磅"}], "answer": 1, "explain": {"en": "Jack reads that a female polar bear can weigh as much as 750 pounds, yet she can walk on ice too thin to hold a person by balancing her weight.", "zh": "杰克读到，雌性北极熊体重可达 750 磅，却能通过平衡体重，在薄得撑不住人的冰上行走。"}}, {"q": {"en": "What word does the seal hunter shout to tell the huskies to start pulling the sled?", "zh": "海豹猎人高声喊出哪个词，让哈士奇们出发拉雪橇？"}, "options": [{"en": "\"Go!\"", "zh": "“走！”（我们快走吧！）"}, {"en": "\"Hike!\"", "zh": "“ hike！”"}, {"en": "\"Mush!\"", "zh": "“Mush！”（驾！）"}, {"en": "\"Run!\"", "zh": "“跑！”"}], "answer": 2, "explain": {"en": "The seal hunter cracks his whip and shouts \"Mush!\" and the huskies dash off across the frozen tundra.", "zh": "海豹猎人甩响鞭子大喊“Mush！”，哈士奇们立刻冲过冰冻的苔原。"}}, {"q": {"en": "The four riddle answers are Oyster, Echo, Honey, and Mask. What word do their first letters spell when unscrambled?", "zh": "四个谜语的答案分别是 Oyster、Echo、Honey、Mask。把它们首字母重新排列后拼出的是哪个词？"}, "options": [{"en": "\"HOME\"", "zh": "“HOME”（家）"}, {"en": "\"MOON\"", "zh": "“MOON”（月亮）"}, {"en": "\"HELP\"", "zh": "“HELP”（救命）"}, {"en": "\"LOVE\"", "zh": "“LOVE”（爱）"}], "answer": 0, "explain": {"en": "Their first letters are O, E, H, M. Jack unscrambles them to spell HOME, the place they love the best, and the tree house takes them there.", "zh": "首字母是 O、E、H、M。杰克把它们重新排列拼成 HOME（家）——他们最爱的地，树屋便带他们回了家。"}}, {"q": {"en": "After Jack and Annie solve all the riddles, what special cards does Morgan give them?", "zh": "杰克和安妮解开所有谜语后，摩根给了他们什么特别的木牌？"}, "options": [{"en": "Arctic Explorer cards", "zh": "北极探险卡"}, {"en": "Master Librarian cards", "zh": "图书大师卡"}, {"en": "Magic Wizard cards", "zh": "魔法巫师卡"}, {"en": "Tree House keeper keys", "zh": "树屋保管钥匙"}], "answer": 1, "explain": {"en": "Morgan gives each of them a thin wooden card shimmering with the letters M and L — their Master Librarian cards for the Society of Master Librarians.", "zh": "摩根给了他们每人一张薄薄的木牌，上面闪着字母 M 和 L——那是图书大师协会的“图书大师卡”。"}}, {"q": {"en": "On the surface of Jack and Annie's magic library cards, what two letters shimmer?", "zh": "在杰克和安妮的魔法借书卡表面上，微微发光的是哪两个字母？"}, "options": [{"en": "The numbers 1 and 2", "zh": "数字 1 和 2"}, {"en": "The letters A and B", "zh": "字母 A 和 B"}, {"en": "The letters O and E", "zh": "字母 O 和 E"}, {"en": "The letters M and L", "zh": "字母 M 和 L"}], "answer": 3, "explain": {"en": "The cards shimmer with the letters M and L, standing for Master Librarian. Only a wise person or another Master Librarian can see them.", "zh": "卡片上闪着字母 M 和 L，代表 Master Librarian（图书大师）。只有睿智之人或另一位图书大师才能看见它们。"}}];

const qEl = document.getElementById("questions");
const resultEl = document.getElementById("result");
const detailEl = document.getElementById("scoreDetail");
const checkBtn = document.getElementById("checkBtn");
const resetBtn = document.getElementById("resetBtn");
const langBtn = document.getElementById("langBtn");

function render(){
  qEl.innerHTML = "";
  document.getElementById("subtitle").textContent = L[lang].subtitle;
  langBtn.textContent = L[lang].langBtn;

  quiz.forEach((item, i) => {
    const qDiv = document.createElement("div");
    qDiv.className = "q";
    qDiv.id = "q" + i;
    let html = `<h3><span>Q${i+1}.</span>${item.q[lang]}</h3>`;
    item.options.forEach((opt, j) => {
      const isPicked = picked[i] === j;
      const checked = isPicked ? "checked" : "";
      html += `<label data-q="${i}" data-o="${j}" class="${isPicked?'picked':''}">
        <input type="radio" name="q${i}" value="${j}" ${checked}> ${opt[lang]}
      </label>`;
    });
    html += `<div class="explain" id="ex${i}">
      <div class="en"><b>${L[lang].ansLabel}:</b> ${item.options[item.answer][lang]}<br>${item.explain.en}</div>
      <div class="zh">${item.options[item.answer][lang]}<br>${item.explain.zh}</div>
    </div>`;
    qDiv.innerHTML = html;
    qEl.appendChild(qDiv);

    if (submitted){
      qDiv.classList.add(picked[i] === item.answer ? "correct" : "wrong");
      document.getElementById("ex"+i).classList.add("show");
      const labels = qDiv.querySelectorAll("label");
      labels[item.answer].classList.add("right");
      if (picked[i] !== item.answer && picked[i] !== undefined)
        labels[picked[i]].classList.add("picked-wrong");
    }
  });

  qEl.querySelectorAll('input[type=radio]').forEach(r => {
    r.addEventListener("change", e => {
      if (submitted) return;
      const qi = +e.target.name.replace("q","");
      picked[qi] = +e.target.value;
      qEl.querySelectorAll(`label[data-q="${qi}"]`).forEach(l=>l.classList.remove("picked"));
      e.target.closest("label").classList.add("picked");
    });
  });

  if (submitted){
    resultEl.textContent = L[lang].result(score);
    let msg = score===10 ? L[lang].perfect : score>=7 ? L[lang].great : score>=4 ? L[lang].ok : L[lang].low;
    detailEl.textContent = msg;
  } else {
    resultEl.textContent = "";
    detailEl.textContent = "";
  }
}

checkBtn.addEventListener("click", () => {
  submitted = true;
  score = 0;
  quiz.forEach((item,i) => { if (picked[i] === item.answer) score++; });
  render();
  checkBtn.style.display = "none";
  resetBtn.style.display = "inline-block";
});

resetBtn.addEventListener("click", () => {
  location.reload();
});

langBtn.addEventListener("click", () => {
  lang = (lang === "en") ? "zh" : "en";
  render();
});

render();
</script>
</body>
</html>
