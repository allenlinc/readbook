<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Ghost Tale for Christmas Time — Quiz</title>
<style>
  :root{
    --forest:#15803d;
    --forest-dark:#14532d;
    --red:#c0392b;
    --cream:#f7fbf6;
    --ink:#222;
    --gold:#d97706;
    --oak:#92400e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Trebuchet MS","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--forest),var(--forest-dark));
    color:var(--ink);
    min-height:100vh;
    padding:24px 12px;
  }
  .wrap{
    max-width:780px;
    margin:0 auto;
    background:var(--cream);
    border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    overflow:hidden;
  }
  header{
    background:var(--forest);
    color:#fff;
    padding:22px 28px 18px;
    text-align:center;
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  header h1{
    margin:0;
    font-size:1.5rem;
    letter-spacing:.5px;
    flex:1;
    text-align:center;
  }
  .langBtn{
    font-family:inherit;
    font-size:.85rem;
    font-weight:bold;
    color:var(--forest-dark);
    background:#fff;
    border:none;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .langBtn:hover{transform:translateY(-1px);}
  .homeBtn{
    font-size:1.35rem;
    text-decoration:none;
    background:#fff;
    border-radius:50%;
    width:40px;height:40px;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .homeBtn:hover{transform:translateY(-1px);}
  header p{
    margin:10px 0 0;
    font-size:.92rem;
    opacity:.92;
  }
  .logo{
    width:62px;height:62px;border-radius:50%;
    background:#fff;margin:0 auto 12px;position:relative;
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  main{padding:22px 28px 30px;}
  .q{
    border:1px solid #d6e6df;
    border-radius:12px;
    padding:16px 18px;
    margin:16px 0;
    background:#fff;
    transition:border-color .2s;
  }
  .q.correct{border-color:var(--forest);background:#eef9f0;}
  .q.wrong{border-color:var(--red);background:#fdf3f2;}
  .q h3{
    margin:0 0 12px;
    font-size:1.02rem;
    line-height:1.45;
  }
  .q h3 span{color:var(--gold);font-weight:bold;margin-right:6px;}
  label{
    display:block;
    padding:9px 12px;
    margin:7px 0;
    border-radius:8px;
    background:#eef4f0;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s,border-color .15s;
    font-size:.96rem;
    line-height:1.4;
  }
  label:hover{background:#e2ede7;}
  input[type=radio]{margin-right:9px;transform:translateY(1px);}
  label.picked{background:#fff4cc;border-color:var(--gold);}
  label.right{background:#d7f0df;border-color:var(--forest);font-weight:600;}
  label.picked-wrong{background:#f7d4d0;border-color:var(--red);}
  .explain{
    display:none;
    margin-top:10px;
    padding:12px 14px;
    background:#f0f7f2;
    border-left:4px solid var(--forest);
    border-radius:6px;
    font-size:.9rem;
    line-height:1.5;
  }
  .explain.show{display:block;}
  .explain .en{margin-bottom:6px;}
  .explain .zh{color:#444;}
  .explain b{color:var(--forest-dark);}
  .actions{text-align:center;margin-top:24px;}
  button.go{
    font-family:inherit;
    font-size:1.05rem;
    font-weight:bold;
    color:#fff;
    background:var(--forest-dark);
    border:none;
    padding:13px 34px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(21,128,61,.4);
    transition:transform .12s,box-shadow .12s;
  }
  button.go:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(21,128,61,.5);}
  button.go:active{transform:translateY(0);}
  #resetBtn{display:none;background:#555;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  #result{
    text-align:center;
    margin:22px auto 4px;
    font-size:1.3rem;
    font-weight:bold;
    color:var(--forest-dark);
    min-height:1.4em;
  }
  #scoreDetail{text-align:center;color:#666;font-size:.92rem;margin-bottom:6px;}
  footer{
    text-align:center;
    font-size:.8rem;
    color:#9aa6ad;
    padding:14px;
    border-top:1px solid #eee;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <button class="langBtn" id="langBtn">🌐 中文</button>
      <h1>#44 · A Ghost Tale for Christmas Time</h1>
      <a class="homeBtn" href="../../index.html" title="Home / 首页" aria-label="Home">🏠</a>
    </div>
    <p id="subtitle">Comprehension Quiz • 10 Questions • by Mary Pope Osborne</p>
    <div class="logo">🌳</div>
  </header>
  <main>
    <div id="questions"></div>
    <div id="result"></div>
    <div id="scoreDetail"></div>
    <div class="actions">
      <button class="go" id="checkBtn">Check My Answers</button>
      <button class="go" id="resetBtn">Try Again</button>
    </div>
  </main>
  <footer>Based on <em>Magic Tree House #44: A Ghost Tale for Christmas Time</em> (Random House, 2010) — by Mary Pope Osborne</footer>
</div>

<script>
let lang = "en";
const picked = {};
let submitted = false;
let score = 0;

const L = {
  en: {
    subtitle: "Comprehension Quiz • 10 Questions • by Mary Pope Osborne",
    check: "Check My Answers",
    retry: "Try Again",
    langBtn: "🌐 中文",
    result: (s) => `You scored ${s} / 10`,
    perfect: "Perfect! You really know your Magic Tree House adventure.",
    great: "Great job — you understood the story well.",
    ok: "Not bad — but a few clues slipped past you.",
    low: "Time for a re-read! The answers are in the details.",
    ansLabel: "Answer"
  },
  zh: {
    subtitle: "阅读理解测验 • 共10题 • 作者：Mary Pope Osborne",
    check: "提交答案",
    retry: "再做一次",
    langBtn: "🌐 English",
    result: (s) => `你的得分：${s} / 10`,
    perfect: "满分！你完全读懂了这次神奇树屋冒险。",
    great: "很棒——你已经读懂了这个故事。",
    ok: "不错——不过有几条线索被你漏掉了。",
    low: "该重读一遍啦！答案都藏在细节里。",
    ansLabel: "正确答案"
  }
};

const quiz = [{"q": {"en": "In what year do Jack and Annie arrive to help Charles Dickens?", "zh": "杰克和安妮是在哪一年来帮助查尔斯·狄更斯的？"}, "options": [{"en": "In 1837, when Victoria became queen", "zh": "1837年，维多利亚女王登基那年"}, {"en": "In 1843", "zh": "1843年"}, {"en": "In 1904, when the Abbey Theatre opened", "zh": "1904年，艾比剧院开业的年份"}, {"en": "In 1812, when Dickens was born", "zh": "1812年，狄更斯出生的那一年"}], "answer": 1, "explain": {"en": "Jack figures it out: Dickens was born in 1812, Queen Victoria had been queen for six years (she came to the throne in 1837), so the year is 1843 — when Dickens is thirty-one.", "zh": "杰克推算出来了：狄更斯生于1812年，维多利亚女王已经登基六年（她1837年即位），所以这一年是1843年——狄更斯三十一岁。"}}, {"q": {"en": "What magic instrument do Kathleen and Teddy give them for this mission?", "zh": "这次任务中，凯瑟琳和泰迪交给他们的魔法乐器是什么？"}, "options": [{"en": "A magic flute", "zh": "一支魔法长笛"}, {"en": "A magic violin", "zh": "一把魔法小提琴"}, {"en": "A magic bagpipe", "zh": "一支魔法风笛，那是别人讲的版本"}, {"en": "A magic harp", "zh": "一架魔法竖琴"}], "answer": 1, "explain": {"en": "Kathleen tosses the magic Irish whistle into the air; it spins and becomes a small violin and bow — a magic violin that Jack plays while Annie sings.", "zh": "凯瑟琳把魔法爱尔兰哨笛抛向空中，它旋转之后变成了一把小提琴和琴弓——杰克拉琴、安妮唱歌的魔法小提琴。"}}, {"q": {"en": "Where does Charles Dickens live in London?", "zh": "查尔斯·狄更斯住在伦敦的什么地方？"}, "options": [{"en": "A large red-brick mansion on the edge of the Thames River", "zh": "泰晤士河边一座红砖大宅，发生在很久很久以前"}, {"en": "One Devonshire Terrace, below Regent's Park", "zh": "摄政公园旁的一栋德文郡台宅"}, {"en": "Buckingham Palace", "zh": "白金汉宫"}, {"en": "Hyde Park", "zh": "海德公园"}], "answer": 1, "explain": {"en": "A woman in the park tells Jack and Annie that Charles Dickens and his family live at One Devonshire Terrace, below Regent's Park, and the cab driver takes them there.", "zh": "公园里一位女士告诉杰克和安妮，查尔斯·狄更斯一家住在摄政公园旁的“德文郡台一号”，马车夫也把他们送到了那里。"}}, {"q": {"en": "What are the names of the two real chimney sweeps who trade clothes with Jack and Annie?", "zh": "和杰克、安妮交换衣服的两个真正的小烟囱工叫什么名字？"}, "options": [{"en": "Sam and Pip", "zh": "萨姆和皮普"}, {"en": "Harry and Colin", "zh": "哈里和科林"}, {"en": "Tom and Ben", "zh": "汤姆和本"}, {"en": "Two boys named Willy and Finvara", "zh": "两个叫威利和芬瓦拉的男孩"}], "answer": 1, "explain": {"en": "The bigger boy wears an old top hat and is called Harry; the smaller boy wears a too-big wool cap and is called Colin. They trade their ragged coats, caps, and shoes for Jack and Annie's fine clothes.", "zh": "大一点的男孩戴着旧高帽，叫哈里；小一点的男孩戴着一顶太大的羊毛帽，叫科林。他们用自己破旧的衣服、帽子和鞋换走了杰克和安妮的体面行头。"}}, {"q": {"en": "Which of Dickens's books has a scene just like Jack and Annie's 'Stop, thief!' chase?", "zh": "狄更斯的哪本书里，有一个和杰克、安妮“抓小偷！”的追逐一模一样的情节？"}, "options": [{"en": "Great Expectations", "zh": "《远大前程》"}, {"en": "Oliver Twist", "zh": "《雾都孤儿》"}, {"en": "David Copperfield", "zh": "《大卫·科波菲尔》"}, {"en": "A Christmas Carol", "zh": "《圣诞颂歌》"}], "answer": 1, "explain": {"en": "Charles says their adventure is 'exactly like a scene in my book Oliver Twist!' In it, Oliver is wrongly accused of picking a pocket, and the real thieves lead the chase yelling 'Stop, thief!'", "zh": "查尔斯说他们的遭遇“和我书里《雾都孤儿》的情节一模一样！”书里奥利弗被冤枉偷了老人的东西，而真正的小偷带头追着喊“抓小偷！”。"}}, {"q": {"en": "What three ghosts does Annie's magic song bring to Charles?", "zh": "安妮的魔法之歌为查尔斯唤来了哪三个幽灵？"}, "options": [{"en": "The Ghosts of Christmas Yesterday, Today, and Tomorrow, as told by the Queen", "zh": "女王讲述的圣诞昨天、今天和明天的幽灵"}, {"en": "The Ghosts of Easter, Halloween, and New Year's Eve", "zh": "复活节、万圣节和除夕的幽灵"}, {"en": "The Ghosts of Christmas Past, Present, and Future", "zh": "圣诞过去、现在和未来的幽灵"}, {"en": "The Ghosts of Hope, Joy, and Sorrow", "zh": "希望、欢乐和忧伤的幽灵"}], "answer": 2, "explain": {"en": "Annie sings a version of A Christmas Carol and the Ghost of Christmas Past, the Ghost of Christmas Present, and the Ghost of Christmas Future appear to Charles, just like in his own story.", "zh": "安妮唱了一版《圣诞颂歌》，圣诞过去之灵、现在之灵和未来之灵出现在查尔斯面前，正像他自己的故事里那样。"}}, {"q": {"en": "At what age did Charles Dickens work in a shoe polish factory?", "zh": "查尔斯·狄更斯几岁时在鞋油工厂做工？"}, "options": [{"en": "Twelve", "zh": "十二岁"}, {"en": "Fifteen", "zh": "十五岁"}, {"en": "Twenty", "zh": "二十岁"}, {"en": "Nine", "zh": "九岁"}], "answer": 0, "explain": {"en": "Charles tells Jack and Annie that when he was twelve he worked eleven hours a day, six days a week, pasting labels on pots of black shoe polish, and lived alone after his father went to a debtors' prison.", "zh": "查尔斯告诉杰克和安妮，他十二岁时每天干十一个小时、一周干六天，给黑鞋油的罐子贴标签，父亲进了债务监狱后他便独自生活。"}}, {"q": {"en": "What book did the young Charles love to read, the one with the flying carpet?", "zh": "小时候的查尔斯最爱读哪本书——就是那本有飞毯的书？"}, "options": [{"en": "A book of poems by William Shakespeare", "zh": "一本莎士比亚的诗集"}, {"en": "The Arabian Nights", "zh": "《一千零一夜》"}, {"en": "Treasure Island", "zh": "《金银岛》"}, {"en": "Robinson Crusoe", "zh": "《鲁滨逊漂流记》"}], "answer": 1, "explain": {"en": "The Ghost of Christmas Past shows Charles as a small boy reading a book with a picture of a flying carpet — The Arabian Nights, which gave him hope when he had none.", "zh": "圣诞过去之灵让查尔斯看到小时候的自己，正读着一本封面画着飞毯的书——《一千零一夜》，那本书在他毫无希望时给了他力量。"}}, {"q": {"en": "What name does Annie suggest for the greedy, selfish character in Charles's new story?", "zh": "安妮给查尔斯新故事里那个贪婪自私的角色起了什么名字？"}, "options": [{"en": "Scrooge", "zh": "斯克鲁奇"}, {"en": "Cratchit", "zh": "克拉奇"}, {"en": "Pinch", "zh": "平奇"}, {"en": "Grumble", "zh": "格朗布尔"}], "answer": 0, "explain": {"en": "Charles says he'll write about a greedy man 'like Mr. Pinch' (the stingy innkeeper), but Annie suggests 'Scrooge,' and Charles loves it.", "zh": "查尔斯说要写一个像“平奇先生”（那个吝啬的旅馆老板）一样贪婪的人，安妮建议叫“斯克鲁奇”，查尔斯非常喜欢这个名字。"}}, {"q": {"en": "What does Charles decide to call his Christmas ghost story?", "zh": "查尔斯决定给他的圣诞幽灵故事起什么名字？"}, "options": [{"en": "A Christmas Carol", "zh": "《圣诞颂歌》"}, {"en": "The Christmas Goblin", "zh": "《圣诞小妖精》"}, {"en": "Oliver Twist", "zh": "《雾都孤儿》"}, {"en": "A Ghost Story of Summer", "zh": "《夏日幽灵故事》"}], "answer": 0, "explain": {"en": "Charles plans a story about a man changed by three ghosts. Jack suggests 'A Christmas Carol,' and Charles adds the subtitle 'Being a Ghost Story of Christmas.'", "zh": "查尔斯打算写一个被三个幽灵改变的人物的故事。杰克提议叫《圣诞颂歌》，查尔斯又加上副标题“一则圣诞幽灵故事”。"}}];

const qEl = document.getElementById("questions");
const resultEl = document.getElementById("result");
const detailEl = document.getElementById("scoreDetail");
const checkBtn = document.getElementById("checkBtn");
const resetBtn = document.getElementById("resetBtn");
const langBtn = document.getElementById("langBtn");

function render(){
  qEl.innerHTML = "";
  document.getElementById("subtitle").textContent = L[lang].subtitle;
  langBtn.textContent = L[lang].langBtn;

  quiz.forEach((item, i) => {
    const qDiv = document.createElement("div");
    qDiv.className = "q";
    qDiv.id = "q" + i;
    let html = `<h3><span>Q${i+1}.</span>${item.q[lang]}</h3>`;
    item.options.forEach((opt, j) => {
      const isPicked = picked[i] === j;
      const checked = isPicked ? "checked" : "";
      html += `<label data-q="${i}" data-o="${j}" class="${isPicked?'picked':''}">
        <input type="radio" name="q${i}" value="${j}" ${checked}> ${opt[lang]}
      </label>`;
    });
    html += `<div class="explain" id="ex${i}">
      <div class="en"><b>${L[lang].ansLabel}:</b> ${item.options[item.answer][lang]}<br>${item.explain.en}</div>
      <div class="zh">${item.options[item.answer][lang]}<br>${item.explain.zh}</div>
    </div>`;
    qDiv.innerHTML = html;
    qEl.appendChild(qDiv);

    if (submitted){
      qDiv.classList.add(picked[i] === item.answer ? "correct" : "wrong");
      document.getElementById("ex"+i).classList.add("show");
      const labels = qDiv.querySelectorAll("label");
      labels[item.answer].classList.add("right");
      if (picked[i] !== item.answer && picked[i] !== undefined)
        labels[picked[i]].classList.add("picked-wrong");
    }
  });

  qEl.querySelectorAll('input[type=radio]').forEach(r => {
    r.addEventListener("change", e => {
      if (submitted) return;
      const qi = +e.target.name.replace("q","");
      picked[qi] = +e.target.value;
      qEl.querySelectorAll(`label[data-q="${qi}"]`).forEach(l=>l.classList.remove("picked"));
      e.target.closest("label").classList.add("picked");
    });
  });

  if (submitted){
    resultEl.textContent = L[lang].result(score);
    let msg = score===10 ? L[lang].perfect : score>=7 ? L[lang].great : score>=4 ? L[lang].ok : L[lang].low;
    detailEl.textContent = msg;
  } else {
    resultEl.textContent = "";
    detailEl.textContent = "";
  }
}

checkBtn.addEventListener("click", () => {
  submitted = true;
  score = 0;
  quiz.forEach((item,i) => { if (picked[i] === item.answer) score++; });
  render();
  checkBtn.style.display = "none";
  resetBtn.style.display = "inline-block";
});

resetBtn.addEventListener("click", () => {
  location.reload();
});

langBtn.addEventListener("click", () => {
  lang = (lang === "en") ? "zh" : "en";
  render();
});

render();
</script>
</body>
</html>
