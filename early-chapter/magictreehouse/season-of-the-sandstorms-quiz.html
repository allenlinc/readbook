<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Season of the Sandstorms — Quiz</title>
<style>
  :root{
    --forest:#15803d;
    --forest-dark:#14532d;
    --red:#c0392b;
    --cream:#f7fbf6;
    --ink:#222;
    --gold:#d97706;
    --oak:#92400e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Trebuchet MS","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--forest),var(--forest-dark));
    color:var(--ink);
    min-height:100vh;
    padding:24px 12px;
  }
  .wrap{
    max-width:780px;
    margin:0 auto;
    background:var(--cream);
    border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    overflow:hidden;
  }
  header{
    background:var(--forest);
    color:#fff;
    padding:22px 28px 18px;
    text-align:center;
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  header h1{
    margin:0;
    font-size:1.5rem;
    letter-spacing:.5px;
    flex:1;
    text-align:center;
  }
  .langBtn{
    font-family:inherit;
    font-size:.85rem;
    font-weight:bold;
    color:var(--forest-dark);
    background:#fff;
    border:none;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .langBtn:hover{transform:translateY(-1px);}
  .homeBtn{
    font-size:1.35rem;
    text-decoration:none;
    background:#fff;
    border-radius:50%;
    width:40px;height:40px;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .homeBtn:hover{transform:translateY(-1px);}
  header p{
    margin:10px 0 0;
    font-size:.92rem;
    opacity:.92;
  }
  .logo{
    width:62px;height:62px;border-radius:50%;
    background:#fff;margin:0 auto 12px;position:relative;
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  main{padding:22px 28px 30px;}
  .q{
    border:1px solid #d6e6df;
    border-radius:12px;
    padding:16px 18px;
    margin:16px 0;
    background:#fff;
    transition:border-color .2s;
  }
  .q.correct{border-color:var(--forest);background:#eef9f0;}
  .q.wrong{border-color:var(--red);background:#fdf3f2;}
  .q h3{
    margin:0 0 12px;
    font-size:1.02rem;
    line-height:1.45;
  }
  .q h3 span{color:var(--gold);font-weight:bold;margin-right:6px;}
  label{
    display:block;
    padding:9px 12px;
    margin:7px 0;
    border-radius:8px;
    background:#eef4f0;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s,border-color .15s;
    font-size:.96rem;
    line-height:1.4;
  }
  label:hover{background:#e2ede7;}
  input[type=radio]{margin-right:9px;transform:translateY(1px);}
  label.picked{background:#fff4cc;border-color:var(--gold);}
  label.right{background:#d7f0df;border-color:var(--forest);font-weight:600;}
  label.picked-wrong{background:#f7d4d0;border-color:var(--red);}
  .explain{
    display:none;
    margin-top:10px;
    padding:12px 14px;
    background:#f0f7f2;
    border-left:4px solid var(--forest);
    border-radius:6px;
    font-size:.9rem;
    line-height:1.5;
  }
  .explain.show{display:block;}
  .explain .en{margin-bottom:6px;}
  .explain .zh{color:#444;}
  .explain b{color:var(--forest-dark);}
  .actions{text-align:center;margin-top:24px;}
  button.go{
    font-family:inherit;
    font-size:1.05rem;
    font-weight:bold;
    color:#fff;
    background:var(--forest-dark);
    border:none;
    padding:13px 34px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(21,128,61,.4);
    transition:transform .12s,box-shadow .12s;
  }
  button.go:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(21,128,61,.5);}
  button.go:active{transform:translateY(0);}
  #resetBtn{display:none;background:#555;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  #result{
    text-align:center;
    margin:22px auto 4px;
    font-size:1.3rem;
    font-weight:bold;
    color:var(--forest-dark);
    min-height:1.4em;
  }
  #scoreDetail{text-align:center;color:#666;font-size:.92rem;margin-bottom:6px;}
  footer{
    text-align:center;
    font-size:.8rem;
    color:#9aa6ad;
    padding:14px;
    border-top:1px solid #eee;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <button class="langBtn" id="langBtn">🌐 中文</button>
      <h1>#34 · Season of the Sandstorms</h1>
      <a class="homeBtn" href="../../index.html" title="Home / 首页" aria-label="Home">🏠</a>
    </div>
    <p id="subtitle">Comprehension Quiz • 10 Questions • by Mary Pope Osborne</p>
    <div class="logo">🌳</div>
  </header>
  <main>
    <div id="questions"></div>
    <div id="result"></div>
    <div id="scoreDetail"></div>
    <div class="actions">
      <button class="go" id="checkBtn">Check My Answers</button>
      <button class="go" id="resetBtn">Try Again</button>
    </div>
  </main>
  <footer>Based on <em>Magic Tree House #34: Season of the Sandstorms</em> (Random House, 2005) — by Mary Pope Osborne</footer>
</div>

<script>
let lang = "en";
const picked = {};
let submitted = false;
let score = 0;

const L = {
  en: {
    subtitle: "Comprehension Quiz • 10 Questions • by Mary Pope Osborne",
    check: "Check My Answers",
    retry: "Try Again",
    langBtn: "🌐 中文",
    result: (s) => `You scored ${s} / 10`,
    perfect: "Perfect! You really know your Magic Tree House adventure.",
    great: "Great job — you understood the story well.",
    ok: "Not bad — but a few clues slipped past you.",
    low: "Time for a re-read! The answers are in the details.",
    ansLabel: "Answer"
  },
  zh: {
    subtitle: "阅读理解测验 • 共10题 • 作者：Mary Pope Osborne",
    check: "提交答案",
    retry: "再做一次",
    langBtn: "🌐 English",
    result: (s) => `你的得分：${s} / 10`,
    perfect: "满分！你完全读懂了这次神奇树屋冒险。",
    great: "很棒——你已经读懂了这个故事。",
    ok: "不错——不过有几条线索被你漏掉了。",
    low: "该重读一遍啦！答案都藏在细节里。",
    ansLabel: "正确答案"
  }
};

const quiz = [{"q": {"en": "What are the names of the two camel sisters Jack and Annie ride?", "zh": "杰克和安妮骑的那两匹骆驼姊妹叫什么名字？"}, "options": [{"en": "Rosie and Star, a pair of old gray donkeys", "zh": "罗茜和星星，一对老灰驴，不过那是另一个故事了"}, {"en": "Sandy and Dusty, two desert ponies", "zh": "沙沙和尘尘，两匹沙漠小马"}, {"en": "Max and Ruby, the merchant's horses", "zh": "马克斯和露比，商人的马"}, {"en": "Cutie and Beauty, the two camel sisters", "zh": "小可爱和美人，两匹骆驼姊妹"}], "answer": 3, "explain": {"en": "Annie names the two kneeling camel sisters: 'Hey, Cutie,' she says to one, and 'Hey, Beauty,' to the other. She pats their 'wiry, tan-colored fur.'", "zh": "安妮给跪着的两匹骆驼姊妹起了名字：对着一匹说“嘿，小可爱”，对着另一匹说“嘿，美人”。她还拍了拍它们土黄色的粗毛。"}}, {"q": {"en": "In Merlin's letter, what is the 'ship of the desert'?", "zh": "在梅林的信里，“沙漠之舟”指的是什么？"}, "options": [{"en": "A large sailboat sailing the wide Tigris River", "zh": "在宽阔的底格里斯河上航行的大帆船"}, {"en": "A camel that crosses the sand", "zh": "穿越黄沙的骆驼"}, {"en": "A wooden cart pulled by donkeys", "zh": "驴子拉的大木车"}, {"en": "A magic flying carpet from Baghdad", "zh": "来自巴格达的魔法飞毯"}], "answer": 1, "explain": {"en": "When Mamoon says 'We love our ships of the desert, too,' Annie whispers, 'So that's what \"ships of the desert\" are!' — and they climb onto the camels.", "zh": "马蒙说“我们也爱我们的沙漠之舟”，安妮小声说“原来‘沙漠之舟’就是这个！”——然后他们就骑上了骆驼。"}}, {"q": {"en": "What is inside the wooden treasure box Mamoon protects with his life?", "zh": "马蒙用生命保护的那个木宝盒里，装的是什么？"}, "options": [{"en": "A pile of precious rubies", "zh": "一堆珍贵的红宝石"}, {"en": "Several heavy bags of pepper and bright painted beads", "zh": "好几袋沉重的胡椒和鲜艳的彩绘珠子"}, {"en": "A book of Aristotle's wisdom", "zh": "一本亚里士多德智慧之书"}, {"en": "Gold coins from the bazaar", "zh": "集市上得来的金币"}], "answer": 2, "explain": {"en": "When Jack pries the box open, 'Inside the box was a book,' with the words THE WRITINGS OF ARISTOTLE on the first page. Mamoon calls it a priceless treasure.", "zh": "杰克撬开盒子，“里面是一本书”，扉页上写着《亚里士多德的著作》。马蒙说这是无价之宝。"}}, {"q": {"en": "Which magic rhyme brings the camel caravan to Jack and Annie in the desert?", "zh": "杰克和安妮在沙漠里用了哪条魔法韵文，把驼队引了过来？"}, "options": [{"en": "Make a Stone Come Alive to help", "zh": "让石头活过来帮忙"}, {"en": "Turn into a flock of loud quacking ducks", "zh": "变成一群呱呱大叫的鸭子"}, {"en": "Make Helpers Appear from Nowhere", "zh": "让帮手从“无处”现身"}, {"en": "Bend the Iron of the Saddle", "zh": "弯折马鞍上的铁"}], "answer": 2, "explain": {"en": "In the oasis ('nowhere'), Annie picks 'Make Helpers Appear out of Nowhere.' A sandstorm comes and brings Mamoon's caravan — the helpers they needed.", "zh": "在绿洲（“无处”）里，安妮选了“让帮手从无处现身”。一阵沙暴过后，马蒙的驼队正好赶到——正是他们需要的帮手。"}}, {"q": {"en": "Which rhyme fixes the book of wisdom after Beauty the camel chews it?", "zh": "骆驼美人把智慧书咬坏后，用了哪条韵文把它修好？"}, "options": [{"en": "Mend What Cannot Be Mended", "zh": "修补无法修补的东西"}, {"en": "Find a Treasure That You Must Never Lose", "zh": "找到绝不能丢失的宝物"}, {"en": "Spin into the Air", "zh": "旋转飞上天空"}, {"en": "Make Metal Soft", "zh": "让金属变软"}], "answer": 0, "explain": {"en": "Beauty chews the book to shreds, so Jack uses 'Mend What Cannot Be Mended.' The torn pages swirl up and reform into the whole, unbroken book.", "zh": "美人把书咬得粉碎，于是杰克用了“修补无法修补的东西”。碎页打着旋飞起，重新拼成一本完好无损的书。"}}, {"q": {"en": "What is the 'House of Wisdom' that Caliph al-Mamoon shows Jack and Annie?", "zh": "哈伦·马蒙哈里发带杰克和安妮去看的“智慧宫”是什么？"}, "options": [{"en": "A library for the whole world", "zh": "一座面向全世界的图书馆"}, {"en": "A zoo with a hundred lions", "zh": "养着一百头狮子的动物园"}, {"en": "A market selling spices and silk", "zh": "贩卖香料和丝绸的集市"}, {"en": "A grand palace topped with a glittering green dome", "zh": "顶端闪着绿光圆顶的宏伟宫殿"}], "answer": 0, "explain": {"en": "The caliph says 'Welcome to the House of Wisdom, a learning center for the entire world,' with a library, an observatory, and a laboratory for medicines.", "zh": "哈里发说“欢迎来到智慧宫，一座面向全世界的学问中心”，里面有图书馆、天文台，还有研制药物的研究室。"}}, {"q": {"en": "What is the 'horse on a dome, the one who sees all' that Merlin's letter mentions?", "zh": "梅林信里说的“圆顶上的马，洞察一切的那匹”是什么？"}, "options": [{"en": "A flying horse from Arabian tales", "zh": "阿拉伯故事里那匹会飞的马"}, {"en": "A real horse kept in the caliph's royal stable", "zh": "养在哈里发皇家马厩里的一匹真马"}, {"en": "A horse statue on the dome", "zh": "圆顶上一尊马的雕像"}, {"en": "A soldier riding through the city", "zh": "一个骑马穿过城市的士兵"}], "answer": 2, "explain": {"en": "At the heart of the city, a palace looms 'with a glittering green dome. At the top of the dome stood the statue of a horse' — the 'horse who sees all.'", "zh": "在城中心，一座宫殿“顶着闪亮的绿圆顶。圆顶之上立着一尊马的雕像”——正是那匹“洞察一切的马”。"}}, {"q": {"en": "Who perfected the way of writing numbers that we now call Arabic numerals?", "zh": "谁完善了我们现在称为“阿拉伯数字”的记数法？"}, "options": [{"en": "al-Kindi, perhaps the greatest scientist alive", "zh": "或许是世界上最伟大科学家的阿尔·肯迪"}, {"en": "Aristotle, a Greek philosopher", "zh": "希腊哲学家亚里士多德"}, {"en": "al-Khwarizmi the mathematician", "zh": "数学家阿尔·花拉子米"}, {"en": "Mamoon, the camel merchant", "zh": "骆驼商人马蒙"}], "answer": 2, "explain": {"en": "The caliph points to al-Khwarizmi and says he 'has perfected the Indian way of writing numbers,' the 1–10 numerals we call Arabic numerals today.", "zh": "哈里发指着阿尔·花拉子米，说他“完善了印度的记数法”——也就是我们今天称为阿拉伯数字的1到10。"}}, {"q": {"en": "What causes the mysterious 'whistling sands' sound in the desert?", "zh": "沙漠里神秘的“会唱歌的沙”声音是怎么来的？"}, "options": [{"en": "Sands shifting as they settle", "zh": "沙粒在沉降时移动摩擦"}, {"en": "Ghosts of lost desert travelers", "zh": "迷路旅人留下的鬼魂"}, {"en": "A magic spell from the caliph", "zh": "哈里发施下的魔法"}, {"en": "Birds singing softly in the date palm trees", "zh": "在椰枣树里低声歌唱的鸟儿"}], "answer": 0, "explain": {"en": "Mamoon says he likes science: 'We have learned the whistling is made by sands settling in the drifts.' He believes nature has reasons, not just magic.", "zh": "马蒙说他喜欢科学：“我们了解到，那呜呜声是沙粒在沙丘里沉降时发出来的。”他认为大自然自有其道理，不全是魔法。"}}, {"q": {"en": "How do Jack and Annie fly back to the tree house at the end of the mission?", "zh": "任务结束时，杰克和安妮是坐着什么飞回树屋的？"}, "options": [{"en": "On a magic flying carpet", "zh": "一张会飞的魔法地毯"}, {"en": "In the caliph's royal carriage", "zh": "坐在哈里发的皇家马车里"}, {"en": "On a giant golden eagle", "zh": "骑在一只巨大的金鹰上"}, {"en": "On the backs of their two camel sisters", "zh": "骑在他们那两匹骆驼姊妹的背上"}], "answer": 0, "explain": {"en": "Using the 'Fly Through the Air' rhyme, a carpet in the library lifts off and carries them out the window, soaring all the way back to the oasis tree house.", "zh": "他们用了“飞上天空”的韵文，图书馆里的一块地毯飞了起来，载着他们飞出窗外，一路回到绿洲里的树屋。"}}];

const qEl = document.getElementById("questions");
const resultEl = document.getElementById("result");
const detailEl = document.getElementById("scoreDetail");
const checkBtn = document.getElementById("checkBtn");
const resetBtn = document.getElementById("resetBtn");
const langBtn = document.getElementById("langBtn");

function render(){
  qEl.innerHTML = "";
  document.getElementById("subtitle").textContent = L[lang].subtitle;
  langBtn.textContent = L[lang].langBtn;

  quiz.forEach((item, i) => {
    const qDiv = document.createElement("div");
    qDiv.className = "q";
    qDiv.id = "q" + i;
    let html = `<h3><span>Q${i+1}.</span>${item.q[lang]}</h3>`;
    item.options.forEach((opt, j) => {
      const isPicked = picked[i] === j;
      const checked = isPicked ? "checked" : "";
      html += `<label data-q="${i}" data-o="${j}" class="${isPicked?'picked':''}">
        <input type="radio" name="q${i}" value="${j}" ${checked}> ${opt[lang]}
      </label>`;
    });
    html += `<div class="explain" id="ex${i}">
      <div class="en"><b>${L[lang].ansLabel}:</b> ${item.options[item.answer][lang]}<br>${item.explain.en}</div>
      <div class="zh">${item.options[item.answer][lang]}<br>${item.explain.zh}</div>
    </div>`;
    qDiv.innerHTML = html;
    qEl.appendChild(qDiv);

    if (submitted){
      qDiv.classList.add(picked[i] === item.answer ? "correct" : "wrong");
      document.getElementById("ex"+i).classList.add("show");
      const labels = qDiv.querySelectorAll("label");
      labels[item.answer].classList.add("right");
      if (picked[i] !== item.answer && picked[i] !== undefined)
        labels[picked[i]].classList.add("picked-wrong");
    }
  });

  qEl.querySelectorAll('input[type=radio]').forEach(r => {
    r.addEventListener("change", e => {
      if (submitted) return;
      const qi = +e.target.name.replace("q","");
      picked[qi] = +e.target.value;
      qEl.querySelectorAll(`label[data-q="${qi}"]`).forEach(l=>l.classList.remove("picked"));
      e.target.closest("label").classList.add("picked");
    });
  });

  if (submitted){
    resultEl.textContent = L[lang].result(score);
    let msg = score===10 ? L[lang].perfect : score>=7 ? L[lang].great : score>=4 ? L[lang].ok : L[lang].low;
    detailEl.textContent = msg;
  } else {
    resultEl.textContent = "";
    detailEl.textContent = "";
  }
}

checkBtn.addEventListener("click", () => {
  submitted = true;
  score = 0;
  quiz.forEach((item,i) => { if (picked[i] === item.answer) score++; });
  render();
  checkBtn.style.display = "none";
  resetBtn.style.display = "inline-block";
});

resetBtn.addEventListener("click", () => {
  location.reload();
});

langBtn.addEventListener("click", () => {
  lang = (lang === "en") ? "zh" : "en";
  render();
});

render();
</script>
</body>
</html>
