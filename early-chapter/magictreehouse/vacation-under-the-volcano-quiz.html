<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vacation Under the Volcano — Quiz</title>
<style>
  :root{
    --forest:#15803d;
    --forest-dark:#14532d;
    --red:#c0392b;
    --cream:#f7fbf6;
    --ink:#222;
    --gold:#d97706;
    --oak:#92400e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Trebuchet MS","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--forest),var(--forest-dark));
    color:var(--ink);
    min-height:100vh;
    padding:24px 12px;
  }
  .wrap{
    max-width:780px;
    margin:0 auto;
    background:var(--cream);
    border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    overflow:hidden;
  }
  header{
    background:var(--forest);
    color:#fff;
    padding:22px 28px 18px;
    text-align:center;
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  header h1{
    margin:0;
    font-size:1.5rem;
    letter-spacing:.5px;
    flex:1;
    text-align:center;
  }
  .langBtn{
    font-family:inherit;
    font-size:.85rem;
    font-weight:bold;
    color:var(--forest-dark);
    background:#fff;
    border:none;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .langBtn:hover{transform:translateY(-1px);}
  .homeBtn{
    font-size:1.35rem;
    text-decoration:none;
    background:#fff;
    border-radius:50%;
    width:40px;height:40px;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    transition:transform .12s;
  }
  .homeBtn:hover{transform:translateY(-1px);}
  header p{
    margin:10px 0 0;
    font-size:.92rem;
    opacity:.92;
  }
  .logo{
    width:62px;height:62px;border-radius:50%;
    background:#fff;margin:0 auto 12px;position:relative;
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  main{padding:22px 28px 30px;}
  .q{
    border:1px solid #d6e6df;
    border-radius:12px;
    padding:16px 18px;
    margin:16px 0;
    background:#fff;
    transition:border-color .2s;
  }
  .q.correct{border-color:var(--forest);background:#eef9f0;}
  .q.wrong{border-color:var(--red);background:#fdf3f2;}
  .q h3{
    margin:0 0 12px;
    font-size:1.02rem;
    line-height:1.45;
  }
  .q h3 span{color:var(--gold);font-weight:bold;margin-right:6px;}
  label{
    display:block;
    padding:9px 12px;
    margin:7px 0;
    border-radius:8px;
    background:#eef4f0;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s,border-color .15s;
    font-size:.96rem;
    line-height:1.4;
  }
  label:hover{background:#e2ede7;}
  input[type=radio]{margin-right:9px;transform:translateY(1px);}
  label.picked{background:#fff4cc;border-color:var(--gold);}
  label.right{background:#d7f0df;border-color:var(--forest);font-weight:600;}
  label.picked-wrong{background:#f7d4d0;border-color:var(--red);}
  .explain{
    display:none;
    margin-top:10px;
    padding:12px 14px;
    background:#f0f7f2;
    border-left:4px solid var(--forest);
    border-radius:6px;
    font-size:.9rem;
    line-height:1.5;
  }
  .explain.show{display:block;}
  .explain .en{margin-bottom:6px;}
  .explain .zh{color:#444;}
  .explain b{color:var(--forest-dark);}
  .actions{text-align:center;margin-top:24px;}
  button.go{
    font-family:inherit;
    font-size:1.05rem;
    font-weight:bold;
    color:#fff;
    background:var(--forest-dark);
    border:none;
    padding:13px 34px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(21,128,61,.4);
    transition:transform .12s,box-shadow .12s;
  }
  button.go:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(21,128,61,.5);}
  button.go:active{transform:translateY(0);}
  #resetBtn{display:none;background:#555;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  #result{
    text-align:center;
    margin:22px auto 4px;
    font-size:1.3rem;
    font-weight:bold;
    color:var(--forest-dark);
    min-height:1.4em;
  }
  #scoreDetail{text-align:center;color:#666;font-size:.92rem;margin-bottom:6px;}
  footer{
    text-align:center;
    font-size:.8rem;
    color:#9aa6ad;
    padding:14px;
    border-top:1px solid #eee;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <button class="langBtn" id="langBtn">🌐 中文</button>
      <h1>#13 · Vacation Under the Volcano</h1>
      <a class="homeBtn" href="../../index.html" title="Home / 首页" aria-label="Home">🏠</a>
    </div>
    <p id="subtitle">Comprehension Quiz • 10 Questions • by Mary Pope Osborne</p>
    <div class="logo">🌳</div>
  </header>
  <main>
    <div id="questions"></div>
    <div id="result"></div>
    <div id="scoreDetail"></div>
    <div class="actions">
      <button class="go" id="checkBtn">Check My Answers</button>
      <button class="go" id="resetBtn">Try Again</button>
    </div>
  </main>
  <footer>Based on <em>Magic Tree House #13: Vacation Under the Volcano</em> (Random House, 1998) — by Mary Pope Osborne</footer>
</div>

<script>
let lang = "en";
const picked = {};
let submitted = false;
let score = 0;

const L = {
  en: {
    subtitle: "Comprehension Quiz • 10 Questions • by Mary Pope Osborne",
    check: "Check My Answers",
    retry: "Try Again",
    langBtn: "🌐 中文",
    result: (s) => `You scored ${s} / 10`,
    perfect: "Perfect! You really know your Magic Tree House adventure.",
    great: "Great job — you understood the story well.",
    ok: "Not bad — but a few clues slipped past you.",
    low: "Time for a re-read! The answers are in the details.",
    ansLabel: "Answer"
  },
  zh: {
    subtitle: "阅读理解测验 • 共10题 • 作者：Mary Pope Osborne",
    check: "提交答案",
    retry: "再做一次",
    langBtn: "🌐 English",
    result: (s) => `你的得分：${s} / 10`,
    perfect: "满分！你完全读懂了这次神奇树屋冒险。",
    great: "很棒——你已经读懂了这个故事。",
    ok: "不错——不过有几条线索被你漏掉了。",
    low: "该重读一遍啦！答案都藏在细节里。",
    ansLabel: "正确答案"
  }
};

const quiz = [{"q": {"en": "What is the title of the lost story that Morgan asks Jack and Annie to find, written in Latin?", "zh": "摩根让杰克和安妮去寻找的那篇失落的、用拉丁文写的故事，标题是什么？"}, "options": [{"en": "The Brave Gladiator of Pompeii", "zh": "《庞贝的勇敢角斗士》"}, {"en": "The Strongest Man in the World", "zh": "《世界上最强壮的人》"}, {"en": "The Lost City of Rome", "zh": "《失落罗马城》"}, {"en": "The Burning Mountain", "zh": "《燃烧的山》"}], "answer": 1, "explain": {"en": "The Latin title is \"Vir Fortissimus in Mundo,\" which means \"The Strongest Man in the World\" — a lost tale about the hero Hercules.", "zh": "拉丁文标题是“Vir Fortissimus in Mundo”，意思是《世界上最强壮的人》——一个关于英雄赫拉克勒斯的失落传说。"}}, {"q": {"en": "Which research book does Morgan hand Jack before they travel to ancient Italy?", "zh": "在前往古罗马之前，摩根交给了杰克哪一本参考书？"}, "options": [{"en": "A Day in Ancient Rome", "zh": "《古罗马的一天》"}, {"en": "Pompeii: City of Ashes", "zh": "《庞贝：灰烬之城》"}, {"en": "Life in Roman Times", "zh": "《罗马时代的生活》"}, {"en": "The Romans and Their Gods", "zh": "《罗马人与他们的神》"}], "answer": 2, "explain": {"en": "Morgan hands Jack a book called Life in Roman Times, whose cover shows a Roman town with people in tunics and sandals.", "zh": "摩根交给杰克一本叫《罗马时代的生活》的书，封面上是一座古罗马城镇，人们穿着长袍和凉鞋。"}}, {"q": {"en": "On what date did Mount Vesuvius erupt and bury Pompeii?", "zh": "维苏威火山喷发、掩埋庞贝城是在哪一天？"}, "options": [{"en": "October 31, A.D. 79", "zh": "公元 79 年 10 月 31 日"}, {"en": "July 4, A.D. 79", "zh": "公元 79 年 7 月 4 日"}, {"en": "August 24, A.D. 79", "zh": "公元 79 年 8 月 24 日"}, {"en": "March 15, A.D. 79", "zh": "公元 79 年 3 月 15 日"}], "answer": 2, "explain": {"en": "Jack reads that on August 24, A.D. 79, Mount Vesuvius erupted into a deadly volcano and buried the town of Pompeii.", "zh": "杰克读到，公元 79 年 8 月 24 日，维苏威火山猛烈喷发，掩埋了庞贝城。"}}, {"q": {"en": "In the forum, who warns Jack and Annie by crying \"The end is near!\"?", "zh": "在广场上，是谁冲着杰克和安妮喊“末日将至！”来警告他们的？"}, "options": [{"en": "a bakery woman", "zh": "一位面包店女店主"}, {"en": "a Roman soldier", "zh": "一名罗马士兵"}, {"en": "a frightened temple priest dressed all in white", "zh": "一位身穿白衣、惊慌失措的神庙祭司"}, {"en": "an old soothsayer in a black cloak", "zh": "一位披黑斗篷的老预言家"}], "answer": 3, "explain": {"en": "An old woman in a black cloak with wild gray hair points at them and rasps \"The end is near!\" She is a soothsayer who sees the future.", "zh": "一位灰发蓬乱、披黑斗篷的老妇人指着他们沙哑地喊“末日将至！”她是一位能预见未来的预言家。"}}, {"q": {"en": "To protect themselves from falling pumice and ash, what do Jack and Annie wear on their heads?", "zh": "为了挡住落下的浮石和火山灰，杰克和安妮把什么顶在头上？"}, "options": [{"en": "wooden bowls", "zh": "木碗"}, {"en": "pillows tied on with their belts", "zh": "用腰带绑在头上的枕头"}, {"en": "straw hats", "zh": "草帽"}, {"en": "heavy bronze battle helmets with red crests", "zh": "带红缨的沉重青铜战盔"}], "answer": 1, "explain": {"en": "They grab pillows from the couches and tie them onto their heads with the belts from their tunics to shield against the falling pumice.", "zh": "他们从躺椅上抓起枕头，用长袍上的腰带绑在头上，挡住掉落的浮石。"}}, {"q": {"en": "Besides the volcano, what strange signs does the soothsayer say are happening in Pompeii?", "zh": "除了火山，女预言家说庞贝城还出现了哪些奇怪的迹象？"}, "options": [{"en": "the sun has stopped shining", "zh": "太阳不再升起"}, {"en": "the river has turned bright red and all the crops in the fields have died", "zh": "河水变红，田里的庄稼全都枯死了"}, {"en": "the streams dried up, birds flew away, and rats left", "zh": "溪水干涸、鸟儿飞走、老鼠出逃"}, {"en": "the fish have disappeared from the sea", "zh": "海里的鱼都不见了"}], "answer": 2, "explain": {"en": "The soothsayer tells Annie that all the streams have dried up, all the birds have flown away, and even the rats have left the town.", "zh": "女预言家告诉安妮，所有的溪水都干涸了，鸟儿全都飞走，连老鼠也离开了庞贝城。"}}, {"q": {"en": "Where do Jack and Annie find the lost scroll — what kind of building is it?", "zh": "杰克和安妮是在哪里找到那卷失落的卷轴的——那是什么样的建筑？"}, "options": [{"en": "the amphitheater", "zh": "圆形竞技场"}, {"en": "the Public Baths", "zh": "公共浴室"}, {"en": "the great Temple of Jupiter on the hill", "zh": "山坡上宏伟的朱庇特神庙"}, {"en": "the vacation villa of Brutus", "zh": "布鲁图斯的度假别墅"}], "answer": 3, "explain": {"en": "The soothsayer points them to the villa of Brutus, a large house at the end of the street where the scrolls are kept in a room off the garden.", "zh": "女预言家指向街尽头布鲁图斯的大别墅，卷轴就保存在花园旁边的一间屋子里。"}}, {"q": {"en": "When the giant gladiator from the ancient story saves them, what does he shout?", "zh": "当古老故事里的巨人角斗士救起他们时，他大喊了什么？"}, "options": [{"en": "Run! Before it's too late!", "zh": "快跑！不然就来不及了！"}, {"en": "Call out loudly for Morgan!", "zh": "大声喊摩根！"}, {"en": "Hide in the library!", "zh": "躲进图书馆！"}, {"en": "Run as fast as you can to the tree house!", "zh": "用最快的速度跑回树屋去！"}], "answer": 0, "explain": {"en": "The huge gladiator lifts Jack and Annie to safety and booms \"Run! Before it's too late!\" — the ancient story of Hercules has saved them.", "zh": "巨角斗士把杰克和安妮举到安全的地方，大吼“快跑！不然就来不及了！”——正是赫拉克勒斯的古老故事救了他们。"}}, {"q": {"en": "What does Morgan tell Jack and Annie about what happened to most of the people of Pompeii?", "zh": "关于庞贝城大多数人遭遇了什么，摩根告诉了杰克和安妮什么？"}, "options": [{"en": "they moved together to the city of Rome the very next day", "zh": "第二天他们一起搬到了罗马城"}, {"en": "all of them were lost forever in the great eruption of the volcano", "zh": "他们全都在那场火山大喷发中永远消失了"}, {"en": "they sailed far away together on a trading ship", "zh": "他们一起乘商船远航而去"}, {"en": "most of them escaped before the city was fully buried", "zh": "大多数人在城市被完全掩埋前逃走了"}], "answer": 3, "explain": {"en": "Morgan says most of the people of Pompeii did escape, and the city was not completely buried by ash until the next day.", "zh": "摩根说，庞贝城大多数人确实逃了出去，直到第二天城市才被火山灰彻底掩埋。"}}, {"q": {"en": "In ancient Roman times, what were \"books\" written on?", "zh": "在古罗马时期，人们把“书”写在哪里？"}, "options": [{"en": "sheets of paper", "zh": "一张张纸上"}, {"en": "wooden boards", "zh": "木板上"}, {"en": "carved into heavy stone tablets", "zh": "刻在沉重的石板上的"}, {"en": "scrolls of papyrus paper", "zh": "纸莎草纸卷轴上"}], "answer": 3, "explain": {"en": "Romans wrote their \"books\" on scrolls of papyrus paper, using pens made of small reeds and ink from the black ink of octopuses.", "zh": "罗马人把“书”写在纸莎草纸卷轴上，用芦苇小笔和章鱼墨汁来书写。"}}];

const qEl = document.getElementById("questions");
const resultEl = document.getElementById("result");
const detailEl = document.getElementById("scoreDetail");
const checkBtn = document.getElementById("checkBtn");
const resetBtn = document.getElementById("resetBtn");
const langBtn = document.getElementById("langBtn");

function render(){
  qEl.innerHTML = "";
  document.getElementById("subtitle").textContent = L[lang].subtitle;
  langBtn.textContent = L[lang].langBtn;

  quiz.forEach((item, i) => {
    const qDiv = document.createElement("div");
    qDiv.className = "q";
    qDiv.id = "q" + i;
    let html = `<h3><span>Q${i+1}.</span>${item.q[lang]}</h3>`;
    item.options.forEach((opt, j) => {
      const isPicked = picked[i] === j;
      const checked = isPicked ? "checked" : "";
      html += `<label data-q="${i}" data-o="${j}" class="${isPicked?'picked':''}">
        <input type="radio" name="q${i}" value="${j}" ${checked}> ${opt[lang]}
      </label>`;
    });
    html += `<div class="explain" id="ex${i}">
      <div class="en"><b>${L[lang].ansLabel}:</b> ${item.options[item.answer][lang]}<br>${item.explain.en}</div>
      <div class="zh">${item.options[item.answer][lang]}<br>${item.explain.zh}</div>
    </div>`;
    qDiv.innerHTML = html;
    qEl.appendChild(qDiv);

    if (submitted){
      qDiv.classList.add(picked[i] === item.answer ? "correct" : "wrong");
      document.getElementById("ex"+i).classList.add("show");
      const labels = qDiv.querySelectorAll("label");
      labels[item.answer].classList.add("right");
      if (picked[i] !== item.answer && picked[i] !== undefined)
        labels[picked[i]].classList.add("picked-wrong");
    }
  });

  qEl.querySelectorAll('input[type=radio]').forEach(r => {
    r.addEventListener("change", e => {
      if (submitted) return;
      const qi = +e.target.name.replace("q","");
      picked[qi] = +e.target.value;
      qEl.querySelectorAll(`label[data-q="${qi}"]`).forEach(l=>l.classList.remove("picked"));
      e.target.closest("label").classList.add("picked");
    });
  });

  if (submitted){
    resultEl.textContent = L[lang].result(score);
    let msg = score===10 ? L[lang].perfect : score>=7 ? L[lang].great : score>=4 ? L[lang].ok : L[lang].low;
    detailEl.textContent = msg;
  } else {
    resultEl.textContent = "";
    detailEl.textContent = "";
  }
}

checkBtn.addEventListener("click", () => {
  submitted = true;
  score = 0;
  quiz.forEach((item,i) => { if (picked[i] === item.answer) score++; });
  render();
  checkBtn.style.display = "none";
  resetBtn.style.display = "inline-block";
});

resetBtn.addEventListener("click", () => {
  location.reload();
});

langBtn.addEventListener("click", () => {
  lang = (lang === "en") ? "zh" : "en";
  render();
});

render();
</script>
</body>
</html>
