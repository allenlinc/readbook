<script>window.BOOK = {"slug": "the-gossip-monster", "title": "The Gossip Monster", "titleZh": "八卦怪物", "level": "V", "genre": "Narrative", "mainSkill": "Key Ideas and Details", "questions": [{"q": {"en": "What rumor about Del spread through the school?", "zh": "学校里流传着关于戴尔的什么谣言？"}, "options": [{"en": "He beat up a kindergartner and was expelled.", "zh": "他打了一个幼儿园小朋友，还被开除了。"}, {"en": "He saved a younger student from danger during a fire drill at school", "zh": "他在一场学校消防演习中救了一个低年级的同学"}, {"en": "He moved to a new school far away.", "zh": "他转去了很远的另一所学校。"}, {"en": "He won a school reading award.", "zh": "他赢得了一个校内阅读奖项。"}], "answer": 0, "skill": "Key Ideas and Details", "explain": {"en": "Matt told Jamie the rumor said Principal Cosgrove expelled Del for beating up a kindergartner.", "zh": "马特告诉杰米，谣言说科斯格罗夫校长因为戴尔打了幼儿园小朋友而把他开除了。"}}, {"q": {"en": "Why was Del really in Principal Cosgrove's office?", "zh": "戴尔到底为什么会在科斯格罗夫校长的办公室里？"}, "options": [{"en": "He was registering for a brand-new school.", "zh": "他正在办理转学手续。"}, {"en": "He was in trouble for bullying a classmate.", "zh": "他因为欺负同学惹了麻烦。"}, {"en": "He was receiving a special Student of the Month award and a shiny new badge in front of the whole school", "zh": "他要在全校师生面前领取一个“本月之星”特别奖和一枚闪亮的新徽章"}, {"en": "His mom was telling him and his little brother their dad, hurt overseas in the Army, was coming home.", "zh": "他妈妈正告诉他和小弟弟，他们在海外服役受伤的爸爸要回家了。"}], "answer": 3, "skill": "Key Ideas and Details", "explain": {"en": "Del explained his mom and little brother were there; his dad had been hurt while deployed overseas and was being sent home.", "zh": "戴尔解释说当时是他妈妈和小弟弟在场，爸爸在海外服役时受伤，即将被送回家。"}}, {"q": {"en": "What does the 'gossip monster' in the story represent?", "zh": "故事里的“八卦怪物”象征什么？"}, "options": [{"en": "A pet that Del keeps at home.", "zh": "戴尔在家养的一只宠物。"}, {"en": "A real creature that lives in the school basement and comes out at night", "zh": "一只住在学校地下室里、夜晚才出来活动的真实怪物"}, {"en": "A noisy machine in the cafeteria.", "zh": "食堂里一台很吵的机器。"}, {"en": "A rumor that grows and changes as it is passed from person to person.", "zh": "一个在人们口中不断传播、变形并越来越大的谣言。"}], "answer": 3, "skill": "Craft and Structure", "explain": {"en": "Mr. Sanchez compares starting or passing a rumor to feeding a monster that mutates and grows.", "zh": "桑切斯老师把散布谣言比作喂养一只会变异、会不断长大的怪物。"}}, {"q": {"en": "In Mr. Sanchez's Telephone game, what did the message become by the time it reached him?", "zh": "在桑切斯老师的“传话游戏”里，这句话传到他耳朵里时变成了什么？"}, "options": [{"en": "\"Dope leaning ringing in your ear.\"", "zh": "“Dope leaning ringing in your ear（耳边叮当作响）”。"}, {"en": "\"Del beat up a kindergartner.\"", "zh": "“戴尔打了幼儿园小朋友”。"}, {"en": "\"Double leaves everything in your ear.\"", "zh": "“Double leaves everything in your ear（叶子落进你耳朵）”。"}, {"en": "\"Don't tell anyone the secret.\"", "zh": "“别把秘密告诉任何人”。"}], "answer": 0, "skill": "Craft and Structure", "explain": {"en": "The original sentence 'Don't believe everything that you hear' mutated into 'Dope leaning ringing in your ear.'", "zh": "原句“不要相信你听到的一切”在传递中变成了“Dope leaning ringing in your ear”。"}}, {"q": {"en": "What lesson does Mr. Sanchez want students to learn from the Telephone game?", "zh": "桑切斯老师想让学生从传话游戏中明白什么道理？"}, "options": [{"en": "Rumors change and grow as they spread, so you shouldn't believe every story you hear.", "zh": "谣言在传播中会变形变大，所以不该轻信听到的每个说法。"}, {"en": "Only teachers should talk during class.", "zh": "课堂上只有老师能说话。"}, {"en": "Science class is more fun than recess.", "zh": "科学课比课间休息更有趣。"}, {"en": "Whispering is a good way to keep secrets safe and stop rumors from spreading to others at school", "zh": "小声耳语是保守秘密、阻止谣言向他人传播的好办法，但并不能真正杜绝谣言"}], "answer": 0, "skill": "Integration of Knowledge and Ideas", "explain": {"en": "He says passing on a rumor is like feeding a monster and that words have consequences.", "zh": "他说散播谣言像喂养怪物，并且言语是有后果的。"}}, {"q": {"en": "Why did the author most likely write The Gossip Monster?", "zh": "作者写《八卦怪物》最可能的目的是什么？"}, "options": [{"en": "To teach readers how to play kickball.", "zh": "为了教读者怎么玩踢球游戏。"}, {"en": "To describe an exciting school field trip to a museum full of dinosaur bones and fossils. The original sentence 'Don't believe everything that you hear' mutated into 'Dope leaning ringing in your ear.'", "zh": "为了描写一次去满是恐龙骨骼和化石的博物馆的刺激的校外郊游。原句“不要相信你听到的一切”在传递中变成了“Dope leaning ringing in your ear”。"}, {"en": "To explain how to win a science fair.", "zh": "为了讲解怎样在科学展上获奖。"}, {"en": "To show how gossip can hurt people and encourage readers to think before spreading rumors.", "zh": "为了说明八卦会伤害他人，并鼓励读者在传播谣言前三思。"}], "answer": 3, "skill": "Author's Purpose and Perspective", "explain": {"en": "The story follows Jamie learning that her gossip hurt Del, highlighting the harm of rumors.", "zh": "故事通过杰米意识到自己的八卦伤害了戴尔，凸显了谣言的危害。"}}, {"q": {"en": "How did Jamie feel after she apologized to Del?", "zh": "杰米向戴尔道歉后感觉如何？"}, "options": [{"en": "Angry that Del ignored her apology and walked away without saying even a single word to her", "zh": "因为戴尔不理她的道歉，连一句话都没跟她说就走开了，她很生气"}, {"en": "Better and almost smiling, since Del used her real name for the first time in months.", "zh": "轻松了一些，几乎露出微笑，因为戴尔几个月来第一次叫了她的真名。"}, {"en": "Proud that she had started the rumor.", "zh": "为自己发起谣言感到骄傲。"}, {"en": "Sad that she had to leave school.", "zh": "因为要离校而感到难过。"}], "answer": 1, "skill": "Key Ideas and Details", "explain": {"en": "Del called her 'Jamie' for the first time in months, and she 'almost smiled.'", "zh": "戴尔几个月来第一次叫她“杰米”，她“几乎笑了起来”。"}}, {"q": {"en": "What made Jamie realize that the rumor about Del was wrong?", "zh": "是什么让杰米意识到关于戴尔的谣言是错的？"}, "options": [{"en": "A note delivered by Del's mother.", "zh": "戴尔妈妈送来的一张纸条。"}, {"en": "A television news report about the school that showed Del's picture on the evening news for everyone to see", "zh": "电视上对这所学校的报道，晚间新闻里还播出了戴尔的照片，让全校都看到"}, {"en": "Winning a prize in science class.", "zh": "在科学课上得了一个奖。"}, {"en": "Mr. Sanchez's Telephone game showed how rumors mutate and grow, plus her own guilt.", "zh": "桑切斯老师的传话游戏展示了谣言如何变异变大，加上她自己的愧疚。"}], "answer": 3, "skill": "Integration of Knowledge and Ideas", "explain": {"en": "The game sparked the idea in her head, leading her to confess and seek the truth.", "zh": "传话游戏启发了她，促使她坦白并去寻求真相。"}}, {"q": {"en": "What advice does Mr. Sanchez give about gossiping?", "zh": "桑切斯老师关于八卦给出了什么建议？"}, "options": [{"en": "Rumors are harmless fun and should be ignored.", "zh": "谣言只是无害的玩笑，不必理会。"}, {"en": "Always repeat rumors so everyone stays informed about what happened at school each day", "zh": "一定要把谣言传开，让每个人都知道学校里发生了什么，消息传得更快"}, {"en": "Don't gossip about people when they're not around unless you're saying something nice.", "zh": "别人不在场时不要说闲话，除非你说的是好话。"}, {"en": "Only talk about teachers, never about students.", "zh": "只议论老师，别议论同学。"}], "answer": 2, "skill": "Author's Purpose and Perspective", "explain": {"en": "He says let people speak for themselves and don't gossip unless it is kind.", "zh": "他说要让当事人自己说话，除非说好话，否则不要背后议论。"}}, {"q": {"en": "Why did Del call Jamie 'Germy' instead of her real name?", "zh": "戴尔为什么叫杰米“Germy”而不是她的真名？"}, "options": [{"en": "Her middle name was actually Germaine.", "zh": "她的中间名其实是Germaine。"}, {"en": "A rumor said Jamie got sick from crawling through garbage, and the nickname stuck.", "zh": "有谣言说杰米因为钻垃圾桶才生病，这个外号就一直留了下来。"}, {"en": "Del simply could not pronounce 'Jamie.'", "zh": "戴尔就是不会发“Jamie”这个音。"}, {"en": "Jamie loved collecting germs for a science project and kept them in glass jars at home", "zh": "杰米喜欢为科学课收集细菌，还把它们养在家里的玻璃罐中"}], "answer": 1, "skill": "Craft and Structure", "explain": {"en": "A summer rumor claimed Jamie got sick by crawling through garbage, leading to the nickname.", "zh": "去年夏天有谣言说杰米钻垃圾桶才生病，于是有了这个绰号。"}}], "extended": {"prompt": {"en": "Have you ever heard a rumor that turned out to be untrue? What could you do to stop a gossip monster from growing?", "zh": "你有没有听过后来发现并不真实的谣言？你可以做些什么来阻止“八卦怪物”越变越大？"}, "guidance": {"en": ["Think about a time you heard or passed along a story that changed as it traveled.", "Consider one kind action, like asking the source or speaking up, that could help."], "zh": ["回想一下你曾听到或转述过、后来却变样的故事。", "想想一个善意的做法，比如去问当事人或站出来说明，会有什么帮助。"]}}};</script>
