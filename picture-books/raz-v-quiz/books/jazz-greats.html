ican music, including blues", "zh": "非裔美国人的音乐，包括布鲁斯"}, {"en": "European classical music only, a style that left out the blues and ragtime that shaped jazz.", "zh": "仅欧洲古典音乐，这种风格遗漏了塑造爵士乐的布鲁斯与拉格泰姆。"}, {"en": "Military marches", "zh": "军乐进行曲"}, {"en": "Chinese opera", "zh": "中国戏曲"}], "answer": 0, "skill": "Integration of Knowledge and Ideas", "explain": {"en": "Jazz is built on African-American music; blues and jazz styles often blend and overlap.", "zh": "爵士乐建立在非裔美国人的音乐之上，布鲁斯与爵士常常交融。"}}, {"q": {"en": "Bebop, a kind of jazz with a strong beat, first became popular in which decade?", "zh": "比波普（bebop）这种节奏强烈的爵士乐最早是在哪个十年流行起来的？"}, "options": [{"en": "The 1960s", "zh": "20世纪60年代"}, {"en": "The 1920s. Ella won thirteen Grammy Awards and was honored as one of the most talented American performers.", "zh": "20世纪20年代。艾拉获得13座格莱美奖，被誉为美国最有天赋的表演者之一。"}, {"en": "The 1940s", "zh": "20世纪40年代"}, {"en": "The 1900s", "zh": "20世纪00年代"}], "answer": 2, "skill": "Key Ideas and Details", "explain": {"en": "Ella sang with bebop bands, a kind of jazz that first became popular in the 1940s.", "zh": "艾拉曾与比波普乐队合作，这种爵士乐在20世纪40年代开始流行。"}}, {"q": {"en": "Which modern trumpeter works to inspire young people through 'Jazz for Young People' concerts?", "zh": "哪位当代小号手通过“给年轻人的爵士”（Jazz for Young People）音乐会来激励年轻人？"}, "options": [{"en": "Branford Marsalis", "zh": "布兰福德·马萨利斯"}, {"en": "Wynton Marsalis", "zh": "温顿·马萨利斯"}, {"en": "Dizzy Gillespie", "zh": "迪齐·吉莱斯皮"}, {"en": "Louis Armstrong", "zh": "路易斯·阿姆斯特朗"}], "answer": 1, "skill": "Key Ideas and Details", "explain": {"en": "Wynton Marsalis performs in Jazz for Young People concerts at Lincoln Center.", "zh": "温顿·马萨利斯在林肯中心的“给年轻人的爵士”音乐会上演出。"}}, {"q": {"en": "What does the book say is still at the heart of jazz today?", "zh": "本书认为，至今仍是爵士乐核心的是什么？"}, "options": [{"en": "Playing very slowly", "zh": "非常缓慢地演奏"}, {"en": "Singing only", "zh": "只唱歌"}, {"en": "Improvisation - musicians making up music as they go", "zh": "即兴演奏——乐手边走边创作出音乐"}, {"en": "Reading sheet music exactly, playing every note just as it was first written down long ago.", "zh": "精确地照谱演奏，把很久以前写下的每个音符都原样弹奏出来。"}], "answer": 2, "skill": "Author's Purpose and Perspective", "explain": {"en": "Improvisation is still at the heart of jazz; musicians 'jam' and make things up as they go.", "zh": "即兴演奏仍是爵士乐的核心，乐手们“jam”并边演奏边创作。"}}], "extended": {"prompt": {"en": "The book says jazz musicians often 'jam' and improvise together. If you could form a band with one of the jazz greats from the book, who would it be and what would you want to create together?", "zh": "书中说爵士乐手常常一起“即兴演奏”（jam）。如果你能和书中某位爵士大师组乐队，你会选谁？你们想一起创作什么？"}, "guidance": {"en": ["Pick a musician whose style you like.", "Think about what 'improvising together' would feel like."], "zh": ["选一位你喜欢的风格的音乐家。", "想象一下“一起即兴”会是什么感觉。"]}}};</script>
