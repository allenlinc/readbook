rd 'summit' mean in this book?", "zh": "在这本书中，'summit'（顶峰）一词是什么意思？"}, "options": [{"en": "The bottom of a valley.", "zh": "山谷的底部。"}, {"en": "A type of climbing rope made from strong nylon to keep climbers safe.", "zh": "一种登山绳，用结实的尼龙制成，用来保护登山者安全。"}, {"en": "A kind of storm.", "zh": "一种风暴。"}, {"en": "The highest point of a mountain.", "zh": "山峰的最高点。"}], "answer": 3, "skill": "Craft and Structure", "explain": {"en": "The glossary defines 'summit' as the highest point of a mountain.", "zh": "词汇表把 summit 定义为山的最高点。"}}, {"q": {"en": "Who was the first woman to climb Mount Everest?", "zh": "谁是首位登上珠穆朗玛峰的女性？"}, "options": [{"en": "Serena Williams.", "zh": "塞雷娜·威廉姆斯。"}, {"en": "Mia Hamm.", "zh": "米娅·哈姆。"}, {"en": "Bethany Hamilton, the surfer who lost her arm to a shark at age thirteen.", "zh": "贝瑟尼·汉密尔顿，那位13岁时被鲨鱼咬掉手臂的冲浪者。"}, {"en": "Junko Tabei of Japan, in 1975.", "zh": "1975年日本的田部井淳子。"}], "answer": 3, "skill": "Key Ideas and Details", "explain": {"en": "In 1975, Junko Tabei of Japan became the first woman to scale Everest.", "zh": "1975年，日本的田部井淳子成为首位登上珠峰的女性。"}}, {"q": {"en": "What is the author's main purpose in writing this book?", "zh": "作者写这本书的主要目的是什么？"}, "options": [{"en": "To inform readers about the challenge, dangers, and history of climbing Everest.", "zh": "向读者介绍攀登珠峰的挑战、危险和历史。"}, {"en": "To tell a made-up adventure story that would excite young readers about magic, imaginary mountains.", "zh": "讲述一个虚构的冒险故事，好让小读者对神奇的想象之山兴奋起来。"}, {"en": "To sell climbing equipment.", "zh": "推销登山装备。"}, {"en": "To teach readers how to fly a plane.", "zh": "教读者如何驾驶飞机。"}], "answer": 0, "skill": "Author's Purpose and Perspective", "explain": {"en": "The mountain, the climb, the people, and the dangers, showing it is informational.", "zh": "全书介绍山峰、攀登过程、人物与危险，属于知识说明类内容。"}}, {"q": {"en": "Why must climbers begin the final push to the summit around midnight?", "zh": "为什么登山者要在午夜前后开始最后冲顶？"}, "options": [{"en": "Because the Sun is too hot at noon.", "zh": "因为正午的太阳太热。"}, {"en": "So they can retur
