<script>window.BOOK = {"slug": "frederick-douglass-forever-free", "title": "Frederick Douglass Forever Free", "titleZh": "弗雷德里克·道格拉斯：永远自由", "level": "S", "genre": "Biography", "mainSkill": "Key Ideas and Details", "questions": [{"q": {"en": "How did young Frederick learn to read?", "zh": "小时候的弗雷德里克是如何学会阅读的？"}, "options": [{"en": "He traded bread/food for lessons and learned letters from white boys", "zh": "他用面包／食物换课程，并跟白人男孩学字母"}, {"en": "He went to a free school in the city where a kind teacher gave him books and taught him every afternoon", "zh": "他进了城里一所免费的学校，一位和蔼的老师每天下午给他书本并教他读书"}, {"en": "His mother taught him", "zh": "他母亲教他"}, {"en": "He read the Bible only", "zh": "他只读《圣经》"}], "answer": 0, "skill": "Key Ideas and Details", "explain": {"en": "Frederick 'traded them bread for something he wanted even more—an education' and learned the alphabet by writing letters in the dirt with poor white boys.", "zh": "弗雷德里克“用面包换来更想要的东西——教育”，并通过在泥地上写字母、跟穷白人男孩学，学会了字母表。"}}, {"q": {"en": "What did Douglass mean by 'Once you learn to read, you will be forever free'?", "zh": "道格拉斯说“一旦学会阅读，你就永远自由”，是什么意思？"}, "options": [{"en": "Books are free", "zh": "书是免费的"}, {"en": "Reading makes you rich, because every book a person finishes is worth a bag of gold coins", "zh": "阅读让人变富有，因为一个人每读完一本书，就相当于得到一袋金币"}, {"en": "Education gives enslaved people the power to seek freedom", "zh": "教育让被奴役者获得追求自由的力量"}, {"en": "He liked school", "zh": "他喜欢上学"}], "answer": 2, "skill": "Key Ideas and Details", "explain": {"en": "After learning to read, Douglass understood the abolition movement and 'began dreaming of escape,' showing reading opened the path to freedom.", "zh": "学会阅读后，道格拉斯理解了废奴运动并“开始梦想逃亡”，说明阅读打开了通往自由的道路。"}}, {"q": {"en": "In the glossary, the word 'abolition' means—", "zh": "在词汇表中，“abolition”的意思是——"}, "options": [{"en": "a farm", "zh": "一个农场"}, {"en": "the act of ending slavery", "zh": "废除奴隶制的行为"}, {"en": "a newspaper", "zh": "一份报纸"}, {"en": "a type of school that was built only for the children of farmers in the southern states", "zh": "一种只为南方各州农民子弟建造的学校"}], "answer": 1, "skill": "Key Ideas and Details", "explain": {"en": "Glossary: 'abolition (n.) the act of doing away with or ending something; the act of making slavery illegal (p. 7).'", "zh": "词汇表：abolition 意为“废除或终结某事的行为；使奴隶制非法化的行为（第7页）”。"}}, {"q": {"en": "How did Douglass escape to freedom?", "zh": "道格拉斯是如何逃到自由之地的？"}, "options": [{"en": "By walking at night through the dark woods for many long weeks until he finally reached the ocean shore all alone", "zh": "夜间独自穿过黑暗的森林走了好几个星期，直到终于抵达海岸"}, {"en": "Dressed in a sailor's uniform with a free man's passport, by train to New York", "zh": "身穿水手制服、持自由人护照，乘火车到纽约"}, {"en": "By boat alone", "zh": "独自乘船"}, {"en": "With the army", "zh": "随军队"}], "answer": 1, "skill": "Key Ideas and Details", "explain": {"en": "'Dressed in a sailor's uniform and carrying a free man's passport, Frederick traveled by train to New York. The escape took a little less than twenty-four hours.'", "zh": "“弗雷德里克身穿水手制服、持自由人护照，乘火车前往纽约。逃亡用了不到二十四小时。”"}}, {"q": {"en": "What was the name of Douglass's famous autobiography?", "zh": "道格拉斯那部著名自传叫什么名字？"}, "options": [{"en": "The Starry Messenger, a book about the planets that Galileo wrote near the end of his life", "zh": "《星际信使》，一本伽利略在生命末期写下的、关于行星的书"}, {"en": "My Bondage", "zh": "《我的奴役》"}, {"en": "The Emancipation", "zh": "《解放》"}, {"en": "Narrative of the Life of Frederick Douglass", "zh": "《弗雷德里克·道格拉斯的生平叙事》"}], "answer": 3, "skill": "Key Ideas and Details", "explain": {"en": "'Douglass wrote an autobiography. Narrative of the Life of Frederick Douglass was published in 1845.'", "zh": "“道格拉斯写了一部自传。《弗雷德里克·道格拉斯的生平叙事》于1845年出版。”"}}, {"q": {"en": "Who bought Douglass's freedom?", "zh": "是谁买下了道格拉斯的自由？"}, "options": [{"en": "Fans in England who raised $711", "zh": "英格兰的粉丝，他们凑了711美元"}, {"en": "His wife Anna", "zh": "他的妻子安娜"}, {"en": "The government", "zh": "政府"}, {"en": "Abraham Lincoln, who used government money to pay for Douglass's freedom after the Civil War ended", "zh": "亚伯拉罕·林肯，他在内战结束后用政府资金买下了道格拉斯的自由"}], "answer": 0, "skill": "Key Ideas and Details", "explain": {"en": "'An electrifying speaker, Douglass was a star in England. Fans there raised $711 to buy Douglass's freedom.'", "zh": "“作为极具感染力的演说家，道格拉斯在英格兰是明星。那里的粉丝凑了711美元买下他的自由。”"}}, {"q": {"en": "What amendment gave every male citizen, including former slaves, the right to vote?", "zh": "哪条修正案赋予包括前奴隶在内的每位男性公民投票权？"}, "options": [{"en": "Fifteenth", "zh": "第十五条"}, {"en": "Fourteenth", "zh": "第十四条"}, {"en": "Nineteenth", "zh": "第十九条"}, {"en": "Thirteenth", "zh": "第十三条"}], "answer": 0, "skill": "Key Ideas and Details", "explain": {"en": "'In 1870, the Fifteenth Amendment gave every male citizen, even former slaves, the right to vote.'", "zh": "“1870年，第十五条修正案赋予每位男性公民、甚至前奴隶投票的权利。”"}}, {"q": {"en": "What role did Douglass play for President Lincoln?", "zh": "道格拉斯为林肯总统担任了什么角色？"}, "options": [{"en": "A cook", "zh": "一名厨师"}, {"en": "A senator", "zh": "一名参议员"}, {"en": "An advisor on the Emancipation Proclamation", "zh": "《解放宣言》的顾问"}, {"en": "He was a general in the Union army who led soldiers into battle during the American Civil War", "zh": "他是联邦军的一名将军，在美国内战期间率军作战"}], "answer": 2, "skill": "Key Ideas and Details", "explain": {"en": "'In 1863, he served as President Lincoln's advisor on the Emancipation Proclamation, an order that freed most of the slaves.'", "zh": "“1863年，他担任林肯总统《解放宣言》的顾问，该命令解放了大多数奴隶。”"}}, {"q": {"en": "What is the main purpose of this biography?", "zh": "这部传记的主要目的是什么？"}, "options": [{"en": "To entertain readers with a completely made-up adventure story full of talking animals and magical events that never really happened in history", "zh": "用充满会说话的动物和从未在历史上发生过的魔法冒险的虚构故事来娱乐读者"}, {"en": "To inform readers about Douglass's life and his fight against slavery and for equality", "zh": "向读者介绍道格拉斯的生平以及他反对奴隶制、争取平等的抗争"}, {"en": "To teach cooking", "zh": "教烹饪"}, {"en": "To describe a war", "zh": "描述一场战争"}], "answer": 1, "skill": "Author's Purpose and Perspective", "explain": {"en": "The book traces Douglass from slavery to becoming 'the father of the civil rights movement,' presenting factual life events.", "zh": "本书追踪道格拉斯从奴隶到“民权运动之父”的历程，呈现的是真实生平。"}}, {"q": {"en": "What does Douglass's motto 'Right is of no sex, truth is of no color' express?", "zh": "道格拉斯的格言“权利不分性别，真理不分肤色”表达了什么？"}, "options": [{"en": "Only men matter", "zh": "只有男性重要"}, {"en": "He disliked the color of people's skin and believed that only one single shade of color should ever be allowed in the whole country", "zh": "他讨厌人们的肤色，认为这个国家只应允许一种颜色存在"}, {"en": "Reading is power", "zh": "阅读就是力量"}, {"en": "His belief that equality should apply to all people regardless of sex or race", "zh": "他相信平等应不分性别与种族地适用于所有人"}], "answer": 3, "skill": "Integration of Knowledge and Ideas", "explain": {"en": "Douglass 'fought for women's rights until the day he died' and wanted the U.S. to be free 'for blacks, women, Native Americans, and immigrants, too,' expressing this in his motto.", "zh": "道格拉斯“直到离世都在为女性权利奋斗”，并希望美国对“黑人、女性、原住民和移民”都自由，这一信念体现在他的格言中。"}}], "extended": {"prompt": {"en": "Write a biography paragraph about one brave choice Frederick Douglass made, using details from the book.", "zh": "用书中的细节，写一段关于弗雷德里克·道格拉斯某个勇敢抉择的传记式段落。"}, "guidance": {"en": ["Choose his escape, his autobiography, or his fight for voting rights.", "Include a specific fact (e.g., the $711 raised in England)."], "zh": ["选择他的逃亡、自传或争取投票权之一。", "包含一个具体事实（如英格兰筹得的711美元）。"]}}};</script>
