ld-blooded, and breathes with lungs", "zh": "它有脊椎、产卵、有鳞片或骨板、是冷血动物，并用肺呼吸"}, {"en": "It lives only in fresh water and has gills", "zh": "它只生活在淡水里，而且有鳃"}], "answer": 2, "skill": "Craft and Structure", "explain": {"en": "The book lists the reptile traits: dragons 'have a backbone, lay eggs, have scales or bony plates, are cold-blooded, [and] breathe with lungs.'", "zh": "书里列出了爬行动物的特征：巨蜥「有脊椎、产卵、有鳞片或骨板、是冷血动物，并用肺呼吸」"}}, {"q": {"en": "On which islands do Komodo dragons live?", "zh": "科莫多巨蜥生活在哪些岛上？"}, "options": [{"en": "Five small islands in Indonesia (the Lesser Sunda Islands)", "zh": "印度尼西亚的五座小岛（小巽他群岛）"}, {"en": "The islands of Hawaii", "zh": "夏威夷群岛"}, {"en": "Every continent except Antarctica—from the frozen poles to the hottest deserts, including Europe, Asia, and the Americas", "zh": "除南极洲外的每个大洲——从冰封的极地到最热的沙漠，包括欧洲、亚洲和美洲"}, {"en": "Iceland in the north Atlantic", "zh": "北大西洋的冰岛"}], "answer": 0, "skill": "Key Ideas and Details", "explain": {"en": "The book says 'Komodo dragons live on five small islands in the Asian country of Indonesia' (the Lesser Sunda Islands, including Komodo, Rinca, and Padar)", "zh": "书里说「科莫多巨蜥生活在亚洲国家印度尼西亚的五座小岛上」（小巽他群岛，包括科莫多岛、林卡岛和帕达尔岛）"}}, {"q": {"en": "How do Komodo dragons find dead animals that are far away?", "zh": "科莫多巨蜥是怎样找到远处的动物尸体的？"}, "options": [{"en": "They listen for the animals with big ears—gathering to a point and tuning in like radios to catch the faintest footstep from miles away, so they can rush in before the animal even notices", "zh": "它们用大耳朵听动物的声音——像收音机一样聚拢并调谐，捕捉数英里外最轻微的脚步声，于是它们能在动物察觉前冲过去"}, {"en": "They use their forked tongue to 'taste' the air and touch it to an organ on the roof of their mouth to sense which direction the smell comes from", "zh": "它们用分叉的舌头「品尝」空气，再把它触碰口腔顶部的器官，判断气味来自哪个方向"}, {"en": "They use a flashlight at night", "zh": "它们晚上用手电筒"}, {"en": "They follow brightly colored birds", "zh": "它们跟着颜色鲜艳的鸟"}], "answer": 1, "skill": "Integration of Knowledge and Ideas", "explain": {"en": "The book says they 'use their forked tongue to \"taste\" the air. Then they touch their tongue to a special organ on the roof of their mouth to identify tiny odor particles' and 'can tell the direction of the prey by noticing which tongue tip had more particles.'", "zh": "书里说它们「用分叉的舌头『品尝』空气。然后把舌头触碰口腔顶部一个特殊器官，辨别微小的气味颗粒」，并「通过注意哪一侧舌尖颗粒更多，判断猎物的方向」"}}, {"q": {"en": "What are the Komodo dragon's three main foods?", "zh": "科莫多巨蜥的三大主要食物是什么？"}, "options": [{"en": "Deer, wild pigs, and water buffalo", "zh": "鹿、野猪和水牛"}, {"en": "Honey and fruit", "zh": "蜂蜜和水果"}, {"en": "Only fish from the ocean", "zh": "只有海洋里的鱼"}, {"en": "Grass, leaves, and flowers—grazing all day in open fields and chewing peacefully like gentle cows", "zh": "草、叶子和花——整天在开阔田野里吃草，像温顺的牛一样安静地咀嚼"}], "answer": 0, "skill": "Key Ideas and Details", "explain": {"en": "The book says 'Their main foods are deer, wild pigs, and water buffalo' (they also eat rats, snakes, bird eggs, dead fish, and even young dragons)", "zh": "书里说「它们的主要食物是鹿、野猪和水牛」（也吃老鼠、蛇、鸟蛋、死鱼，甚至幼龙）"}}, {"q": {"en": "Why is a Komodo dragon's bite so deadly to its prey?", "zh": "为什么科莫多巨蜥的咬噬对猎物如此致命？"}, "options": [{"en": "The bite is itchy but harmless", "zh": "咬一口只是痒，没有危险"}, {"en": "It only makes the animal sleepy—so the dragon simply waits for the prey to take a nap, then curls up beside it and dozes off together until morning", "zh": "它只会让动物犯困——于是巨蜥就等猎物打盹，然后挨着它蜷起来一起睡到天亮"}, {"en": "The wound can bleed the animal to death, harmful bacteria can cause a deadly infection, and the dragon also has venom", "zh": "伤口会让动物失血而死，有害细菌会引发致命感染，而且巨蜥还有毒液"}, {"en": "The bite turns the animal into stone", "zh": "咬一口会把动物变成石头"}], "answer": 2, "skill": "Integration of Knowledge and Ideas", "explain": {"en": "The book explains the bite 'may cause the prey animal to bleed to death. Harmful bacteria from a dragon's mouth may cause a deadly infection,' and 'Scientists recently discovered that Komodo dragons have venom.'", "zh": "书里解释，咬噬「可能让猎物失血而死。巨蜥嘴里的有害细菌会引发致命感染」，而且「科学家最近发现科莫多巨蜥有毒液」"}}, {"q": {"en": "In the glossary, what is 'venom'?", "zh": "在词汇表里，「毒液」(venom) 是什么？"}, "options": [{"en": "The sound a dragon makes", "zh": "巨蜥发出的声音"}, {"en": "A kind of soft nest material", "zh": "一种柔软的筑巢材料"}, {"en": "A type of sweet nectar from flowers—sipped by butterflies and bees each spring from brightly colored blossoms, giving the dragon a sugary treat that helps it grow bright new colors and a sweeter smile", "zh": "一种来自花朵的甜花蜜——每年春天被蝴蝶和蜜蜂从鲜艳花朵中啜饮，给巨蜥甜美的享受，帮它长出鲜艳的新颜色，还露出更甜的笑容"}, {"en": "A poisonous fluid some animals use to kill prey and defend themselves, usually delivered by biting or stinging", "zh": "某些动物用来杀死猎物、保护自己的有毒液体，通常通过咬或刺来释放"}], "answer": 3, "skill": "Craft and Structure", "explain": {"en": "The glossary defines 'venom' as 'a poisonous fluid that some animals use to kill prey and defend themselves, usually delivered by biting or stinging.'", "zh": "词汇表把 venom 定义为「某些动物用来杀死猎物、保护自己的有毒液体，通常通过咬或刺来释放」"}}, {"q": {"en": "Why does the author include the 'Saving Dragons' section about conservation?", "zh": "作者为什么要加入关于保育的「拯救巨蜥」(Saving Dragons) 一节？"}, "options": [{"en": "To prove dragons are make-believe", "zh": "证明巨蜥是虚构的"}, {"en": "To show the dragons are 'vulnerable' (at risk of becoming endangered) and that people should help protect them", "zh": "为了说明巨蜥「易危」（有灭绝风险），人们应当帮助保护它们"}, {"en": "To list zoos that are closing—naming every zoo on each continent that has locked its gates forever, given its animals away, and turned the buildings into museums about the past", "zh": "列出即将关闭的动物园——列出每个大洲上永远关门、把动物送走、并把建筑改成怀旧博物馆的所有动物园"}, {"en": "To explain how to cook a dragon for dinner", "zh": "教大家怎样把巨蜥做成晚餐"}], "answer": 1, "skill": "Author's Purpose and Perspective", "explain": {"en": "The book says only 3,000 to 5,000 dragons remain and they are considered 'vulnerable.' Conservation groups 'teach people how to help protect Komodo dragons,' so the author wants readers to care about saving them", "zh": "书里说仅存3000到5000只巨蜥，且被视为「易危」。保育团体「教导人们如何帮助保护科莫多巨蜥」，所以作者希望读者关心拯救它们"}}, {"q": {"en": "What is the book's
